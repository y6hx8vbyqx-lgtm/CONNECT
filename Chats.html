<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CZH Messenger - Контакты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Шапка */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-icons {
            display: flex;
            gap: 20px;
        }

        .header-icons span {
            font-size: 22px;
            cursor: pointer;
            opacity: 0.7;
        }

        /* Поиск */
        .search {
            padding: 10px 20px;
        }

        .search input {
            width: 100%;
            padding: 12px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search input:focus {
            border-color: #667eea;
        }

        /* Список пользователей */
        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }

        .user-item:hover {
            background: rgba(255,255,255,0.02);
        }

        .user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 600;
            color: white;
            flex-shrink: 0;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .user-username {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255,255,255,0.3);
            font-size: 16px;
        }

        /* Нижняя панель */
        .bottom-nav {
            background: rgba(28,28,30,0.9);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            font-size: 12px;
        }

        .nav-item.active {
            color: #667eea;
        }

        .nav-item span {
            font-size: 22px;
            margin-bottom: 4px;
        }

        /* Кнопка выхода */
        .logout-btn {
            margin: 20px;
            padding: 12px;
            background: rgba(255,59,48,0.1);
            border: 1px solid #ff3b30;
            border-radius: 12px;
            color: #ff3b30;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Контакты</h1>
        <div class="header-icons">
            <span>➕</span>
        </div>
    </div>

    <div class="search">
        <input type="text" id="searchInput" placeholder="Поиск по username" oninput="filterUsers()">
    </div>

    <div class="users-list" id="usersList">
        <!-- Пользователи будут загружены через JS -->
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">
            <span>👥</span>
            <span>Контакты</span>
        </div>
        <div class="nav-item" onclick="goToSettings()">
            <span>⚙️</span>
            <span>Настройки</span>
        </div>
    </div>

    <div class="logout-btn" onclick="logout()">
        Выйти
    </div>

    <script>
        // Текущий пользователь
        let currentUser = null;
        let allUsers = [];
        let filteredUsers = [];

        // Загрузка пользователя
        function loadUser() {
            const saved = localStorage.getItem('czh_user');
            if (saved) {
                try {
                    currentUser = JSON.parse(saved);
                } catch (e) {
                    currentUser = null;
                }
            }
            
            if (!currentUser || !currentUser.loggedIn) {
                window.location.href = 'index.html';
            }
        }

        // Загрузка всех пользователей из базы
        function loadUsers() {
            // Получаем всех зарегистрированных пользователей
            const saved = localStorage.getItem('czh_users');
            if (saved) {
                try {
                    allUsers = JSON.parse(saved);
                } catch (e) {
                    allUsers = [];
                }
            }

            // Убираем текущего пользователя из списка
            if (currentUser) {
                allUsers = allUsers.filter(u => u.username !== currentUser.username);
            }

            filteredUsers = [...allUsers];
            renderUsers();
        }

        // Отображение пользователей
        function renderUsers() {
            const container = document.getElementById('usersList');
            
            if (filteredUsers.length === 0) {
                container.innerHTML = '<div class="empty-state'>Никого не найдено</div>';
                return;
            }

            container.innerHTML = filteredUsers.map(user => `
                <div class="user-item" onclick="openChat('${user.username}')">
                    <div class="user-avatar">${user.username[0].toUpperCase()}</div>
                    <div class="user-info">
                        <div class="user-name">${user.name || user.username}</div>
                        <div class="user-username">@${user.username}</div>
                    </div>
                </div>
            `).join('');
        }

        // Поиск пользователей
        function filterUsers() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!query) {
                filteredUsers = [...allUsers];
            } else {
                filteredUsers = allUsers.filter(user => 
                    user.username.toLowerCase().includes(query) || 
                    (user.name && user.name.toLowerCase().includes(query))
                );
            }
            
            renderUsers();
        }

        // Открыть чат с пользователем
        function openChat(username) {
            alert(`Чат с @${username} будет здесь`);
            // Здесь потом будет переход в чат
        }

        // Настройки
        function goToSettings() {
            alert('Настройки появятся позже');
        }

        // Выход
        function logout() {
            localStorage.removeItem('czh_user');
            window.location.href = 'index.html';
        }

        // Инициализация
        window.onload = function() {
            loadUser();
            loadUsers();
        };
    </script>
</body>
</html>
