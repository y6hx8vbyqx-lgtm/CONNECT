<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CZH Messenger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Экраны */
        .screen {
            display: none;
            height: 100%;
            flex-direction: column;
            overflow: hidden;
        }

        .screen.active {
            display: flex;
        }

        /* Шапка */
        .header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: #000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            font-size: 24px;
            cursor: pointer;
            color: #667eea;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        .header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
        }

        /* Список чатов */
        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }

        .chat-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .chat-info {
            flex: 1;
        }

        .chat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .chat-name {
            font-size: 17px;
            font-weight: 600;
        }

        .chat-time {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }

        .chat-last-msg {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        /* Экран чата */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
        }

        .message.received {
            align-self: flex-start;
            background: rgba(255,255,255,0.1);
            border-bottom-left-radius: 5px;
        }

        .message.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-bottom-right-radius: 5px;
        }

        .message-time {
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
            text-align: right;
        }

        .input-area {
            padding: 15px 20px;
            background: rgba(28,28,30,0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .message-input {
            flex: 1;
            padding: 12px 18px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .message-input:focus {
            border-color: #667eea;
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        .send-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        /* Экран профиля */
        .profile-header {
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 600;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 600;
        }

        .profile-username {
            font-size: 16px;
            color: rgba(255,255,255,0.5);
        }

        .profile-stats {
            display: flex;
            gap: 40px;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 600;
        }

        .stat-label {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }

        .profile-menu {
            padding: 20px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }

        .menu-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(102,126,234,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .menu-item-text {
            flex: 1;
        }

        .menu-item-title {
            font-size: 16px;
            margin-bottom: 3px;
        }

        .menu-item-subtitle {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }

        /* Нижняя навигация */
        .bottom-nav {
            background: rgba(28,28,30,0.9);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            font-size: 12px;
            gap: 4px;
        }

        .nav-item.active {
            color: #667eea;
        }

        .nav-item span {
            font-size: 22px;
        }

        /* Поиск */
        .search-box {
            padding: 10px 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <!-- Экран списка чатов -->
    <div class="screen active" id="chatsScreen">
        <div class="header">
            <div class="header-title">Чаты</div>
            <div class="header-avatar" onclick="goToProfile()" id="currentUserAvatar">A</div>
        </div>

        <div class="search-box">
            <input type="text" id="searchUsers" placeholder="Поиск пользователей..." oninput="searchUsers()">
        </div>

        <div class="chats-list" id="chatsList">
            <!-- Список чатов -->
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchScreen('chats')">
                <span>💬</span>
                <span>Чаты</span>
            </div>
            <div class="nav-item" onclick="switchScreen('profile')">
                <span>👤</span>
                <span>Профиль</span>
            </div>
        </div>
    </div>

    <!-- Экран чата с пользователем -->
    <div class="screen" id="chatScreen">
        <div class="header">
            <div class="header-left">
                <div class="back-btn" onclick="closeChat()">←</div>
                <div class="header-avatar" id="chatAvatar">A</div>
                <div class="header-title" id="chatName">Пользователь</div>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <!-- Сообщения -->
        </div>

        <div class="input-area">
            <input type="text" class="message-input" id="messageInput" placeholder="Сообщение" onkeyup="checkInput()">
            <div class="send-btn" id="sendBtn" onclick="sendMessage()">➤</div>
        </div>
    </div>

    <!-- Экран профиля -->
    <div class="screen" id="profileScreen">
        <div class="header">
            <div class="header-title">Профиль</div>
            <div class="header-avatar" onclick="logout()" style="background: rgba(255,59,48,0.2); color: #ff3b30;">🚪</div>
        </div>

        <div class="profile-header">
            <div class="profile-avatar" id="profileAvatar">A</div>
            <div class="profile-name" id="profileName">Имя</div>
            <div class="profile-username" id="profileUsername">@username</div>
        </div>

        <div class="profile-stats">
            <div class="stat-item">
                <div class="stat-value" id="chatsCount">0</div>
                <div class="stat-label">Чаты</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="contactsCount">0</div>
                <div class="stat-label">Контакты</div>
            </div>
        </div>

        <div class="profile-menu">
            <div class="menu-item" onclick="logout()">
                <div class="menu-item-icon">🚪</div>
                <div class="menu-item-text">
                    <div class="menu-item-title">Выйти</div>
                    <div class="menu-item-subtitle">Завершить сеанс</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== ДАННЫЕ ====================
        let currentUser = null;
        let users = [];
        let chats = [];
        let messages = {};
        let currentChat = null;

        // ==================== ЗАГРУЗКА ====================
        function loadData() {
            // Загружаем текущего пользователя
            const savedUser = localStorage.getItem('czh_user');
            if (!savedUser) {
                window.location.href = 'index.html';
                return;
            }
            
            try {
                currentUser = JSON.parse(savedUser);
                document.getElementById('currentUserAvatar').textContent = currentUser.displayName[0].toUpperCase();
                document.getElementById('profileAvatar').textContent = currentUser.displayName[0].toUpperCase();
                document.getElementById('profileName').textContent = currentUser.displayName;
                document.getElementById('profileUsername').textContent = '@' + currentUser.username;
            } catch (e) {}

            // Загружаем всех пользователей
            const savedUsers = localStorage.getItem('czh_users');
            if (savedUsers) {
                users = JSON.parse(savedUsers).filter(u => u.username !== currentUser.username);
            }

            // Загружаем чаты
            const savedChats = localStorage.getItem('czh_chats_' + currentUser.username);
            if (savedChats) {
                chats = JSON.parse(savedChats);
            } else {
                chats = [];
            }

            // Загружаем сообщения
            const savedMessages = localStorage.getItem('czh_messages_' + currentUser.username);
            if (savedMessages) {
                messages = JSON.parse(savedMessages);
            } else {
                messages = {};
            }

            updateChatsCount();
            renderChats();
        }

        // ==================== ПОИСК ПОЛЬЗОВАТЕЛЕЙ ====================
        function searchUsers() {
            const query = document.getElementById('searchUsers').value.toLowerCase().trim();
            const list = document.getElementById('chatsList');

            if (!query) {
                renderChats();
                return;
            }

            const foundUsers = users.filter(u => 
                u.username.toLowerCase().includes(query) || 
                (u.name && u.name.toLowerCase().includes(query))
            );

            if (foundUsers.length === 0) {
                list.innerHTML = '<div class="empty-state">Пользователи не найдены</div>';
                return;
            }

            list.innerHTML = foundUsers.map(user => `
                <div class="chat-item" onclick="startChat('${user.username}')">
                    <div class="chat-avatar">${user.username[0].toUpperCase()}</div>
                    <div class="chat-info">
                        <div class="chat-row">
                            <span class="chat-name">${user.name || user.username}</span>
                        </div>
                        <div class="chat-last-msg">@${user.username}</div>
                    </div>
                </div>
            `).join('');
        }

        // ==================== ЧАТЫ ====================
        function renderChats() {
            const list = document.getElementById('chatsList');
            
            if (chats.length === 0) {
                list.innerHTML = '<div class="empty-state">Начните общение, найдите пользователя</div>';
                return;
            }

            // Сортируем по последнему сообщению
            const sortedChats = [...chats].sort((a, b) => {
                const aMsg = messages[a.with] || [];
                const bMsg = messages[b.with] || [];
                const aTime = aMsg.length ? new Date(aMsg[aMsg.length-1].time) : new Date(0);
                const bTime = bMsg.length ? new Date(bMsg[bMsg.length-1].time) : new Date(0);
                return bTime - aTime;
            });

            list.innerHTML = sortedChats.map(chat => {
                const user = users.find(u => u.username === chat.with) || { username: chat.with, name: chat.with };
                const chatMessages = messages[chat.with] || [];
                const lastMsg = chatMessages[chatMessages.length - 1];
                
                return `
                    <div class="chat-item" onclick="openChat('${chat.with}')">
                        <div class="chat-avatar">${user.username[0].toUpperCase()}</div>
                        <div class="chat-info">
                            <div class="chat-row">
                                <span class="chat-name">${user.name || user.username}</span>
                                <span class="chat-time">${lastMsg ? formatTime(lastMsg.time) : ''}</span>
                            </div>
                            <div class="chat-last-msg">${lastMsg ? (lastMsg.sent ? 'Вы: ' : '') + lastMsg.text : 'Нет сообщений'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function startChat(username) {
            // Создаем чат если его нет
            if (!chats.find(c => c.with === username)) {
                chats.push({ with: username, created: new Date().toISOString() });
                saveChats();
            }
            
            openChat(username);
        }

        function openChat(username) {
            currentChat = username;
            
            const user = users.find(u => u.username === username) || { username, name: username };
            document.getElementById('chatAvatar').textContent = user.username[0].toUpperCase();
            document.getElementById('chatName').textContent = user.name || user.username;
            
            renderMessages(username);
            
            switchScreen('chat');
        }

        function closeChat() {
            currentChat = null;
            switchScreen('chats');
            renderChats();
        }

        // ==================== СООБЩЕНИЯ ====================
        function renderMessages(username) {
            const container = document.getElementById('messagesContainer');
            const userMessages = messages[username] || [];
            
            container.innerHTML = userMessages.map(msg => `
                <div class="message ${msg.sent ? 'sent' : 'received'}">
                    ${msg.text}
                    <div class="message-time">${formatTime(msg.time)}</div>
                </div>
            `).join('');
            
            container.scrollTop = container.scrollHeight;
        }

        function checkInput() {
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            
            if (input.value.trim()) {
                sendBtn.classList.remove('disabled');
            } else {
                sendBtn.classList.add('disabled');
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !currentChat) return;

            const now = new Date();
            const message = {
                text: text,
                sent: true,
                time: now.toISOString()
            };

            // Сохраняем сообщение
            if (!messages[currentChat]) {
                messages[currentChat] = [];
            }
            messages[currentChat].push(message);

            // Сохраняем для получателя (имитация получения)
            setTimeout(() => {
                const reply = {
                    text: '👍',
                    sent: false,
                    time: new Date().toISOString()
                };
                
                if (!messages[currentChat]) {
                    messages[currentChat] = [];
                }
                messages[currentChat].push(reply);
                
                if (currentChat === currentChat) {
                    renderMessages(currentChat);
                }
                
                saveMessages();
                renderChats();
            }, 2000);

            saveMessages();
            
            input.value = '';
            checkInput();
            renderMessages(currentChat);
            renderChats();
        }

        // ==================== ПРОФИЛЬ ====================
        function goToProfile() {
            switchScreen('profile');
            updateProfileStats();
        }

        function updateProfileStats() {
            document.getElementById('chatsCount').textContent = chats.length;
            document.getElementById('contactsCount').textContent = users.length;
        }

        // ==================== НАВИГАЦИЯ ====================
        function switchScreen(screen) {
            const screens = ['chatsScreen', 'chatScreen', 'profileScreen'];
            const navItems = document.querySelectorAll('.nav-item');
            
            screens.forEach(s => {
                document.getElementById(s).classList.remove('active');
            });
            
            if (screen === 'chats') {
                document.getElementById('chatsScreen').classList.add('active');
                navItems[0].classList.add('active');
                navItems[1].classList.remove('active');
                renderChats();
            } else if (screen === 'chat') {
                document.getElementById('chatScreen').classList.add('active');
            } else if (screen === 'profile') {
                document.getElementById('profileScreen').classList.add('active');
                navItems[0].classList.remove('active');
                navItems[1].classList.add('active');
                updateProfileStats();
            }
        }

        // ==================== СОХРАНЕНИЕ ====================
        function saveChats() {
            localStorage.setItem('czh_chats_' + currentUser.username, JSON.stringify(chats));
        }

        function saveMessages() {
            localStorage.setItem('czh_messages_' + currentUser.username, JSON.stringify(messages));
        }

        function updateChatsCount() {
            const count = document.getElementById('chatsCount');
            if (count) count.textContent = chats.length;
        }

        // ==================== ВСПОМОГАТЕЛЬНОЕ ====================
        function formatTime(isoString) {
            const date = new Date(isoString);
            const now = new Date();
            
            if (date.toDateString() === now.toDateString()) {
                return date.getHours() + ':' + date.getMinutes().toString().padStart(2, '0');
            }
            
            return date.getDate() + '.' + (date.getMonth() + 1) + '.' + date.getFullYear().toString().slice(-2);
        }

        function logout() {
            localStorage.removeItem('czh_user');
            window.location.href = 'index.html';
        }

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        window.onload = function() {
            loadData();
            
            document.getElementById('messageInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        };
    </script>
</body>
</html>
