<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CZH Messenger - Вход</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .logo {
            margin-bottom: 40px;
            text-align: center;
        }

        .logo h1 {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: rgba(28,28,30,0.9);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.05);
            padding: 5px;
            border-radius: 12px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            color: rgba(255,255,255,0.5);
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .form {
            display: block;
        }

        .form.hidden {
            display: none;
        }

        h2 {
            margin-bottom: 25px;
            font-size: 22px;
            text-align: center;
        }

        .phone-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        select, input {
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        select {
            width: 100px;
        }

        input {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .secondary-btn {
            background: transparent;
            border: 1px solid #667eea;
            color: #667eea;
        }

        #recaptcha-container {
            margin: 20px 0;
            min-height: 78px;
            display: flex;
            justify-content: center;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .success {
            background: rgba(52,199,89,0.15);
            color: #34c759;
            border: 1px solid #34c759;
        }

        .error {
            background: rgba(255,59,48,0.15);
            color: #ff3b30;
            border: 1px solid #ff3b30;
        }

        .otp-container {
            margin-top: 20px;
        }

        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
        }

        .otp-input {
            width: 45px;
            height: 55px;
            text-align: center;
            font-size: 24px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
        }

        .timer {
            text-align: center;
            color: rgba(255,255,255,0.5);
            margin: 15px 0;
            font-size: 14px;
        }

        .timer a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>CZH</h1>
        </div>

        <div class="card">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('phone')">📱 Телефон</div>
                <div class="tab" onclick="switchTab('username')">👤 Username</div>
            </div>

            <!-- Форма телефона -->
            <div id="phoneForm" class="form">
                <h2>Вход по телефону</h2>

                <div class="phone-input">
                    <select id="countryCode">
                        <option value="+7">+7</option>
                        <option value="+1">+1</option>
                        <option value="+44">+44</option>
                    </select>
                    <input type="tel" id="phoneNumber" placeholder="900 123 45 67" 
                           onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                </div>

                <div id="recaptcha-container"></div>

                <button onclick="sendSMSCode()" id="sendBtn">Получить код</button>

                <!-- Форма ввода кода -->
                <div id="otpContainer" style="display: none;">
                    <div class="otp-container">
                        <p style="text-align: center; margin: 15px 0;" id="phoneDisplay"></p>
                        
                        <div class="otp-inputs">
                            <input type="text" id="otp1" class="otp-input" maxlength="1" inputmode="numeric">
                            <input type="text" id="otp2" class="otp-input" maxlength="1" inputmode="numeric">
                            <input type="text" id="otp3" class="otp-input" maxlength="1" inputmode="numeric">
                            <input type="text" id="otp4" class="otp-input" maxlength="1" inputmode="numeric">
                            <input type="text" id="otp5" class="otp-input" maxlength="1" inputmode="numeric">
                            <input type="text" id="otp6" class="otp-input" maxlength="1" inputmode="numeric">
                        </div>
                        
                        <p id="timer" class="timer"></p>
                        
                        <button onclick="verifyCode()" id="verifyBtn">Подтвердить</button>
                        <button onclick="backToPhone()" class="secondary-btn">Назад</button>
                    </div>
                </div>
            </div>

            <!-- Форма username -->
            <div id="usernameForm" class="form hidden">
                <h2>Вход по username</h2>

                <input type="text" id="username" placeholder="Username" style="width: 100%; margin-bottom: 15px;">
                <input type="password" id="password" placeholder="Пароль" style="width: 100%; margin-bottom: 15px;">

                <button onclick="loginWithUsername()">Войти</button>
                <button onclick="registerWithUsername()" class="secondary-btn">Регистрация</button>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        // Конфиг Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB6wgY0_Yx3A8Ht8QZgm-bSP_umAcPe29g",
            authDomain: "connect-41f33.firebaseapp.com",
            projectId: "connect-41f33",
            storageBucket: "connect-41f33.appspot.com",
            messagingSenderId: "56431451204",
            appId: "1:56431451204:web:43c55041fc0fa14b71251"
        };

        // Инициализация Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let confirmationResult = null;
        let recaptchaVerifier = null;
        let countdownInterval = null;

        // Тестовые пользователи
        const testUsers = [
            { username: 'admin', password: 'admin123', name: 'Admin' },
            { username: 'user', password: 'user123', name: 'User' }
        ];

        // Переключение вкладок
        function switchTab(tab) {
            const phoneForm = document.getElementById('phoneForm');
            const usernameForm = document.getElementById('usernameForm');
            const tabs = document.querySelectorAll('.tab');

            if (tab === 'phone') {
                phoneForm.classList.remove('hidden');
                usernameForm.classList.add('hidden');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                phoneForm.classList.add('hidden');
                usernameForm.classList.remove('hidden');
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            }
        }

        // Инициализация reCAPTCHA
        function initRecaptcha() {
            recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                'size': 'normal',
                'callback': function() {
                    document.getElementById('sendBtn').disabled = false;
                }
            });
        }

        // Отправка SMS
        async function sendSMSCode() {
            const country = document.getElementById('countryCode').value;
            const phone = document.getElementById('phoneNumber').value.replace(/\D/g, '');
            const fullPhone = country + phone;

            if (phone.length < 10) {
                showMessage('Введите полный номер', 'error');
                return;
            }

            document.getElementById('sendBtn').disabled = true;
            document.getElementById('sendBtn').textContent = 'Отправка...';

            try {
                if (!recaptchaVerifier) {
                    initRecaptcha();
                }

                confirmationResult = await auth.signInWithPhoneNumber(fullPhone, recaptchaVerifier);
                
                document.getElementById('phoneForm').style.display = 'none';
                document.getElementById('otpContainer').style.display = 'block';
                document.getElementById('phoneDisplay').textContent = formatPhone(fullPhone);
                
                startCountdown();
                setupOtpInputs();
                document.getElementById('otp1').focus();
                
                showMessage('Код отправлен', 'success');
            } catch (error) {
                console.error(error);
                showMessage('Ошибка отправки', 'error');
            } finally {
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('sendBtn').textContent = 'Получить код';
            }
        }

        // Проверка кода
        async function verifyCode() {
            const code = 
                document.getElementById('otp1').value +
                document.getElementById('otp2').value +
                document.getElementById('otp3').value +
                document.getElementById('otp4').value +
                document.getElementById('otp5').value +
                document.getElementById('otp6').value;

            if (code.length !== 6) {
                showMessage('Введите код', 'error');
                return;
            }

            document.getElementById('verifyBtn').disabled = true;
            document.getElementById('verifyBtn').textContent = 'Проверка...';

            try {
                const result = await confirmationResult.confirm(code);
                await saveUser(result.user, 'phone');
            } catch (error) {
                showMessage('Неверный код', 'error');
                clearOtpFields();
                document.getElementById('verifyBtn').disabled = false;
                document.getElementById('verifyBtn').textContent = 'Подтвердить';
            }
        }

        // Вход по username
        function loginWithUsername() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            const user = testUsers.find(u => u.username === username && u.password === password);

            if (user) {
                const fakeUser = {
                    uid: username,
                    displayName: user.name,
                    username: username
                };
                saveUser(fakeUser, 'username');
            } else {
                showMessage('Неверный логин или пароль', 'error');
            }
        }

        // Регистрация
        function registerWithUsername() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }

            if (username.length < 3) {
                showMessage('Username минимум 3 символа', 'error');
                return;
            }

            if (testUsers.find(u => u.username === username)) {
                showMessage('Пользователь уже существует', 'error');
                return;
            }

            testUsers.push({ username, password, name: username });
            showMessage('Аккаунт создан', 'success');
        }

        // Сохранение пользователя и переход
        async function saveUser(user, method) {
            const userData = {
                uid: user.uid,
                displayName: user.displayName || user.username || 'User',
                loginMethod: method,
                loggedIn: true
            };

            localStorage.setItem('czh_user', JSON.stringify(userData));
            
            showMessage('Вход выполнен', 'success');
            
            setTimeout(() => {
                window.location.href = 'Chats.html';
            }, 1000);
        }

        // Вспомогательные функции
        function formatPhone(phone) {
            return phone;
        }

        function startCountdown() {
            let countdown = 60;
            const timerEl = document.getElementById('timer');
            
            countdownInterval = setInterval(() => {
                countdown--;
                timerEl.textContent = `Повторная отправка через ${countdown}с`;
                
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    timerEl.innerHTML = '<a href="#" onclick="resendCode()">Отправить повторно</a>';
                }
            }, 1000);
        }

        function resendCode() {
            backToPhone();
            showMessage('Введите номер заново', 'info');
        }

        function backToPhone() {
            document.getElementById('phoneForm').style.display = 'block';
            document.getElementById('otpContainer').style.display = 'none';
            clearInterval(countdownInterval);
            clearOtpFields();
        }

        function clearOtpFields() {
            for (let i = 1; i <= 6; i++) {
                document.getElementById('otp' + i).value = '';
            }
        }

        function setupOtpInputs() {
            const inputs = [];
            for (let i = 1; i <= 6; i++) {
                inputs.push(document.getElementById('otp' + i));
            }

            inputs.forEach((input, index) => {
                input.addEventListener('input', function() {
                    if (this.value.length === 1 && index < 5) {
                        inputs[index + 1].focus();
                    }
                    
                    const allFilled = inputs.every(inp => inp.value.length === 1);
                    if (allFilled) {
                        verifyCode();
                    }
                });

                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && !this.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            
            setTimeout(() => {
                msg.textContent = '';
                msg.className = 'message';
            }, 3000);
        }

        // Инициализация
        window.onload = function() {
            initRecaptcha();
            
            // Проверяем, не залогинен ли уже
            const saved = localStorage.getItem('czh_user');
            if (saved) {
                const user = JSON.parse(saved);
                if (user.loggedIn) {
                    window.location.href = 'Chats.html';
                }
            }
        };
    </script>
</body>
</html>
