<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CZH Messenger - Вход по телефону</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <!-- reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js"></script>
    <style>
        /* СТИЛИ ОТ ТВОЕГО ДИЗАЙНА */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #000; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .auth-container { width: 100%; max-width: 400px; }
        
        .logo { text-align: center; margin-bottom: 40px; }
        .logo h1 { font-size: 42px; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo p { color: rgba(255,255,255,0.6); margin-top: 10px; }
        
        .auth-card { background: rgba(28,28,30,0.9); border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); }
        
        .form-title { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; color: rgba(255,255,255,0.6); margin-bottom: 8px; font-size: 14px; }
        .input-field { width: 100%; padding: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-size: 16px; }
        .input-field:focus { outline: none; border-color: #667eea; }
        
        .phone-input { display: flex; gap: 10px; }
        .country-code { width: 80px; }
        .phone-number { flex: 1; }
        
        .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #recaptcha-container { margin: 20px 0; display: flex; justify-content: center; }
        
        .otp-container { display: none; text-align: center; }
        .otp-inputs { display: flex; gap: 10px; justify-content: center; margin: 25px 0; }
        .otp-input { width: 50px; height: 60px; font-size: 24px; text-align: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; }
        
        .message { padding: 12px; border-radius: 10px; margin: 15px 0; display: none; text-align: center; }
        .success { background: rgba(52,199,89,0.15); color: #34c759; display: block !important; }
        .error { background: rgba(255,59,48,0.15); color: #ff3b30; display: block !important; }
        
        .loading { text-align: center; padding: 20px; display: none; }
        
        @media (max-width: 480px) {
            .auth-card { padding: 20px; }
            .logo h1 { font-size: 36px; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <h1>CZH Messenger</h1>
            <p>Вход по номеру телефона</p>
        </div>
        
        <div class="auth-card">
            <!-- Форма ввода телефона -->
            <div id="phone-form">
                <h2 class="form-title">Введите ваш номер</h2>
                
                <div class="input-group">
                    <label class="input-label">Номер телефона</label>
                    <div class="phone-input">
                        <select id="country-code" class="input-field country-code">
                            <option value="+7">+7 RU</option>
                            <option value="+380">+380 UA</option>
                            <option value="+375">+375 BY</option>
                            <option value="+1">+1 US</option>
                        </select>
                        <input type="tel" id="phone-number" class="input-field phone-number" 
                               placeholder="999 123-45-67" maxlength="15">
                    </div>
                </div>
                
                <!-- reCAPTCHA контейнер -->
                <div id="recaptcha-container"></div>
                
                <button class="btn" onclick="sendPhoneCode()" id="send-code-btn">
                    Получить SMS код
                </button>
            </div>
            
            <!-- Форма ввода OTP -->
            <div id="otp-form" class="otp-container">
                <h2 class="form-title">Введите код из SMS</h2>
                <p style="color: rgba(255,255,255,0.6); margin-bottom: 20px;" id="otp-info">
                    Код отправлен на номер
                </p>
                
                <div class="otp-inputs">
                    <input type="text" class="otp-input" maxlength="1" data-index="0">
                    <input type="text" class="otp-input" maxlength="1" data-index="1">
                    <input type="text" class="otp-input" maxlength="1" data-index="2">
                    <input type="text" class="otp-input" maxlength="1" data-index="3">
                    <input type="text" class="otp-input" maxlength="1" data-index="4">
                    <input type="text" class="otp-input" maxlength="1" data-index="5">
                </div>
                
                <p id="countdown" style="color: rgba(255,255,255,0.5); margin: 15px 0;">
                    Повторная отправка через 60 сек
                </p>
                
                <button class="btn" onclick="verifyPhoneCode()" id="verify-btn">
                    Подтвердить
                </button>
                
                <button onclick="backToPhone()" 
                        style="background: none; color: #667eea; border: none; margin-top: 15px; cursor: pointer;">
                    Изменить номер
                </button>
            </div>
            
            <!-- Сообщения -->
            <div id="message" class="message"></div>
            
            <!-- Загрузка -->
            <div id="loading" class="loading">
                <div style="color: rgba(255,255,255,0.5);">Загрузка...</div>
            </div>
        </div>
    </div>

    <script>
        // ==================== КОНФИГУРАЦИЯ ====================
        // 🔥 ЗАМЕНИТЕ ЭТИ ДАННЫЕ НА ВАШИ С FIREBASE!
        const firebaseConfig = {
            apiKey: "AIzaSyBn-gM0CM2NPMGZ6OpytlPkiIOSIm54hcY",
            authDomain: "czhmass.firebaseapp.com",
            projectId: "czhmass",
            storageBucket: "czhmass.firebasestorage.app",
            messagingSenderId: "1064257019843",
            appId: "1:1064257019843:web:65488b45be2f86838ca776"
        };
        
        // 🔐 Получите на: https://www.google.com/recaptcha/admin/create
        // Выберите reCAPTCHA v2 → "Челлендж"
        const RECAPTCHA_SITE_KEY = "6LcYFagpAAAAAH2sNtnc5eO1oIMQHX9jVHv8t8m7"; // Пример, замените
        
        // ==================== ПЕРЕМЕННЫЕ ====================
        let auth;
        let confirmationResult = null;
        let recaptchaVerifier;
        let countdownInterval;
        let countdownTime = 60;
        
        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        // Инициализируем Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            console.log('✅ Firebase подключен');
        }
        auth = firebase.auth();
        
        // Создаем reCAPTCHA при загрузке
        window.onload = function() {
            initRecaptcha();
            setupOtpInputs();
        };
        
        // ==================== reCAPTCHA ====================
        function initRecaptcha() {
            try {
                recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
                    'recaptcha-container', 
                    {
                        'size': 'normal',
                        'callback': function(response) {
                            console.log('✅ reCAPTCHA пройдена');
                            enableButton('send-code-btn', true);
                        },
                        'expired-callback': function() {
                            showMessage('reCAPTCHA истекла. Обновите страницу.', 'error');
                            enableButton('send-code-btn', false);
                        }
                    },
                    auth
                );
                
                recaptchaVerifier.render();
                console.log('✅ reCAPTCHA создана');
                
            } catch (error) {
                console.error('❌ Ошибка reCAPTCHA:', error);
                showMessage('Ошибка загрузки reCAPTCHA', 'error');
            }
        }
        
        // ==================== ОТПРАВКА SMS ====================
        async function sendPhoneCode() {
            const countryCode = document.getElementById('country-code').value;
            const phoneNum = document.getElementById('phone-number').value;
            
            // Валидация
            if (!phoneNum || phoneNum.replace(/\D/g, '').length < 10) {
                showMessage('Введите корректный номер телефона', 'error');
                return;
            }
            
            const fullPhoneNumber = countryCode + phoneNum.replace(/\D/g, '');
            console.log('📱 Отправка SMS на:', fullPhoneNumber);
            
            try {
                showLoading(true);
                enableButton('send-code-btn', false);
                
                // Отправляем SMS через Firebase
                confirmationResult = await auth.signInWithPhoneNumber(
                    fullPhoneNumber, 
                    recaptchaVerifier
                );
                
                console.log('✅ SMS отправлено');
                
                // Показываем OTP форму
                document.getElementById('phone-form').style.display = 'none';
                document.getElementById('otp-form').style.display = 'block';
                document.getElementById('otp-info').textContent = 
                    `Код отправлен на ${formatPhoneNumber(fullPhoneNumber)}`;
                
                // Запускаем таймер
                startCountdown();
                
                // Фокус на первое поле OTP
                document.querySelector('.otp-input[data-index="0"]').focus();
                
                showMessage('✅ Код отправлен! Проверьте SMS.', 'success');
                
            } catch (error) {
                console.error('❌ Ошибка отправки SMS:', error);
                
                let errorMessage = 'Не удалось отправить SMS';
                if (error.code === 'auth/invalid-phone-number') {
                    errorMessage = 'Неверный формат номера телефона';
                } else if (error.code === 'auth/quota-exceeded') {
                    errorMessage = 'Превышен лимит SMS. Попробуйте позже.';
                } else if (error.code === 'auth/captcha-check-failed') {
                    errorMessage = 'Ошибка reCAPTCHA. Обновите страницу.';
                }
                
                showMessage(errorMessage, 'error');
                
                // Пересоздаем reCAPTCHA
                recaptchaVerifier.clear();
                initRecaptcha();
                
            } finally {
                showLoading(false);
                enableButton('send-code-btn', true);
            }
        }
        
        // ==================== ПОДТВЕРЖДЕНИЕ КОДА ====================
        async function verifyPhoneCode() {
            // Собираем код из 6 полей
            const otpInputs = document.querySelectorAll('.otp-input');
            const code = Array.from(otpInputs).map(input => input.value).join('');
            
            if (code.length !== 6) {
                showMessage('Введите 6-значный код из SMS', 'error');
                return;
            }
            
            try {
                showLoading(true);
                enableButton('verify-btn', false);
                
                console.log('🔐 Проверка кода:', code);
                
                // Подтверждаем код
                const userCredential = await confirmationResult.confirm(code);
                const user = userCredential.user;
                
                console.log('✅ Успешный вход! User ID:', user.uid);
                console.log('📱 Номер:', user.phoneNumber);
                
                showMessage('✅ Успешный вход! Перенаправление...', 'success');
                
                // Здесь можно сохранить пользователя в базу или сделать что-то еще
                // await saveUser(user);
                
                // Через 1 секунду перенаправляем в чат
                setTimeout(() => {
                    window.location.href = '/chat.html'; // Создайте этот файл позже
                }, 1000);
                
            } catch (error) {
                console.error('❌ Ошибка подтверждения:', error);
                
                let errorMessage = 'Неверный код';
                if (error.code === 'auth/invalid-verification-code') {
                    errorMessage = 'Неверный код. Попробуйте еще раз.';
                } else if (error.code === 'auth/code-expired') {
                    errorMessage = 'Код устарел. Запросите новый.';
                }
                
                showMessage(errorMessage, 'error');
                
                // Очищаем поля OTP
                otpInputs.forEach(input => input.value = '');
                document.querySelector('.otp-input[data-index="0"]').focus();
                
            } finally {
                showLoading(false);
                enableButton('verify-btn', true);
            }
        }
        
        // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 4000);
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        function enableButton(buttonId, enable) {
            const btn = document.getElementById(buttonId);
            if (btn) btn.disabled = !enable;
        }
        
        function startCountdown() {
            countdownTime = 60;
            const countdownElement = document.getElementById('countdown');
            
            if (countdownInterval) clearInterval(countdownInterval);
            
            countdownInterval = setInterval(() => {
                countdownTime--;
                countdownElement.textContent = `Повторная отправка через ${countdownTime} сек`;
                
                if (countdownTime <= 0) {
                    clearInterval(countdownInterval);
                    countdownElement.innerHTML = 
                        '<a href="#" onclick="resendCode()" style="color:#667eea;">Отправить код повторно</a>';
                }
            }, 1000);
        }
        
        function resendCode() {
            // Очищаем старую reCAPTCHA
            document.getElementById('recaptcha-container').innerHTML = '';
            
            // Снова показываем форму телефона
            backToPhone();
            
            // Пересоздаем reCAPTCHA
            initRecaptcha();
            
            showMessage('Введите номер и нажмите "Получить SMS код"', 'info');
        }
        
        function backToPhone() {
            document.getElementById('otp-form').style.display = 'none';
            document.getElementById('phone-form').style.display = 'block';
            
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            // Очищаем OTP поля
            document.querySelectorAll('.otp-input').forEach(input => input.value = '');
        }
        
        function formatPhoneNumber(phone) {
            // Форматирование для красивого отображения
            const cleaned = phone.replace(/\D/g, '');
            if (cleaned.length === 11 && cleaned.startsWith('7')) {
                return `+7 ${cleaned.substring(1,4)} ${cleaned.substring(4,7)}-${cleaned.substring(7,9)}-${cleaned.substring(9)}`;
            }
            return phone;
        }
        
        function setupOtpInputs() {
            const inputs = document.querySelectorAll('.otp-input');
            
            inputs.forEach(input => {
                input.addEventListener('input', (e) => {
                    const value = e.target.value;
                    const index = parseInt(e.target.dataset.index);
                    
                    // Переход к следующему полю
                    if (value.length === 1 && index < 5) {
                        inputs[index + 1].focus();
                    }
                    
                    // Авто-подтверждение при заполнении всех полей
                    const allFilled = Array.from(inputs).every(inp => inp.value.length === 1);
                    if (allFilled) {
                        verifyPhoneCode();
                    }
                });
                
                // Обработка Backspace
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
        }
        
        // ==================== ТЕСТОВЫЙ РЕЖИМ ====================
        // Для тестирования без SMS (в консоли разработчика)
        window.testLogin = function(testCode = "123456") {
            console.log('🧪 Тестовый вход с кодом:', testCode);
            
            // Создаем мок confirmationResult
            confirmationResult = {
                confirm: async function(code) {
                    console.log('Тестовое подтверждение кода:', code);
                    return {
                        user: {
                            uid: 'test_' + Date.now(),
                            phoneNumber: '+79991234567',
                            displayName: 'Тестовый пользователь'
                        }
                    };
                }
            };
            
            // Заполняем OTP поля тестовым кодом
            const inputs = document.querySelectorAll('.otp-input');
            testCode.split('').forEach((digit, i) => {
                if (inputs[i]) inputs[i].value = digit;
            });
            
            showMessage('Тестовый режим активирован. Код: 123456', 'info');
        };
        
        // Вызовите в консоли: testLogin()
        console.log('Для теста вызовите: testLogin("123456")');
        
    </script>
</body>
</html>
