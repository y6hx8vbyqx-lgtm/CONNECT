<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contegg · Messenger</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="app">
        <!-- Главный экран с логотипом -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="logo-animation">
                <div class="logo-circle">
                    <i class="fas fa-paper-plane paper-plane"></i>
                    <span class="at-symbol">@</span>
                </div>
                <div class="wind-rose">
                    <i class="fas fa-location-dot"></i>
                </div>
            </div>
            
            <h1 class="app-name">Contegg</h1>
            <p class="app-tagline">connect & chat</p>
            
            <div class="button-group">
                <button class="btn btn-primary" id="showRegister">
                    <i class="fas fa-pen"></i>
                    Создать аккаунт
                </button>
                <button class="btn btn-secondary" id="showLogin">
                    <i class="fas fa-key"></i>
                    Войти
                </button>
            </div>
        </div>

        <!-- Форма регистрации -->
        <div class="auth-form register-form hidden" id="registerForm">
            <button class="back-btn" id="backFromRegister">
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <div class="form-header">
                <div class="mini-logo">
                    <i class="fas fa-paper-plane"></i>
                </div>
                <h2>Регистрация</h2>
            </div>

            <form id="registerFormElement">
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input 
                        type="text" 
                        id="registerUsername" 
                        placeholder="Имя пользователя"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="registerPassword" 
                        placeholder="Пароль"
                        autocomplete="new-password"
                        required
                    >
                    <i class="fas fa-eye toggle-password" id="toggleRegisterPassword"></i>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        placeholder="Подтвердите пароль"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <span>Зарегистрироваться</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="error-message" id="registerError"></div>
        </div>

        <!-- Форма входа -->
        <div class="auth-form login-form hidden" id="loginForm">
            <button class="back-btn" id="backFromLogin">
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <div class="form-header">
                <div class="mini-logo">
                    <i class="fas fa-key"></i>
                </div>
                <h2>Вход</h2>
            </div>

            <form id="loginFormElement">
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input 
                        type="text" 
                        id="loginUsername" 
                        placeholder="Имя пользователя"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        placeholder="Пароль"
                        autocomplete="current-password"
                        required
                    >
                    <i class="fas fa-eye toggle-password" id="toggleLoginPassword"></i>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <span>Войти</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="error-message" id="loginError"></div>
        </div>
    </div>

    <!-- Скрипты -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="firebase.js"></script>
    <script src="script.js"></script>
</body>
</html>
