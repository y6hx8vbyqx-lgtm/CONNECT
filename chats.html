<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Contegg · Чаты и Группы</title>
    
    <meta name="theme-color" content="#0a0a0a">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Cropper.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --bg-input: #1e1e1e;
            --bg-hover: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #707070;
            --text-hint: #5a5a5a;
            --accent-color: #6c5ce7;
            --accent-hover: #7c6ff7;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --border-light: rgba(255, 255, 255, 0.05);
            --border-medium: rgba(255, 255, 255, 0.1);
            --online-color: #4caf50;
            --danger-color: #cf6679;
            --pinned-color: #ffd700;
            --group-color: #00cec9;
            --call-accept: #4caf50;
            --call-decline: #f44336;
            --nav-bg: rgba(26, 26, 26, 0.95);
            --input-bg: rgba(30, 30, 30, 0.95);
            --card-bg: rgba(26, 26, 26, 0.95);
            --glass-bg: rgba(26, 26, 26, 0.8);
            --glass-border: rgba(255, 255, 255, 0.05);
            --header-height: 56px;
            --bottom-nav-height: 60px;
            --radius-bubble: 18px;
            --radius-card: 24px;
            --radius-input: 20px;
            --radius-avatar: 50%;
            --transition-default: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.9);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
            background: var(--bg-primary);
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(108, 92, 231, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 206, 209, 0.05) 0%, transparent 50%);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            line-height: 1.25;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1px 1px at 60% 40%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 10% 90%, rgba(255,255,255,0.3), transparent);
            animation: twinkle 4s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: transparent;
            position: relative;
            z-index: 1;
        }

        .nav-bar {
            height: var(--header-height);
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav-left h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        
        .create-group-btn {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-color);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition-default);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .create-group-btn:hover { 
            background: var(--accent-hover);
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(108, 92, 231, 0.5);
        }
        .create-group-btn:active { transform: scale(0.92); }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .nav-right span {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition-default);
        }
        .icon-btn:hover { 
            background: var(--bg-hover);
            color: var(--accent-color);
        }
        .icon-btn:active { transform: scale(0.92); }

        .main-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            position: relative;
            scrollbar-width: none;
        }
        .main-content::-webkit-scrollbar { display: none; }

        .tab-content {
            display: none;
            min-height: 100%;
            width: 100%;
        }
        .tab-content.active { display: block; }

        .chats-container {
            padding: 8px 12px;
            min-height: 100%;
            background: transparent;
            padding-bottom: 20px;
        }
        
        .chats-list { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: var(--radius-bubble);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            cursor: pointer;
            transition: var(--transition-default);
            border: 1px solid var(--glass-border);
            min-height: 82px;
            position: relative;
        }
        .chat-item:hover { 
            background: var(--bg-hover);
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateX(4px);
        }
        .chat-item.unread { 
            background: rgba(108, 92, 231, 0.1);
            border-color: rgba(108, 92, 231, 0.3);
        }
        .chat-item.unread::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .chat-item.pinned { 
            background: var(--bg-tertiary);
            border-left: 3px solid var(--pinned-color);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
        }
        
        .chat-avatar {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-avatar);
            background: linear-gradient(135deg, #6c5ce7, #4834d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 24px;
            color: white;
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .chat-avatar.group {
            background: linear-gradient(135deg, #00cec9, #0984e3);
        }
        
        .online-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background: var(--online-color);
            border-radius: 50%;
            border: 2px solid var(--bg-secondary);
            display: none;
        }
        
        .chat-info { flex: 1; min-width: 0; }
        
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
            gap: 8px;
        }
        .chat-user {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .verified-badge { color: var(--accent-color); font-size: 14px; margin-left: 4px; }
        .group-badge { 
            color: var(--group-color); 
            font-size: 14px; 
            margin-left: 4px;
        }
        .chat-time { 
            font-size: 12px; 
            color: var(--text-muted); 
            flex-shrink: 0; 
            white-space: nowrap;
            background: var(--bg-tertiary);
            padding: 2px 8px;
            border-radius: 12px;
        }
        .chat-preview {
            font-size: 15px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
            max-width: 220px;
        }

        .search-container {
            padding: 8px 16px;
            background: transparent;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 5;
            backdrop-filter: blur(20px);
        }
        .search-box { position: relative; }
        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            z-index: 1;
        }
        .search-box input {
            width: 100%;
            height: 44px;
            padding: 0 45px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-input);
            font-size: 16px;
            color: var(--text-primary);
            transition: var(--transition-default);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: var(--bg-tertiary);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .search-box input::placeholder { color: var(--text-muted); }
        
        .search-results {
            margin-top: 8px;
            background: var(--card-bg);
            border-radius: var(--radius-card);
            overflow: hidden;
            animation: fadeSlide 0.2s ease;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: var(--shadow-card);
            position: absolute;
            left: 16px;
            right: 16px;
            z-index: 10;
        }
        .search-result-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            cursor: pointer;
            transition: var(--transition-default);
            border-bottom: 1px solid var(--glass-border);
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover { background: var(--bg-hover); }
        .result-avatar {
            width: 46px;
            height: 46px;
            border-radius: var(--radius-avatar);
            background: linear-gradient(135deg, #6c5ce7, #4834d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: white;
            background-size: cover;
            background-position: center;
        }
        .result-info { flex: 1; }
        .result-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .result-username { font-size: 13px; color: var(--text-muted); }

        /* Модальное окно создания группы */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 8000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 16px;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-container {
            background: var(--glass-bg);
            border-radius: 32px;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(30px);
            animation: fadeScale 0.3s ease;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 12px;
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            z-index: 10;
            border-radius: 32px 32px 0 0;
        }
        .modal-header h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition-default);
        }
        .modal-close:hover { 
            background: var(--bg-hover);
            color: var(--danger-color);
        }
        .modal-content {
            padding: 20px;
        }

        .group-avatar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
        }
        .group-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00cec9, #0984e3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 600;
            color: white;
            margin-bottom: 12px;
            border: 2px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0, 206, 209, 0.3);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .group-avatar-upload {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition-default);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .group-avatar-upload:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }

        .input-field {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 16px;
            margin-bottom: 20px;
            transition: var(--transition-default);
        }
        .input-field:focus {
            outline: none;
            border-color: var(--accent-color);
            background: var(--bg-tertiary);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .input-field::placeholder {
            color: var(--text-muted);
        }

        .users-search {
            margin-bottom: 16px;
            position: relative;
        }
        .users-search i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }
        .users-search input {
            width: 100%;
            height: 48px;
            padding: 0 45px;
            background: var(--bg-input);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            font-size: 16px;
            color: var(--text-primary);
        }
        .users-search input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .users-list {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            background: var(--bg-tertiary);
            margin-bottom: 24px;
        }
        .user-select-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--glass-border);
            cursor: pointer;
            transition: var(--transition-default);
        }
        .user-select-item:last-child { border-bottom: none; }
        .user-select-item:hover { background: var(--bg-hover); }
        .user-select-item.selected {
            background: rgba(108, 92, 231, 0.15);
            border-left: 3px solid var(--accent-color);
        }
        .user-select-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #4834d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }
        .user-select-info {
            flex: 1;
        }
        .user-select-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        .user-select-username {
            font-size: 13px;
            color: var(--text-muted);
        }
        .user-select-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 2px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-size: 14px;
        }
        .user-select-item.selected .user-select-check {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .selected-users {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0;
            min-height: 40px;
        }
        .selected-user-tag {
            background: var(--accent-color);
            border-radius: 30px;
            padding: 6px 12px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .selected-user-tag i {
            cursor: pointer;
            font-size: 12px;
            opacity: 0.8;
            transition: var(--transition-default);
        }
        .selected-user-tag i:hover { opacity: 1; }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .modal-btn {
            flex: 1;
            padding: 14px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition-default);
        }
        .modal-btn.primary {
            background: var(--accent-color);
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .modal-btn.primary:hover:not(:disabled) { 
            background: var(--accent-hover);
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.5);
        }
        .modal-btn.primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .modal-btn.secondary {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--glass-border);
        }
        .modal-btn.secondary:hover { background: var(--bg-hover); }

        .profile-container {
            min-height: 100%;
            background: transparent;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
        }

        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .profile-avatar-wrapper {
            position: relative;
            margin-bottom: 16px;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #4834d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 44px;
            color: white;
            box-shadow: 0 0 30px var(--accent-glow);
            border: 2px solid var(--glass-border);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .avatar-upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-color);
            border: 2px solid var(--bg-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition-default);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .avatar-upload-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.1);
        }

        .profile-name {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profile-name span {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .edit-btn {
            background: transparent;
            border: none;

(function hideBrowserUI() {
    const requestFullscreen = () => {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
            docEl.requestFullscreen().catch(e => console.log("Fullscreen error:", e));
        } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
        } else if (docEl.msRequestFullscreen) {
            docEl.msRequestFullscreen();
        }
    };
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            requestFullscreen();
        }, 500);
        
        window.scrollTo(0, 1);
        
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                setTimeout(requestFullscreen, 500);
            }
        });

// ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
function formatTimeAgo(date) {
    if (!date) return "только что";
    const now = new Date();
    const diff = now - date;
    const seconds = Math.floor(diff / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    if (days > 7) return date.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
    else if (days > 0) return `${days}д`;
    else if (hours > 0) return `${hours}ч`;
    else if (minutes > 0) return `${minutes}м`;
    else return "только что";
}

function formatMessageTime(date) {
    if (!date) return "";
    return date.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showNotification(message, duration = 3000) {
    notification.textContent = message;
    notification.classList.add('show');
    setTimeout(() => notification.classList.remove('show'), duration);
}

async function loadUserData() {
    try {
        const snap = await db.collection("users").doc(currentUser.uid).get();
        if (!snap.exists) {
            userData = {
                uid: currentUser.uid,
                username: "user" + currentUser.uid.slice(-6),
                displayName: "Пользователь",
                bio: "Расскажите о себе...",
                email: currentUser.email || "email@example.com",
                isAdmin: false,
                blockedUsers: [],
                pinnedChats: [],
                avatarBase64: null
            };
            await db.collection("users").doc(currentUser.uid).set(userData);
        } else {
            userData = snap.data();
            if (!userData.displayName) userData.displayName = "Пользователь";
            if (!userData.bio) userData.bio = "Расскажите о себе...";
            if (!userData.email) userData.email = currentUser.email || "email@example.com";
            if (!userData.avatarBase64) userData.avatarBase64 = null;
            if (!userData.blockedUsers) userData.blockedUsers = [];
            if (!userData.pinnedChats) userData.pinnedChats = [];
            
            blockedUsers = userData.blockedUsers || [];
            pinnedChats = userData.pinnedChats || [];
        }
    } catch (error) {
        console.error("Ошибка загрузки данных:", error);
        showNotification("Ошибка загрузки данных");
        throw error;
    }
}

async function getUserInfo(userId) {
    if (usersCache.has(userId)) return usersCache.get(userId);
    try {
        const userDoc = await db.collection("users").doc(userId).get();
        let userInfo = {
            uid: userId,
            username: "user" + userId.slice(-6),
            displayName: "Пользователь",
            bio: "",
            email: "",
            isAdmin: false,
            avatarBase64: null
        };
        if (userDoc.exists) {
            const data = userDoc.data();
            userInfo = {
                uid: userId,
                username: data.username || userInfo.username,
                displayName: data.displayName || userInfo.displayName,
                bio: data.bio || "",
                email: data.email || "",
                isAdmin: data.isAdmin || false,

            avatarBase64: null

    }

async function loadChatsList() {
    try {
        const chatsSnap = await db.collection('chats').get();
        if (chatsSnap.empty) {
            chatsList.innerHTML = `<div class="no-chats"><div class="no-chats-card"><div class="no-chats-icon">💬</div><div class="no-chats-title">Нет сообщений</div><div class="no-chats-description">Начните общение с другими пользователями</div></div></div>`;
            return;
        }
        
        const userChats = [];
        for (const doc of chatsSnap.docs) {
            const chat = doc.data();
            const chatId = doc.id;
            
            if (chat.isGroup) {
                if (chat.participants && chat.participants.includes(currentUser.uid)) {
                    const isPinned = pinnedChats.includes(chatId);
                    const isUnread = chat.unreadFor && chat.unreadFor.includes(currentUser.uid);
                    
                    userChats.push({
                        id: chatId, 
                        ...chat,
                        isPinned: isPinned,
                        isUnread: isUnread
                    });
                }
            } else {
                if (chat.participants && chat.participants.includes(currentUser.uid)) {
                    const otherUserId = chat.participants.find(id => id !== currentUser.uid);
                    if (!otherUserId) continue;
                    if (blockedUsers.includes(otherUserId)) continue;
                    
                    const otherUserInfo = await getUserInfo(otherUserId);
                    const isPinned = pinnedChats.includes(chatId);
                    const isUnread = chat.unreadFor && chat.unreadFor.includes(currentUser.uid);
                    
                    userChats.push({
                        id: chatId, 
                        ...chat,
                        otherUserId: otherUserId,
                        otherUserInfo: otherUserInfo,
                        isPinned: isPinned,
                        isUnread: isUnread
                    });
                }
            }
        }
        
        if (userChats.length === 0) {
            chatsList.innerHTML = `<div class="no-chats"><div class="no-chats-card"><div class="no-chats-icon">💬</div><div class="no-chats-title">Нет активных чатов</div><div class="no-chats-description">Начните общение с другими пользователями</div></div></div>`;
            return;
        }
        
        const pinnedChatsArray = userChats.filter(chat => chat.isPinned);
        const regularChatsArray = userChats.filter(chat => !chat.isPinned);
        const sortByTime = (a, b) => {
            const timeA = a.lastMessageTime?.toDate ? a.lastMessageTime.toDate() : new Date(0);
            const timeB = b.lastMessageTime?.toDate ? b.lastMessageTime.toDate() : new Date(0);
            return timeB - timeA;
        };
        pinnedChatsArray.sort(sortByTime);
        regularChatsArray.sort(sortByTime);
        const sortedChats = [...pinnedChatsArray, ...regularChatsArray];
        
        let chatsHTML = '';
        for (const chat of sortedChats) {
            if (chat.isGroup) {
                const avatarStyle = chat.avatarBase64 
                    ? `style="background-image: url('${chat.avatarBase64}');"` 
                    : '';
                
                chatsHTML += `
                    <div class="chat-item fade ${chat.isUnread ? 'unread' : ''} ${chat.isPinned ? 'pinned' : ''}" 
                         data-chat-id="${chat.id}"
                         data-is-group="true"
                         onclick="openGroupChat('${chat.id}', '${chat.name}', ${JSON.stringify(chat.participants).replace(/"/g, '&quot;')})">
                        <div class="chat-avatar group" ${avatarStyle}>
                            ${chat.avatarBase64 ? '' : '👥'}
                        </div>
                        <div class="chat-info">
                            <div class="chat-header">
                                <span class="chat-user">
                                    ${escapeHtml(chat.name || 'Группа')}
                                    <span class="group-badge">👥</span>
                                </span>
                                <span class="chat-time">${formatTimeAgo(chat.lastMessageTime?.toDate())}</span>
                            </div>
                            <div class="chat-preview">${escapeHtml(chat.lastMessage || 'Нет сообщений')}</div>
                        </div>
                    </div>`;
            } else {
                const otherUser = chat.otherUserInfo;
                if (!otherUser) continue;
                
                const lastMessageTime = chat.lastMessageTime?.toDate ? chat.lastMessageTime.toDate() : new Date();
                const timeAgo = formatTimeAgo(lastMessageTime);
                let preview = chat.lastMessage || 'Нет сообщений';
                if (preview.length > 60) preview = preview.substring(0, 57) + '...';
                const senderPrefix = chat.lastSender === currentUser.uid ? 'Вы: ' : '';
                
                const avatarStyle = otherUser.avatarBase64 
                    ? `style="background-image: url('${otherUser.avatarBase64}');"` 
                    : '';
                
                chatsHTML += `
                    <div class="chat-item fade ${chat.isUnread ? 'unread' : ''} ${chat.isPinned ? 'pinned' : ''}" 
                         data-chat-id="${chat.id}"
                         data-other-user-id="${chat.otherUserId}"
                         data-is-pinned="${chat.isPinned}"
                         onclick="openChat('${chat.otherUserId}', '${otherUser.username}', '${chat.id}')">
                        <div class="chat-avatar" ${avatarStyle}>
                            ${otherUser.avatarBase64 ? '' : (otherUser.displayName?.[0]?.toUpperCase() || otherUser.username?.[0]?.toUpperCase() || 'U')}
                        </div>
                        <div class="chat-info">
                            <div class="chat-header">
                                <span class="chat-user">
                                    ${escapeHtml(otherUser.displayName || otherUser.username)}
                                    ${adminUsers.includes(chat.otherUserId) ? '<span class="verified-badge">✓</span>' : ''}
                                </span>
                                <span class="chat-time">${timeAgo}</span>
                            </div>
                            <div class="chat-preview">${senderPrefix}${escapeHtml(preview)}</div>
                        </div>
                    </div>`;
            }
        }
        chatsList.innerHTML = chatsHTML;

        document.querySelectorAll('.chat-item').forEach(item => {
            const chatId = item.dataset.chatId;
            const otherUserId = item.dataset.otherUserId;
            const isPinned = item.dataset.isPinned === 'true';
            const isGroup = item.dataset.isGroup === 'true';

            item.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!isGroup) {
                    showChatContextMenu(e, chatId, otherUserId, isPinned, item);
                }
            });

            let longPressTimer;
            item.addEventListener('touchstart', (e) => {
                if (!isGroup) {
                    longPressTimer = setTimeout(() => {
                        showChatContextMenu(e, chatId, otherUserId, isPinned, item);
                    }, 600);
                }
            });
            item.addEventListener('touchend', () => clearTimeout(longPressTimer));
            item.addEventListener('touchmove', () => clearTimeout(longPressTimer));
        });

    } catch (error) {
        console.error('Ошибка загрузки чатов:', error);
        chatsList.innerHTML = `<div class="no-chats"><div class="no-chats-card"><div class="no-chats-icon">⚠️</div><div class="no-chats-title">Ошибка загрузки</div><div class="no-chats-description">${error.message}</div></div></div>`;
    }
}

function handleGroupAvatarSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (e) => {
        groupCropImage.src = e.target.result;
        groupCropModal.classList.add('show');
        setTimeout(() => {
            if (groupCropper) groupCropper.destroy();
            groupCropper = new Cropper(groupCropImage, {
                aspectRatio: 1,
                viewMode: 1,
                dragMode: 'move',
                autoCropArea: 1,
                cropBoxMovable: true,
                cropBoxResizable: true,
                background: false,
                modal: true,
                guides: true,
                center: true,
                highlight: false,
                toggleDragModeOnDblclick: false,
            });
        }, 100);
    };
    reader.readAsDataURL(file);
    groupAvatarUploadInput.value = '';
}

function closeGroupCropModal() {
    groupCropModal.classList.remove('show');
    if (groupCropper) {
        groupCropper.destroy();
        groupCropper = null;
    }
}

function saveGroupCroppedAvatar() {
    if (!groupCropper) return;
    
    const canvas = groupCropper.getCroppedCanvas({
        width: 300,
        height: 300,
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high',
    });
    
    canvas.toBlob((blob) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            groupAvatarBase64 = e.target.result;
            groupAvatarPreview.style.backgroundImage = `url('${groupAvatarBase64}')`;
            groupAvatarPreview.style.backgroundSize = 'cover';
            groupAvatarPreview.style.backgroundPosition = 'center';
            groupAvatarPreview.textContent = '';
            closeGroupCropModal();
        };
        reader.readAsDataURL(blob);
    }, 'image/jpeg', 0.9);
}

function updateSelectedUsersDisplay() {
    if (selectedUsersMap.size === 0) {
        selectedUsersDiv.innerHTML = '';
        createGroupBtn.disabled = true;
        return;
    }
    
    let html = '';
    selectedUsersMap.forEach((user, userId) => {
        html += `
            <div class="selected-user-tag">
                ${escapeHtml(user.displayName || user.username)}
                <i class="fas fa-times" onclick="removeSelectedUser('${userId}')"></i>
            </div>
        `;
    });
    selectedUsersDiv.innerHTML = html;
    createGroupBtn.disabled = selectedUsersMap.size < 1 || !groupNameInput.value.trim();
}

function removeSelectedUser(userId) {
    selectedUsersMap.delete(userId);
    updateSelectedUsersDisplay();
    
    const userElement = document.querySelector(`.user-select-item[data-user-id="${userId}"]`);
    if (userElement) {
        userElement.classList.remove('selected');
        const checkElement = userElement.querySelector('.user-select-check');
        if (checkElement) checkElement.innerHTML = '';
    }
}

groupUserSearch.addEventListener('input', () => {
    filterUsers();
});

function filterUsers() {
    const query = groupUserSearch.value.toLowerCase().trim();
    const filtered = allUsers.filter(user => {
        const displayName = (user.displayName || '').toLowerCase();
        const username = (user.username || '').toLowerCase();
        return displayName.includes(query) || username.includes(query);
    });
    
    renderUsersList(filtered);
}

function renderUsersList(users) {
    let html = '';
    users.forEach(user => {
        const isSelected = selectedUsersMap.has(user.uid);
        const avatarStyle = user.avatarBase64 
            ? `style="background-image: url('${user.avatarBase64}');"` 
            : '';
        
        html += `
            <div class="user-select-item ${isSelected ? 'selected' : ''}" data-user-id="${user.uid}">
                <div class="user-select-avatar" ${avatarStyle}>
                    ${user.avatarBase64 ? '' : (user.displayName?.[0]?.toUpperCase() || user.username?.[0]?.toUpperCase() || 'U')}
                </div>
                <div class="user-select-info">
                    <div class="user-select-name">${escapeHtml(user.displayName || 'Пользователь')}</div>
                    <div class="user-select-username">@${escapeHtml(user.username || 'username')}</div>
                </div>
                <div class="user-select-check">
                    ${isSelected ? '<i class="fas fa-check"></i>' : ''}
                </div>
            </div>
        `;
    });
    
    if (users.length === 0) {
        html = '<div class="user-select-item" style="justify-content: center;">Ничего не найдено</div>';
    }
    
    usersListEl.innerHTML = html;
    
    document.querySelectorAll('.user-select-item').forEach(item => {
        item.addEventListener('click', () => {
            const userId = item.dataset.userId;
            const user = allUsers.find(u => u.uid === userId);
            
            if (selectedUsersMap.has(userId)) {
                selectedUsersMap.delete(userId);
                item.classList.remove('selected');
                const checkElement = item.querySelector('.user-select-check');
                if (checkElement) checkElement.innerHTML = '';
            } else {
                selectedUsersMap.set(userId, user);
                item.classList.add('selected');
                const checkElement = item.querySelector('.user-select-check');
                if (checkElement) checkElement.innerHTML = '<i class="fas fa-check"></i>';
            }
            
            updateSelectedUsersDisplay();
        });
    });
}

groupNameInput.addEventListener('input', () => {
    createGroupBtn.disabled = selectedUsersMap.size < 1 || !groupNameInput.value.trim();
});

async function createGroup() {
    const groupName = groupNameInput.value.trim();
    if (!groupName) {
        showNotification('Введите название группы');
        return;
    }
    
    if (selectedUsersMap.size < 1) {
        showNotification('Выберите хотя бы одного участника');
        return;
    }
    
    createGroupBtn.disabled = true;
    
    const participants = [currentUser.uid, ...selectedUsersMap.keys()];
    
    try {
        const groupData = {
            isGroup: true,
            name: groupName,
            participants: participants,
            createdBy: currentUser.uid,
            createdAt: new Date(),
            lastMessage: '',
            lastSender: null,
            lastMessageTime: new Date(),
            updatedAt: new Date(),
            unreadFor: participants.filter(id => id !== currentUser.uid)
        };
        
        if (groupAvatarBase64) {
            groupData.avatarBase64 = groupAvatarBase64;
        }
        
        const groupRef = await db.collection('chats').add(groupData);
        
        const welcomeMessage = {
            text: `👋 Группа "${groupName}" создана`,
            senderId: currentUser.uid,
            timestamp: new Date(),
            read: false,
            isSystemMessage: true
        };
        
        await groupRef.collection('messages').add(welcomeMessage);
        
        closeCreateGroupModal();
        showNotification('Группа успешно создана');
        
        await loadChatsList();
        
    } catch (error) {
        console.error('Ошибка создания группы:', error);
        showNotification('Ошибка: ' + error.message);
        createGroupBtn.disabled = false;
    }
}

// ===== КОНТЕКСТНОЕ МЕНЮ ЧАТА =====
function showChatContextMenu(event, chatId, otherUserId, isPinned, element) {
    event.preventDefault();
    event.stopPropagation();

    let x, y;
    if (event.type.includes('touch')) {
        const touch = event.touches[0] || event.changedTouches[0];
        x = touch.clientX;
        y = touch.clientY;
    } else {
        x = event.clientX;
        y = event.clientY;
    }

    currentChatContext = { chatId, otherUserId, isPinned, element };

    document.getElementById('pinChatText').textContent = isPinned ? 'Открепить' : 'Закрепить';

    chatContextMenu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
    chatContextMenu.style.top = Math.min(y, window.innerHeight - 150) + 'px';
    chatContextMenu.style.display = 'block';

    setTimeout(() => {
        const closeMenu = (e) => {
            if (!chatContextMenu.contains(e.target)) {
                chatContextMenu.style.display = 'none';
                document.removeEventListener('click', closeMenu);
                document.removeEventListener('touchstart', closeMenu);
            }
        };
        document.addEventListener('click', closeMenu);
        document.addEventListener('touchstart', closeMenu);
    }, 10);
}

function contextChatAction(action) {
    chatContextMenu.style.display = 'none';
    
    if (!currentChatContext) return;
    
    if (action === 'pin') {
        pinChat(currentChatContext.chatId, !currentChatContext.isPinned);
    } else if (action === 'delete') {
        deleteChat(currentChatContext.chatId);
    }
}

async function pinChat(chatId, shouldPin) {
    if (shouldPin && pinnedChats.length >= 5) {
        showNotification('Максимум 5 закреплённых чатов');
        return;
    }

    try {
        const userRef = db.collection('users').doc(currentUser.uid);
        if (shouldPin) {
            await userRef.update({
                pinnedChats: firebase.firestore.FieldValue.arrayUnion(chatId)
            });
            pinnedChats.push(chatId);
        } else {
            await userRef.update({
                pinnedChats: firebase.firestore.FieldValue.arrayRemove(chatId)
            });
            pinnedChats = pinnedChats.filter(id => id !== chatId);
        }
        await loadChatsList();
        showNotification(shouldPin ? 'Чат закреплён' : 'Чат откреплён');
    } catch (error) {
        console.error('Ошибка при закреплении/откреплении:', error);
        showNotification('Ошибка: ' + error.message);
    }
}

async function deleteChat(chatId) {
    if (!confirm('Удалить чат? Это действие нельзя отменить.')) return;

    try {
        const batch = db.batch();
        const chatRef = db.collection('chats').doc(chatId);

        const messagesSnap = await chatRef.collection('messages').get();
        messagesSnap.forEach(doc => {
            batch.delete(doc.ref);
        });

        batch.delete(chatRef);
        await batch.commit();

        if (pinnedChats.includes(chatId)) {
            await db.collection('users').doc(currentUser.uid).update({
                pinnedChats: firebase.firestore.FieldValue.arrayRemove(chatId)
            });
            pinnedChats = pinnedChats.filter(id => id !== chatId);
        }

        await loadChatsList();
        showNotification('Чат удалён');
    } catch (error) {
        console.error('Ошибка при удалении чата:', error);
        showNotification('Ошибка удаления: ' + error.message);
    }
}

async function markChatAsRead(chatId) {
    try {
        const chatRef = db.collection('chats').doc(chatId);
        const chatDoc = await chatRef.get();
        if (chatDoc.exists) {
            const chatData = chatDoc.data();
            if (chatData.unreadFor && chatData.unreadFor.includes(currentUser.uid)) {
                const updatedUnreadFor = chatData.unreadFor.filter(id => id !== currentUser.uid);
                await chatRef.update({ unreadFor: updatedUnreadFor });
            }
        }
    } catch (error) {
        console.error("Ошибка при отметке чата как прочитанного:", error);
    }
}

async function loadChatMessages() {
    chatMessages.innerHTML = '<div class="loader"><div class="loader-spinner"></div><div>Загрузка сообщений...</div></div>';
    if (!currentChatId) {
        chatMessages.innerHTML = `<div class="no-messages"><div class="no-messages-card"><div class="no-messages-icon">💬</div><div class="no-messages-text">Нет сообщений. Начните общение!</div></div></div>`;
        return;
    }
    try {
        const messagesSnap = await db.collection('chats').doc(currentChatId).collection('messages').orderBy('timestamp', 'asc').limit(100).get();
        if (messagesSnap.empty) {
            chatMessages.innerHTML = `<div class="no-messages"><div class="no-messages-card"><div class="no-messages-icon">💬</div><div class="no-messages-text">Нет сообщений. Начните общение!</div></div></div>`;
            return;
        }
        chatMessages.innerHTML = '';
        let lastDate = null;
        messagesSnap.forEach(doc => {
            const msg = doc.data();
            const msgDate = msg.timestamp?.toDate ? msg.timestamp.toDate() : new Date();
            const currentDate = new Date(msgDate.getFullYear(), msgDate.getMonth(), msgDate.getDate());
            if (!lastDate || currentDate.getTime() !== lastDate.getTime()) {
                const dateDivider = document.createElement('div');
                dateDivider.className = 'message-date-divider';
                dateDivider.innerHTML = `<span>${formatDateDivider(msgDate)}</span>`;
                chatMessages.appendChild(dateDivider);
                lastDate = currentDate;
            }
            addMessageToUI({ id: doc.id, ...msg });
        });
        
        setTimeout(() => {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 100);
        
        setupChatMessagesListener();
    } catch (error) {
        console.error('Ошибка загрузки сообщений:', error);
        chatMessages.innerHTML = `<div class="no-messages"><div class="no-messages-card"><div class="no-messages-icon">⚠️</div><div class="no-messages-text">Ошибка загрузки сообщений</div></div></div>`;
    }
}

function formatDateDivider(date) {
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    if (date.toDateString() === today.toDateString()) return 'Сегодня';
    else if (date.toDateString() === yesterday.toDateString()) return 'Вчера';
    else return date.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
}

function addMessageToUI(msg) {
    const isOutgoing = msg.senderId === currentUser.uid;
    const msgDate = msg.timestamp?.toDate ? msg.timestamp.toDate() : new Date();
    const messageTime = formatMessageTime(msgDate);
    
    const messageDiv = document.createElement('div');
    messageDiv.className = `message fade ${isOutgoing ? 'message-outgoing' : 'message-incoming'}`;
    if (msg.isCallMessage) {
        messageDiv.classList.add('call-message');
    }
    messageDiv.setAttribute('data-message-id', msg.id);
    messageDiv.setAttribute('data-sender-id', msg.senderId);
    
    setupMessageClickHandler(messageDiv, msg);
    
    const readStatus = msg.read === true ? '✓✓' : '✓';
    
    let replyHTML = '';
    if (msg.replyTo) {
        const replySenderName = msg.replyTo.senderId === currentUser.uid ? 'Вы' : 'Пользователь';
        const replyTextContent = msg.replyTo.text || '';
        const shortText = replyTextContent.length > 50 ? replyTextContent.substring(0, 47) + '...' : replyTextContent;
        replyHTML = `<div class="message-reply"><div class="message-reply-sender">${replySenderName}</div><div class="message-reply-text">${escapeHtml(shortText)}</div></div>`;
    }
    
    let senderNameHTML = '';
    if (currentChatIsGroup && !isOutgoing) {
        getUserInfo(msg.senderId).then(userInfo => {
            const senderElement = messageDiv.querySelector('.message-sender-name');
            if (senderElement) {
                senderElement.textContent = userInfo.displayName || userInfo.username;
            }
        });
        senderNameHTML = `<div class="message-sender-name" style="font-size: 12px; color: var(--accent-color); margin-bottom: 2px;">Загрузка...</div>`;
    }
    
    let reactionsHTML = '';
    if (msg.reactions && Object.keys(msg.reactions).length > 0) {
        const reactionGroups = {};
        Object.entries(msg.reactions).forEach(([userId, emoji]) => {
            if (!reactionGroups[emoji]) reactionGroups[emoji] = [];
            reactionGroups[emoji].push(userId);
        });
        reactionsHTML = '<div class="message-reactions">';
        Object.entries(reactionGroups).forEach(([emoji, users]) => {
            const isLikedByMe = users.includes(currentUser.uid);
            reactionsHTML += `<div class="reaction ${isLikedByMe ? 'liked' : ''}" onclick="event.stopPropagation(); addReactionToMessage('${msg.id}', '${emoji}')"><span>${emoji}</span><span class="reaction-count">${users.length}</span></div>`;
        });
        reactionsHTML += '</div>';
    }
    
    messageDiv.innerHTML = `${senderNameHTML}${replyHTML}<div class="message-text">${escapeHtml(msg.text || '')}</div>${reactionsHTML}<div class="message-time">${messageTime}${isOutgoing ? `<span class="message-status">${readStatus}</span>` : ''}</div>`;
    chatMessages.appendChild(messageDiv);
}

function setupMessageClickHandler(messageDiv, msg) {
    let longPressTimer;
    let isLongPress = false;
    
    messageDiv.addEventListener('touchstart', (e) => {
        isLongPress = false;
        longPressTimer = setTimeout(() => {
            isLongPress = true;
            showMessageContextMenu(e, msg.id, msg);
        }, 500);
    });
    
    messageDiv.addEventListener('touchend', (e) => {
        clearTimeout(longPressTimer);
        if (!isLongPress && !msg.isCallMessage && !msg.isSystemMessage) {
            showReactionsPanel(e, msg.id, msg);
        }
    });
    
    messageDiv.addEventListener('touchmove', () => {
        clearTimeout(longPressTimer);
    });
    
    messageDiv.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (!msg.isCallMessage && !msg.isSystemMessage) {
            showMessageContextMenu(e, msg.id, msg);
        }
    });
    
    messageDiv.addEventListener('click', (e) => {
        if (!msg.isCallMessage && !msg.isSystemMessage) {
            showReactionsPanel(e, msg.id, msg);
        }
    });
}

function setupChatMessagesListener() {
    if (chatMessagesListener || !currentChatId) return;
    chatMessagesListener = db.collection('chats').doc(currentChatId).collection('messages').orderBy('timestamp', 'desc').limit(1).onSnapshot((snapshot) => {
        snapshot.docChanges().forEach((change) => {
            if (change.type === 'added') {
                const msg = change.doc.data();
                const existingMessage = document.querySelector(`[data-message-id="${change.doc.id}"]`);
                if (!existingMessage) {
                    addMessageToUI({ id: change.doc.id, ...msg });
                    setTimeout(() => chatMessages.scrollTop = chatMessages.scrollHeight, 100);
                }
            } else if (change.type === 'modified') {
                const msg = change.doc.data();
                const existingMessage = document.querySelector(`[data-message-id="${change.doc.id}"]`);
                if (existingMessage && msg.reactions) updateMessageReactions(change.doc.id, msg.reactions);
            }
        });
    });
}

async function sendMessage() {
    if (!currentChatId) return;
    const text = chatInput.value.trim();
    if (!text) {
        showNotification('Введите сообщение');
        return;
    }
    if (!currentChatIsGroup && blockedUsers.includes(currentChatUserId)) {
        showNotification('Нельзя отправить сообщение заблокированному пользователю');
        return;
    }
    chatSendBtn.disabled = true;
    
    const messageData = { 
        text: text, 
        senderId: currentUser.uid, 
        timestamp: new Date(), 
        read: false 
    };
    
    if (replyingToMessage) {
        messageData.replyTo = {
            messageId: replyingToMessage.id,
            senderId: replyingToMessage.senderId,
            text: replyingToMessage.text
        };
    }
    
    try {
        await db.collection('chats').doc(currentChatId).collection('messages').add(messageData);
        
        let unreadFor = [];
        if (currentChatIsGroup) {
            unreadFor = currentChatParticipants.filter(id => id !== currentUser.uid);
        } else {
            unreadFor = [currentChatUserId];
        }
        
        await db.collection('chats').doc(currentChatId).update({
            lastMessage: text,
            lastSender: currentUser.uid,
            lastMessageTime: new Date(),
            updatedAt: new Date(),
            unreadFor: firebase.firestore.FieldValue.arrayUnion(...unreadFor)
        });
        
        chatInput.value = '';
        chatInput.style.height = 'auto';
        cancelReply();
        loadChatsList();
    } catch (error) {
        console.error('Ошибка отправки сообщения:', error);
        showNotification('Ошибка отправки: ' + error.message);
    } finally {
        chatSendBtn.disabled = false;
    }
}

function showMessageContextMenu(event, messageId, messageData) {
    event.preventDefault();
    event.stopPropagation();
    
    let x, y;
    if (event.type.includes('touch')) {
        const touch = event.touches[0] || event.changedTouches[0];
        x = touch.clientX;
        y = touch.clientY;
    } else {
        x = event.clientX;
        y = event.clientY;
    }
    
    currentMessageContextId = messageId;
    currentMessageContextData = messageData;
    
    messageContextMenu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
    messageContextMenu.style.top = Math.min(y, window.innerHeight - 150) + 'px';
    messageContextMenu.style.display = 'block';
    
    setTimeout(() => {
        const closeMenu = (e) => {
            if (!messageContextMenu.contains(e.target)) {
                messageContextMenu.style.display = 'none';
                document.removeEventListener('click', closeMenu);
                document.removeEventListener('touchstart', closeMenu);
            }
        };
        document.addEventListener('click', closeMenu);
        document.addEventListener('touchstart', closeMenu);
    }, 10);
}

function contextMenuAction(action) {
    messageContextMenu.style.display = 'none';
    
    if (!currentMessageContextId || !currentMessageContextData) return;
    
    if (action === 'reply') {
        replyToMessage(currentMessageContextId, currentMessageContextData);
    } else if (action === 'reactions') {
        showReactionsPanelFromMenu();
    } else if (action === 'delete') {
        if (currentMessageContextData.senderId === currentUser.uid && confirm("Удалить сообщение?")) {
            deleteMessage(currentMessageContextId);
        } else if (currentMessageContextData.senderId !== currentUser.uid) {
            showNotification('Нельзя удалить чужое сообщение');
        }
    }
}

function showReactionsPanel(event, messageId, messageData) {
    if (messageData.isCallMessage || messageData.isSystemMessage) return;
    
    selectedMessageForReaction = { id: messageId, ...messageData };
    
    let x, y;
    if (event.type.includes('touch')) {
        const touch = event.touches[0] || event.changedTouches[0];
        x = touch.clientX;
        y = touch.clientY;
    } else {
        x = event.clientX;
        y = event.clientY;
    }
    
    reactionsPanel.style.left = Math.min(x - 140, window.innerWidth - 300) + 'px';
    reactionsPanel.style.top = Math.min(y - 60, window.innerHeight - 100) + 'px';
    reactionsPanel.classList.add('show');
    
    setTimeout(() => {
        const closePanel = (e) => {
            if (!reactionsPanel.contains(e.target)) {
                reactionsPanel.classList.remove('show');
                document.removeEventListener('click', closePanel);
                document.removeEventListener('touchstart', closePanel);
            }
        };
        document.addEventListener('click', closePanel);
        document.addEventListener('touchstart', closePanel);

}

function showReactionsPanelFromMenu() {

    setTimeout(() => {

                document.removeEventListener('touchstart', closePanel);
            }
        };
        document.addEventListener('click', closePanel);
        document.addEventListener('touchstart', closePanel);

}

async function addReaction(emoji) {
    reactionsPanel.classList.remove('show');
    
    if (!selectedMessageForReaction || !currentChatId) return;
    
    try {
        const messageRef = db.collection('chats').doc(currentChatId).collection('messages').doc(selectedMessageForReaction.id);
        const messageDoc = await messageRef.get();
        const currentReactions = messageDoc.data()?.reactions || {};
        const userReaction = currentReactions[currentUser.uid];
        
        if (userReaction === emoji) {
            delete currentReactions[currentUser.uid];
            showNotification("Реакция убрана");
        } else {
            currentReactions[currentUser.uid] = emoji;
            showNotification(`+${emoji}`);
        }
        
        await messageRef.update({ reactions: currentReactions });
        updateMessageReactions(selectedMessageForReaction.id, currentReactions);
    } catch (error) {
        console.error("Ошибка при добавлении реакции:", error);
        showNotification("Ошибка: " + error.message);
    }
}

async function addReactionToMessage(messageId, emoji) {
    if (!currentChatId) return;
    
    try {
        const messageRef = db.collection('chats').doc(currentChatId).collection('messages').doc(messageId);
        const messageDoc = await messageRef.get();
        const currentReactions = messageDoc.data()?.reactions || {};
        const userReaction = currentReactions[currentUser.uid];
        
        if (userReaction === emoji) {
            delete currentReactions[currentUser.uid];
            showNotification("Реакция убрана");
        } else {
            currentReactions[currentUser.uid] = emoji;
            showNotification(`+${emoji}`);
        }
        
        await messageRef.update({ reactions: currentReactions });
        updateMessageReactions(messageId, currentReactions);
    } catch (error) {
        console.error("Ошибка при добавлении реакции:", error);
        showNotification("Ошибка: " + error.message);
    }
}

function updateMessageReactions(messageId, reactions) {
    const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
    if (!messageElement) return;
    
    let reactionsContainer = messageElement.querySelector('.message-reactions');
    if (!reactionsContainer) {
        reactionsContainer = document.createElement('div');
        reactionsContainer.className = 'message-reactions';
        const timeElement = messageElement.querySelector('.message-time');
        if (timeElement) messageElement.insertBefore(reactionsContainer, timeElement);
        else messageElement.appendChild(reactionsContainer);
    }
    
    reactionsContainer.innerHTML = '';
    
    if (Object.keys(reactions).length === 0) {
        reactionsContainer.remove();
        return;
    }
    
    const reactionGroups = {};
    Object.entries(reactions).forEach(([userId, emoji]) => {
        if (!reactionGroups[emoji]) reactionGroups[emoji] = [];
        reactionGroups[emoji].push(userId);
    });
    
    Object.entries(reactionGroups).forEach(([emoji, users]) => {
        const isLikedByMe = users.includes(currentUser.uid);
        const reactionElement = document.createElement('div');
        reactionElement.className = `reaction ${isLikedByMe ? 'liked' : ''}`;
        reactionElement.onclick = (e) => {
            e.stopPropagation();
            addReactionToMessage(messageId, emoji);
        };
        reactionElement.innerHTML = `<span>${emoji}</span><span class="reaction-count">${users.length}</span>`;
        reactionsContainer.appendChild(reactionElement);
    });
}

function replyToMessage(messageId, messageData) {
    const senderInfo = messageData.senderId === currentUser.uid ? { username: 'Вы' } : { username: 'Пользователь' };
    replyingToMessage = { id: messageId, text: messageData.text, senderId: messageData.senderId, senderName: senderInfo.username };
    replyContainer.style.display = 'block';
    replySender.textContent = senderInfo.username;
    const shortText = messageData.text.length > 50 ? messageData.text.substring(0, 47) + '...' : messageData.text;
    replyText.textContent = shortText;
    chatInput.focus();
}

function cancelReply() {
    replyingToMessage = null;
    replyContainer.style.display = 'none';
}

async function deleteMessage(messageId) {
    try {
        if (!currentChatId) return;
        await db.collection('chats').doc(currentChatId).collection('messages').doc(messageId).delete();
        const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
        if (messageElement) messageElement.remove();
        showNotification("Сообщение удалено");
    } catch (error) {
        console.error("Ошибка при удалении сообщения:", error);
        showNotification("Ошибка удаления сообщения: " + error.message);
    }
}

        searchResults.style.display = 'none';

async function searchUsers(query) {
    try {
        const usersRef = db.collection('users');
        const snapshot = await usersRef.where('username', '>=', query).where('username', '<=', query + '\uf8ff').limit(10).get();
        if (snapshot.empty) {
            searchResults.innerHTML = '<div class="search-result-item" style="justify-content: center;">Ничего не найдено</div>';
            searchResults.style.display = 'block';
            return;
        }
        let html = '';
        snapshot.forEach(doc => {
            const user = doc.data();
            if (user.uid === currentUser.uid) return;
            const avatarStyle = user.avatarBase64 
                ? `style="background-image: url('${user.avatarBase64}');"` 
                : '';
            html += `<div class="search-result-item" data-user-id="${user.uid}"><div class="result-avatar" ${avatarStyle}>${user.avatarBase64 ? '' : (user.displayName || user.username || 'U')[0].toUpperCase()}</div><div class="result-info"><div class="result-name">${escapeHtml(user.displayName || user.username || 'Пользователь')}</div><div class="result-username">@${escapeHtml(user.username || 'user')}</div></div></div>`;
        });
        if (!html) html = '<div class="search-result-item" style="justify-content: center;">Только вы</div>';
        searchResults.innerHTML = html;
        searchResults.style.display = 'block';
        document.querySelectorAll('.search-result-item').forEach(item => {
            item.addEventListener('click', () => {
                const userId = item.dataset.userId;
                if (userId) {
                    createOrOpenChat(userId);
                    searchResults.style.display = 'none';
                    searchInput.value = '';
                }
            });
        });
    } catch (error) {
        console.error('Search error:', error);
        searchResults.style.display = 'none';
    }
}

async function createOrOpenChat(otherUserId) {
    try {
        const userInfo = await getUserInfo(otherUserId);
        const chatsSnap = await db.collection('chats').get();
        let existingChatId = null;
        for (const doc of chatsSnap.docs) {
            const chat = doc.data();
            if (!chat.isGroup && chat.participants && chat.participants.includes(currentUser.uid) && chat.participants.includes(otherUserId)) {
                existingChatId = doc.id;
                break;
            }
        }
        if (existingChatId) {
            openChat(otherUserId, userInfo.username, existingChatId);
            return;
        }
        const newChatRef = await db.collection('chats').add({
            participants: [currentUser.uid, otherUserId],
            lastMessage: '',
            lastSender: currentUser.uid,
            lastMessageTime: new Date(),
            createdAt: new Date(),
            updatedAt: new Date(),
            unreadFor: [otherUserId]
        });
        openChat(otherUserId, userInfo.username, newChatRef.id);
    } catch (error) {
        console.error('Error creating chat:', error);
        showNotification('Ошибка при создании чата');
    }
}
