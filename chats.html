<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Contegg · Messenger</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --bg-input: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-tertiary: #636366;
            --accent: #007aff;
            --danger: #ff3b30;
            --separator: rgba(84, 84, 88, 0.65);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --navbar-height: 44px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-primary);
            padding-bottom: 80px;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            padding: 0 16px;
            height: var(--navbar-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 0.5px solid var(--separator);
            flex-shrink: 0;
        }

        .navbar-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #8e8e93);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 122, 255, 0.2);
            border: none;
            color: var(--accent);
            font-size: 18px;
            cursor: pointer;
        }
        .navbar-btn:active { transform: scale(0.9); }

        .content-area {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            background: var(--bg-primary);
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
        .page.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .search-bar {
            margin: 8px 16px;
            background: var(--bg-input);
            border-radius: 12px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 40px;
            border: 0.5px solid var(--separator);
        }
        .search-bar input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 17px;
            outline: none;
        }
        .search-bar input::placeholder { color: var(--text-tertiary); }

        .search-results {
            position: absolute;
            top: 56px;
            left: 16px;
            right: 16px;
            background: var(--bg-secondary);
            border-radius: 16px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 50;
            display: none;
            border: 0.5px solid var(--separator);
        }

        .search-result-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 0.5px solid var(--separator);
        }
        .search-result-item:active { background: var(--bg-tertiary); }

        .chats-list {
            padding: 0 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .chat-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
        }
        .chat-cell:active { background: var(--bg-secondary); }
        .chat-cell.unread { background: rgba(0, 122, 255, 0.08); }

        .unread-dot {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
        }

        .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007aff, #5856d6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 500;
            color: white;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .chat-content {
            flex: 1;
            min-width: 0;
            border-bottom: 0.5px solid var(--separator);
            padding: 10px 0;
        }
        .chat-cell:last-child .chat-content { border-bottom: none; }

        .chat-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .chat-name {
            font-size: 17px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-time { font-size: 12px; color: var(--text-tertiary); }
        .chat-preview { font-size: 14px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .tabbar {
            position: fixed;
            bottom: 12px;
            left: 16px;
            right: 16px;
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(25px);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px 8px;
            z-index: 100;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: var(--text-tertiary);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 0;
            border-radius: 20px;
        }
        .tab-item i { font-size: 22px; }
        .tab-item.active { color: var(--accent); background: rgba(0, 122, 255, 0.15); }

        .profile-page { padding: 20px 16px 40px; }
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007aff, #5856d6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
        .profile-username { font-size: 16px; color: var(--text-secondary); margin-bottom: 8px; }

        .profile-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .profile-cell {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 0.5px solid var(--separator);
            cursor: pointer;
            gap: 14px;
        }
        .profile-cell:last-child { border-bottom: none; }
        .profile-cell:active { background: var(--bg-tertiary); }
        .profile-cell-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            z-index: 500;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: 0.3s;
        }
        .chat-overlay.show { transform: translateX(0); }
        .chat-navbar {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            border-bottom: 0.5px solid var(--separator);
            flex-shrink: 0;
            height: var(--navbar-height);
        }
        .chat-back {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 20px;
            cursor: pointer;
        }
        .chat-user-info { flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .chat-user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007aff, #5856d6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
            background-size: cover;
            overflow: hidden;
        }
        .chat-user-name { font-size: 15px; font-weight: 500; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .msg {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
        }
        .msg-out { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .msg-in { align-self: flex-start; background: var(--bg-secondary); border-bottom-left-radius: 4px; }
        .msg-time {
            font-size: 11px;
            opacity: 0.7;
            text-align: right;
            margin-top: 2px;
        }
        .msg-date-divider { text-align: center; font-size: 13px; color: var(--text-secondary); padding: 8px 0; }

        .msg-reactions {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .reaction-badge {
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .reaction-badge.by-me { background: rgba(0,122,255,0.5); }

        .chat-input-bar {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            padding: 8px 10px;
            display: flex;
            gap: 8px;
            border-top: 0.5px solid var(--separator);
            flex-shrink: 0;
            padding-bottom: calc(8px + var(--safe-bottom));
        }
        .chat-input {
            flex: 1;
            background: var(--bg-input);
            border: 0.5px solid var(--separator);
            border-radius: 18px;
            padding: 8px 14px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
        }
        .chat-send {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-sheet {
            background: var(--bg-secondary);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: 0.3s;
            padding-bottom: var(--safe-bottom);
        }
        .modal-overlay.show .modal-sheet { transform: translateY(0); }
        .modal-handle {
            width: 36px;
            height: 5px;
            background: var(--text-tertiary);
            border-radius: 3px;
            margin: 8px auto 16px;
        }
        .modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 16px; }
        .modal-content { padding: 0 16px 20px; }

        .input-row {
            background: var(--bg-tertiary);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        .input-row input, .input-row textarea {
            width: 100%;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); margin-top: 8px; }
        .btn-danger { background: rgba(255, 59, 48, 0.15); color: var(--danger); }

        .context-menu {
            position: fixed;
            background: var(--bg-secondary);
            border-radius: 14px;
            padding: 6px;
            z-index: 2000;
            min-width: 170px;
            display: none;
            border: 0.5px solid var(--separator);
        }
        .context-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
        }
        .context-item:active { background: var(--bg-tertiary); }
        .context-item i { width: 20px; color: var(--accent); }
        .context-item.danger { color: var(--danger); }
        .context-item.danger i { color: var(--danger); }

        .reactions-panel {
            display: none;
            position: fixed;
            background: var(--bg-secondary);
            border-radius: 40px;
            padding: 8px 12px;
            gap: 6px;
            z-index: 2001;
            border: 0.5px solid var(--separator);
        }
        .reactions-panel span {
            font-size: 28px;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .reactions-panel span:active { background: rgba(255,255,255,0.1); transform: scale(1.1); }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-secondary);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 3000;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }

        .loader { text-align: center; padding: 40px; color: var(--text-secondary); }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--separator);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-container">
    <div class="navbar">
        <span class="navbar-title">Contegg</span>
        <button class="navbar-btn" onclick="showCreateGroup()">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <div class="content-area">
        <div class="page active" id="pageChats">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Поиск пользователей">
            </div>
            <div class="search-results" id="searchResults"></div>
            <div class="chats-list" id="chatsList">
                <div class="loader"><div class="spinner"></div>Загрузка...</div>
            </div>
        </div>

        <div class="page" id="pageProfile">
            <div class="profile-page" id="profileContent">
                <div class="loader"><div class="spinner"></div></div>
            </div>
        </div>
    </div>

    <div class="tabbar">
        <div class="tab-item active" data-tab="chats" onclick="switchTab('chats')">
            <i class="fas fa-comment"></i>
            <span>Чаты</span>
        </div>
        <div class="tab-item" data-tab="profile" onclick="switchTab('profile')">
            <i class="fas fa-user"></i>
            <span>Профиль</span>
        </div>
    </div>
</div>

<div class="chat-overlay" id="chatOverlay">
    <div class="chat-navbar">
        <button class="chat-back" onclick="closeChat()">
            <i class="fas fa-chevron-left"></i>
        </button>
        <div class="chat-user-info" onclick="viewChatUserProfile()">
            <div class="chat-user-avatar" id="chatAvatar"></div>
            <div>
                <div class="chat-user-name" id="chatName"></div>
            </div>
        </div>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="loader"><div class="spinner"></div></div>
    </div>
    <div class="chat-input-bar">
        <textarea class="chat-input" id="chatInput" placeholder="Сообщение" rows="1"></textarea>
        <button class="chat-send" onclick="sendMessage()">
            <i class="fas fa-arrow-up"></i>
        </button>
    </div>
</div>

<div class="modal-overlay" id="groupModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Новая группа</div>
        <div class="modal-content">
            <div class="input-row">
                <label>Название</label>
                <input type="text" id="groupNameInput" placeholder="Название группы">
            </div>
            <div class="input-row">
                <label>Поиск участников</label>
                <input type="text" id="groupSearch" placeholder="Поиск...">
            </div>
            <div id="groupUsersList" style="max-height:200px;overflow-y:auto;margin-bottom:12px;"></div>
            <button class="btn btn-primary" id="createGroupBtn" onclick="createGroup()" disabled>Создать</button>
            <button class="btn btn-secondary" onclick="closeGroupModal()">Отмена</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="profileEditModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Редактировать профиль</div>
        <div class="modal-content">
            <div class="input-row">
                <label>Имя</label>
                <input type="text" id="editName">
            </div>
            <div class="input-row">
                <label>Описание</label>
                <textarea id="editBio" rows="3"></textarea>
            </div>
            <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
            <button class="btn btn-secondary" onclick="closeProfileEdit()">Отмена</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="changePasswordModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Смена пароля</div>
        <div class="modal-content">
            <div class="input-row">
                <label>Текущий пароль</label>
                <input type="password" id="oldPassword">
            </div>
            <div class="input-row">
                <label>Новый пароль</label>
                <input type="password" id="newPassword">
            </div>
            <div class="input-row">
                <label>Подтвердите</label>
                <input type="password" id="confirmPassword">
            </div>
            <div id="passwordError" style="color:var(--danger);margin-bottom:12px;display:none;"></div>
            <button class="btn btn-primary" onclick="changePassword()">Сменить</button>
            <button class="btn btn-secondary" onclick="closeChangePasswordModal()">Отмена</button>
        </div>
    </div>
</div>

<div class="context-menu" id="msgContextMenu">
    <div class="context-item" onclick="showReactionsPanel()">
        <i class="fas fa-smile"></i> Реакции
    </div>
    <div class="context-item" onclick="ctxDelete()">
        <i class="fas fa-trash"></i> Удалить
    </div>
</div>

<div class="reactions-panel" id="reactionsPanel">
    <span onclick="addReaction('❤️')">❤️</span>
    <span onclick="addReaction('👍')">👍</span>
    <span onclick="addReaction('👎')">👎</span>
    <span onclick="addReaction('😂')">😂</span>
    <span onclick="addReaction('😮')">😮</span>
    <span onclick="addReaction('😢')">😢</span>
    <span onclick="addReaction('😡')">😡</span>
    <span onclick="addReaction('🔥')">🔥</span>
    <span onclick="addReaction('🎉')">🎉</span>
    <span onclick="addReaction('💩')">💩</span>
</div>

<div class="toast" id="toast">Сообщение</div>

<script>
// ========== FIREBASE ==========
const firebaseConfig = {
    apiKey: "AIzaSyBKTPyHKC_Mp1ZO6NDiCaJVz3w1u_PWfUo",
    authDomain: "contegg-b3b4b.firebaseapp.com",
    projectId: "contegg-b3b4b",
    storageBucket: "contegg-b3b4b.firebasestorage.app",
    messagingSenderId: "678323780149",
    appId: "1:678323780149:web:9717ac593a21d97a19cf7c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
let currentUser = null;
let userData = {};
let currentChatId = null;
let currentChatUser = null;
let currentChatIsGroup = false;
let allUsers = [];
let selectedGroupUsers = new Set();
let selectedMsgId = null;
let chatsListener = null;
let messagesListener = null;

// ========== ВСПОМОГАТЕЛЬНЫЕ ==========
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function esc(s) { return (s || '').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function timeAgo(d) {
    if (!d) return '';
    const sec = Math.floor((Date.now() - d) / 1000);
    if (sec < 60) return 'сейчас';
    if (sec < 3600) return Math.floor(sec / 60) + ' мин';
    if (sec < 86400) return Math.floor(sec / 3600) + ' ч';
    return Math.floor(sec / 86400) + ' д';
}

function timeFormat(d) {
    return d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
}

// ========== АВТОРИЗАЦИЯ ==========
auth.onAuthStateChanged(async user => {
    if (!user) { location.href = 'index.html'; return; }
    currentUser = user;
    await loadUserData();
    await loadAllUsers();
    await loadChats();
    startChatsListener();
    renderProfile();
});

async function loadUserData() {
    const snap = await db.collection('users').doc(currentUser.uid).get();
    if (!snap.exists) {
        userData = {
            uid: currentUser.uid,
            username: 'user' + Date.now().toString(36),
            displayName: 'Пользователь',
            bio: '',
            email: currentUser.email
        };
        await db.collection('users').doc(currentUser.uid).set(userData);
    } else {
        userData = snap.data();
    }
}

async function loadAllUsers() {
    const snap = await db.collection('users').get();
    allUsers = [];
    snap.forEach(doc => {
        if (doc.id !== currentUser.uid) allUsers.push({ uid: doc.id, ...doc.data() });
    });
}

// ========== НАВИГАЦИЯ ==========
function switchTab(tab) {
    const pages = document.querySelectorAll('.page');
    const tabs = document.querySelectorAll('.tab-item');
    pages.forEach(p => p.classList.remove('active'));
    document.getElementById(tab === 'chats' ? 'pageChats' : 'pageProfile').classList.add('active');
    tabs.forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');
    if (tab === 'profile') renderProfile();
}

// ========== ЧАТЫ ==========
async function loadChats() {
    const list = document.getElementById('chatsList');
    const snap = await db.collection('chats').get();
    let chats = [];
    
    for (const doc of snap.docs) {
        const chat = doc.data();
        if (!chat.participants?.includes(currentUser.uid)) continue;
        if (chat.isGroup) {
            chats.push({ id: doc.id, ...chat, type: 'group' });
        } else if (!chat.isSaved) {
            const otherId = chat.participants.find(id => id !== currentUser.uid);
            if (otherId) {
                const otherUser = await getUserInfo(otherId);
                chats.push({ id: doc.id, ...chat, otherUser, otherId, type: 'dm' });
            }
        }
    }
    
    chats.sort((a,b) => (b.lastMessageTime?.toDate() || 0) - (a.lastMessageTime?.toDate() || 0));
    
    if (chats.length === 0) {
        list.innerHTML = '<div class="loader">Нет чатов. Начните диалог через поиск!</div>';
        return;
    }
    
    list.innerHTML = chats.map(chat => {
        if (chat.type === 'group') {
            return `
                <div class="chat-cell" onclick="openGroupChat('${chat.id}')">
                    <div class="chat-avatar group">👥</div>
                    <div class="chat-content">
                        <div class="chat-top">
                            <span class="chat-name">${esc(chat.name)}</span>
                            <span class="chat-time">${timeAgo(chat.lastMessageTime?.toDate())}</span>
                        </div>
                        <div class="chat-preview">${esc(chat.lastMessage || '')}</div>
                    </div>
                </div>`;
        } else {
            const u = chat.otherUser;
            const isUnread = chat.unreadFor?.includes(currentUser.uid);
            return `
                <div class="chat-cell ${isUnread ? 'unread' : ''}" onclick="openDirectChat('${chat.otherId}')">
                    <div class="chat-avatar">${u.avatarBase64 ? `<img src="${u.avatarBase64}">` : (u.displayName?.[0] || 'U')}</div>
                    <div class="chat-content">
                        <div class="chat-top">
                            <span class="chat-name">${esc(u.displayName || u.username)}</span>
                            <span class="chat-time">${timeAgo(chat.lastMessageTime?.toDate())}</span>
                        </div>
                        <div class="chat-preview">${chat.lastSender === currentUser.uid ? 'Вы: ' : ''}${esc(chat.lastMessage || '')}</div>
                    </div>
                    ${isUnread ? '<div class="unread-dot"></div>' : ''}
                </div>`;
        }
    }).join('');
}

function startChatsListener() {
    if (chatsListener) return;
    chatsListener = db.collection('chats').onSnapshot(() => loadChats());
}

async function getUserInfo(uid) {
    const snap = await db.collection('users').doc(uid).get();
    return snap.exists ? snap.data() : { uid, displayName: 'Пользователь', username: 'user' };
}

async function openDirectChat(userId) {
    currentChatUser = { uid: userId };
    currentChatIsGroup = false;
    
    let chatId = null;
    const snap = await db.collection('chats').get();
    for (const doc of snap.docs) {
        const c = doc.data();
        if (!c.isGroup && !c.isSaved && c.participants?.includes(currentUser.uid) && c.participants?.includes(userId)) {
            chatId = doc.id;
            break;
        }
    }
    
    if (!chatId) {
        const ref = await db.collection('chats').add({
            participants: [currentUser.uid, userId],
            lastMessage: '', lastMessageTime: new Date(),
            createdAt: new Date(), isGroup: false, isSaved: false,
            unreadFor: [userId]
        });
        chatId = ref.id;
    }
    
    currentChatId = chatId;
    await openChatUI();
}

async function openGroupChat(chatId) {
    currentChatId = chatId;
    currentChatIsGroup = true;
    const doc = await db.collection('chats').doc(chatId).get();
    const chat = doc.data();
    document.getElementById('chatName').textContent = chat.name;
    document.getElementById('chatAvatar').innerHTML = '👥';
    document.getElementById('chatOverlay').classList.add('show');
    await loadMessages();
    markAsRead();
}

async function openChatUI() {
    const user = await getUserInfo(currentChatUser.uid);
    document.getElementById('chatName').textContent = user.displayName || user.username;
    document.getElementById('chatAvatar').innerHTML = user.avatarBase64 ? `<img src="${user.avatarBase64}">` : (user.displayName?.[0] || 'U');
    document.getElementById('chatOverlay').classList.add('show');
    await loadMessages();
    markAsRead();
    document.getElementById('chatInput').focus();
}

function closeChat() {
    document.getElementById('chatOverlay').classList.remove('show');
    if (messagesListener) { messagesListener(); messagesListener = null; }
    currentChatId = null;
}

async function markAsRead() {
    if (!currentChatId) return;
    const ref = db.collection('chats').doc(currentChatId);
    const doc = await ref.get();
    if (doc.data()?.unreadFor?.includes(currentUser.uid)) {
        await ref.update({ unreadFor: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
    }
}

// ========== СООБЩЕНИЯ ==========
async function loadMessages() {
    const container = document.getElementById('chatMessages');
    if (!currentChatId) return;
    
    container.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
    
    const snap = await db.collection('chats').doc(currentChatId)
        .collection('messages').orderBy('timestamp', 'asc').get();
    
    container.innerHTML = '';
    let lastDate = null;
    
    snap.forEach(doc => {
        const msg = doc.data();
        const d = msg.timestamp?.toDate() || new Date();
        const dateKey = d.toDateString();
        
        if (lastDate !== dateKey) {
            const divider = document.createElement('div');
            divider.className = 'msg-date-divider';
            divider.textContent = d.toLocaleDateString('ru', { day: 'numeric', month: 'long' });
            container.appendChild(divider);
            lastDate = dateKey;
        }
        
        renderMessage(doc.id, msg);
    });
    
    container.scrollTop = container.scrollHeight;
    
    if (messagesListener) messagesListener();
    messagesListener = db.collection('chats').doc(currentChatId)
        .collection('messages').orderBy('timestamp', 'asc')
        .onSnapshot(snap => {
            snap.docChanges().forEach(change => {
                if (change.type === 'added') {
                    const existing = document.querySelector(`[data-msg-id="${change.doc.id}"]`);
                    if (!existing) {
                        const msg = change.doc.data();
                        renderMessage(change.doc.id, msg);
                        container.scrollTop = container.scrollHeight;
                    }
                }
                if (change.type === 'modified') {
                    updateMessageReactions(change.doc.id, change.doc.data().reactions);
                }
            });
        });
}

function renderMessage(id, msg) {
    const container = document.getElementById('chatMessages');
    const isOut = msg.senderId === currentUser.uid;
    const d = msg.timestamp?.toDate() || new Date();
    
    const div = document.createElement('div');
    div.className = `msg ${isOut ? 'msg-out' : 'msg-in'}`;
    div.setAttribute('data-msg-id', id);
    div.setAttribute('data-sender-id', msg.senderId);
    
    let html = esc(msg.text || '');
    
    if (msg.reactions && Object.keys(msg.reactions).length > 0) {
        html += '<div class="msg-reactions">';
        const groups = {};
        Object.entries(msg.reactions).forEach(([uid, emoji]) => {
            if (!groups[emoji]) groups[emoji] = [];
            groups[emoji].push(uid);
        });
        Object.entries(groups).forEach(([emoji, users]) => {
            const byMe = users.includes(currentUser.uid);
            html += `<span class="reaction-badge ${byMe ? 'by-me' : ''}" data-msg-id="${id}" data-emoji="${emoji}">${emoji} ${users.length}</span>`;
        });
        html += '</div>';
    }
    
    html += `<div class="msg-time">${timeFormat(d)}</div>`;
    div.innerHTML = html;
    
    // Клик по реакции
    div.querySelectorAll('.reaction-badge').forEach(badge => {
        badge.addEventListener('click', (e) => {
            e.stopPropagation();
            const mid = badge.dataset.msgId;
            const emoji = badge.dataset.emoji;
            toggleReaction(mid, emoji);
        });
    });
    
    // Долгое нажатие для контекстного меню
    let pressTimer;
    div.addEventListener('touchstart', (e) => {
        pressTimer = setTimeout(() => {
            showMsgContextMenu(id, msg, e);
        }, 500);
    });
    div.addEventListener('touchend', () => clearTimeout(pressTimer));
    div.addEventListener('touchmove', () => clearTimeout(pressTimer));
    div.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showMsgContextMenu(id, msg, e);
    });
    
    container.appendChild(div);
}

function updateMessageReactions(id, reactions) {
    const el = document.querySelector(`.msg[data-msg-id="${id}"]`);
    if (!el) return;
    
    let rc = el.querySelector('.msg-reactions');
    if (!reactions || Object.keys(reactions).length === 0) {
        if (rc) rc.remove();
        return;
    }
    
    if (!rc) {
        rc = document.createElement('div');
        rc.className = 'msg-reactions';
        const timeEl = el.querySelector('.msg-time');
        if (timeEl) el.insertBefore(rc, timeEl);
        else el.appendChild(rc);
    }
    
    const groups = {};
    Object.entries(reactions).forEach(([uid, emoji]) => {
        if (!groups[emoji]) groups[emoji] = [];
        groups[emoji].push(uid);
    });
    
    rc.innerHTML = '';
    Object.entries(groups).forEach(([emoji, users]) => {
        const byMe = users.includes(currentUser.uid);
        const span = document.createElement('span');
        span.className = `reaction-badge ${byMe ? 'by-me' : ''}`;
        span.setAttribute('data-msg-id', id);
        span.setAttribute('data-emoji', emoji);
        span.textContent = `${emoji} ${users.length}`;
        span.onclick = (e) => {
            e.stopPropagation();
            toggleReaction(id, emoji);
        };
        rc.appendChild(span);
    });
}

async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !currentChatId) return;
    
    input.value = '';
    
    const msgData = {
        text,
        senderId: currentUser.uid,
        timestamp: new Date(),
        read: false
    };
    
    try {
        await db.collection('chats').doc(currentChatId).collection('messages').add(msgData);
        
        let unreadFor = [];
        if (!currentChatIsGroup && currentChatUser) {
            unreadFor = [currentChatUser.uid];
        }
        
        await db.collection('chats').doc(currentChatId).update({
            lastMessage: text,
            lastSender: currentUser.uid,
            lastMessageTime: new Date(),
            unreadFor: firebase.firestore.FieldValue.arrayUnion(...unreadFor)
        });
    } catch(e) { toast('Ошибка'); }
}

// ========== РЕАКЦИИ (РАБОЧАЯ ВЕРСИЯ) ==========
function showMsgContextMenu(msgId, msgData, event) {
    event.preventDefault();
    selectedMsgId = msgId;
    
    const menu = document.getElementById('msgContextMenu');
    let x = event.touches?.[0]?.clientX || event.clientX || window.innerWidth/2;
    let y = event.touches?.[0]?.clientY || event.clientY || window.innerHeight/2;
    
    x = Math.min(x, window.innerWidth - 170);
    x = Math.max(x, 10);
    y = Math.min(y, window.innerHeight - 100);
    y = Math.max(y, 10);
    
    menu.style.left = x + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
    
    const close = (e) => {
        if (!menu.contains(e.target)) {
            menu.style.display = 'none';
            document.removeEventListener('click', close);
        }
    };
    setTimeout(() => document.addEventListener('click', close), 50);
}

function showReactionsPanel() {
    const menu = document.getElementById('msgContextMenu');
    const panel = document.getElementById('reactionsPanel');
    
    menu.style.display = 'none';
    
    if (!selectedMsgId) {
        toast('Ошибка: выберите сообщение');
        return;
    }
    
    panel.setAttribute('data-msg-id', selectedMsgId);
    panel.style.display = 'flex';
    panel.style.left = (window.innerWidth/2 - 160) + 'px';
    panel.style.top = (window.innerHeight/2 - 50) + 'px';
    
    const close = (e) => {
        if (!panel.contains(e.target)) {
            panel.style.display = 'none';
            document.removeEventListener('click', close);
        }
    };
    setTimeout(() => document.addEventListener('click', close), 50);
}

async function addReaction(emoji) {
    const panel = document.getElementById('reactionsPanel');
    const msgId = panel.getAttribute('data-msg-id');
    
    panel.style.display = 'none';
    
    if (!msgId || !currentChatId) {
        toast('Ошибка: ID сообщения не найден');
        return;
    }
    
    try {
        const msgRef = db.collection('chats').doc(currentChatId).collection('messages').doc(msgId);
        const doc = await msgRef.get();
        let reactions = doc.data()?.reactions || {};
        
        if (reactions[currentUser.uid] === emoji) {
            delete reactions[currentUser.uid];
            toast('Реакция убрана');
        } else {
            reactions[currentUser.uid] = emoji;
            toast(`Реакция ${emoji} добавлена`);
        }
        
        await msgRef.update({ reactions });
        
    } catch(e) {
        console.error(e);
        toast('Ошибка при добавлении реакции');
    }
}

async function toggleReaction(msgId, emoji) {
    if (!currentChatId) return;
    
    try {
        const msgRef = db.collection('chats').doc(currentChatId).collection('messages').doc(msgId);
        const doc = await msgRef.get();
        let reactions = doc.data()?.reactions || {};
        
        if (reactions[currentUser.uid] === emoji) {
            delete reactions[currentUser.uid];
        } else {
            reactions[currentUser.uid] = emoji;
        }
        
        await msgRef.update({ reactions });
        
    } catch(e) {
        console.error(e);
    }
}

async function ctxDelete() {
    document.getElementById('msgContextMenu').style.display = 'none';
    if (!selectedMsgId || !currentChatId) return;
    if (!confirm('Удалить сообщение?')) return;
    
    try {
        await db.collection('chats').doc(currentChatId).collection('messages').doc(selectedMsgId).delete();
        document.querySelector(`.msg[data-msg-id="${selectedMsgId}"]`)?.remove();
        toast('Сообщение удалено');
    } catch(e) { toast('Ошибка'); }
}

            </div>
            <div class="profile-cell" onclick="openChangePasswordModal()">

function openProfileEdit() {
    document.getElementById('editName').value = userData.displayName || '';
    document.getElementById('editBio').value = userData.bio || '';
    document.getElementById('profileEditModal').classList.add('show');
}

function closeProfileEdit() {
    document.getElementById('profileEditModal').classList.remove('show');
}

async function saveProfile() {
    const name = document.getElementById('editName').value.trim();
    const bio = document.getElementById('editBio').value.trim();
    if (!name) { toast('Введите имя'); return; }
    
    await db.collection('users').doc(currentUser.uid).update({ displayName: name, bio });
    userData.displayName = name;
    userData.bio = bio;
    closeProfileEdit();
    renderProfile();

function openChangePasswordModal() {
    document.getElementById('oldPassword').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmPassword').value = '';
    document.getElementById('passwordError').style.display = 'none';
    document.getElementById('changePasswordModal').classList.add('show');
}

function closeChangePasswordModal() {
    document.getElementById('changePasswordModal').classList.remove('show');
}

async function changePassword() {
    const oldPass = document.getElementById('oldPassword').value;
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    const errorEl = document.getElementById('passwordError');
    
    if (!oldPass || !newPass || !confirmPass) {
        errorEl.textContent = 'Заполните все поля';
        errorEl.style.display = 'block';
        return;
    }
    if (newPass.length < 6) {
        errorEl.textContent = 'Пароль должен быть минимум 6 символов';
        errorEl.style.display = 'block';
        return;
    }
    if (newPass !== confirmPass) {
        errorEl.textContent = 'Пароли не совпадают';
        errorEl.style.display = 'block';
        return;
    }
    
    const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, oldPass);
    try {
        await currentUser.reauthenticateWithCredential(credential);
        await currentUser.updatePassword(newPass);
        toast('Пароль изменён');
        closeChangePasswordModal();
    } catch(e) {
        errorEl.textContent = e.code === 'auth/wrong-password' ? 'Неверный текущий пароль' : 'Ошибка';
        errorEl.style.display = 'block';
    }
}

// ========== ПОИСК ==========
let searchTimeout;
document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(searchTimeout);
    const q = this.value.trim();
    if (q.length < 2) {
        document.getElementById('searchResults').style.display = 'none';
        return;
    }
    searchTimeout = setTimeout(() => searchUsers(q), 400);
});

async function searchUsers(q) {
    const res = document.getElementById('searchResults');
    const filtered = allUsers.filter(u => 
        u.displayName?.toLowerCase().includes(q.toLowerCase()) || 
        u.username?.toLowerCase().includes(q.toLowerCase())
    ).slice(0, 15);
    
    if (filtered.length === 0) {
        res.innerHTML = '<div style="padding:16px;text-align:center;">Ничего не найдено</div>';
    } else {
        res.innerHTML = filtered.map(u => `
            <div class="search-result-item" onclick="startChatWith('${u.uid}')">
                <div class="chat-avatar" style="width:40px;height:40px;">${u.avatarBase64 ? `<img src="${u.avatarBase64}">` : (u.displayName?.[0] || 'U')}</div>
                <div>
                    <div>${esc(u.displayName)}</div>
                    <div style="font-size:13px;color:var(--text-secondary);">@${esc(u.username)}</div>
                </div>
            </div>
        `).join('');
    }
    res.style.display = 'block';
}

async function startChatWith(userId) {
    document.getElementById('searchResults').style.display = 'none';
    document.getElementById('searchInput').value = '';
    await openDirectChat(userId);
}

// ========== ГРУППЫ ==========
function showCreateGroup() {
    selectedGroupUsers.clear();
    document.getElementById('groupNameInput').value = '';
    document.getElementById('createGroupBtn').disabled = true;
    renderGroupUsersList();
    document.getElementById('groupModal').classList.add('show');
}

function closeGroupModal() {
    document.getElementById('groupModal').classList.remove('show');
}

function renderGroupUsersList(filter = '') {
    const container = document.getElementById('groupUsersList');
    const q = filter.toLowerCase();
    const filtered = allUsers.filter(u =>
        (u.displayName || '').toLowerCase().includes(q) ||
        (u.username || '').toLowerCase().includes(q)
    );
    
    container.innerHTML = filtered.map(u => {
        const sel = selectedGroupUsers.has(u.uid);
        return `
            <div class="search-result-item" style="justify-content:space-between;" onclick="toggleGroupUser('${u.uid}')">
                <div style="display:flex;align-items:center;gap:10px;">
                    <div class="chat-avatar" style="width:36px;height:36px;">${u.avatarBase64 ? `<img src="${u.avatarBase64}">` : (u.displayName?.[0] || 'U')}</div>
                    <div>${esc(u.displayName)}</div>
                </div>
                <div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;">${sel ? '<i class="fas fa-check" style="color:var(--accent);font-size:12px;"></i>' : ''}</div>
            </div>
        `;
    }).join('');
}

function toggleGroupUser(uid) {
    if (selectedGroupUsers.has(uid)) {
        selectedGroupUsers.delete(uid);
    } else {
        selectedGroupUsers.add(uid);
    }
    renderGroupUsersList(document.getElementById('groupSearch').value);
    updateCreateGroupBtn();
}

function updateCreateGroupBtn() {
    const name = document.getElementById('groupNameInput').value.trim();
    document.getElementById('createGroupBtn').disabled = !name || selectedGroupUsers.size < 1;
}

document.getElementById('groupSearch').addEventListener('input', function() {
    renderGroupUsersList(this.value);
});

document.getElementById('groupNameInput').addEventListener('input', updateCreateGroupBtn);

async function createGroup() {
    const name = document.getElementById('groupNameInput').value.trim();
    if (!name || selectedGroupUsers.size < 1) return;
    
    const participants = [currentUser.uid, ...Array.from(selectedGroupUsers)];
    
    const data = {
        isGroup: true, name, participants,
        lastMessage: '', lastMessageTime: new Date(),
        createdAt: new Date(), createdBy: currentUser.uid,
        unreadFor: participants.filter(id => id !== currentUser.uid),
        isSaved: false
    };
    
    const ref = await db.collection('chats').add(data);
    await ref.collection('messages').add({
        text: `Группа "${name}" создана`,
        senderId: currentUser.uid,
        timestamp: new Date(),
        isSystemMessage: true
    });
    
    closeGroupModal();
    toast('Группа создана');
}

function viewChatUserProfile() {
    toast('Профиль пользователя');
}

function logout() {
    if (confirm('Выйти?')) {
        if (chatsListener) chatsListener();
        auth.signOut().then(() => location.href = 'index.html');
    }
}

document.getElementById('chatInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-bar')) {
        document.getElementById('searchResults').style.display = 'none';
    }
    if (!e.target.closest('.context-menu')) {
        document.getElementById('msgContextMenu').style.display = 'none';
    }
    if (!e.target.closest('.reactions-panel')) {
        document.getElementById('reactionsPanel').style.display = 'none';
    }
});

console.log('✅ Contegg Messenger - Реакции работают!');
</script>
