async function searchUsers(query) {
    try {
        const usersRef = db.collection('users');
        const snapshot = await usersRef.where('username', '>=', query).where('username', '<=', query + '\uf8ff').limit(10).get();
        if (snapshot.empty) {
            searchResults.innerHTML = '<div class="search-result-item" style="justify-content: center;">Ничего не найдено</div>';
            searchResults.style.display = 'block';
            return;
        }
        let html = '';
        snapshot.forEach(doc => {
            const user = doc.data();
            if (user.uid === currentUser.uid) return;
            const avatarStyle = user.avatarBase64 
                ? `style="background-image: url('${user.avatarBase64}');"` 
                : '';
            html += `<div class="search-result-item" data-user-id="${user.uid}"><div class="result-avatar" ${avatarStyle}>${user.avatarBase64 ? '' : (user.displayName || user.username || 'U')[0].toUpperCase()}</div><div class="result-info"><div class="result-name">${escapeHtml(user.displayName || user.username || 'Пользователь')}</div><div class="result-username">@${escapeHtml(user.username || 'user')}</div></div></div>`;
        });
        if (!html) html = '<div class="search-result-item" style="justify-content: center;">Только вы</div>';
        searchResults.innerHTML = html;
        searchResults.style.display = 'block';
        document.querySelectorAll('.search-result-item').forEach(item => {
            item.addEventListener('click', () => {
                const userId = item.dataset.userId;
                if (userId) {
                    createOrOpenChat(userId);
                    searchResults.style.display = 'none';
                    searchInput.value = '';
                }
            });
        });
    } catch (error) {
        console.error('Search error:', error);
        searchResults.style.display = 'none';
    }
}

async function createOrOpenChat(otherUserId) {
    try {
        const userInfo = await getUserInfo(otherUserId);
        const chatsSnap = await db.collection('chats').get();
        let existingChatId = null;
        for (const doc of chatsSnap.docs) {
            const chat = doc.data();
            if (chat.participants && chat.participants.includes(currentUser.uid) && chat.participants.includes(otherUserId)) {
                existingChatId = doc.id;
                break;
            }
        }
        if (existingChatId) {
            openChat(otherUserId, userInfo.username, existingChatId);
            return;
        }
        const newChatRef = await db.collection('chats').add({
            participants: [currentUser.uid, otherUserId],
            lastMessage: '',
            lastSender: currentUser.uid,
            lastMessageTime: new Date(),
            createdAt: new Date(),
            updatedAt: new Date(),
            unreadFor: [otherUserId]
        });
        openChat(otherUserId, userInfo.username, newChatRef.id);
    } catch (error) {
        console.error('Error creating chat:', error);
        showNotification('Ошибка при создании чата');
    }
}

function handleAvatarSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (e) => {
        cropImage.src = e.target.result;
        cropModal.classList.add('show');
        setTimeout(() => {
            if (cropper) cropper.destroy();
            cropper = new Cropper(cropImage, {
                aspectRatio: 1,
                viewMode: 1,
                dragMode: 'move',
                autoCropArea: 1,
                cropBoxMovable: true,
                cropBoxResizable: true,
                background: false,
                modal: true,
                guides: true,
                center: true,
                highlight: false,
                toggleDragModeOnDblclick: false,
            });
        }, 100);
    };
    reader.readAsDataURL(file);
    avatarUploadInput.value = '';
}

function closeCropModal() {
    cropModal.classList.remove('show');
    if (cropper) {
        cropper.destroy();
        cropper = null;
    }
}

function saveCroppedAvatar() {
    if (!cropper) return;
    
    const canvas = cropper.getCroppedCanvas({
        width: 300,
        height: 300,
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high',
    });
    
    canvas.toBlob(async (blob) => {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const base64Data = e.target.result;
            
            try {
                await db.collection("users").doc(currentUser.uid).update({
                    avatarBase64: base64Data
                });
                
                userData.avatarBase64 = base64Data;
                usersCache.delete(currentUser.uid);
                
                renderProfile();
                loadChatsList();
                
                showNotification('Аватар успешно обновлен');
            } catch (error) {
                console.error('Ошибка сохранения аватара:', error);
                showNotification('Ошибка при сохранении аватара');
            }
            
            closeCropModal();
        };
        reader.readAsDataURL(blob);
    }, 'image/jpeg', 0.9);
}

});

chatInput?.addEventListener('keydown', function(e) { 
    if (e.key === 'Enter' && !e.shiftKey) { 
        e.preventDefault(); 
        sendMessage(); 
    } 
});

document.addEventListener('touchstart', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        e.target.style.fontSize = '16px';
    }
}, { passive: true });

document.addEventListener('click', (e) => {
    if (!searchResults.contains(e.target) && !searchInput.contains(e.target)) {
        searchResults.style.display = 'none';
    }
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && callOverlay.classList.contains('show')) {
        endCall();
    }
});

// ===== ИСПРАВЛЕННЫЕ ФУНКЦИИ ЗВОНКОВ =====

async function sendCallMessage(callType, duration = null) {
    if (!currentChatId || !currentChatUserId) return;
    try {
        let messageText = '';
        if (duration) {
            const minutes = Math.floor(duration / 60);
            const seconds = duration % 60;
            const durationStr = minutes > 0 ? `${minutes} мин ${seconds} сек` : `${seconds} сек`;
            messageText = `🔊 ${callType === 'video' ? 'Видеозвонок' : 'Аудиозвонок'}, длительность ${durationStr}`;
        } else {
            messageText = `🔊 ${callType === 'video' ? 'Видеозвонок' : 'Аудиозвонок'} (нет ответа)`;
        }
        
        const messageData = {
            text: messageText,
            senderId: currentUser.uid,
            timestamp: new Date(),
            read: false,
            isCallMessage: true,
            callType: callType,
            callDuration: duration
        };
        
        await db.collection('chats').doc(currentChatId).collection('messages').add(messageData);
        await db.collection('chats').doc(currentChatId).update({
            lastMessage: messageText,
            lastSender: currentUser.uid,
            lastMessageTime: new Date(),
            updatedAt: new Date()
        });
    } catch (error) {
        console.error('Ошибка при отправке сообщения о звонке:', error);
    }
}

function updateCallUI() {
    if (currentCallType === 'audio') {
        localVideo.style.display = 'none';
        toggleVideoBtn.style.display = 'none';
        callAvatar.style.display = 'flex';
    } else {
        localVideo.style.display = 'block';
        toggleVideoBtn.style.display = 'flex';
        callAvatar.style.display = 'none';
    }
    callOverlay.classList.add('show');
}

function updateCallStatus() {
    const statusMap = {
        'disconnected': 'Звонок завершен',
        'connecting': 'Соединение...',
        'connected': 'Разговор',
        'ringing': 'Звонок...'
    };
    callStatusEl.textContent = statusMap[callStatus] || 'Звонок';
}

function startCallTimer() {
    callStartTime = Date.now();
    callTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
        const minutes = Math.floor(elapsed / 60);
        const seconds = elapsed % 60;
        callTimer.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }, 1000);
}

// ИСПРАВЛЕННАЯ функция очистки звонка
function cleanupCall() {
    console.log('Cleaning up call...');
    
    if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
    }
    
    if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
    }
    
    localVideo.srcObject = null;
    remoteVideo.srcObject = null;
    
    if (callTimerInterval) {
        clearInterval(callTimerInterval);
        callTimerInterval = null;
    }
    
    // ИСПРАВЛЕНО: правильное удаление слушателя
    if (currentCallRef && callListener) {
        console.log('Removing call listener');
        currentCallRef.off('value', callListener);
        callListener = null;
        currentCallRef = null;
    }
    
    callOverlay.classList.remove('show');
    incomingCallBar.classList.remove('show');
    
    callStatus = 'disconnected';
    currentCallId = null;
    incomingCallData = null;
    callStartTime = null;
    pendingIceCandidates = [];
    isMuted = false;
    isVideoEnabled = true;
    
    toggleMuteBtn.innerHTML = '<i class="fas fa-microphone"></i>';
    toggleMuteBtn.classList.remove('muted');
    toggleVideoBtn.innerHTML = '<i class="fas fa-video"></i>';
    toggleVideoBtn.classList.remove('video-off');
    
    callTimer.textContent = '00:00';
    updateCallStatus();
    
    console.log('Call cleaned up');
}

// ИСПРАВЛЕННАЯ функция слушателя документа звонка
function listenToCallDoc(callId) {
    if (!callId) return;
    
    console.log('Setting up call listener for:', callId);
    
    currentCallRef = rtdb.ref(`calls/${callId}`);
    
    callListener = async (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        
        console.log('callDoc updated:', data);
        
        if (data.status === 'ended' || data.status === 'rejected') {
            console.log('Call ended/rejected');
            
            if (data.status === 'rejected' && data.calleeId === currentUser.uid) {
                showNotification('Звонок отклонен');
                await sendCallMessage(data.type);
            }
            
            if (data.status === 'ended' && data.calleeId === currentUser.uid && callStartTime) {
                const duration = Math.floor((Date.now() - callStartTime) / 1000);
                await sendCallMessage(data.type, duration);
            }
            
            cleanupCall();
            return;
        }
        
        if (data.answer && peerConnection && peerConnection.signalingState === 'have-local-offer') {
            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                console.log('remoteDescription set from answer');
                
                for (const candidate of pendingIceCandidates) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                    } catch (e) {
                        console.error('Error adding pending ICE candidate:', e);
                    }
                }
                pendingIceCandidates = [];
            } catch (e) {
                console.error('Error setting remote description:', e);
            }
        }
        
        if (data.iceCandidate) {
            if (peerConnection && peerConnection.remoteDescription) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.iceCandidate));
                    console.log('ICE candidate added');
                } catch (e) {
                    console.error('Error adding ICE candidate:', e);
                }
            } else {
                console.log('Storing ICE candidate for later');
                pendingIceCandidates.push(data.iceCandidate);
            }
        }
    };
    
    currentCallRef.on('value', callListener);
}

async function startCall(type) {
    if (!currentChatUserId) {
        showNotification('Сначала выберите чат');
        return;
    }
    
    try {
        currentCallType = type;
        callStatus = 'ringing';
        updateCallStatus();
        
        const callId = `${currentUser.uid}_${currentChatUserId}_${Date.now()}`;
        currentCallId = callId;
        pendingIceCandidates = [];
        
        const callerInfo = await getUserInfo(currentUser.uid);
        const callData = {
            callerId: currentUser.uid,
            calleeId: currentChatUserId,
            type: type,
            status: 'ringing',
            timestamp: Date.now(),
            callerName: callerInfo.displayName || callerInfo.username,
            callerAvatar: callerInfo.avatarBase64 || null
        };
        
        await rtdb.ref(`calls/${callId}`).set(callData);
        console.log('Call document created');
        
        const constraints = { audio: true, video: type === 'video' };
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        localVideo.srcObject = localStream;
        
        peerConnection = new RTCPeerConnection(iceServers);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        
        peerConnection.ontrack = (event) => {
            remoteVideo.srcObject = event.streams[0];
            callStatus = 'connected';
            updateCallStatus();
            startCallTimer();
        };
        
        peerConnection.onicecandidate = async (event) => {
            if (event.candidate) {
                await rtdb.ref(`calls/${callId}/iceCandidate`).set(event.candidate);
            }
        };
        
        peerConnection.oniceconnectionstatechange = () => {
            if (peerConnection.iceConnectionState === 'disconnected' || 
                peerConnection.iceConnectionState === 'failed') {
                if (callStatus === 'connected') {
                    showNotification('Соединение потеряно');
                    endCall();
                }
            }
        };
        
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        
        await rtdb.ref(`calls/${callId}/offer`).set(offer);
        
        const userInfo = await getUserInfo(currentChatUserId);
        callName.textContent = userInfo.displayName || userInfo.username;
        if (userInfo.avatarBase64) {
            callAvatar.style.backgroundImage = `url('${userInfo.avatarBase64}')`;
            callAvatar.innerHTML = '';
        } else {
            callAvatar.style.backgroundImage = '';
            callAvatar.innerHTML = (userInfo.displayName || userInfo.username || 'U')[0].toUpperCase();
        }
        updateCallUI();
        
        listenToCallDoc(callId);
        
    } catch (error) {
        console.error('Error starting call:', error);
        showNotification('Ошибка: ' + error.message);
        endCall();
    }
}

async function showIncomingCall(callData) {
    if (callOverlay.classList.contains('show')) return;
    
    const callerInfo = await getUserInfo(callData.callerId);
    incomingCallData = {
        id: callData.callId,
        callerId: callData.callerId,
        type: callData.type,
        name: callerInfo.displayName || callerInfo.username,
        avatar: callerInfo.avatarBase64,
        offer: callData.offer
    };
    
    incomingCallName.textContent = incomingCallData.name;
    incomingCallType.textContent = callData.type === 'video' ? '📹 Входящий видеозвонок...' : '🎧 Входящий аудиозвонок...';
    
    if (incomingCallData.avatar) {
        incomingCallAvatar.style.backgroundImage = `url('${incomingCallData.avatar}')`;
        incomingCallAvatar.innerHTML = '';
    } else {
        incomingCallAvatar.style.backgroundImage = '';
        incomingCallAvatar.style.background = 'linear-gradient(135deg, #3a6ea5, #6b4e71)';
        incomingCallAvatar.innerHTML = incomingCallData.name[0].toUpperCase();
    }
    
    incomingCallBar.classList.add('show');
    if (navigator.vibrate) navigator.vibrate([1000, 500, 1000]);
    
    listenToCallDoc(incomingCallData.id);
}

async function answerCall() {
    if (!incomingCallData) return;
    
    try {
        incomingCallBar.classList.remove('show');
        callStatus = 'connecting';
        updateCallStatus();
        
        const callId = incomingCallData.id;
        currentCallId = callId;
        pendingIceCandidates = [];
        
        const myInfo = await getUserInfo(currentUser.uid);
        
        const constraints = { audio: true, video: incomingCallData.type === 'video' };
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        localVideo.srcObject = localStream;
        
        peerConnection = new RTCPeerConnection(iceServers);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        
        peerConnection.ontrack = (event) => {
            remoteVideo.srcObject = event.streams[0];
            callStatus = 'connected';
            updateCallStatus();
            startCallTimer();
        };
        
        peerConnection.onicecandidate = async (event) => {
            if (event.candidate) {
                await rtdb.ref(`calls/${callId}/iceCandidate`).set(event.candidate);
            }
        };
        
        peerConnection.oniceconnectionstatechange = () => {
            if (peerConnection.iceConnectionState === 'disconnected' || 
                peerConnection.iceConnectionState === 'failed') {
                if (callStatus === 'connected') {
                    showNotification('Соединение потеряно');
                    endCall();
                }
            }
        };
        
        await rtdb.ref(`calls/${callId}`).update({
            status: 'answered',
            calleeId: currentUser.uid,
            calleeName: myInfo.displayName || myInfo.username,
            calleeAvatar: myInfo.avatarBase64 || null
        });
        
        if (incomingCallData.offer) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingCallData.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            await rtdb.ref(`calls/${callId}/answer`).set(answer);
        } else {
            console.error('No offer in incomingCallData');
            endCall();
            return;
        }
        
        callName.textContent = incomingCallData.name;
        currentCallType = incomingCallData.type;
        updateCallUI();
        
    } catch (error) {
        console.error('Error answering call:', error);
        showNotification('Ошибка: ' + error.message);
        endCall();
    }
}

async function declineCall() {
    if (incomingCallData) {
        await rtdb.ref(`calls/${incomingCallData.id}`).update({ status: 'rejected' });
        incomingCallBar.classList.remove('show');
        incomingCallData = null;
    }
}

async function endCall() {
    console.log('Ending call...');
    if (currentCallId) {
        await rtdb.ref(`calls/${currentCallId}`).update({ status: 'ended' });
    }
    cleanupCall();
}

function toggleMute() {
    if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
            isMuted = !isMuted;
            audioTrack.enabled = !isMuted;
            toggleMuteBtn.innerHTML = isMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
            toggleMuteBtn.classList.toggle('muted', isMuted);
        }
    }
}

function toggleVideo() {
    if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
            isVideoEnabled = !isVideoEnabled;
            videoTrack.enabled = isVideoEnabled;
            toggleVideoBtn.innerHTML = isVideoEnabled ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
            toggleVideoBtn.classList.toggle('video-off', !isVideoEnabled);
            
            if (!isVideoEnabled) {
                localVideo.style.display = 'none';
                callAvatar.style.display = 'flex';
            } else {
                localVideo.style.display = 'block';
                callAvatar.style.display = 'none';
            }
        }
    }
}

function listenForIncomingCalls() {
    if (!currentUser) return;
    
    console.log('Настройка слушателя входящих звонков');
    
    const callsRef = rtdb.ref('calls');
    callsRef.on('child_added', async (snapshot) => {
        const initialData = snapshot.val();
        const callId = snapshot.key;
        
        if (initialData.calleeId === currentUser.uid && 
            initialData.status === 'ringing' && 
            initialData.callerId !== currentUser.uid &&
            !callOverlay.classList.contains('show') &&
            !incomingCallBar.classList.contains('show')) {
            
            console.log('Potential incoming call, fetching full data...');
            
            const callRef = rtdb.ref(`calls/${callId}`);
            
            let attempts = 0;
            const maxAttempts = 10;
            
            const checkForOffer = async () => {
                const snap = await callRef.once('value');
                const data = snap.val();
                
                if (data && data.offer) {
                    data.callId = callId;
                    await showIncomingCall(data);
                    return true;
                }
                return false;
            };
            
            const checkInterval = setInterval(async () => {
                attempts++;
                if (await checkForOffer() || attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                }
            }, 500);
            
            setTimeout(async () => {
                if (await checkForOffer()) {
                    clearInterval(checkInterval);
                }
            }, 100);
        }
    });
    
    callsRef.on('child_changed', (snapshot) => {
        const callData = snapshot.val();
        const callId = snapshot.key;
        
        if (callData.status === 'answered' && callData.calleeId === currentUser.uid) {
            if (callStatus === 'connecting' || callStatus === 'ringing') {
                callStatus = 'connected';
                updateCallStatus();
            }
        }
        
        if ((callData.status === 'ended' || callData.status === 'rejected') && 
            incomingCallData && incomingCallData.id === callId) {
            incomingCallBar.classList.remove('show');
            incomingCallData = null;
        }
    });
}

console.log('Call system initialized with improved signaling');
