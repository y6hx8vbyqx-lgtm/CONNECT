<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Contegg · Messenger</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --accent: #007aff;
            --danger: #ff3b30;
            --success: #34c759;
            --warning: #ff9f0a;
            --separator: rgba(84, 84, 88, 0.65);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid var(--separator);
        }

        .navbar-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #8e8e93);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 122, 255, 0.2);
            border: none;
            color: var(--accent);
            font-size: 18px;
            cursor: pointer;
        }

        .content-area {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .page.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .search-bar {
            margin: 8px 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 40px;
            border: 0.5px solid var(--separator);
        }

        .search-bar input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 17px;
            outline: none;
        }

        .search-results {
            position: absolute;
            top: 56px;
            left: 16px;
            right: 16px;
            background: var(--bg-secondary);
            border-radius: 16px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 50;
            display: none;
        }

        .chats-list {
            padding: 0 16px;
        }

        .chat-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-cell:active {
            background: var(--bg-secondary);
        }

        .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007aff, #5856d6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 500;
            color: white;
            flex-shrink: 0;
            overflow: hidden;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-content {
            flex: 1;
            border-bottom: 0.5px solid var(--separator);
            padding: 8px 0;
        }

        .chat-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 17px;
            font-weight: 500;
        }

        .chat-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .chat-preview {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tabbar {
            position: fixed;
            bottom: 12px;
            left: 16px;
            right: 16px;
            background: rgba(28, 28, 30, 0.95);
            backdrop-filter: blur(25px);
            border-radius: 28px;
            display: flex;
            padding: 6px 8px;
            gap: 8px;
            z-index: 100;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px;
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-item i {
            font-size: 22px;
        }

        .tab-item.active {
            color: var(--accent);
            background: rgba(0, 122, 255, 0.15);
        }

        .chat-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            z-index: 500;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: 0.3s ease;
        }

        .chat-overlay.show {
            transform: translateX(0);
        }

        .chat-navbar {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 0.5px solid var(--separator);
        }

        .chat-back {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 20px;
            cursor: pointer;
        }

        .chat-user-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .chat-user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007aff, #5856d6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .chat-user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
        }

        .msg-out {
            align-self: flex-end;
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-in {
            align-self: flex-start;
            background: var(--bg-secondary);
            border-bottom-left-radius: 4px;
        }

        .msg-image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            margin: 4px 0;
            cursor: pointer;
        }

        .msg-video {
            max-width: 100%;
            max-height: 280px;
            border-radius: 12px;
            margin: 4px 0;
        }

        .msg-file {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 4px 0;
        }

        .msg-file-icon {
            font-size: 32px;
        }

        .msg-file-name {
            font-size: 13px;
            font-weight: 500;
            word-break: break-all;
        }

        .msg-time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }

        .chat-input-bar {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            padding: 8px 12px;
            border-top: 0.5px solid var(--separator);
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .attach-btn, .mic-btn, .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .attach-btn {
            background: var(--bg-tertiary);
            color: var(--accent);
        }

        .mic-btn {
            background: var(--bg-tertiary);
            color: var(--accent);
        }

        .mic-btn.recording {
            background: var(--danger);
            color: white;
            animation: pulse 1s infinite;
        }

        .send-btn {
            background: var(--accent);
            color: white;
        }

        .chat-input {
            flex: 1;
            background: var(--bg-secondary);
            border: 0.5px solid var(--separator);
            border-radius: 20px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: 100px;
        }

        .upload-progress {
            display: none;
            margin-bottom: 8px;
            padding: 8px;
            background: var(--bg-tertiary);
            border-radius: 10px;
        }

        .progress-bar {
            height: 4px;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.3s;
        }

        .profile-page {
            padding: 20px;
        }

        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007aff, #5856d6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            overflow: hidden;
            cursor: pointer;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .profile-cell {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-bottom: 0.5px solid var(--separator);
            cursor: pointer;
        }

        .profile-cell:last-child {
            border-bottom: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-sheet {
            background: var(--bg-secondary);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: 0.3s;
        }

        .modal-overlay.show .modal-sheet {
            transform: translateY(0);
        }

        .modal-title {
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            padding: 16px;
            border-bottom: 0.5px solid var(--separator);
        }

        .modal-content {
            padding: 16px;
        }

        .input-row {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .input-row input, .input-row textarea {
            width: 100%;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-danger {
            background: rgba(255, 59, 48, 0.15);
            color: var(--danger);
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 3000;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .loader {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--separator);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="app-container">

        <button class="navbar-btn" id="newGroupBtn">

<input type="file" id="photoInput" accept="image/*" style="display:none;" multiple>

<div class="toast" id="toast"></div>

<script>
// Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyBKTPyHKC_Mp1ZO6NDiCaJVz3w1u_PWfUo",
    authDomain: "contegg-b3b4b.firebaseapp.com",
    projectId: "contegg-b3b4b",
    storageBucket: "contegg-b3b4b.firebasestorage.app",
    messagingSenderId: "678323780149",
    appId: "1:678323780149:web:9717ac593a21d97a19cf7c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const storage = firebase.storage();

// ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
let currentUser = null;
let userData = {};
let currentChatId = null;
let currentChatUser = null;
let currentChatIsGroup = false;
let currentChatParticipants = [];
let chatMessagesListener = null;
let allUsers = [];
let replyTo = null;
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];

// Конфигурация файлов
const MAX_PHOTO_SIZE = 10 * 1024 * 1024;
const MAX_VIDEO_SIZE = 50 * 1024 * 1024;
const MAX_FILE_SIZE = 20 * 1024 * 1024;

// ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

function esc(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function formatFileSize(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function timeAgo(date) {
    if (!date) return '';
    const seconds = Math.floor((new Date() - date) / 1000);
    if (seconds < 60) return 'сейчас';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + ' мин';
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + ' ч';
    const days = Math.floor(hours / 24);
    return days + ' д';
}

function formatTime(date) {
    if (!date) return '';
    return date.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
}

// ========== ПОЛЬЗОВАТЕЛИ ==========
async function loadUserData() {
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if (!doc.exists) {
        userData = {
            uid: currentUser.uid,
            username: 'user_' + currentUser.uid.slice(-6),
            displayName: currentUser.email?.split('@')[0] || 'Пользователь',
            bio: '',
            avatarBase64: null
        };
        await db.collection('users').doc(currentUser.uid).set(userData);
    } else {
        userData = doc.data();
    }
}

async function getUserInfo(uid) {
    if (uid === 'system') {
        return { uid: 'system', displayName: 'Contegg', avatarBase64: null };
    }
    const doc = await db.collection('users').doc(uid).get();
    return doc.exists ? doc.data() : { uid, displayName: 'Пользователь', avatarBase64: null };
}

async function loadAllUsers() {
    const snapshot = await db.collection('users').get();
    allUsers = [];
    snapshot.forEach(doc => {
        if (doc.id !== currentUser.uid) {
            allUsers.push({ uid: doc.id, ...doc.data() });
        }
    });
}

// ========== ЧАТЫ ==========
async function loadChats() {
    const list = document.getElementById('chatsList');
    const snapshot = await db.collection('chats').get();
    let chats = [];
    
    for (const doc of snapshot.docs) {
        const chat = doc.data();
        if (!chat.participants?.includes(currentUser.uid)) continue;
        
        let displayName = '';
        let avatar = '';
        
        if (chat.isGroup) {
            displayName = chat.name;
        } else {
            const otherId = chat.participants.find(id => id !== currentUser.uid);
            if (otherId) {
                const user = await getUserInfo(otherId);
                displayName = user.displayName;
                avatar = user.avatarBase64;
            }
        }
        
        chats.push({
            id: doc.id,
            ...chat,
            displayName,
            avatar
        });
    }
    
    chats.sort((a, b) => {
        const timeA = a.lastMessageTime?.toDate() || new Date(0);
        const timeB = b.lastMessageTime?.toDate() || new Date(0);
        return timeB - timeA;
    });
    
    if (chats.length === 0) {
        list.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-secondary);">Нет чатов</div>';
        return;
    }
    
    list.innerHTML = chats.map(chat => `
        <div class="chat-cell" data-chat-id="${chat.id}" data-chat-type="${chat.isGroup ? 'group' : 'dm'}">
            <div class="chat-avatar">
                ${chat.avatar ? `<img src="${chat.avatar}">` : (chat.isGroup ? '👥' : (chat.displayName?.[0]?.toUpperCase() || 'U'))}
            </div>
            <div class="chat-content">
                <div class="chat-top">
                    <span class="chat-name">${esc(chat.displayName)}</span>
                    <span class="chat-time">${timeAgo(chat.lastMessageTime?.toDate())}</span>
                </div>
                <div class="chat-preview">${esc(chat.lastMessage || 'Новое сообщение')}</div>
            </div>
        </div>
    `).join('');
    
    document.querySelectorAll('.chat-cell').forEach(cell => {
        cell.addEventListener('click', () => {
            const chatId = cell.dataset.chatId;
            const chatType = cell.dataset.chatType;
            if (chatType === 'group') {
                openGroupChat(chatId);
            } else {
                openDirectChat(chatId);
            }
        });
    });
}

async function openDirectChat(chatId) {
    const doc = await db.collection('chats').doc(chatId).get();
    const chat = doc.data();
    const otherId = chat.participants.find(id => id !== currentUser.uid);
    const otherUser = await getUserInfo(otherId);
    
    currentChatId = chatId;
    currentChatUser = otherUser;
    currentChatIsGroup = false;
    currentChatParticipants = chat.participants;
    
    document.getElementById('chatName').textContent = otherUser.displayName;
    const avatarDiv = document.getElementById('chatAvatar');
    if (otherUser.avatarBase64) {
        avatarDiv.innerHTML = `<img src="${otherUser.avatarBase64}">`;
    } else {
        avatarDiv.innerHTML = otherUser.displayName?.[0]?.toUpperCase() || 'U';
    }
    
    document.getElementById('chatOverlay').classList.add('show');
    await loadMessages();
    markMessagesAsRead();
}

async function openGroupChat(chatId) {
    const doc = await db.collection('chats').doc(chatId).get();
    const chat = doc.data();
    
    currentChatId = chatId;
    currentChatUser = null;
    currentChatIsGroup = true;
    currentChatParticipants = chat.participants;
    
    document.getElementById('chatName').textContent = chat.name;
    const avatarDiv = document.getElementById('chatAvatar');
    if (chat.avatarBase64) {
        avatarDiv.innerHTML = `<img src="${chat.avatarBase64}">`;
    } else {
        avatarDiv.innerHTML = '👥';
    }
    
    document.getElementById('chatOverlay').classList.add('show');
    await loadMessages();
    markMessagesAsRead();
}

async function createDirectChat(userId) {
    const existing = await db.collection('chats')
        .where('participants', 'array-contains', currentUser.uid)
        .get();
    
    for (const doc of existing.docs) {
        const chat = doc.data();
        if (!chat.isGroup && chat.participants.includes(userId)) {
            return doc.id;
        }
    }
    
    const newChat = {
        participants: [currentUser.uid, userId],
        lastMessage: '',
        lastMessageTime: new Date(),
        createdAt: new Date(),
        isGroup: false
    };
    
    const docRef = await db.collection('chats').add(newChat);
    return docRef.id;
}

// ========== СООБЩЕНИЯ ==========
async function loadMessages() {
    const container = document.getElementById('chatMessages');
    if (!currentChatId) return;
    
    container.innerHTML = '<div class="loader"><div class="spinner"></div>Загрузка...</div>';
    
    const snapshot = await db.collection('chats').doc(currentChatId)
        .collection('messages')
        .orderBy('timestamp', 'asc')
        .limit(100)
        .get();
    
    container.innerHTML = '';
    
    snapshot.forEach(doc => {
        renderMessage(doc.id, doc.data());
    });
    
    container.scrollTop = container.scrollHeight;
    
    if (chatMessagesListener) chatMessagesListener();
    chatMessagesListener = db.collection('chats').doc(currentChatId)
        .collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot(snapshot => {
            snapshot.docChanges().forEach(change => {
                if (change.type === 'added') {
                    renderMessage(change.doc.id, change.doc.data());
                    container.scrollTop = container.scrollHeight;
                }
            });
        });
}

function renderMessage(id, msg) {
    const container = document.getElementById('chatMessages');
    const isOut = msg.senderId === currentUser.uid;
    const time = msg.timestamp?.toDate() || new Date();
    
    const div = document.createElement('div');
    div.className = `msg ${isOut ? 'msg-out' : 'msg-in'}`;
    
    let html = '';
    
    // Медиа контент
    if (msg.mediaType === 'photo' && msg.mediaUrl) {
        html += `<img src="${msg.mediaUrl}" class="msg-image" onclick="viewImage('${msg.mediaUrl}')">`;
    }
    else if (msg.mediaType === 'video' && msg.mediaUrl) {
        html += `<video class="msg-video" controls preload="metadata">
                    <source src="${msg.mediaUrl}">
                </video>`;
    }
    else if (msg.mediaType === 'file' && msg.mediaUrl) {
        html += `
            <div class="msg-file">
                <div class="msg-file-icon"><i class="fas fa-file"></i></div>
                <div class="msg-file-name">${esc(msg.fileName)}</div>
                <div style="margin-left: auto;">${formatFileSize(msg.fileSize || 0)}</div>
            </div>
        `;
    }
    else if (msg.text) {
        html += esc(msg.text);
    }
    
    html += `<div class="msg-time">${formatTime(time)}</div>`;
    div.innerHTML = html;
    
    container.appendChild(div);
}

async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !currentChatId) return;
    
    input.value = '';
    input.style.height = 'auto';
    
    const msgData = {
        text: text,
        senderId: currentUser.uid,
        timestamp: new Date(),
        read: false
    };
    
    await db.collection('chats').doc(currentChatId).collection('messages').add(msgData);
    
    // Обновляем последнее сообщение в чате
    let unreadFor = currentChatParticipants.filter(id => id !== currentUser.uid);
    await db.collection('chats').doc(currentChatId).update({
        lastMessage: text,
        lastMessageTime: new Date(),
        unreadFor: firebase.firestore.FieldValue.arrayUnion(...unreadFor)
    });
}

    if (!currentChatId) return;
    await db.collection('chats').doc(currentChatId).update({

}

// ========== МЕДИА ФАЙЛЫ ==========
async function uploadToStorage(file, type) {
    if (!currentChatId) {
        toast("Сначала откройте чат");
        return null;
    }
    
    const timestamp = Date.now();
    const fileName = `${timestamp}_${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
    const filePath = `chats/${currentChatId}/${type}/${fileName}`;
    const storageRef = storage.ref(filePath);
    
    const progressDiv = document.getElementById('uploadProgress');
    const progressBar = document.getElementById('progressBar');
    const statusDiv = document.getElementById('uploadStatus');
    progressDiv.style.display = 'block';
    progressBar.style.width = '0%';
    
    try {
        const uploadTask = storageRef.put(file);
        
        return new Promise((resolve, reject) => {
            uploadTask.on('state_changed',
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    progressBar.style.width = progress + '%';
                    statusDiv.textContent = `Загрузка: ${Math.round(progress)}%`;
                },
                (error) => {
                    progressDiv.style.display = 'none';
                    toast('Ошибка загрузки: ' + error.message);
                    reject(error);
                },
                async () => {
                    const url = await uploadTask.snapshot.ref.getDownloadURL();
                    progressDiv.style.display = 'none';
                    resolve({ url, name: file.name, size: file.size });
                }
            );
        });
    } catch (error) {
        progressDiv.style.display = 'none';
        toast('Ошибка: ' + error.message);
        return null;
    }
}

async function sendMediaMessage(mediaData, mediaType) {
    if (!currentChatId || !mediaData) return;
    
    const msgData = {
        senderId: currentUser.uid,
        timestamp: new Date(),
        read: false,
        mediaType: mediaType,
        mediaUrl: mediaData.url,
        fileName: mediaData.name,
        fileSize: mediaData.size
    };
    
    await db.collection('chats').doc(currentChatId).collection('messages').add(msgData);
    
    let previewText = '';
    if (mediaType === 'photo') previewText = '📷 Фото';
    else if (mediaType === 'video') previewText = '🎥 Видео';
    else previewText = `📎 ${mediaData.name}`;
    
    let unreadFor = currentChatParticipants.filter(id => id !== currentUser.uid);
    await db.collection('chats').doc(currentChatId).update({
        lastMessage: previewText,
        lastMessageTime: new Date(),
        unreadFor: firebase.firestore.FieldValue.arrayUnion(...unreadFor)
    });
    
    toast('Отправлено!');
}

}

// ========== ГОЛОСОВЫЕ СООБЩЕНИЯ ==========
async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        
        mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
        };
        
        mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const audioFile = new File([audioBlob], `voice_${Date.now()}.webm`, { type: 'audio/webm' });
            stream.getTracks().forEach(track => track.stop());
            
            const uploaded = await uploadToStorage(audioFile, 'audio');
            if (uploaded) {
                await sendMediaMessage(uploaded, 'audio');
            }
            updateMicButton(false);
        };
        
        mediaRecorder.start();
        isRecording = true;
        updateMicButton(true);
        toast('🎙️ Запись... Нажмите снова для отправки');
        
    } catch (error) {
        toast('Ошибка доступа к микрофону');
    }
}

function stopRecording() {
    if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
    }
}

function toggleRecording() {
    if (isRecording) {
        stopRecording();
    } else {
        startRecording();
    }
}

function updateMicButton(recording) {
    const micBtn = document.getElementById('micBtn');
    if (recording) {
        micBtn.innerHTML = '<i class="fas fa-stop-circle"></i>';
        micBtn.classList.add('recording');
    } else {
        micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
        micBtn.classList.remove('recording');
    }
}

document.querySelectorAll('.tab-item').forEach(tab => {
    tab.addEventListener('click', () => {
        const tabName = tab.dataset.tab;
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById(`page${tabName === 'chats' ? 'Chats' : 'Profile'}`).classList.add('active');
        tab.classList.add('active');
    });
});

// Auto resize textarea
document.getElementById('chatInput')?.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

// Enter to send
document.getElementById('chatInput')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
