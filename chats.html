<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Contegg · Мессенджер с каналами</title>
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #000000; --bg2: #1c1c1e; --bg3: #2c2c2e;
            --text: #ffffff; --text2: #8e8e93; --text3: #636366;
            --accent: #007aff; --danger: #ff3b30; --channel: #af52de;
            --sep: rgba(84,84,88,0.65); --safe-bottom: env(safe-area-inset-bottom,20px);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; position: fixed; width: 100%; }
        .app { display: flex; flex-direction: column; height: 100vh; padding-bottom: 80px; }
        .navbar { background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); padding: 0 16px; height: 44px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid var(--sep); flex-shrink: 0; }
        .navbar-title { font-size: 28px; font-weight: 700; background: linear-gradient(135deg,#fff,#8e8e93); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .navbar-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(0,122,255,0.2); border: none; color: var(--accent); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .navbar-btn:active { transform: scale(0.9); }
        .content { flex: 1; overflow: hidden; position: relative; }
        .page { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; background: var(--bg); opacity: 0; transform: translateX(30px); transition: 0.3s; pointer-events: none; }
        .page.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
        
        .tabbar { position: fixed; bottom: 12px; left: 16px; right: 16px; background: rgba(28,28,30,0.92); backdrop-filter: blur(25px); border-radius: 28px; display: flex; padding: 6px 8px; z-index: 100; border: 0.5px solid rgba(255,255,255,0.1); }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text3); font-size: 10px; cursor: pointer; padding: 8px 0; border-radius: 20px; }
        .tab-item i { font-size: 22px; }
        .tab-item.active { color: var(--accent); background: rgba(0,122,255,0.15); }
        .tab-item[data-tab="channels"].active { color: var(--channel); background: rgba(175,82,222,0.15); }
        
        .list { padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 8px; }
        .card { background: var(--bg2); border-radius: 16px; padding: 14px; cursor: pointer; border: 0.5px solid var(--sep); }
        .card:active { background: var(--bg3); transform: scale(0.98); }
        .card-header { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #5856d6); display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; flex-shrink: 0; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .card-name { font-size: 17px; font-weight: 500; flex: 1; }
        .badge { background: rgba(0,122,255,0.2); padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        .stats { font-size: 12px; color: var(--text2); display: flex; gap: 12px; margin-top: 6px; }
        
        .chat-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 500; display: flex; flex-direction: column; transform: translateX(100%); transition: 0.3s; }
        .chat-overlay.show { transform: translateX(0); }
        .chat-navbar { background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); padding: 0 12px; height: 56px; display: flex; align-items: center; gap: 12px; border-bottom: 0.5px solid var(--sep); flex-shrink: 0; }
        .chat-back { width: 36px; height: 36px; border-radius: 50%; background: none; border: none; color: var(--accent); font-size: 20px; cursor: pointer; }
        .chat-avatar-small { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #5856d6); display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; overflow: hidden; flex-shrink: 0; }
        .messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 15px; }
        .msg-out { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .msg-in { align-self: flex-start; background: var(--bg2); border-bottom-left-radius: 4px; }
        .channel-msg { background: var(--bg2); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
        .channel-msg-text { font-size: 15px; margin: 6px 0; }
        .channel-msg-stats { font-size: 11px; color: var(--text3); display: flex; gap: 12px; margin-top: 6px; }
        .channel-info-bar { background: rgba(175,82,222,0.15); padding: 8px 12px; font-size: 13px; text-align: center; border-bottom: 0.5px solid var(--sep); }
        .input-bar { background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); padding: 8px 12px; display: flex; gap: 8px; border-top: 0.5px solid var(--sep); flex-shrink: 0; padding-bottom: calc(8px + var(--safe-bottom)); }
        .input-field { flex: 1; background: var(--bg2); border: 0.5px solid var(--sep); border-radius: 20px; padding: 10px 16px; color: var(--text); font-size: 15px; font-family: inherit; resize: none; outline: none; max-height: 100px; }
        .send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); border: none; color: white; cursor: pointer; }
        
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); z-index: 1000; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal.show { opacity: 1; pointer-events: auto; }
        .modal-sheet { background: var(--bg2); border-radius: 20px 20px 0 0; width: 100%; max-height: 85vh; overflow-y: auto; transform: translateY(100%); transition: 0.3s; padding-bottom: var(--safe-bottom); }
        .modal.show .modal-sheet { transform: translateY(0); }
        .modal-handle { width: 36px; height: 5px; background: var(--text3); border-radius: 3px; margin: 8px auto 16px; }
        .modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 16px; }
        .modal-content { padding: 0 16px 20px; }
        .input-row { background: var(--bg3); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .input-row label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; }
        .input-row input, .input-row textarea { width: 100%; background: none; border: none; color: var(--text); font-size: 16px; outline: none; }
        .visibility-select { display: flex; gap: 12px; margin-bottom: 16px; }
        .visibility-option { flex: 1; text-align: center; padding: 10px; border-radius: 12px; background: var(--bg3); cursor: pointer; }
        .visibility-option.active { background: var(--accent); color: white; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: 500; cursor: pointer; margin-bottom: 8px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: var(--bg3); color: var(--text); }
        .btn-danger { background: rgba(255,59,48,0.15); color: var(--danger); }
        .profile-cell { display: flex; align-items: center; padding: 14px 16px; border-bottom: 0.5px solid var(--sep); cursor: pointer; gap: 14px; }
        .profile-cell:active { background: var(--bg3); }
        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--bg2); padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 3000; opacity: 0; transition: 0.3s; pointer-events: none; white-space: nowrap; }
        .toast.show { opacity: 1; transform: translateX(-50%); }
        .loader { text-align: center; padding: 40px; color: var(--text2); }
        .spinner { width: 30px; height: 30px; border: 3px solid var(--sep); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty { text-align: center; padding: 60px 20px; color: var(--text2); }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 12px; background: linear-gradient(135deg,var(--accent),#5856d6); display: flex; align-items: center; justify-content: center; font-size: 32px; color: white; overflow: hidden; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .sub-badge { background: rgba(0,122,255,0.2); padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        .private-badge { background: rgba(255,59,48,0.15); color: var(--danger); }
        .inline-icon { margin-right: 4px; }
    </style>
</head>
<body>
<div class="app">
    <div class="navbar">
        <span class="navbar-title">Contegg</span>
        <button class="navbar-btn" id="createBtn"><i class="fas fa-plus"></i></button>
    </div>
    <div class="content">
        <div class="page active" id="pageChats"><div class="list" id="chatsList"><div class="loader"><div class="spinner"></div></div></div></div>
        <div class="page" id="pageChannels"><div class="list" id="channelsList"><div class="loader"><div class="spinner"></div></div></div></div>
        <div class="page" id="pageProfile"><div id="profileContent"><div class="loader"><div class="spinner"></div></div></div></div>
    </div>
    <div class="tabbar">
        <div class="tab-item active" data-tab="chats" onclick="switchTab('chats')"><i class="fas fa-comment"></i><span>Чаты</span></div>
        <div class="tab-item" data-tab="channels" onclick="switchTab('channels')"><i class="fas fa-bullhorn"></i><span>Каналы</span></div>
        <div class="tab-item" data-tab="profile" onclick="switchTab('profile')"><i class="fas fa-user"></i><span>Профиль</span></div>
    </div>
</div>

<div class="chat-overlay" id="chatOverlay">
    <div class="chat-navbar">
        <button class="chat-back" onclick="closeOverlay()"><i class="fas fa-chevron-left"></i></button>
        <div class="chat-avatar-small" id="overlayAvatar"></div>
        <div style="flex:1"><div id="overlayTitle"></div><div id="overlaySubtitle" style="font-size:12px;color:var(--text2)"></div></div>
        <button class="navbar-btn" id="menuBtn" style="width:36px;background:transparent;" onclick="showOverlayMenu()"><i class="fas fa-ellipsis-h"></i></button>
    </div>
    <div id="channelInfo" class="channel-info-bar" style="display:none"></div>
    <div class="messages" id="messagesContainer"></div>
    <div class="input-bar" id="inputBar"><textarea class="input-field" id="messageInput" placeholder="Сообщение" rows="1"></textarea><button class="send-btn" onclick="sendMessage()"><i class="fas fa-arrow-up"></i></button></div>
    <div class="input-bar" id="subscribeBar" style="display:none; justify-content:center;"><button class="btn-primary" style="width:auto;padding:10px 24px;" onclick="subscribeToChannel()"><i class="fas fa-bell"></i> Подписаться</button></div>
</div>

<!-- Модалка создания канала -->
<div class="modal" id="createChannelModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Создать канал</div>
        <div class="modal-content">
            <div class="input-row"><label>Название</label><input type="text" id="channelName" placeholder="Название канала" maxlength="40"></div>
            <div class="input-row"><label>Описание</label><textarea id="channelDesc" placeholder="Описание" rows="2" maxlength="200"></textarea></div>
            <div class="visibility-select">
                <div class="visibility-option active" data-vis="public" onclick="setVisibility('public')"><i class="fas fa-globe"></i> Публичный</div>
                <div class="visibility-option" data-vis="private" onclick="setVisibility('private')"><i class="fas fa-lock"></i> Приватный (по ссылке)</div>
            </div>
            <div style="text-align:center;margin-bottom:16px"><div id="channelAvatarPreview" style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--channel),#5856d6);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 8px;overflow:hidden;">📢</div><button onclick="document.getElementById('channelAvatarFile').click()" style="background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;">Загрузить фото</button></div>
            <button class="btn btn-primary" onclick="createChannel()">Создать канал</button>
            <button class="btn btn-secondary" onclick="closeModal('createChannelModal')">Отмена</button>
        </div>
    </div>
</div>

<!-- Модалка приглашения в приватный канал -->
<div class="modal" id="joinChannelModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Войти по ссылке</div>
        <div class="modal-content">
            <div class="input-row"><label>Ссылка-приглашение</label><input type="text" id="inviteCodeInput" placeholder="Вставьте ссылку или код приглашения"></div>
            <button class="btn btn-primary" onclick="joinChannelByCode()">Подписаться</button>
            <button class="btn btn-secondary" onclick="closeModal('joinChannelModal')">Отмена</button>
        </div>
    </div>
</div>

<!-- Модалка управления каналом -->
<div class="modal" id="manageModal">
    <div class="modal-sheet"><div class="modal-handle"></div><div class="modal-title">Управление</div><div class="modal-content" id="manageContent"></div></div>
</div>

<!-- Модалка приглашения -->
<div class="modal" id="inviteLinkModal">
    <div class="modal-sheet"><div class="modal-handle"></div><div class="modal-title">Ссылка-приглашение</div><div class="modal-content"><div class="input-row"><input type="text" id="inviteLink" readonly onclick="this.select()"></div><button class="btn btn-primary" onclick="copyInviteLink()">Копировать</button><button class="btn btn-secondary" onclick="closeModal('inviteLinkModal')">Закрыть</button></div></div>
</div>

<!-- Остальные модалки для чатов и групп -->
<div class="modal" id="groupModal"><div class="modal-sheet"><div class="modal-handle"></div><div class="modal-title">Новая группа</div><div class="modal-content"><div class="input-row"><label>Название</label><input type="text" id="groupName" placeholder="Название группы"></div><div class="input-row"><label>Поиск участников</label><input type="text" id="groupSearch" placeholder="Поиск..."></div><div id="groupUsersList" style="max-height:200px;overflow-y:auto;margin-bottom:12px;"></div><button class="btn btn-primary" id="createGroupBtn" onclick="createGroup()" disabled>Создать группу</button><button class="btn btn-secondary" onclick="closeModal('groupModal')">Отмена</button></div></div></div>

<div class="modal" id="profileEditModal"><div class="modal-sheet"><div class="modal-handle"></div><div class="modal-title">Редактировать профиль</div><div class="modal-content"><div class="input-row"><label>Имя</label><input type="text" id="editName"></div><div class="input-row"><label>Описание</label><textarea id="editBio" rows="2"></textarea></div><button class="btn btn-primary" onclick="saveProfile()">Сохранить</button><button class="btn btn-secondary" onclick="closeModal('profileEditModal')">Отмена</button></div></div></div>

<div class="modal" id="userProfileModal"><div class="modal-sheet"><div class="modal-handle"></div><div id="userProfileContent" style="padding:0 16px 30px;text-align:center"></div></div></div>

<input type="file" id="channelAvatarFile" accept="image/*" style="display:none">
<input type="file" id="avatarInput" accept="image/*" style="display:none">
<div class="toast" id="toast"></div>

<script>
// Firebase
const firebaseConfig = {
    apiKey: "AIzaSyBKTPyHKC_Mp1ZO6NDiCaJVz3w1u_PWfUo",
    authDomain: "contegg-b3b4b.firebaseapp.com",
    projectId: "contegg-b3b4b",
    storageBucket: "contegg-b3b4b.firebasestorage.app",
    messagingSenderId: "678323780149",
    appId: "1:678323780149:web:9717ac593a21d97a19cf7c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// Глобальные переменные
let currentUser = null, userData = {};
let currentChannel = null;
let currentChatId = null;
let currentChatUser = null;
let currentIsChannel = false;
let messagesUnsub = null;
let channelAvatarBase64 = null;
let selectedVisibility = 'public';
let allUsers = [];
let selectedGroupUsers = new Set();
let groupAvatarBase64 = null;
let savedChatId = null;
let pinnedChats = [];

// Вспомогательные функции
function toast(msg) { let t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
function esc(s) { return (s || '').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function timeAgo(d) { if(!d) return ''; let sec = Math.floor((Date.now() - d) / 1000); if(sec < 60) return 'сейчас'; if(sec < 3600) return Math.floor(sec/60)+' мин'; if(sec < 86400) return Math.floor(sec/3600)+' ч'; return Math.floor(sec/86400)+' д'; }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// Авторизация
auth.onAuthStateChanged(async user => {
    if(!user) { location.href = 'index.html'; return; }
    currentUser = user;
    await loadUserData();
    await loadChats();
    await loadChannels();
    await loadAllUsers();
    switchTab('chats');
    
    document.getElementById('createBtn').onclick = () => {
        let activeTab = document.querySelector('.tab-item.active').dataset.tab;
        if(activeTab === 'channels') showCreateChannelModal();
        else if(activeTab === 'chats') showCreateGroupModal();
        else openProfileEdit();
    };
});

async function loadUserData() {
    let snap = await db.collection('users').doc(currentUser.uid).get();
    if(!snap.exists) {
        userData = { uid: currentUser.uid, username: 'user'+Date.now().toString(36), displayName: 'Пользователь', bio: '', email: currentUser.email || '', avatarBase64: null, pinnedChats: [] };
        await db.collection('users').doc(currentUser.uid).set(userData);
    } else { userData = snap.data(); pinnedChats = userData.pinnedChats || []; }
    renderProfile();
}

async function loadAllUsers() {
    let snap = await db.collection('users').get();
    allUsers = [];
    snap.forEach(doc => { if(doc.id !== currentUser.uid) allUsers.push({ uid: doc.id, ...doc.data() }); });
}

function switchTab(tab) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page${tab.charAt(0).toUpperCase()+tab.slice(1)}`).classList.add('active');
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');
    if(tab === 'profile') renderProfile();
    if(tab === 'channels') loadChannels();
    if(tab === 'chats') loadChats();
}

// ==================== КАНАЛЫ ====================
function setVisibility(v) { selectedVisibility = v; document.querySelectorAll('.visibility-option').forEach(el => el.classList.remove('active')); document.querySelector(`.visibility-option[data-vis="${v}"]`).classList.add('active'); }

function showCreateChannelModal() {
    channelAvatarBase64 = null;
    document.getElementById('channelName').value = '';
    document.getElementById('channelDesc').value = '';
    selectedVisibility = 'public';
    setVisibility('public');
    document.getElementById('channelAvatarPreview').innerHTML = '📢';
    document.getElementById('channelAvatarPreview').style.background = 'linear-gradient(135deg,var(--channel),#5856d6)';
    document.getElementById('createChannelModal').classList.add('show');
}

document.getElementById('channelAvatarFile').addEventListener('change', e => {
    let file = e.target.files[0]; if(!file) return;
    let reader = new FileReader();
    reader.onload = ev => {
        let img = new Image();
        img.onload = () => {
            let canvas = document.createElement('canvas');
            canvas.width = 300; canvas.height = 300;
            let ctx = canvas.getContext('2d');
            let scale = Math.max(300/img.width, 300/img.height);
            let x = (300/2) - (img.width*scale/2);
            let y = (300/2) - (img.height*scale/2);
            ctx.drawImage(img, x, y, img.width*scale, img.height*scale);
            channelAvatarBase64 = canvas.toDataURL('image/jpeg', 0.85);
            let preview = document.getElementById('channelAvatarPreview');
            preview.innerHTML = `<img src="${channelAvatarBase64}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
            preview.style.background = 'none';
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
});

async function createChannel() {
    let name = document.getElementById('channelName').value.trim();
    if(!name) { toast('Введите название'); return; }
    let inviteCode = Math.random().toString(36).substring(2, 12);
    let channelData = {
        name, description: document.getElementById('channelDesc').value.trim(),
        ownerId: currentUser.uid, admins: [currentUser.uid], subscribers: [currentUser.uid],
        visibility: selectedVisibility, inviteCode, createdAt: new Date(),
        lastMessage: '', lastMessageTime: new Date(), type: 'channel'
    };
    if(channelAvatarBase64) channelData.avatarBase64 = channelAvatarBase64;
    let docRef = await db.collection('channels').add(channelData);
    await db.collection('channels').doc(docRef.id).collection('messages').add({
        text: `📢 Канал "${name}" создан`, senderId: currentUser.uid, timestamp: new Date(), views: 0
    });
    toast('Канал создан!');
    closeModal('createChannelModal');
    loadChannels();
}

async function loadChannels() {
    let container = document.getElementById('channelsList');
    try {
        let snap = await db.collection('channels').get();
        let channels = [];
        snap.forEach(doc => {
            let ch = doc.data();
            // Публичные видны всем, приватные - только подписчикам и владельцу
            if(ch.visibility === 'public' || ch.subscribers?.includes(currentUser.uid) || ch.ownerId === currentUser.uid) {
                channels.push({ id: doc.id, ...ch });
            }
        });
        if(channels.length === 0) {
            container.innerHTML = `<div class="empty"><i class="fas fa-bullhorn" style="font-size:48px;opacity:0.5"></i><div>Нет доступных каналов</div><div style="font-size:13px;margin-top:8px">Создайте публичный канал или получите ссылку на приватный</div><button class="btn-primary" style="margin-top:16px;width:auto;padding:10px 20px;" onclick="showJoinChannelModal()"><i class="fas fa-link"></i> Войти по ссылке</button></div>`;
            return;
        }
        container.innerHTML = channels.map(ch => {
            let isSub = ch.subscribers?.includes(currentUser.uid);
            let isOwner = ch.ownerId === currentUser.uid;
            let avatarHtml = ch.avatarBase64 ? `<img src="${ch.avatarBase64}">` : '📢';
            return `
                <div class="card" onclick="openChannel('${ch.id}')">
                    <div class="card-header">
                        <div class="avatar">${avatarHtml}</div>
                        <div class="card-name">${esc(ch.name)} ${isOwner ? '<i class="fas fa-crown" style="color:#ffd700;font-size:12px"></i>' : ''}</div>
                        ${isSub ? '<span class="badge">Подписан</span>' : ''}
                        ${ch.visibility === 'private' ? '<span class="badge private-badge"><i class="fas fa-lock"></i> Приватный</span>' : '<span class="badge"><i class="fas fa-globe"></i> Публичный</span>'}
                    </div>
                    <div style="font-size:13px;color:var(--text2);margin:4px 0">${esc(ch.description || '')}</div>
                    <div class="stats"><span><i class="fas fa-users"></i> ${ch.subscribers?.length || 0}</span></div>
                </div>
            `;
        }).join('');
        container.innerHTML += `<div style="margin-top:12px;text-align:center"><button class="btn-secondary" style="width:auto;padding:10px 20px;" onclick="showJoinChannelModal()"><i class="fas fa-link"></i> Приватный канал? Войти по ссылке</button></div>`;
    } catch(e) { container.innerHTML = '<div class="empty">Ошибка загрузки</div>'; }
}

function showJoinChannelModal() {
    document.getElementById('inviteCodeInput').value = '';
    document.getElementById('joinChannelModal').classList.add('show');
}

async function joinChannelByCode() {
    let input = document.getElementById('inviteCodeInput').value.trim();
    let code = input.includes('code=') ? input.split('code=')[1] : input;
    if(!code) { toast('Введите код или ссылку'); return; }
    
    let snap = await db.collection('channels').where('inviteCode', '==', code).get();
    if(snap.empty) { toast('Канал не найден'); return; }
    
    let channel = snap.docs[0];
    let chData = channel.data();
    
    if(chData.subscribers?.includes(currentUser.uid)) {
        toast('Вы уже подписаны на этот канал');
        closeModal('joinChannelModal');
        openChannel(channel.id);
        return;
    }
    
    await channel.ref.update({
        subscribers: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
    });
    toast('Вы подписались на канал!');
    closeModal('joinChannelModal');
    loadChannels();
    openChannel(channel.id);
}

async function openChannel(id) {
    if(messagesUnsub) messagesUnsub();
    let doc = await db.collection('channels').doc(id).get();
    if(!doc.exists) return;
    currentChannel = { id, ...doc.data() };
    currentIsChannel = true;
    currentChatId = null;
    
    let isSub = currentChannel.subscribers?.includes(currentUser.uid);
    let isAdmin = currentChannel.admins?.includes(currentUser.uid);
    
    document.getElementById('overlayAvatar').innerHTML = currentChannel.avatarBase64 ? `<img src="${currentChannel.avatarBase64}">` : '📢';
    document.getElementById('overlayTitle').innerText = currentChannel.name;
    document.getElementById('overlaySubtitle').innerHTML = `${currentChannel.subscribers?.length || 0} подписчиков • ${currentChannel.visibility === 'public' ? 'Публичный' : 'Приватный'}`;
    document.getElementById('channelInfo').style.display = 'block';
    document.getElementById('channelInfo').innerHTML = currentChannel.description || '';
    
    if(isAdmin) {
        document.getElementById('inputBar').style.display = 'flex';
        document.getElementById('subscribeBar').style.display = 'none';
    } else if(isSub) {
        document.getElementById('inputBar').style.display = 'none';
        document.getElementById('subscribeBar').style.display = 'none';
    } else {
        document.getElementById('inputBar').style.display = 'none';
        document.getElementById('subscribeBar').style.display = 'flex';
    }
    
    document.getElementById('chatOverlay').classList.add('show');
    await loadChannelMessages();
}

async function loadChannelMessages() {
    if(!currentChannel) return;
    let container = document.getElementById('messagesContainer');
    container.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
    
    let snap = await db.collection('channels').doc(currentChannel.id).collection('messages').orderBy('timestamp', 'asc').get();
    container.innerHTML = '';
    
    for(let doc of snap.docs) {
        let msg = doc.data();
        let div = document.createElement('div');
        div.className = 'channel-msg';
        div.innerHTML = `
            <div class="flex-between"><span style="font-size:12px;color:var(--accent)">${msg.senderId === currentUser.uid ? 'Вы' : 'Администратор'}</span><span style="font-size:11px;color:var(--text3)">${new Date(msg.timestamp?.toDate()).toLocaleTimeString('ru', {hour:'2-digit',minute:'2-digit'})}</span></div>
            <div class="channel-msg-text">${esc(msg.text)}</div>
            <div class="channel-msg-stats"><span><i class="fas fa-eye"></i> ${msg.views || 0}</span></div>
        `;
        container.appendChild(div);
        
        if(msg.senderId !== currentUser.uid && !msg.viewedBy?.includes(currentUser.uid)) {
            await db.collection('channels').doc(currentChannel.id).collection('messages').doc(doc.id).update({
                views: firebase.firestore.FieldValue.increment(1),
                viewedBy: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
            });
        }
    }
    container.scrollTop = container.scrollHeight;
    
    // Один слушатель для обновлений
    if(messagesUnsub) messagesUnsub();
    messagesUnsub = db.collection('channels').doc(currentChannel.id).collection('messages').orderBy('timestamp', 'asc').onSnapshot(() => {
        if(currentChannel) loadChannelMessages();
    });
}

async function sendChannelMessage() {
    let input = document.getElementById('messageInput');
    let text = input.value.trim();
    if(!text || !currentChannel) return;
    if(!currentChannel.admins?.includes(currentUser.uid)) { toast('Только администраторы могут публиковать'); return; }
    
    await db.collection('channels').doc(currentChannel.id).collection('messages').add({
        text, senderId: currentUser.uid, timestamp: new Date(), views: 0, viewedBy: []
    });
    await db.collection('channels').doc(currentChannel.id).update({ lastMessage: text, lastMessageTime: new Date() });
    input.value = '';
}

async function subscribeToChannel() {
    if(!currentChannel) return;
    let isSub = currentChannel.subscribers?.includes(currentUser.uid);
    let ref = db.collection('channels').doc(currentChannel.id);
    
    if(isSub) {
        await ref.update({ subscribers: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
        toast('Вы отписались');
        currentChannel.subscribers = currentChannel.subscribers.filter(s => s !== currentUser.uid);
        document.getElementById('subscribeBar').style.display = 'flex';
        document.getElementById('inputBar').style.display = 'none';
    } else {
        await ref.update({ subscribers: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
        toast('Вы подписались');
        currentChannel.subscribers = [...(currentChannel.subscribers || []), currentUser.uid];
        document.getElementById('subscribeBar').style.display = 'none';
        document.getElementById('inputBar').style.display = 'none';
    }
    document.getElementById('overlaySubtitle').innerHTML = `${currentChannel.subscribers?.length || 0} подписчиков • ${currentChannel.visibility === 'public' ? 'Публичный' : 'Приватный'}`;
}

function showOverlayMenu() {
    if(currentChannel) showChannelMenu();
    else if(currentChatId) toast('Меню чата');
}

function showChannelMenu() {
    let isAdmin = currentChannel?.admins?.includes(currentUser.uid);
    let isOwner = currentChannel?.ownerId === currentUser.uid;
    let content = document.getElementById('manageContent');
    content.innerHTML = `
        <div class="profile-cell" onclick="getInviteLink()"><i class="fas fa-link"></i> <span style="flex:1">Ссылка-приглашение</span><i class="fas fa-chevron-right"></i></div>
        ${isAdmin ? `<div class="profile-cell" onclick="editChannelDesc()"><i class="fas fa-edit"></i> <span style="flex:1">Редактировать описание</span><i class="fas fa-chevron-right"></i></div>` : ''}
        ${isOwner ? `<div class="profile-cell" onclick="addChannelAdminPrompt()"><i class="fas fa-user-plus"></i> <span style="flex:1">Добавить администратора</span><i class="fas fa-chevron-right"></i></div>` : ''}
        ${isOwner ? `<div class="profile-cell" style="color:var(--danger)" onclick="deleteChannelConfirm()"><i class="fas fa-trash"></i> <span style="flex:1">Удалить канал</span><i class="fas fa-chevron-right"></i></div>` : ''}
        <div class="profile-cell" onclick="closeModal('manageModal')"><i class="fas fa-times"></i> <span style="flex:1">Закрыть</span></div>
    `;
    document.getElementById('manageModal').classList.add('show');
}

function getInviteLink() {
    let link = `https://contegg.me/join?code=${currentChannel.inviteCode}`;
    document.getElementById('inviteLink').value = link;
    closeModal('manageModal');
    document.getElementById('inviteLinkModal').classList.add('show');
}

function copyInviteLink() { let inp = document.getElementById('inviteLink'); inp.select(); document.execCommand('copy'); toast('Ссылка скопирована'); closeModal('inviteLinkModal'); }

async function editChannelDesc() {
    let newDesc = prompt('Новое описание:', currentChannel.description || '');
    if(newDesc !== null) {
        await db.collection('channels').doc(currentChannel.id).update({ description: newDesc });
        currentChannel.description = newDesc;
        document.getElementById('channelInfo').innerHTML = newDesc;
        toast('Описание обновлено');
        closeModal('manageModal');
    }
}

async function addChannelAdminPrompt() {
    let uid = prompt('Введите UID пользователя:');
    if(!uid) return;
    let userSnap = await db.collection('users').doc(uid).get();
    if(!userSnap.exists) { toast('Пользователь не найден'); return; }
    await db.collection('channels').doc(currentChannel.id).update({ admins: firebase.firestore.FieldValue.arrayUnion(uid) });
    toast('Администратор добавлен');
    closeModal('manageModal');
}

async function deleteChannelConfirm() {
    if(!confirm('Удалить канал навсегда?')) return;
    let msgs = await db.collection('channels').doc(currentChannel.id).collection('messages').get();
    let batch = db.batch();
    msgs.forEach(m => batch.delete(m.ref));
    batch.delete(db.collection('channels').doc(currentChannel.id));
    await batch.commit();
    toast('Канал удалён');
    closeOverlay();
    loadChannels();
}

// ==================== ЧАТЫ (ЛИЧНЫЕ) ====================
async function loadChats() {
    let container = document.getElementById('chatsList');
    try {
        let snap = await db.collection('chats').get();
        let chats = [];
        for(let doc of snap.docs) {
            let chat = doc.data();
            if(!chat.participants?.includes(currentUser.uid)) continue;
            if(chat.isSaved) chats.push({ id: doc.id, name: 'Избранное', icon: '📌', ...chat });
            else if(chat.isGroup) chats.push({ id: doc.id, name: chat.name, icon: '👥', ...chat });
            else {
                let otherId = chat.participants.find(id => id !== currentUser.uid);
                if(otherId) {
                    let userSnap = await db.collection('users').doc(otherId).get();
                    let u = userSnap.data() || { displayName: 'User' };
                    chats.push({ id: doc.id, name: u.displayName, icon: u.avatarBase64 ? `<img src="${u.avatarBase64}">` : (u.displayName?.[0] || 'U'), otherId, ...chat });
                }
            }
        }
        if(chats.length === 0) { container.innerHTML = '<div class="empty"><i class="fas fa-comment" style="font-size:48px"></i><div>Нет чатов</div><div>Найдите пользователя через поиск</div></div>'; return; }
        container.innerHTML = chats.map(chat => `<div class="card" onclick="openChat('${chat.id}', ${!!chat.isGroup}, ${!!chat.isSaved})"><div class="card-header"><div class="avatar">${typeof chat.icon === 'string' ? chat.icon : chat.icon}</div><div class="card-name">${esc(chat.name)}</div></div><div class="stats">${chat.lastMessage ? esc(chat.lastMessage.substring(0,50)) : 'Нет сообщений'}</div></div>`).join('');
    } catch(e) { container.innerHTML = '<div class="empty">Ошибка</div>'; }
}

async function openChat(id, isGroup, isSaved) {
    if(messagesUnsub) messagesUnsub();
    currentChatId = id;
    currentIsChannel = false;
    currentChannel = null;
    let chat = (await db.collection('chats').doc(id).get()).data();
    let name = isSaved ? 'Избранное' : (isGroup ? chat.name : chat.name);
    document.getElementById('overlayAvatar').innerHTML = isSaved ? '📌' : (isGroup ? '👥' : '👤');
    document.getElementById('overlayTitle').innerText = name;
    document.getElementById('overlaySubtitle').innerText = isGroup ? `${chat.participants?.length || 0} участников` : 'онлайн';
    document.getElementById('channelInfo').style.display = 'none';
    document.getElementById('inputBar').style.display = 'flex';
    document.getElementById('subscribeBar').style.display = 'none';
    document.getElementById('chatOverlay').classList.add('show');
    await loadChatMessages();
}

async function loadChatMessages() {
    if(!currentChatId) return;
    let container = document.getElementById('messagesContainer');
    container.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
    let snap = await db.collection('chats').doc(currentChatId).collection('messages').orderBy('timestamp', 'asc').get();
    container.innerHTML = '';
    snap.forEach(doc => {
        let msg = doc.data();
        let isOut = msg.senderId === currentUser.uid;
        let div = document.createElement('div');
        div.className = `msg ${isOut ? 'msg-out' : 'msg-in'}`;
        div.innerHTML = `<div>${esc(msg.text)}</div><div style="font-size:10px;opacity:0.7;margin-top:4px">${new Date(msg.timestamp?.toDate()).toLocaleTimeString('ru', {hour:'2-digit',minute:'2-digit'})}</div>`;
        container.appendChild(div);
    });
    container.scrollTop = container.scrollHeight;
    
    if(messagesUnsub) messagesUnsub();
    messagesUnsub = db.collection('chats').doc(currentChatId).collection('messages').orderBy('timestamp', 'asc').onSnapshot(() => {
        if(currentChatId && !currentIsChannel) loadChatMessages();
    });
}

async function sendChatMessage() {
    let input = document.getElementById('messageInput');
    let text = input.value.trim();
    if(!text || !currentChatId) return;
    await db.collection('chats').doc(currentChatId).collection('messages').add({ text, senderId: currentUser.uid, timestamp: new Date() });
    await db.collection('chats').doc(currentChatId).update({ lastMessage: text, lastMessageTime: new Date() });
    input.value = '';
}

function sendMessage() {
    if(currentIsChannel) sendChannelMessage();
    else sendChatMessage();
}

function closeOverlay() {
    document.getElementById('chatOverlay').classList.remove('show');
    if(messagesUnsub) messagesUnsub();
    currentChannel = null;
    currentChatId = null;
    currentIsChannel = false;
}

// ==================== ГРУППЫ ====================
function showCreateGroupModal() {
    selectedGroupUsers.clear();
    groupAvatarBase64 = null;
    document.getElementById('groupName').value = '';
    document.getElementById('createGroupBtn').disabled = true;
    renderGroupUsersList();
    document.getElementById('groupModal').classList.add('show');
}

function renderGroupUsersList(filter = '') {
    let q = filter.toLowerCase();
    let filtered = allUsers.filter(u => (u.displayName || '').toLowerCase().includes(q) || (u.username || '').toLowerCase().includes(q));
    document.getElementById('groupUsersList').innerHTML = filtered.map(u => {
        let sel = selectedGroupUsers.has(u.uid);
        return `<div onclick="toggleGroupUser('${u.uid}')" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;${sel ? 'background:rgba(0,122,255,0.1)' : ''}"><div class="avatar" style="width:36px;height:36px;font-size:14px;">${u.avatarBase64 ? `<img src="${u.avatarBase64}">` : (u.displayName?.[0] || 'U')}</div><div style="flex:1"><div>${esc(u.displayName || 'Пользователь')}</div><div style="font-size:13px;color:var(--text2)">@${esc(u.username)}</div></div><div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--sep);display:flex;align-items:center;justify-content:center;${sel ? 'background:var(--accent);border-color:var(--accent);color:white' : ''}">${sel ? '<i class="fas fa-check"></i>' : ''}</div></div>`;
    }).join('');
    updateCreateGroupBtn();
}

function toggleGroupUser(uid) {
    if(selectedGroupUsers.has(uid)) selectedGroupUsers.delete(uid);
    else selectedGroupUsers.add(uid);
    renderGroupUsersList(document.getElementById('groupSearch').value);
}

function updateCreateGroupBtn() {
    let name = document.getElementById('groupName').value.trim();
    document.getElementById('createGroupBtn').disabled = !name || selectedGroupUsers.size < 1;
}

document.getElementById('groupSearch').addEventListener('input', e => renderGroupUsersList(e.target.value));
document.getElementById('groupName').addEventListener('input', () => updateCreateGroupBtn());

async function createGroup() {
    let name = document.getElementById('groupName').value.trim();
    if(!name || selectedGroupUsers.size < 1) return;
    let participants = [currentUser.uid, ...Array.from(selectedGroupUsers)];
    let data = { isGroup: true, name, participants, lastMessage: '', lastMessageTime: new Date(), createdAt: new Date(), createdBy: currentUser.uid, unreadFor: participants.filter(id => id !== currentUser.uid), isSaved: false };
    if(groupAvatarBase64) data.avatarBase64 = groupAvatarBase64;
    let ref = await db.collection('chats').add(data);
    await ref.collection('messages').add({ text: `Группа "${name}" создана`, senderId: currentUser.uid, timestamp: new Date(), isSystemMessage: true });
    closeModal('groupModal');
    toast('Группа создана');
    loadChats();
}

// ==================== ПРОФИЛЬ ====================
function renderProfile() {
    let av = userData.avatarBase64 ? `<img src="${userData.avatarBase64}">` : (userData.displayName?.[0]?.toUpperCase() || 'U');
    document.getElementById('profileContent').innerHTML = `
        <div style="padding:20px;text-align:center">
            <div class="profile-avatar" onclick="document.getElementById('avatarInput').click()">${av}</div>
            <h2>${esc(userData.displayName)}</h2>
            <div style="color:var(--text2)">@${esc(userData.username)}</div>
            <div style="margin:12px 0">${esc(userData.bio || 'Нет описания')}</div>
            <button class="btn btn-primary" onclick="openProfileEdit()">Редактировать</button>
            <button class="btn btn-danger" onclick="logout()" style="margin-top:8px">Выйти</button>
        </div>
    `;
}

function openProfileEdit() {
    document.getElementById('editName').value = userData.displayName || '';
    document.getElementById('editBio').value = userData.bio || '';
    document.getElementById('profileEditModal').classList.add('show');
}

async function saveProfile() {
    let name = document.getElementById('editName').value.trim();
    if(!name) { toast('Введите имя'); return; }
    await db.collection('users').doc(currentUser.uid).update({ displayName: name, bio: document.getElementById('editBio').value });
    userData.displayName = name;
    userData.bio = document.getElementById('editBio').value;
    closeModal('profileEditModal');
    renderProfile();
    toast('Профиль обновлён');
}

document.getElementById('avatarInput').addEventListener('change', async e => {
    let file = e.target.files[0];
    if(!file) return;
    let reader = new FileReader();
    reader.onload = async ev => {
        let base64 = ev.target.result;
        await db.collection('users').doc(currentUser.uid).update({ avatarBase64: base64 });
        userData.avatarBase64 = base64;
        renderProfile();
        loadChats();
        toast('Аватар обновлён');
    };
    reader.readAsDataURL(file);
});

function logout() { auth.signOut().then(() => location.href = 'index.html'); }

document.getElementById('messageInput').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
document.getElementById('messageInput').addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 100) + 'px'; });
document.addEventListener('click', e => { if(e.target.classList.contains('modal')) e.target.classList.remove('show'); });

console.log('✅ Contegg с каналами — полная версия');
</script>
</body>
</html>
