<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Contegg · Чаты</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --bg-input: #1f1f1f;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #707070;
            --accent-color: #2b7ef5;
            --accent-hover: #4090f7;
            --border-color: #2a2a2a;
            --error-color: #ff4d4d;
            --success-color: #4caf50;
            --online-color: #4caf50;
            --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            --safe-area-top: env(safe-area-inset-top, 0px);
            --header-height: 60px;
            --bottom-nav-height: 70px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            padding-top: var(--safe-area-top);
        }

        /* App Container */
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header - с отступом для мобильных */
        .header {
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            padding-top: max(0px, env(safe-area-inset-top));
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Медиа-запрос для мобильных устройств */
        @media (max-width: 768px) {
            .header {
                padding-top: max(15px, env(safe-area-inset-top));
                height: calc(var(--header-height) + 10px);
            }
            
            .search-container {
                padding-top: 5px;
            }
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-left h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #b0b0b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-right span {
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 500;
        }

        /* Search Bar */
        .search-container {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 45px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            font-size: 16px;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: #2a2a2a;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        /* Chats List */
        .chats-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            background: var(--bg-color);
            -webkit-overflow-scrolling: touch;
        }

        .chats-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            background: var(--bg-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            user-select: none;
            border: 1px solid transparent;
        }

        .chat-item:hover {
            background: var(--bg-tertiary);
            transform: translateX(4px);
        }

        .chat-item.pinned {
            border-left: 4px solid var(--accent-color);
            background: var(--bg-tertiary);
        }

        .chat-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color), #1a5ec9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 600;
            color: white;
            flex-shrink: 0;
            position: relative;
        }

        .online-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background: var(--online-color);
            border-radius: 50%;
            border: 3px solid var(--bg-secondary);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .chat-last-message {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .chat-last-message span {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: var(--accent-color);
            color: white;
            font-size: 12px;
            font-weight: 600;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        /* Context Menu */
        .context-menu {
            position: fixed;
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            z-index: 1000;
            min-width: 180px;
            animation: fadeIn 0.1s ease;
        }

        .context-menu-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .context-menu-item:hover {
            background: var(--bg-secondary);
        }

        .context-menu-item i {
            width: 20px;
            color: var(--accent-color);
        }

        .context-menu-item.danger {
            color: var(--error-color);
        }

        .context-menu-item.danger i {
            color: var(--error-color);
        }

        /* Bottom Navigation */
        .bottom-nav {
            height: var(--bottom-nav-height);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 12px;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .nav-item.active {
            color: var(--accent-color);
            background: rgba(43, 126, 245, 0.1);
        }

        .nav-item i {
            font-size: 22px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        @keyframes slideOut {
            from { transform: translateX(0); }
            to { transform: translateX(100%); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 2px;
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* User Search Results */
        .search-results {
            margin-top: 8px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            overflow: hidden;
            animation: fadeIn 0.2s ease;
        }

        .search-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid var(--border-color);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: var(--bg-secondary);
        }

        .result-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: white;
        }

        .result-info {
            flex: 1;
        }

        .result-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .result-username {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* No Chats */
        .no-chats {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .no-chats i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1>Contegg</h1>
            </div>
            <div class="header-right">
                <span>Чаты</span>
            </div>
        </header>

        <!-- Search -->
        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Поиск по нику...">
            </div>
            <div id="searchResults" class="search-results hidden"></div>
        </div>

        <!-- Chats List -->
        <div class="chats-container" id="chatsContainer">
            <div class="chats-list" id="chatsList"></div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-tab="chats">
                <i class="fas fa-comment"></i>
                <span>Чаты</span>
            </div>
            <div class="nav-item" data-tab="settings">
                <i class="fas fa-cog"></i>
                <span>Настройки</span>
            </div>
            <div class="nav-item" data-tab="profile">
                <i class="fas fa-user"></i>
                <span>Профиль</span>
            </div>
        </nav>

        <!-- Context Menu (hidden by default) -->
        <div id="contextMenu" class="context-menu hidden">
            <div class="context-menu-item" id="pinChat">
                <i class="fas fa-thumbtack"></i>
                <span>Закрепить</span>
            </div>
            <div class="context-menu-item danger" id="deleteChat">
                <i class="fas fa-trash"></i>
                <span>Удалить чат</span>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBKTPyHKC_Mp1ZO6NDiCaJVz3w1u_PWfUo",
            authDomain: "contegg-b3b4b.firebaseapp.com",
            projectId: "contegg-b3b4b",
            storageBucket: "contegg-b3b4b.firebasestorage.app",
            messagingSenderId: "678323780149",
            appId: "1:678323780149:web:9717ac593a21d97a19cf7c"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Enable offline persistence for faster loading
        db.enablePersistence({ synchronizeTabs: true })
            .catch(err => console.log('Persistence error:', err));

        // Current user
        let currentUser = null;
        let currentUserId = null;
        let pinnedChats = new Set();
        let selectedChatId = null;
        let usersCache = new Map(); // Кэш пользователей

        // DOM Elements
        const chatsList = document.getElementById('chatsList');
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const contextMenu = document.getElementById('contextMenu');
        const pinChatBtn = document.getElementById('pinChat');
        const deleteChatBtn = document.getElementById('deleteChat');
        const navItems = document.querySelectorAll('.nav-item');

        // Check auth state
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            
            currentUser = user;
            currentUserId = user.uid;
            
            // Save user to Firestore
            await saveUserToFirestore(user);
            
            // Load pinned chats from localStorage
            loadPinnedChats();
            
            // Load chats
            loadChats();
            
            // Listen for new chats
            listenForChats();
        });

        // Save user to Firestore
        async function saveUserToFirestore(user) {
            try {
                const username = user.displayName || user.email.split('@')[0];
                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    email: user.email,
                    username: username,
                    displayName: username,
                    online: true,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                    avatar: username[0].toUpperCase()
                }, { merge: true });
            } catch (error) {
                console.error('Error saving user:', error);
            }
        }

        // Load pinned chats from localStorage
        function loadPinnedChats() {
            const saved = localStorage.getItem(`pinned_${currentUserId}`);
            if (saved) {
                pinnedChats = new Set(JSON.parse(saved));
            }
        }

        // Save pinned chats to localStorage
        function savePinnedChats() {
            localStorage.setItem(`pinned_${currentUserId}`, JSON.stringify([...pinnedChats]));
        }

        // Load chats
        function loadChats() {
            if (!currentUserId) return;
            
            db.collection('chats')
                .where('participants', 'array-contains', currentUserId)
                .orderBy('lastMessageTime', 'desc')
                .onSnapshot(async (snapshot) => {
                    const chats = [];
                    
                    // Собираем все ID участников для загрузки
                    const participantIds = new Set();
                    snapshot.forEach(doc => {
                        const chat = { id: doc.id, ...doc.data() };
                        chats.push(chat);
                        chat.participants.forEach(id => participantIds.add(id));
                    });
                    
                    // Загружаем данные всех участников
                    await loadUsersData([...participantIds]);
                    
                    displayChats(chats);
                }, (error) => {
                    console.error('Error loading chats:', error);
                });
        }

        // Загрузка данных пользователей
        async function loadUsersData(userIds) {
            const uncached = userIds.filter(id => !usersCache.has(id) && id !== currentUserId);
            
            if (uncached.length === 0) return;
            
            // Загружаем пачками по 10
            for (let i = 0; i < uncached.length; i += 10) {
                const batch = uncached.slice(i, i + 10);
                const users = await db.collection('users')
                    .where('uid', 'in', batch)
                    .get();
                
                users.forEach(doc => {
                    usersCache.set(doc.id, doc.data());
                });
            }
        }

        // Display chats
        function displayChats(chats) {
            if (chats.length === 0) {
                chatsList.innerHTML = `
                    <div class="no-chats">
                        <i class="fas fa-comments"></i>
                        <p>У вас пока нет чатов</p>
                        <p style="font-size: 13px; margin-top: 8px;">Найдите пользователя через поиск</p>
                    </div>
                `;
                return;
            }

            // Sort: pinned first, then by last message time
            const sortedChats = [...chats].sort((a, b) => {
                const aPinned = pinnedChats.has(a.id);
                const bPinned = pinnedChats.has(b.id);
                
                if (aPinned && !bPinned) return -1;
                if (!aPinned && bPinned) return 1;
                
                const aTime = a.lastMessageTime?.toDate?.() || new Date(0);
                const bTime = b.lastMessageTime?.toDate?.() || new Date(0);
                return bTime - aTime;
            });

            let html = '';
            
            for (const chat of sortedChats) {
                const otherParticipantId = chat.participants.find(p => p !== currentUserId);
                const otherUser = usersCache.get(otherParticipantId) || {};
                const chatName = otherUser.displayName || otherUser.username || 'Пользователь';
                const lastMessage = chat.lastMessage || 'Нет сообщений';
                const time = chat.lastMessageTime?.toDate?.() || new Date();
                const timeString = formatTime(time);
                const isPinned = pinnedChats.has(chat.id);
                const avatar = chatName[0].toUpperCase();
                const isOnline = otherUser.online || false;
                
                html += `
                    <div class="chat-item ${isPinned ? 'pinned' : ''}" data-chat-id="${chat.id}" data-user-id="${otherParticipantId || ''}">
                        <div class="chat-avatar">
                            ${avatar}
                            ${isOnline ? '<span class="online-indicator"></span>' : ''}
                        </div>
                        <div class="chat-info">
                            <div class="chat-header">
                                <span class="chat-name">${chatName}</span>
                                <span class="chat-time">${timeString}</span>
                            </div>
                            <div class="chat-last-message">
                                <span>${lastMessage}</span>
                                ${chat.unreadCount ? `<span class="unread-badge">${chat.unreadCount}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }
            
            chatsList.innerHTML = html;
            
            // Add click and context menu listeners
            document.querySelectorAll('.chat-item').forEach(item => {
                item.addEventListener('click', () => {
                    const chatId = item.dataset.chatId;
                    const userId = item.dataset.userId;
                    openChat(chatId, userId);
                });
                
                item.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    const chatId = item.dataset.chatId;
                    showContextMenu(e, chatId);
                });
                
                // For mobile: long press
                let pressTimer;
                item.addEventListener('touchstart', (e) => {
                    pressTimer = setTimeout(() => {
                        const chatId = item.dataset.chatId;
                        const touch = e.touches[0];
                        showContextMenu({ clientX: touch.clientX, clientY: touch.clientY }, chatId);
                    }, 500);
                });
                
                item.addEventListener('touchend', () => {
                    clearTimeout(pressTimer);
                });
                
                item.addEventListener('touchmove', () => {
                    clearTimeout(pressTimer);
                });
            });
        }

        // Format time
        function formatTime(date) {
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return 'сейчас';
            if (diff < 3600000) return `${Math.floor(diff / 60000)} мин`;
            if (diff < 86400000) return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            if (diff < 604800000) return ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'][date.getDay()];
            return date.toLocaleDateString();
        }

        // Show context menu
        function showContextMenu(event, chatId) {
            selectedChatId = chatId;
            const isPinned = pinnedChats.has(chatId);
            
            pinChatBtn.innerHTML = `
                <i class="fas fa-thumbtack"></i>
                <span>${isPinned ? 'Открепить' : 'Закрепить'}</span>
            `;
            
            contextMenu.style.left = `${event.clientX}px`;
            contextMenu.style.top = `${event.clientY}px`;
            contextMenu.classList.remove('hidden');
            
            // Hide on click outside
            setTimeout(() => {
                document.addEventListener('click', hideContextMenu, { once: true });
            }, 100);
        }

        function hideContextMenu() {
            contextMenu.classList.add('hidden');
        }

        // Pin/Unpin chat
        pinChatBtn.addEventListener('click', () => {
            if (!selectedChatId) return;
            
            if (pinnedChats.has(selectedChatId)) {
                pinnedChats.delete(selectedChatId);
            } else {
                if (pinnedChats.size >= 5) {
                    alert('Можно закрепить не более 5 чатов');
                    return;
                }
                pinnedChats.add(selectedChatId);
            }
            
            savePinnedChats();
            hideContextMenu();
            
            // Refresh chats display
            loadChats();
        });

        // Delete chat
        deleteChatBtn.addEventListener('click', async () => {
            if (!selectedChatId || !currentUserId) return;
            
            if (!confirm('Удалить чат для всех? Это действие нельзя отменить.')) {
                hideContextMenu();
                return;
            }
            
            try {
                // Get all messages in this chat
                const messages = await db.collection('messages')
                    .where('chatId', '==', selectedChatId)
                    .get();
                
                // Delete all messages
                const batch = db.batch();
                messages.forEach(doc => {
                    batch.delete(doc.ref);
                });
                
                // Delete the chat
                batch.delete(db.collection('chats').doc(selectedChatId));
                
                await batch.commit();
                
                // Remove from pinned
                if (pinnedChats.has(selectedChatId)) {
                    pinnedChats.delete(selectedChatId);
                    savePinnedChats();
                }
                
                hideContextMenu();
            } catch (error) {
                console.error('Error deleting chat:', error);
                alert('Ошибка при удалении чата');
            }
        });

        // Search users
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            if (query.length < 2) {
                searchResults.classList.add('hidden');
                return;
            }
            
            searchTimeout = setTimeout(() => {
                searchUsers(query);
            }, 500);
        });

        async function searchUsers(query) {
            try {
                const usersRef = db.collection('users');
                const snapshot = await usersRef
                    .where('username', '>=', query)
                    .where('username', '<=', query + '\uf8ff')
                    .limit(10)
                    .get();
                
                if (snapshot.empty) {
                    searchResults.innerHTML = '<div class="search-result-item" style="justify-content: center;">Ничего не найдено</div>';
                    searchResults.classList.remove('hidden');
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const user = doc.data();
                    if (user.uid === currentUserId) return; // Don't show self
                    
                    html += `
                        <div class="search-result-item" data-user-id="${user.uid}">
                            <div class="result-avatar">${(user.username || 'U')[0].toUpperCase()}</div>
                            <div class="result-info">
                                <div class="result-name">${user.username || 'Пользователь'}</div>
                                <div class="result-username">@${user.username || 'user'}</div>
                            </div>
                        </div>
                    `;
                });
                
                if (!html) {
                    html = '<div class="search-result-item" style="justify-content: center;">Только вы</div>';
                }
                
                searchResults.innerHTML = html;
                searchResults.classList.remove('hidden');
                
                // Add click listeners
                document.querySelectorAll('.search-result-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const userId = item.dataset.userId;
                        if (userId) {
                            createOrOpenChat(userId);
                        }
                    });
                });
                
            } catch (error) {
                console.error('Search error:', error);
            }
        }

        // Create or open chat with user
        async function createOrOpenChat(otherUserId) {
            try {
                // Check if chat already exists
                const chatsRef = db.collection('chats');
                const snapshot = await chatsRef
                    .where('participants', 'array-contains', currentUserId)
                    .get();
                
                let existingChatId = null;
                
                snapshot.forEach(doc => {
                    const chat = doc.data();
                    if (chat.participants.includes(otherUserId) && chat.participants.length === 2) {
                        existingChatId = doc.id;
                    }
                });
                
                if (existingChatId) {
                    openChat(existingChatId, otherUserId);
                    return;
                }
                
                // Create new chat
                const newChat = {
                    participants: [currentUserId, otherUserId],
                    type: 'private',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastMessage: '',
                    lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                    createdBy: currentUserId
                };
                
                const docRef = await db.collection('chats').add(newChat);
                
                // Send welcome message
                await db.collection('messages').add({
                    chatId: docRef.id,
                    senderId: currentUserId,
                    senderName: currentUser.displayName || 'Пользователь',
                    text: 'Чат создан',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    readBy: [currentUserId]
                });
                
                openChat(docRef.id, otherUserId);
                
            } catch (error) {
                console.error('Error creating chat:', error);
            }
        }

        // Open chat
        function openChat(chatId, otherUserId) {
            // Save chat info to sessionStorage for the chat page
            sessionStorage.setItem('currentChatId', chatId);
            sessionStorage.setItem('otherUserId', otherUserId);
            
            // Animate and redirect
            document.body.style.animation = 'slideOut 0.2s ease';
            setTimeout(() => {
                window.location.href = 'chat.html';
            }, 150);
        }

        // Listen for new chats (for real-time updates)
        function listenForChats() {
            if (!currentUserId) return;
            
            db.collection('chats')
                .where('participants', 'array-contains', currentUserId)
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            // Play sound or show notification
                            if (Notification.permission === 'granted') {
                                new Notification('Новый чат', {
                                    body: 'У вас новый чат',
                                    icon: 'icons/icon-192x192.png'
                                });
                            }
                        }
                    });
                });
        }

        // Request notification permission
        if (Notification.permission !== 'granted' && Notification.permission !== 'denied') {
            Notification.requestPermission();
        }

        // Navigation
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
                
                const tab = item.dataset.tab;
                switch(tab) {
                    case 'chats':
                        // Already on chats
                        break;
                    case 'settings':
                        alert('Настройки будут доступны позже');
                        break;
                    case 'profile':
                        alert('Профиль будет доступен позже');
                        break;
                }
            });
        });

        // Prevent zoom on input focus
        document.addEventListener('touchstart', (e) => {
            if (e.target.nodeName === 'INPUT') {
                e.target.style.fontSize = '16px';
            }
        }, { passive: false });

        // Update online status
        window.addEventListener('beforeunload', () => {
            if (currentUserId) {
                db.collection('users').doc(currentUserId).update({
                    online: false,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        });

        // Set online status
        if (currentUserId) {
            db.collection('users').doc(currentUserId).update({
                online: true,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
    </script>
</body>
</html>
