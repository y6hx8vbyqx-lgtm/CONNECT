<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Contegg · Messenger</title>
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --bg-input: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-tertiary: #636366;
            --accent: #007aff;
            --accent-hover: #0051d5;
            --online: #34c759;
            --danger: #ff3b30;
            --pinned: #ffcc00;
            --saved: #ff9f0a;
            --channel: #af52de;
            --separator: rgba(84, 84, 88, 0.65);
            --tab-bar-bg: rgba(28, 28, 30, 0.92);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 0px);
            --navbar-height: 44px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            position: relative;
            background: var(--bg-primary);
            padding-bottom: 80px;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            padding: 0 16px;
            height: var(--navbar-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 0.5px solid var(--separator);
            flex-shrink: 0;
            z-index: 100;
        }

        .navbar-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #8e8e93);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 122, 255, 0.2);
            border: none;
            color: var(--accent);
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .content-area {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            background: var(--bg-primary);
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
        .page.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        /* Поиск */
        .search-container {
            position: sticky;
            top: 0;
            background: var(--bg-primary);
            z-index: 10;
            transition: transform 0.3s ease;
            transform: translateY(0);
        }
        .search-container.hidden { transform: translateY(-100%); }
        
        .search-bar {
            margin: 8px 16px;
            background: var(--bg-input);
            border-radius: 12px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 40px;
            border: 0.5px solid var(--separator);
        }
        .search-bar input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 17px;
            outline: none;
        }

        .search-results {
            position: absolute;
            top: 56px;
            left: 16px;
            right: 16px;
            background: var(--bg-secondary);
            border-radius: 16px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 50;
            display: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* Список чатов */
        .chats-list {
            padding: 0 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .chat-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .chat-cell:active { background: var(--bg-secondary); }
        .chat-cell.unread { background: rgba(0, 122, 255, 0.08); }
        .chat-cell.channel { background: rgba(175, 82, 222, 0.05); }
        .chat-cell.saved { background: rgba(255, 159, 10, 0.05); }

        .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 500;
            color: white;
            flex-shrink: 0;
            overflow: hidden;
        }
        .chat-avatar.channel { background: linear-gradient(135deg, #af52de, #5856d6); }
        .chat-avatar.saved { background: linear-gradient(135deg, #ff9f0a, #ff4d4d); }
        .chat-avatar.group { background: linear-gradient(135deg, #34c759, #007aff); }

        .chat-content {
            flex: 1;
            min-width: 0;
            border-bottom: 0.5px solid var(--separator);
            padding-bottom: 10px;
            padding-top: 10px;
        }
        .chat-cell:last-child .chat-content { border-bottom: none; }

        .chat-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .chat-name {
            font-size: 17px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-time { font-size: 12px; color: var(--text-tertiary); }
        .chat-preview { font-size: 14px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Плавающая панель */
        .tabbar {
            position: fixed;
            bottom: 12px;
            left: 16px;
            right: 16px;
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(25px);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px 8px;
            z-index: 100;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: var(--text-tertiary);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 0;
            border-radius: 20px;
            transition: all 0.2s;
        }
        .tab-item i { font-size: 22px; }
        .tab-item.active { color: var(--accent); background: rgba(0, 122, 255, 0.15); }
        .tab-item.active i { transform: translateY(-2px); }

        /* Профиль */
        .profile-page { padding: 20px 16px 40px; }
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007aff, #5856d6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            overflow: hidden;
        }
        .profile-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .profile-cell {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 0.5px solid var(--separator);
            cursor: pointer;
            gap: 14px;
        }
        .profile-cell:last-child { border-bottom: none; }
        .profile-cell:active { background: var(--bg-tertiary); }
        .profile-cell-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-sheet {
            background: var(--bg-secondary);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.show .modal-sheet { transform: translateY(0); }
        .modal-handle {
            width: 36px;
            height: 5px;
            background: var(--text-tertiary);
            border-radius: 3px;
            margin: 8px auto 16px;
        }
        .modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 16px; }
        .modal-content { padding: 0 16px 20px; }

        .input-row {
            background: var(--bg-tertiary);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        .input-row label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }
        .input-row input, .input-row textarea {
            width: 100%;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); margin-top: 8px; }
        .btn-danger { background: rgba(255, 59, 48, 0.15); color: var(--danger); margin-top: 8px; }

        /* Чат */
        .chat-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            z-index: 500;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chat-overlay.show { transform: translateX(0); }
        .chat-navbar {
            min-height: var(--navbar-height);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            border-bottom: 0.5px solid var(--separator);
            flex-shrink: 0;
        }
        .chat-back {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 20px;
            cursor: pointer;
        }
        .chat-user-info { flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .chat-user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .msg {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
            cursor: pointer;
        }
        .msg-out { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .msg-in { align-self: flex-start; background: var(--bg-secondary); border-bottom-left-radius: 4px; }
        .msg-reactions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
        .reaction-badge {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 13px;
            cursor: pointer;
        }
        .reaction-badge.by-me { background: rgba(0,122,255,0.4); border: 0.5px solid rgba(0,122,255,0.8); }

        /* Комментарии к постам */
        .post-comments {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 0.5px solid var(--separator);
        }
        .comment {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            padding: 6px;
            background: var(--bg-tertiary);
            border-radius: 10px;
        }
        .comment-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            overflow: hidden;
            cursor: pointer;
        }
        .comment-content {
            flex: 1;
        }
        .comment-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            cursor: pointer;
        }
        .comment-text {
            font-size: 13px;
            margin-top: 2px;
        }
        .comment-time {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .chat-input-bar {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            padding: 8px 10px;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            border-top: 0.5px solid var(--separator);
            flex-shrink: 0;
        }
        .chat-input {
            flex: 1;
            background: var(--bg-input);
            border: 0.5px solid var(--separator);
            border-radius: 18px;
            padding: 8px 14px;
            color: var(--text-primary);
            font-size: 15px;
            max-height: 100px;
            resize: none;
            outline: none;
        }
        .chat-send {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .switch-label { font-size: 16px; }
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 28px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--text-tertiary);
            transition: 0.3s;
            border-radius: 28px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-secondary);
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 3000;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .loader { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px; }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--separator);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state { text-align: center; padding: 60px 20px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="navbar">
        <span class="navbar-title">Contegg</span>
        <button class="navbar-btn" onclick="showCreateMenu()">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <div class="content-area">
        <div class="page active" id="pageChats">
            <div class="search-container" id="searchContainer">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Поиск">
                </div>
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="chats-list" id="chatsList"><div class="loader"><div class="spinner"></div></div></div>
        </div>
        <div class="page" id="pageProfile">
            <div class="profile-page" id="profileContent"><div class="loader"><div class="spinner"></div></div></div>
        </div>
    </div>

    <div class="tabbar">
        <div class="tab-item active" data-tab="chats" onclick="switchTab('chats')"><i class="fas fa-comment"></i><span>Чаты</span></div>
        <div class="tab-item" data-tab="profile" onclick="switchTab('profile')"><i class="fas fa-user"></i><span>Профиль</span></div>
    </div>
</div>

<!-- Меню создания -->
<div class="modal-overlay" id="createMenuModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Создать</div>
        <div class="modal-content">
            <button class="btn btn-primary" onclick="showCreateGroup()" style="margin-bottom:8px;"><i class="fas fa-users"></i> Группу</button>
            <button class="btn btn-primary" onclick="showCreateChannel()" style="margin-bottom:8px;"><i class="fas fa-broadcast-tower"></i> Канал</button>
            <button class="btn btn-secondary" onclick="closeCreateMenu()">Отмена</button>
        </div>
    </div>
</div>

<!-- Создание канала -->
<div class="modal-overlay" id="createChannelModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Создать канал</div>
        <div class="modal-content">
            <div class="channel-avatar-preview" id="channelAvatarPreview" style="width:80px;height:80px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,#af52de,#5856d6);display:flex;align-items:center;justify-content:center;font-size:32px;color:white;overflow:hidden;cursor:pointer;" onclick="document.getElementById('channelAvatarInput').click()">📢</div>
            <div class="input-row"><label>Название</label><input type="text" id="channelNameInput" placeholder="Название канала" maxlength="50"></div>
            <div class="input-row"><label>Описание</label><textarea id="channelDescInput" placeholder="Описание канала" maxlength="200" rows="2"></textarea></div>
            <div class="switch-row">
                <span class="switch-label"><i class="fas fa-comment"></i> Комментарии под постами</span>
                <label class="switch"><input type="checkbox" id="channelCommentsToggle" checked><span class="slider"></span></label>
            </div>
            <button class="btn btn-primary" onclick="createChannel()">Создать канал</button>
            <button class="btn btn-secondary" onclick="closeChannelModal()">Отмена</button>
        </div>
    </div>
</div>

<!-- Настройки канала -->
<div class="modal-overlay" id="channelSettingsModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Настройки канала</div>
        <div class="modal-content" id="channelSettingsContent"></div>
    </div>
</div>

<!-- Модалки -->
<div class="modal-overlay" id="groupModal"><div class="modal-sheet"><div class="modal-handle"></div><div class="modal-title">Новая группа</div><div class="modal-content"><div id="groupAvatarPreview" class="chat-avatar" style="width:80px;margin:0 auto 16px;" onclick="document.getElementById('groupAvatarInput').click()">👥</div><div class="input-row"><label>Название</label><input type="text" id="groupNameInput" placeholder="Название группы"></div><div class="input-row"><label>Поиск участников</label><input type="text" id="groupSearch"></div><div id="groupUsersList" style="max-height:200px;overflow-y:auto;"></div><button class="btn btn-primary" id="createGroupBtn" onclick="createGroup()" disabled>Создать группу</button><button class="btn btn-secondary" onclick="closeGroupModal()">Отмена</button></div></div></div>
<div class="modal-overlay" id="profileEditModal"><div class="modal-sheet"><div class="modal-handle"></div><div class="modal-title">Редактировать профиль</div><div class="modal-content"><div class="profile-avatar" id="editAvatarPreview" style="width:80px;margin:0 auto 16px;" onclick="document.getElementById('avatarInput').click()"></div><div class="input-row"><label>Имя</label><input type="text" id="editName"></div><div class="input-row"><label>Описание</label><textarea id="editBio" rows="2"></textarea></div><button class="btn btn-primary" onclick="saveProfile()">Сохранить</button><button class="btn btn-secondary" onclick="closeProfileEdit()">Отмена</button></div></div></div>

    <div class="chat-navbar"><button class="chat-back" onclick="closeChat()"><i class="fas fa-chevron-left"></i></button><div class="chat-user-info" onclick="openChatSettings()"><div class="chat-user-avatar" id="chatAvatar"></div><div><div class="chat-user-name" id="chatName"></div><div class="chat-user-status" id="chatStatus"></div></div></div></div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-bar"><textarea class="chat-input" id="chatInput" placeholder="Сообщение" rows="1"></textarea><button class="chat-send" onclick="sendMessage()"><i class="fas fa-arrow-up"></i></button></div>

</div>

<input type="file" id="groupAvatarInput" accept="image/*" style="display:none">
<input type="file" id="channelAvatarInput" accept="image/*" style="display:none">
<div class="toast" id="toast"></div>

<script>
// ===== FIREBASE =====
const firebaseConfig = {
    apiKey: "AIzaSyBKTPyHKC_Mp1ZO6NDiCaJVz3w1u_PWfUo",
    authDomain: "contegg-b3b4b.firebaseapp.com",
    projectId: "contegg-b3b4b",
    storageBucket: "contegg-b3b4b.firebasestorage.app",
    messagingSenderId: "678323780149",
    appId: "1:678323780149:web:9717ac593a21d97a19cf7c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let currentUser = null, userData = {}, pinnedChats = [], adminUsers = [];
let currentChatId = null, currentChatType = null, currentChannelData = null;
let currentChannelCommentsEnabled = true;
let replyingTo = null, selectedMsgId = null, selectedMsgData = null;
let allUsers = [], selectedGroupUsers = new Set();
let groupAvatarBase64 = null, channelAvatarBase64 = null;
let cropper = null, channelCropper = null, usersCache = {}, savedChatId = null;
let chatsListener = null, messagesListener = null;

function toast(msg) { let t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function esc(s) { return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ===== ПОЛНОЭКРАННЫЙ РЕЖИМ =====
function enterFullscreen() { 
    let d=document.documentElement;
    (d.requestFullscreen||d.webkitRequestFullscreen||d.msRequestFullscreen)?.call(d).catch(()=>{});
}
window.addEventListener('load',()=>{setTimeout(enterFullscreen,300); window.scrollTo(0,1);});
document.addEventListener('click',()=>{if(!document.fullscreenElement) setTimeout(enterFullscreen,100);});

// ===== АВТОРИЗАЦИЯ =====
auth.onAuthStateChanged(async user=>{
    if(!user){ location.href='index.html'; return; }
    currentUser=user;
    await loadUserData();
    await loadAdminUsers();
    await getOrCreateSavedChat();
    await loadChats();
    startChatsListener();
    loadAllUsers();
});

async function loadUserData(){
    let snap=await db.collection('users').doc(currentUser.uid).get();
    if(!snap.exists){
        userData={uid:currentUser.uid, username:'user'+Date.now().toString(36), displayName:currentUser.displayName||'Пользователь', bio:'', email:currentUser.email||'', avatarBase64:null, blockedUsers:[], pinnedChats:[], isAdmin:false};
        await db.collection('users').doc(currentUser.uid).set(userData);
    } else { userData=snap.data(); userData.pinnedChats=userData.pinnedChats||[]; }
    pinnedChats=userData.pinnedChats;
}
async function loadAdminUsers(){ let snap=await db.collection('users').where('isAdmin','==',true).get(); adminUsers=[]; snap.forEach(d=>adminUsers.push(d.id)); }
async function getUserInfo(uid){ if(usersCache[uid]) return usersCache[uid]; let snap=await db.collection('users').doc(uid).get(); usersCache[uid]=snap.exists?snap.data():{uid,username:'user',displayName:'Пользователь',avatarBase64:null,bio:''}; return usersCache[uid]; }
async function loadAllUsers(){ let snap=await db.collection('users').get(); allUsers=[]; snap.forEach(d=>{if(d.id!==currentUser.uid) allUsers.push({uid:d.id,...d.data()});}); }
async function getOrCreateSavedChat(){ if(savedChatId) return savedChatId; let q=await db.collection('chats').where('isSaved','==',true).where('ownerId','==',currentUser.uid).get(); if(!q.empty){ savedChatId=q.docs[0].id; return savedChatId; } let ref=await db.collection('chats').add({isSaved:true,ownerId:currentUser.uid,participants:[currentUser.uid],name:'Избранное',lastMessage:'',lastMessageTime:new Date(),createdAt:new Date()}); savedChatId=ref.id; return savedChatId; }

// ===== НАВИГАЦИЯ =====
function switchTab(tab){
    let pages=document.querySelectorAll('.page'), cur=document.querySelector('.page.active'), target=document.getElementById(tab==='chats'?'pageChats':'pageProfile');
    if(cur===target) return;
    cur.classList.remove('active'); target.classList.add('active');
    document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
    document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');
    if(tab==='profile') renderProfile();
}
function initSearchScroll(){
    let page=document.getElementById('pageChats'), cont=document.getElementById('searchContainer'), last=0;
    if(page&&cont) page.addEventListener('scroll',()=>{let cur=page.scrollTop; if(cur>50&&cur>last) cont.classList.add('hidden'); else if(cur<30||cur<last) cont.classList.remove('hidden'); last=cur;});
}

// ===== ЗАГРУЗКА ЧАТОВ (включая каналы) =====
async function loadChats(){
    let list=document.getElementById('chatsList');
    try{
        let snap=await db.collection('chats').get(), chats=[];
        for(let doc of snap.docs){
            let chat=doc.data();
            if(!chat.participants?.includes(currentUser.uid) && !chat.subscribers?.includes(currentUser.uid) && !chat.isSaved) continue;
            if(chat.isChannel) chats.push({id:doc.id,...chat,type:'channel'});
            else if(chat.isSaved) chats.push({id:doc.id,...chat,type:'saved'});
            else if(chat.isGroup) chats.push({id:doc.id,...chat,type:'group'});
            else if(!chat.isGroup && !chat.isSaved && !chat.isChannel){
                let otherId=chat.participants.find(id=>id!==currentUser.uid);
                if(otherId){ let otherUser=await getUserInfo(otherId); chats.push({id:doc.id,...chat,otherUser,otherId,type:'dm'}); }
            }
        }
        let saved=chats.find(c=>c.type==='saved'), channels=chats.filter(c=>c.type==='channel'), groups=chats.filter(c=>c.type==='group'), dms=chats.filter(c=>c.type==='dm');
        let sortFn=(a,b)=>(b.lastMessageTime?.toDate?.()||0)-(a.lastMessageTime?.toDate?.()||0);
        channels.sort(sortFn); groups.sort(sortFn); dms.sort(sortFn);
        let sorted=[];
        if(saved) sorted.push(saved);
        sorted.push(...channels,...groups,...dms);
        if(sorted.length===0){ list.innerHTML='<div class="empty-state"><i class="fas fa-comments empty-state-icon"></i><div>Нет чатов</div></div>'; return; }
        list.innerHTML=sorted.map(chat=>{
            if(chat.type==='saved') return `<div class="chat-cell saved" onclick="openSavedChat()"><div class="chat-avatar saved"><i class="fas fa-bookmark"></i></div><div class="chat-content"><div class="chat-top"><span class="chat-name"><i class="fas fa-bookmark"></i> Избранное</span><span class="chat-time">${timeAgo(chat.lastMessageTime?.toDate?.())}</span></div><div class="chat-preview">${esc(chat.lastMessage||'Сохранённые сообщения')}</div></div></div>`;
            if(chat.type==='channel') return `<div class="chat-cell channel" onclick="openChannel('${chat.id}')"><div class="chat-avatar channel">${chat.avatarBase64?`<img src="${chat.avatarBase64}">`:'📢'}</div><div class="chat-content"><div class="chat-top"><span class="chat-name"><i class="fas fa-broadcast-tower"></i> ${esc(chat.name)}</span><span class="chat-time">${timeAgo(chat.lastMessageTime?.toDate?.())}</span></div><div class="chat-preview">${esc(chat.lastMessage||'')}</div></div></div>`;
            if(chat.type==='group') return `<div class="chat-cell" onclick="openGroupChat('${chat.id}')"><div class="chat-avatar group">${chat.avatarBase64?`<img src="${chat.avatarBase64}">`:'👥'}</div><div class="chat-content"><div class="chat-top"><span class="chat-name"><i class="fas fa-users"></i> ${esc(chat.name)}</span><span class="chat-time">${timeAgo(chat.lastMessageTime?.toDate?.())}</span></div><div class="chat-preview">${esc(chat.lastMessage||'')}</div></div></div>`;
            let u=chat.otherUser; return `<div class="chat-cell" onclick="openDirectChat('${chat.otherId}')"><div class="chat-avatar">${u.avatarBase64?`<img src="${u.avatarBase64}">`:(u.displayName?.[0]||'U')}</div><div class="chat-content"><div class="chat-top"><span class="chat-name">${esc(u.displayName||u.username)}</span><span class="chat-time">${timeAgo(chat.lastMessageTime?.toDate?.())}</span></div><div class="chat-preview">${esc(chat.lastMessage||'')}</div></div></div>`;
        }).join('');
    } catch(e){ list.innerHTML='<div class="empty-state">Ошибка</div>'; }
}
function startChatsListener(){ if(chatsListener) return; chatsListener=db.collection('chats').onSnapshot(()=>loadChats()); }
function timeAgo(d){ if(!d) return ''; let s=Math.floor((Date.now()-d)/1000); if(s<60) return 'сейчас'; if(s<3600) return Math.floor(s/60)+' мин'; if(s<86400) return Math.floor(s/3600)+' ч'; return Math.floor(s/86400)+' д'; }

// ===== СОЗДАНИЕ КАНАЛА =====
function showCreateMenu(){ document.getElementById('createMenuModal').classList.add('show'); }
function closeCreateMenu(){ document.getElementById('createMenuModal').classList.remove('show'); }
function showCreateChannel(){ closeCreateMenu(); document.getElementById('channelNameInput').value=''; document.getElementById('channelDescInput').value=''; document.getElementById('channelCommentsToggle').checked=true; channelAvatarBase64=null; document.getElementById('channelAvatarPreview').innerHTML='📢'; document.getElementById('channelAvatarPreview').style.background='linear-gradient(135deg,#af52de,#5856d6)'; document.getElementById('createChannelModal').classList.add('show'); }
function closeChannelModal(){ document.getElementById('createChannelModal').classList.remove('show'); }
async function createChannel(){
    let name=document.getElementById('channelNameInput').value.trim();
    if(!name){ toast('Введите название'); return; }
    let desc=document.getElementById('channelDescInput').value.trim();
    let commentsEnabled=document.getElementById('channelCommentsToggle').checked;
    let data={ isChannel:true, name, description:desc, commentsEnabled, ownerId:currentUser.uid, subscribers:[currentUser.uid], posts:[], lastMessage:'', lastMessageTime:new Date(), createdAt:new Date() };
    if(channelAvatarBase64) data.avatarBase64=channelAvatarBase64;
    let ref=await db.collection('chats').add(data);
    closeChannelModal();
    toast('Канал создан');
    loadChats();
}
document.getElementById('channelAvatarInput').addEventListener('change',e=>{
    let f=e.target.files[0]; if(!f) return;
    let r=new FileReader();
    r.onload=ev=>{ document.getElementById('channelCropImageTarget').src=ev.target.result; document.getElementById('channelCropModal').classList.add('show'); setTimeout(()=>{ if(channelCropper) channelCropper.destroy(); channelCropper=new Cropper(document.getElementById('channelCropImageTarget'),{aspectRatio:1,viewMode:1}); },200); };
    r.readAsDataURL(f);
});
function closeChannelCrop(){ document.getElementById('channelCropModal').classList.remove('show'); if(channelCropper){ channelCropper.destroy(); channelCropper=null; } }
function saveChannelCrop(){ if(!channelCropper) return; let canvas=channelCropper.getCroppedCanvas({width:300,height:300}); channelAvatarBase64=canvas.toDataURL('image/jpeg',0.85); document.getElementById('channelAvatarPreview').innerHTML=`<img src="${channelAvatarBase64}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`; closeChannelCrop(); toast('Фото готово'); }

// ===== ОТКРЫТИЕ КАНАЛА =====
async function openChannel(chatId){
    currentChatId=chatId;
    currentChatType='channel';
    let doc=await db.collection('chats').doc(chatId).get();
    currentChannelData=doc.data();
    currentChannelCommentsEnabled=currentChannelData.commentsEnabled;
    let avatar=document.getElementById('chatAvatar');
    avatar.innerHTML=currentChannelData.avatarBase64?`<img src="${currentChannelData.avatarBase64}">`:'📢';
    avatar.style.background='linear-gradient(135deg,#af52de,#5856d6)';
    document.getElementById('chatName').textContent=currentChannelData.name;
    document.getElementById('chatStatus').textContent=`📢 Канал • ${currentChannelData.subscribers?.length||0} подписчиков`;
    document.getElementById('chatOverlay').classList.add('show');
    await loadChannelMessages();
}
async function loadChannelMessages(){
    let container=document.getElementById('chatMessages');
    container.innerHTML='<div class="loader"><div class="spinner"></div></div>';
    let snap=await db.collection('chats').doc(currentChatId).collection('posts').orderBy('timestamp','asc').get();
    container.innerHTML='';
    for(let doc of snap.docs){
        let post=doc.data();
        let postDiv=document.createElement('div');
        postDiv.className='msg msg-in';
        postDiv.setAttribute('data-post-id',doc.id);
        let html=`<div style="font-size:13px;color:var(--accent);margin-bottom:4px;"><i class="fas fa-broadcast-tower"></i> Пост</div>${esc(post.text)}<div class="msg-time">${new Date(post.timestamp?.toDate()).toLocaleTimeString()}</div>`;
        if(post.reactions && Object.keys(post.reactions).length>0){
            html+='<div class="msg-reactions">';
            let groups={};
            Object.entries(post.reactions).forEach(([uid,emoji])=>{ if(!groups[emoji]) groups[emoji]=[]; groups[emoji].push(uid); });
            Object.entries(groups).forEach(([emoji,users])=>html+=`<span class="reaction-badge ${users.includes(currentUser.uid)?'by-me':''}" data-emoji="${emoji}">${emoji} ${users.length}</span>`);
            html+='</div>';
        }
        if(currentChannelCommentsEnabled){
            let comments=await db.collection('chats').doc(currentChatId).collection('posts').doc(doc.id).collection('comments').orderBy('timestamp','asc').get();
            html+='<div class="post-comments">';
            for(let c of comments.docs){
                let cmt=c.data();
                let user=await getUserInfo(cmt.userId);
                html+=`<div class="comment"><div class="comment-avatar" onclick="event.stopPropagation();viewUserProfile('${cmt.userId}')">${user.avatarBase64?`<img src="${user.avatarBase64}">`:(user.displayName?.[0]||'U')}</div><div class="comment-content"><div class="comment-name" onclick="event.stopPropagation();viewUserProfile('${cmt.userId}')">${esc(user.displayName||user.username)}</div><div class="comment-text">${esc(cmt.text)}</div><div class="comment-time">${new Date(cmt.timestamp?.toDate()).toLocaleTimeString()}</div></div></div>`;
            }
            html+=`<div style="display:flex;gap:8px;margin-top:8px;"><input type="text" class="comment-input" id="comment-input-${doc.id}" placeholder="Написать комментарий..." style="flex:1;background:var(--bg-tertiary);border:none;border-radius:20px;padding:8px 12px;color:white;"><button class="comment-send" onclick="sendComment('${doc.id}')" style="background:var(--accent);border:none;border-radius:20px;padding:8px 12px;color:white;"><i class="fas fa-paper-plane"></i></button></div>`;
            html+='</div>';
        }
        postDiv.innerHTML=html;
        postDiv.querySelectorAll('.reaction-badge').forEach(b=>b.addEventListener('click',(e)=>{ e.stopPropagation(); togglePostReaction(doc.id,b.dataset.emoji); }));
        container.appendChild(postDiv);
    }
    container.scrollTop=container.scrollHeight;
}
async function sendComment(postId){
    let input=document.getElementById(`comment-input-${postId}`);
    let text=input.value.trim();
    if(!text) return;
    await db.collection('chats').doc(currentChatId).collection('posts').doc(postId).collection('comments').add({ userId:currentUser.uid, text, timestamp:new Date() });
    input.value='';
    loadChannelMessages();
}
async function togglePostReaction(postId,emoji){
    let ref=db.collection('chats').doc(currentChatId).collection('posts').doc(postId);
    let doc=await ref.get();
    let reactions=doc.data()?.reactions||{};
    if(reactions[currentUser.uid]===emoji) delete reactions[currentUser.uid];
    else reactions[currentUser.uid]=emoji;
    await ref.update({reactions});
}
function openChatSettings(){
    if(currentChatType==='channel'){
        document.getElementById('channelSettingsContent').innerHTML=`
            <div class="channel-avatar-preview" style="width:80px;height:80px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,#af52de,#5856d6);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;" onclick="document.getElementById('channelAvatarInput').click()">${currentChannelData.avatarBase64?`<img src="${currentChannelData.avatarBase64}" style="width:100%;height:100%;object-fit:cover;">`:'📢'}</div>
            <div class="input-row"><label>Название</label><input type="text" id="channelEditName" value="${esc(currentChannelData.name)}"></div>
            <div class="input-row"><label>Описание</label><textarea id="channelEditDesc" rows="2">${esc(currentChannelData.description||'')}</textarea></div>
            <div class="switch-row"><span class="switch-label"><i class="fas fa-comment"></i> Комментарии</span><label class="switch"><input type="checkbox" id="channelEditComments" ${currentChannelData.commentsEnabled?'checked':''}><span class="slider"></span></label></div>
            <button class="btn btn-primary" onclick="saveChannelSettings()">Сохранить</button>
            <button class="btn btn-secondary" onclick="copyChannelLink()"><i class="fas fa-link"></i> Скопировать ссылку</button>
            <button class="btn btn-danger" onclick="leaveChannel()">Отписаться</button>
            <button class="btn btn-secondary" onclick="closeChannelSettings()">Закрыть</button>`;
        document.getElementById('channelSettingsModal').classList.add('show');
    }
}
async function saveChannelSettings(){
    let name=document.getElementById('channelEditName').value.trim();
    let desc=document.getElementById('channelEditDesc').value.trim();
    let comments=document.getElementById('channelEditComments').checked;
    await db.collection('chats').doc(currentChatId).update({ name, description:desc, commentsEnabled:comments });
    currentChannelData.commentsEnabled=comments;
    toast('Настройки сохранены');
    document.getElementById('channelSettingsModal').classList.remove('show');
    document.getElementById('chatName').textContent=name;
    loadChannelMessages();
}
function copyChannelLink(){ navigator.clipboard.writeText(`contegg://channel/${currentChatId}`); toast('Ссылка скопирована'); }
async function leaveChannel(){ if(!confirm('Отписаться от канала?')) return; await db.collection('chats').doc(currentChatId).update({ subscribers: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) }); closeChat(); loadChats(); toast('Вы отписались'); }
function closeChannelSettings(){ document.getElementById('channelSettingsModal').classList.remove('show'); }

// ===== ИЗБРАННОЕ =====
async function openSavedChat(){ currentChatType='saved'; let chatId=await getOrCreateSavedChat(); currentChatId=chatId; let avatar=document.getElementById('chatAvatar'); avatar.innerHTML='<i class="fas fa-bookmark"></i>'; avatar.style.background='linear-gradient(135deg,#ff9f0a,#ff4d4d)'; document.getElementById('chatName').textContent='Избранное'; document.getElementById('chatStatus').textContent='Сохранённые сообщения'; document.getElementById('chatOverlay').classList.add('show'); await loadMessages(); }
async function saveMessageToFavorites(msgId,msgData){ try{ let savedId=await getOrCreateSavedChat(); await db.collection('chats').doc(savedId).collection('messages').add({ text:`📌 ${msgData.text||''}`, senderId:currentUser.uid, timestamp:new Date(), originalMessageId:msgId }); await db.collection('chats').doc(savedId).update({ lastMessage:`📌 ${(msgData.text||'').substring(0,50)}`, lastSender:currentUser.uid, lastMessageTime:new Date() }); toast('Сохранено в избранное'); } catch(e){ toast('Ошибка'); } }
function ctxSaveToFavorites(){ document.getElementById('msgContextMenu').style.display='none'; if(selectedMsgId&&selectedMsgData) saveMessageToFavorites(selectedMsgId,selectedMsgData); }

// ===== ОБЩИЕ ФУНКЦИИ =====
async function loadMessages(){
    let container=document.getElementById('chatMessages');
    if(!currentChatId) return;
    container.innerHTML='<div class="loader"><div class="spinner"></div></div>';
    let snap=await db.collection('chats').doc(currentChatId).collection('messages').orderBy('timestamp','asc').get();
    container.innerHTML='';
    snap.forEach(doc=>renderMessage(doc.id,doc.data()));
    container.scrollTop=container.scrollHeight;
    if(messagesListener) messagesListener();
    messagesListener=db.collection('chats').doc(currentChatId).collection('messages').orderBy('timestamp','asc').onSnapshot(snap=>{ snap.docChanges().forEach(change=>{ if(change.type==='added') renderMessage(change.doc.id,change.doc.data()); if(change.type==='modified') updateMessageReactions(change.doc.id,change.doc.data().reactions); }); });
}
function renderMessage(id,msg){ let container=document.getElementById('chatMessages'), isOut=msg.senderId===currentUser.uid, d=msg.timestamp?.toDate?.()||new Date(); let div=document.createElement('div'); div.className=`msg ${isOut?'msg-out':'msg-in'}`; div.setAttribute('data-msg-id',id); let html=''; if(msg.replyTo) html+=`<div class="msg-reply"><div class="msg-reply-name">${msg.replyTo.senderId===currentUser.uid?'Вы':'Пользователь'}</div><div class="msg-reply-text">${esc(msg.replyTo.text||'')}</div></div>`; html+=esc(msg.text||''); if(msg.reactions&&Object.keys(msg.reactions).length>0){ html+='<div class="msg-reactions">'; let groups={}; Object.entries(msg.reactions).forEach(([uid,emoji])=>{ if(!groups[emoji]) groups[emoji]=[]; groups[emoji].push(uid); }); Object.entries(groups).forEach(([emoji,users])=>html+=`<span class="reaction-badge ${users.includes(currentUser.uid)?'by-me':''}" data-msg-id="${id}" data-emoji="${emoji}">${emoji} ${users.length}</span>`); html+='</div>'; } html+=`<div class="msg-time">${d.toLocaleTimeString()}</div>`; div.innerHTML=html; div.querySelectorAll('.reaction-badge').forEach(b=>b.addEventListener('click',(e)=>{ e.stopPropagation(); toggleReaction(id,b.dataset.emoji); })); div.addEventListener('click',(e)=>{ if(!e.target.closest('.reaction-badge')) showMsgContext(e,id,msg); }); let timer; div.addEventListener('touchstart',(e)=>{ timer=setTimeout(()=>showMsgContext(e,id,msg),500); }); div.addEventListener('touchend',()=>clearTimeout(timer)); container.appendChild(div); }
function updateMessageReactions(id,reactions){ let el=document.querySelector(`[data-msg-id="${id}"]`); if(!el) return; let rc=el.querySelector('.msg-reactions'); if(!reactions||Object.keys(reactions).length===0){ if(rc) rc.remove(); return; } if(!rc){ rc=document.createElement('div'); rc.className='msg-reactions'; let timeEl=el.querySelector('.msg-time'); if(timeEl) el.insertBefore(rc,timeEl); else el.appendChild(rc); } let groups={}; Object.entries(reactions).forEach(([uid,emoji])=>{ if(!groups[emoji]) groups[emoji]=[]; groups[emoji].push(uid); }); rc.innerHTML=''; Object.entries(groups).forEach(([emoji,users])=>{ let span=document.createElement('span'); span.className=`reaction-badge ${users.includes(currentUser.uid)?'by-me':''}`; span.textContent=`${emoji} ${users.length}`; span.onclick=(e)=>{ e.stopPropagation(); toggleReaction(id,emoji); }; rc.appendChild(span); }); }
async function sendMessage(){ let input=document.getElementById('chatInput'), text=input.value.trim(); if(!text||!currentChatId||currentChatType==='channel') return; let msgData={ text, senderId:currentUser.uid, timestamp:new Date() }; if(replyingTo){ msgData.replyTo={ messageId:replyingTo.id, senderId:replyingTo.senderId, text:replyingTo.text }; cancelReply(); } await db.collection('chats').doc(currentChatId).collection('messages').add(msgData); await db.collection('chats').doc(currentChatId).update({ lastMessage:text, lastSender:currentUser.uid, lastMessageTime:new Date() }); input.value=''; }
async function toggleReaction(msgId,emoji){ let ref=db.collection('chats').doc(currentChatId).collection('messages').doc(msgId); let doc=await ref.get(); let reactions=doc.data()?.reactions||{}; if(reactions[currentUser.uid]===emoji) delete reactions[currentUser.uid]; else reactions[currentUser.uid]=emoji; await ref.update({reactions}); }
function showMsgContext(e,id,msg){ e.preventDefault(); selectedMsgId=id; selectedMsgData=msg; let menu=document.getElementById('msgContextMenu'); let x=e.touches?.[0]?.clientX||e.clientX||100, y=e.touches?.[0]?.clientY||e.clientY||200; menu.style.left=Math.min(x,window.innerWidth-200)+'px'; menu.style.top=Math.min(y,window.innerHeight-150)+'px'; menu.style.display='block'; document.getElementById('reactionsPanel').style.display='none'; setTimeout(()=>{ let closer=(e)=>{ if(!menu.contains(e.target)){ menu.style.display='none'; document.removeEventListener('click',closer); } }; document.addEventListener('click',closer); },10); }
function ctxReply(){ document.getElementById('msgContextMenu').style.display='none'; if(!selectedMsgId||!selectedMsgData) return; replyingTo={ id:selectedMsgId, text:selectedMsgData.text, senderId:selectedMsgData.senderId }; document.getElementById('replyPreview')?.setAttribute('style','display:flex'); toast('Ответ на сообщение'); }
function cancelReply(){ replyingTo=null; document.getElementById('replyPreview')?.setAttribute('style','display:none'); }
function ctxReaction(){ document.getElementById('msgContextMenu').style.display='none'; let panel=document.getElementById('reactionsPanel'); panel.setAttribute('data-msg-id',selectedMsgId); panel.style.left=window.innerWidth/2-100+'px'; panel.style.top=window.innerHeight/2-50+'px'; panel.style.display='flex'; setTimeout(()=>{ let closer=(e)=>{ if(!panel.contains(e.target)){ panel.style.display='none'; document.removeEventListener('click',closer); } }; document.addEventListener('click',closer); },10); }
async function addReaction(emoji){ let panel=document.getElementById('reactionsPanel'), msgId=panel.getAttribute('data-msg-id'); panel.style.display='none'; if(!msgId) return; let ref=db.collection('chats').doc(currentChatId).collection('messages').doc(msgId); let doc=await ref.get(); let reactions=doc.data()?.reactions||{}; if(reactions[currentUser.uid]===emoji) delete reactions[currentUser.uid]; else reactions[currentUser.uid]=emoji; await ref.update({reactions}); toast(`Реакция ${emoji}`); }
async function ctxDelete(){ document.getElementById('msgContextMenu').style.display='none'; if(!selectedMsgId||!currentChatId) return; if(!confirm('Удалить?')) return; await db.collection('chats').doc(currentChatId).collection('messages').doc(selectedMsgId).delete(); toast('Удалено'); }

// ===== ПРОФИЛЬ =====
async function renderProfile(){
    let c=document.getElementById('profileContent');
    c.innerHTML=`
        <div class="profile-header"><div class="profile-avatar" onclick="document.getElementById('avatarInput').click()">${userData.avatarBase64?`<img src="${userData.avatarBase64}">`:(userData.displayName?.[0]||'U')}</div><div class="profile-name">${esc(userData.displayName)} <i class="fas fa-pen" style="font-size:14px;color:var(--accent);cursor:pointer;" onclick="openProfileEdit()"></i></div><div class="profile-username">@${esc(userData.username)}</div><div class="profile-bio">${esc(userData.bio||'Нет описания')}</div></div>
        <div class="profile-section"><div class="profile-cell" onclick="openSavedChat()"><div class="profile-cell-icon" style="background:rgba(255,159,10,0.15);color:#ff9f0a;"><i class="fas fa-bookmark"></i></div><div class="profile-cell-content"><span>Избранное</span><i class="fas fa-chevron-right"></i></div></div></div>
        <div class="profile-section"><div class="profile-cell" onclick="openProfileEdit()"><div class="profile-cell-icon" style="background:rgba(0,122,255,0.15);color:#007aff;"><i class="fas fa-user-edit"></i></div><div class="profile-cell-content"><span>Редактировать профиль</span><i class="fas fa-chevron-right"></i></div></div><div class="profile-cell" onclick="openChangePasswordModal()"><div class="profile-cell-icon" style="background:rgba(52,199,89,0.15);color:#34c759;"><i class="fas fa-key"></i></div><div class="profile-cell-content"><span>Сменить пароль</span><i class="fas fa-chevron-right"></i></div></div><div class="profile-cell"><div class="profile-cell-icon" style="background:rgba(142,142,147,0.15);color:#8e8e93;"><i class="fas fa-envelope"></i></div><div class="profile-cell-content"><span>Почта</span><span>${esc(userData.email)}</span></div></div></div>
        <button class="btn btn-danger" onclick="logout()">Выйти</button>`;
}
function openProfileEdit(){ document.getElementById('editName').value=userData.displayName||''; document.getElementById('editBio').value=userData.bio||''; document.getElementById('profileEditModal').classList.add('show'); }
function closeProfileEdit(){ document.getElementById('profileEditModal').classList.remove('show'); }
async function saveProfile(){ let name=document.getElementById('editName').value.trim(), bio=document.getElementById('editBio').value.trim(); if(!name){ toast('Введите имя'); return; } await db.collection('users').doc(currentUser.uid).update({displayName:name,bio}); userData.displayName=name; userData.bio=bio; closeProfileEdit(); renderProfile(); toast('Сохранено'); }
function openChangePasswordModal(){ document.getElementById('oldPassword').value=''; document.getElementById('newPassword').value=''; document.getElementById('confirmPassword').value=''; document.getElementById('passwordError').innerHTML=''; document.getElementById('changePasswordModal').classList.add('show'); }
function closeChangePasswordModal(){ document.getElementById('changePasswordModal').classList.remove('show'); }
async function changePassword(){ let old=document.getElementById('oldPassword').value, newp=document.getElementById('newPassword').value, conf=document.getElementById('confirmPassword').value; if(!old||!newp||!conf){ document.getElementById('passwordError').innerHTML='Заполните все поля'; return; } if(newp.length<6){ document.getElementById('passwordError').innerHTML='Минимум 6 символов'; return; } if(newp!==conf){ document.getElementById('passwordError').innerHTML='Пароли не совпадают'; return; } try{ let cred=firebase.auth.EmailAuthProvider.credential(currentUser.email,old); await currentUser.reauthenticateWithCredential(cred); await currentUser.updatePassword(newp); toast('Пароль изменён'); closeChangePasswordModal(); } catch(e){ document.getElementById('passwordError').innerHTML='Неверный текущий пароль'; } }

// ===== ГРУППЫ =====
function showCreateGroup(){ closeCreateMenu(); selectedGroupUsers.clear(); groupAvatarBase64=null; document.getElementById('groupNameInput').value=''; document.getElementById('groupAvatarPreview').innerHTML='👥'; updateCreateGroupBtn(); renderGroupUsersList(); document.getElementById('groupModal').classList.add('show'); }
function closeGroupModal(){ document.getElementById('groupModal').classList.remove('show'); }
function renderGroupUsersList(f=''){ let q=f.toLowerCase(), filtered=allUsers.filter(u=>(u.displayName||'').toLowerCase().includes(q)||(u.username||'').toLowerCase().includes(q)); document.getElementById('groupUsersList').innerHTML=filtered.map(u=>`<div onclick="toggleGroupUser('${u.uid}')" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;${selectedGroupUsers.has(u.uid)?'background:rgba(0,122,255,0.1);':''}"><div class="chat-avatar" style="width:36px;height:36px;">${u.avatarBase64?`<img src="${u.avatarBase64}">`:(u.displayName?.[0]||'U')}</div><div><div>${esc(u.displayName)}</div><div style="font-size:12px;color:var(--text-secondary);">@${esc(u.username)}</div></div><div style="margin-left:auto;">${selectedGroupUsers.has(u.uid)?'✓':''}</div></div>`).join(''); }
function toggleGroupUser(uid){ if(selectedGroupUsers.has(uid)) selectedGroupUsers.delete(uid); else selectedGroupUsers.add(uid); renderGroupUsersList(document.getElementById('groupSearch').value); updateCreateGroupBtn(); }
function updateCreateGroupBtn(){ document.getElementById('createGroupBtn').disabled=!document.getElementById('groupNameInput').value.trim()||selectedGroupUsers.size<1; }
document.getElementById('groupSearch').addEventListener('input',()=>renderGroupUsersList(document.getElementById('groupSearch').value));
document.getElementById('groupNameInput').addEventListener('input',updateCreateGroupBtn);
document.getElementById('groupAvatarInput').addEventListener('change',e=>{ let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=ev=>{ document.getElementById('cropImageTarget').src=ev.target.result; document.getElementById('cropModal').classList.add('show'); setTimeout(()=>{ if(cropper) cropper.destroy(); cropper=new Cropper(document.getElementById('cropImageTarget'),{aspectRatio:1,viewMode:1}); },200); }; r.readAsDataURL(f); });
function closeCrop(){ document.getElementById('cropModal').classList.remove('show'); if(cropper){ cropper.destroy(); cropper=null; } }
async function saveCrop(){ if(!cropper) return; let canvas=cropper.getCroppedCanvas({width:300,height:300}); groupAvatarBase64=canvas.toDataURL('image/jpeg',0.85); document.getElementById('groupAvatarPreview').innerHTML=`<img src="${groupAvatarBase64}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`; closeCrop(); toast('Фото готово'); }
async function createGroup(){ let name=document.getElementById('groupNameInput').value.trim(); if(!name||selectedGroupUsers.size<1) return; let participants=[currentUser.uid,...Array.from(selectedGroupUsers)]; let data={ isGroup:true, name, participants, lastMessage:'', lastMessageTime:new Date(), createdAt:new Date(), createdBy:currentUser.uid, unreadFor:participants.filter(id=>id!==currentUser.uid) }; if(groupAvatarBase64) data.avatarBase64=groupAvatarBase64; await db.collection('chats').add(data); closeGroupModal(); selectedGroupUsers.clear(); toast('Группа создана'); loadChats(); }
async function openGroupChat(chatId){ currentChatId=chatId; currentChatType='group'; let doc=await db.collection('chats').doc(chatId).get(); let chat=doc.data(); document.getElementById('chatAvatar').innerHTML=chat.avatarBase64?`<img src="${chat.avatarBase64}">`:'👥'; document.getElementById('chatAvatar').style.background='linear-gradient(135deg,#34c759,#007aff)'; document.getElementById('chatName').textContent=chat.name; document.getElementById('chatStatus').textContent=`${chat.participants?.length||0} участников`; document.getElementById('chatOverlay').classList.add('show'); await loadMessages(); }
async function openDirectChat(userId){ currentChatType='dm'; let chatId=null; let snap=await db.collection('chats').get(); for(let doc of snap.docs){ let c=doc.data(); if(!c.isGroup&&!c.isSaved&&!c.isChannel&&c.participants?.includes(currentUser.uid)&&c.participants?.includes(userId)){ chatId=doc.id; break; } } if(!chatId){ let ref=await db.collection('chats').add({ participants:[currentUser.uid,userId], lastMessage:'', lastMessageTime:new Date(), createdAt:new Date(), isGroup:false, isSaved:false, isChannel:false, unreadFor:[userId] }); chatId=ref.id; } currentChatId=chatId; let user=await getUserInfo(userId); document.getElementById('chatAvatar').innerHTML=user.avatarBase64?`<img src="${user.avatarBase64}">`:(user.displayName?.[0]||'U'); document.getElementById('chatAvatar').style.background='linear-gradient(135deg,#007aff,#5856d6)'; document.getElementById('chatName').textContent=user.displayName||user.username; document.getElementById('chatStatus').textContent='онлайн'; document.getElementById('chatOverlay').classList.add('show'); await loadMessages(); }
function closeChat(){ document.getElementById('chatOverlay').classList.remove('show'); if(messagesListener){ messagesListener(); messagesListener=null; } currentChatId=null; currentChatType=null; cancelReply(); }
async function viewUserProfile(uid){ let user=await getUserInfo(uid); document.getElementById('userProfileContent').innerHTML=`<div style="padding:20px;text-align:center;"><div class="profile-avatar" style="margin:0 auto;">${user.avatarBase64?`<img src="${user.avatarBase64}">`:(user.displayName?.[0]||'U')}</div><div style="font-size:20px;margin-top:12px;">${esc(user.displayName)}</div><div>@${esc(user.username)}</div><div style="margin:12px 0;">${esc(user.bio||'')}</div><button class="btn btn-primary" onclick="startChatFromProfile('${uid}')">Написать</button><button class="btn btn-secondary" onclick="closeUserProfile()">Закрыть</button></div>`; document.getElementById('userProfileModal').classList.add('show'); }
function closeUserProfile(){ document.getElementById('userProfileModal').classList.remove('show'); }
async function startChatFromProfile(uid){ closeUserProfile(); await openDirectChat(uid); }
function viewChatUserProfile(){ if(currentChatType==='dm'&&currentChatId){ let otherId; db.collection('chats').doc(currentChatId).get().then(doc=>{ let participants=doc.data().participants; otherId=participants.find(id=>id!==currentUser.uid); if(otherId) viewUserProfile(otherId); }); } }
function logout(){ if(confirm('Выйти?')){ if(chatsListener) chatsListener(); auth.signOut().then(()=>location.href='index.html'); } }
document.getElementById('searchInput').addEventListener('input',async function(){ let q=this.value.trim(); if(q.length<2){ document.getElementById('searchResults').style.display='none'; return; } let snap=await db.collection('users').where('username','>=',q.toLowerCase()).where('username','<=',q.toLowerCase()+'\uf8ff').limit(15).get(); let users=[]; snap.forEach(d=>{if(d.id!==currentUser.uid) users.push({uid:d.id,...d.data()});}); let res=document.getElementById('searchResults'); if(users.length===0) res.innerHTML='<div style="padding:16px;text-align:center;">Ничего</div>'; else res.innerHTML=users.map(u=>`<div class="search-result-item" onclick="openDirectChat('${u.uid}')"><div class="chat-avatar" style="width:40px;height:40px;">${u.avatarBase64?`<img src="${u.avatarBase64}">`:(u.displayName?.[0]||'U')}</div><div><div>${esc(u.displayName)}</div><div style="font-size:12px;">@${esc(u.username)}</div></div></div>`).join(''); res.style.display='block'; });
document.getElementById('chatInput').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); } });
document.addEventListener('click',e=>{ if(!e.target.closest('.search-bar')) document.getElementById('searchResults').style.display='none'; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeChat(); });
initSearchScroll();
window.addEventListener('DOMContentLoaded',()=>{ renderProfile(); });
</script>
