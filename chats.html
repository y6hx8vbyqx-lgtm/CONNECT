    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --bg-primary: #000000; --bg-secondary: #1c1c1e; --bg-tertiary: #2c2c2e; --bg-input: #1c1c1e; --text-primary: #ffffff; --text-secondary: #8e8e93; --text-tertiary: #636366; --accent: #007aff; --accent-hover: #0051d5; --online: #34c759; --danger: #ff3b30; --pinned: #ffcc00; --saved: #ff9f0a; --separator: rgba(84, 84, 88, 0.65); --safe-bottom: env(safe-area-inset-bottom, 20px); --navbar-height: 44px; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100dvh; overflow: hidden; position: fixed; width: 100%; }
        .app-container { display: flex; flex-direction: column; height: 100dvh; background: var(--bg-primary); padding-bottom: 80px; }

        .navbar-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(0,122,255,0.2); border: none; color: var(--accent); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .navbar-btn:active { transform: scale(0.9); background: rgba(0,122,255,0.4); }
        .content-area { flex: 1; overflow: hidden; position: relative; }
        .page { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg-primary); opacity: 0; transform: translateX(30px); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); pointer-events: none; }
        .page.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
        .search-container { position: sticky; top: 0; background: var(--bg-primary); z-index: 10; transition: transform 0.3s; padding: 8px 16px; }
        .search-bar { background: var(--bg-secondary); border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 8px; height: 40px; border: 0.5px solid var(--separator); }

        .chat-cell:active { background: var(--bg-secondary); }
        .chat-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #007aff, #5856d6); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500; color: white; flex-shrink: 0; background-size: cover; background-position: center; overflow: hidden; }
        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-content { flex: 1; min-width: 0; border-bottom: 0.5px solid var(--separator); padding: 10px 0; }

        .chat-preview { font-size: 14px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tabbar { position: fixed; bottom: 12px; left: 16px; right: 16px; background: rgba(28,28,30,0.92); backdrop-filter: blur(25px); border-radius: 28px; display: flex; padding: 6px 8px; z-index: 100; border: 0.5px solid rgba(255,255,255,0.1); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }

        .modal-content { padding: 0 16px 20px; }

        .input-row label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
        .input-row input, .input-row textarea, .input-row select { width: 100%; background: none; border: none; color: var(--text-primary); font-size: 16px; outline: none; font-family: inherit; }

        .btn-danger { background: rgba(255,59,48,0.15); color: var(--danger); }
        .chat-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-primary); z-index: 500; display: flex; flex-direction: column; transform: translateX(100%); transition: 0.3s cubic-bezier(0.4,0,0.2,1); }
        .chat-overlay.show { transform: translateX(0); }
        .chat-navbar { background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); padding: 0 12px; min-height: var(--navbar-height); display: flex; align-items: center; gap: 12px; border-bottom: 0.5px solid var(--separator); flex-shrink: 0; }
        .chat-back { width: 30px; height: 30px; border-radius: 50%; background: none; border: none; color: var(--accent); font-size: 20px; cursor: pointer; }
        .chat-user-info { flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .chat-user-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg,#007aff,#5856d6); display: flex; align-items: center; justify-content: center; font-size: 14px; color: white; background-size: cover; overflow: hidden; flex-shrink: 0; }

        .msg-out { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .msg-in { align-self: flex-start; background: var(--bg-secondary); border-bottom-left-radius: 4px; }
        .msg-time { font-size: 11px; opacity: 0.7; text-align: right; margin-top: 4px; }
        .msg-date-divider { text-align: center; font-size: 13px; color: var(--text-secondary); padding: 8px 0; margin: 4px 0; }
        .msg-reactions { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
        .reaction-badge { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 2px 8px; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .reaction-badge:active { transform: scale(0.95); }
        .chat-input-bar { background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); padding: 8px 10px; display: flex; gap: 8px; align-items: flex-end; border-top: 0.5px solid var(--separator); flex-shrink: 0; padding-bottom: calc(8px + var(--safe-bottom)); }
        .chat-input { flex: 1; background: var(--bg-input); border: 0.5px solid var(--separator); border-radius: 18px; padding: 8px 14px; color: var(--text-primary); font-size: 15px; font-family: inherit; max-height: 100px; resize: none; outline: none; }
        .chat-send { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); border: none; color: white; font-size: 14px; cursor: pointer; flex-shrink: 0; transition: 0.2s; }
        .chat-send:active { transform: scale(0.9); }
        .comment-section { margin-top: 12px; border-top: 0.5px solid var(--separator); padding-top: 8px; }
        .comment-item { display: flex; gap: 8px; margin-top: 8px; align-items: flex-start; }
        .comment-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 12px; background-size: cover; overflow: hidden; flex-shrink: 0; }
        .comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .comment-bubble { background: var(--bg-tertiary); border-radius: 16px; padding: 6px 12px; flex: 1; }
        .comment-name { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; cursor: pointer; }
        .comment-text { font-size: 13px; }
        .comment-time { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }

        .context-item { padding: 12px 16px; display: flex; align-items: center; gap: 12px; font-size: 15px; border-radius: 10px; cursor: pointer; }
        .context-item:active { background: var(--bg-tertiary); }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .profile-page { padding: 20px 16px 40px; }
        .profile-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #007aff, #5856d6); display: flex; align-items: center; justify-content: center; font-size: 40px; color: white; background-size: cover; background-position: center; overflow: hidden; margin-bottom: 16px; cursor: pointer; }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .loader { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px; color: var(--text-secondary); }
        .spinner { width: 30px; height: 30px; border: 3px solid var(--separator); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .avatar-preview { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 16px; background: linear-gradient(135deg, #34c759, #007aff); display: flex; align-items: center; justify-content: center; font-size: 32px; color: white; overflow: hidden; cursor: pointer; }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
        .user-select-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .user-select-item.selected { background: rgba(0,122,255,0.15); }
    </style>
</head>
<body>
<div class="app-container">
    <div class="navbar">
        <span class="navbar-title">Contegg</span>
        <button class="navbar-btn" onclick="showCreateMenu()"><i class="fas fa-plus"></i></button>
    </div>
    <div class="content-area">
        <div class="page active" id="pageChats">
            <div class="search-container">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Поиск пользователей и каналов">
                </div>
            </div>
            <div class="chats-list" id="chatsList"><div class="loader"><div class="spinner"></div><span>Загрузка...</span></div></div>
        </div>
        <div class="page" id="pageProfile">
            <div class="profile-page" id="profileContent"><div class="loader"><div class="spinner"></div></div></div>
        </div>
    </div>
    <div class="tabbar">
        <div class="tab-item active" data-tab="chats" onclick="switchTab('chats')"><i class="fas fa-comment"></i><span>Чаты</span></div>
        <div class="tab-item" data-tab="profile" onclick="switchTab('profile')"><i class="fas fa-user"></i><span>Профиль</span></div>
    </div>
</div>

<div class="chat-overlay" id="chatOverlay">
    <div class="chat-navbar">
        <button class="chat-back" onclick="closeChat()"><i class="fas fa-chevron-left"></i></button>
        <div class="chat-user-info" onclick="openChatSettings()">
            <div class="chat-user-avatar" id="chatAvatar"></div>
            <div>
                <div class="chat-user-name" id="chatName"></div>
                <div class="chat-user-status" id="chatStatus"></div>
            </div>
        </div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-bar">
        <textarea class="chat-input" id="chatInput" placeholder="Сообщение" rows="1"></textarea>
        <button class="chat-send" onclick="sendMessage()"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<div class="modal-overlay" id="createModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Создать</div>
        <div class="modal-content">
            <button class="btn btn-primary" onclick="showCreateGroup()"><i class="fas fa-users"></i> Группа</button>
            <button class="btn btn-primary" onclick="showCreateChannel()"><i class="fas fa-broadcast-tower"></i> Канал</button>
            <button class="btn btn-secondary" onclick="closeCreateModal()">Отмена</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="groupModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Новая группа</div>
        <div class="modal-content">
            <div class="avatar-preview" id="groupAvatarPreview" onclick="document.getElementById('groupAvatarInput').click()">👥</div>
            <div class="input-row"><label>Название</label><input type="text" id="groupNameInput" placeholder="Название группы"></div>
            <div class="input-row"><label>Поиск участников</label><input type="text" id="groupSearch" placeholder="Поиск"></div>
            <div id="groupUsersList" style="max-height:200px;overflow-y:auto;"></div>
            <button class="btn btn-primary" id="createGroupBtn" onclick="createGroup()" disabled>Создать группу</button>
            <button class="btn btn-secondary" onclick="closeGroupModal()">Отмена</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="channelModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Новый канал</div>
        <div class="modal-content">
            <div class="avatar-preview" id="channelAvatarPreview" onclick="document.getElementById('channelAvatarInput').click()">📢</div>
            <div class="input-row"><label>Название</label><input type="text" id="channelNameInput" placeholder="Название канала"></div>
            <div class="input-row"><label>Описание</label><textarea id="channelDescInput" placeholder="Описание канала" rows="3"></textarea></div>
            <div class="input-row"><label>Комментарии</label><select id="channelCommentsToggle"><option value="true">Включены</option><option value="false">Отключены</option></select></div>
            <button class="btn btn-primary" onclick="createChannel()">Создать канал</button>
            <button class="btn btn-secondary" onclick="closeChannelModal()">Отмена</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="channelSettingsModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Настройки канала</div>
        <div class="modal-content" id="channelSettingsContent"></div>
    </div>
</div>

<div class="modal-overlay" id="cropModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Обрезать фото</div>
        <div class="modal-content">
            <div style="max-height: 350px; border-radius: 12px; overflow: hidden; margin-bottom: 16px;">
                <img id="cropImageTarget" style="max-width: 100%; display: block;">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-secondary" onclick="closeCrop()" style="flex:1;">Отмена</button>
                <button class="btn btn-primary" onclick="saveCrop()" style="flex:1;">Готово</button>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="userProfileModal">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div id="userProfileContent" style="padding: 20px 16px 30px; text-align: center;"></div>
    </div>
</div>

<div class="context-menu" id="msgContextMenu">
    <div class="context-item" onclick="ctxReply()"><i class="fas fa-reply"></i> Ответить</div>
    <div class="context-item" onclick="ctxSaveToFavorites()"><i class="fas fa-bookmark"></i> В избранное</div>
    <div class="context-item" onclick="ctxReaction()"><i class="fas fa-smile"></i> Реакции</div>
    <div class="context-item danger" onclick="ctxDelete()"><i class="fas fa-trash"></i> Удалить</div>
</div>

<div class="context-menu" id="reactionsPanel" style="flex-direction: row; gap: 4px; padding: 8px 10px; min-width: auto;">
    <span style="font-size:28px;cursor:pointer;padding:6px;" onclick="addReaction('❤️')">❤️</span>
    <span style="font-size:28px;cursor:pointer;padding:6px;" onclick="addReaction('👍')">👍</span>
    <span style="font-size:28px;cursor:pointer;padding:6px;" onclick="addReaction('😂')">😂</span>
    <span style="font-size:28px;cursor:pointer;padding:6px;" onclick="addReaction('🔥')">🔥</span>
    <span style="font-size:28px;cursor:pointer;padding:6px;" onclick="addReaction('😮')">😮</span>
    <span style="font-size:28px;cursor:pointer;padding:6px;" onclick="addReaction('😢')">😢</span>
</div>

<input type="file" id="groupAvatarInput" accept="image/*" style="display:none">
<input type="file" id="channelAvatarInput" accept="image/*" style="display:none">
<input type="file" id="avatarInput" accept="image/*" style="display:none">

<div class="toast" id="toast"></div>

<script>
// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyBKTPyHKC_Mp1ZO6NDiCaJVz3w1u_PWfUo",
    authDomain: "contegg-b3b4b.firebaseapp.com",
    projectId: "contegg-b3b4b",
    storageBucket: "contegg-b3b4b.firebasestorage.app",
    appId: "1:678323780149:web:9717ac593a21d97a19cf7c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// Global variables
let currentUser = null;
let userData = {};
let pinnedChats = [];
let savedChatId = null;
let currentChatId = null;
let currentChatIsGroup = false;
let currentChatIsChannel = false;
let currentChannelData = null;
let replyingTo = null;
let selectedMsgId = null;
let selectedMsgData = null;
let selectedGroupUsers = new Set();
let groupAvatarBase64 = null;
let channelAvatarBase64 = null;
let allUsers = [];
let usersCache = {};
let cropper = null;
let currentCropCallback = null;

// Helper functions
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

function esc(s) {
    if (!s) return '';
    return s.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function timeAgo(d) {
    if (!d) return '';
    const sec = Math.floor((Date.now() - d) / 1000);
    if (sec < 60) return 'сейчас';
    if (sec < 3600) return Math.floor(sec / 60) + ' мин';
    if (sec < 86400) return Math.floor(sec / 3600) + ' ч';
    return Math.floor(sec / 86400) + ' д';
}

function timeFormat(d) {
    if (!d) return '';
    return d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
}

async function getUserInfo(uid) {
    if (usersCache[uid]) return usersCache[uid];
    const snap = await db.collection('users').doc(uid).get();
    const data = snap.exists ? snap.data() : { uid, displayName: 'Пользователь', username: 'user', avatarBase64: null, bio: '' };
    usersCache[uid] = data;
    return data;
}

auth.onAuthStateChanged(async user => {

    currentUser = user;

async function loadUserData() {
    const snap = await db.collection('users').doc(currentUser.uid).get();
    if (!snap.exists) {
        userData = {
            uid: currentUser.uid,
            username: 'user' + Date.now().toString(36),
            displayName: currentUser.displayName || 'Пользователь',
            bio: '',

    } else {
        userData = snap.data();
        userData.pinnedChats = userData.pinnedChats || [];

async function getOrCreateSavedChat() {

async function loadAllUsers() {

// Load Chats
async function loadChats() {
    const list = document.getElementById('chatsList');
    try {
        const snap = await db.collection('chats').get();
        let chats = [];
        
        for (const doc of snap.docs) {
            const chat = doc.data();
            if (!chat.participants?.includes(currentUser.uid) && !chat.subscribers?.includes(currentUser.uid)) continue;
            
            if (chat.isSaved && chat.ownerId === currentUser.uid) {
                chats.push({ id: doc.id, type: 'saved', name: 'Избранное', lastMessage: chat.lastMessage, lastMessageTime: chat.lastMessageTime });
            } else if (chat.isGroup && !chat.isChannel) {
                chats.push({ id: doc.id, type: 'group', name: chat.name, avatar: chat.avatarBase64, lastMessage: chat.lastMessage, lastMessageTime: chat.lastMessageTime, pinned: pinnedChats.includes(doc.id) });
            } else if (chat.isChannel) {
                if (chat.subscribers?.includes(currentUser.uid)) {
                    chats.push({ id: doc.id, type: 'channel', name: chat.name, avatar: chat.avatarBase64, lastMessage: chat.lastMessage, lastMessageTime: chat.lastMessageTime });
                }
            } else if (!chat.isGroup && !chat.isSaved && !chat.isChannel) {
                const otherId = chat.participants.find(id => id !== currentUser.uid);
                if (otherId) {
                    const user = await getUserInfo(otherId);
                    chats.push({ id: doc.id, type: 'dm', user: user, lastMessage: chat.lastMessage, lastMessageTime: chat.lastMessageTime, pinned: pinnedChats.includes(doc.id) });
                }
            }
        }
        
        chats.sort((a, b) => (b.lastMessageTime?.toDate?.() || 0) - (a.lastMessageTime?.toDate?.() || 0));
        
        if (chats.length === 0) {
            list.innerHTML = '<div class="loader"><span>Нет чатов</span></div>';
            return;
        }
        
        list.innerHTML = chats.map(c => {
            if (c.type === 'saved') {
                return `<div class="chat-cell" onclick="openSavedChat()"><div class="chat-avatar" style="background:#ff9f0a;"><i class="fas fa-bookmark"></i></div><div class="chat-content"><div class="chat-top"><span class="chat-name">Избранное</span><span class="chat-time">${timeAgo(c.lastMessageTime?.toDate?.())}</span></div><div class="chat-preview">${esc(c.lastMessage || 'Сохранённые сообщения')}</div></div></div>`;
            } else if (c.type === 'dm') {
                return `<div class="chat-cell" onclick="openDirectChat('${c.user.uid}')"><div class="chat-avatar">${c.user.avatarBase64 ? `<img src="${c.user.avatarBase64}">` : (c.user.displayName?.[0] || 'U')}</div><div class="chat-content"><div class="chat-top"><span class="chat-name">${esc(c.user.displayName)}${c.pinned ? ' 📌' : ''}</span><span class="chat-time">${timeAgo(c.lastMessageTime?.toDate?.())}</span></div><div class="chat-preview">${esc(c.lastMessage || '')}</div></div></div>`;
            } else if (c.type === 'group') {
                return `<div class="chat-cell" onclick="openGroupChat('${c.id}')"><div class="chat-avatar">${c.avatar ? `<img src="${c.avatar}">` : '👥'}</div><div class="chat-content"><div class="chat-top"><span class="chat-name">${esc(c.name)}${c.pinned ? ' 📌' : ''}</span><span class="chat-time">${timeAgo(c.lastMessageTime?.toDate?.())}</span></div><div class="chat-preview">${esc(c.lastMessage || '')}</div></div></div>`;
            } else if (c.type === 'channel') {
                return `<div class="chat-cell" onclick="openChannel('${c.id}')"><div class="chat-avatar" style="background:#ff9f0a;">${c.avatar ? `<img src="${c.avatar}">` : '📢'}</div><div class="chat-content"><div class="chat-top"><span class="chat-name">${esc(c.name)}</span><span class="chat-time">${timeAgo(c.lastMessageTime?.toDate?.())}</span></div><div class="chat-preview">${esc(c.lastMessage || '')}</div></div></div>`;
            }
            return '';
        }).join('');
    } catch(e) {
        list.innerHTML = '<div class="loader"><span>Ошибка загрузки</span></div>';
    }
}

// Direct Chat
async function openDirectChat(userId) {
    const q = await db.collection('chats').get();
    let chatId = null;
    for (const doc of q.docs) {
        const c = doc.data();
        if (!c.isGroup && !c.isSaved && !c.isChannel && c.participants?.includes(currentUser.uid) && c.participants?.includes(userId)) {
            chatId = doc.id;
            break;
        }
    }
    if (!chatId) {
        const ref = await db.collection('chats').add({
            participants: [currentUser.uid, userId], lastMessage: '', lastMessageTime: new Date(), isGroup: false, isChannel: false, isSaved: false
        });
        chatId = ref.id;
    }
    currentChatId = chatId;
    currentChatIsGroup = false;
    currentChatIsChannel = false;
    const user = await getUserInfo(userId);
    document.getElementById('chatName').innerText = user.displayName;
    document.getElementById('chatStatus').innerText = 'онлайн';
    document.getElementById('chatAvatar').innerHTML = user.avatarBase64 ? `<img src="${user.avatarBase64}">` : (user.displayName?.[0] || 'U');
    document.getElementById('chatOverlay').classList.add('show');
    await loadMessages();
}

// Channel
async function openChannel(channelId) {
    const doc = await db.collection('chats').doc(channelId).get();
    const data = doc.data();
    if (!data.subscribers?.includes(currentUser.uid)) {
        await db.collection('chats').doc(channelId).update({
            subscribers: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
        });
    }
    currentChatId = channelId;
    currentChatIsChannel = true;
    currentChatIsGroup = false;
    currentChannelData = data;
    document.getElementById('chatName').innerText = data.name;
    document.getElementById('chatStatus').innerHTML = `📢 ${data.subscribers?.length || 1} подписчиков`;
    document.getElementById('chatAvatar').innerHTML = data.avatarBase64 ? `<img src="${data.avatarBase64}">` : '📢';
    document.getElementById('chatOverlay').classList.add('show');
    await loadChannelPosts();
}

async function loadChannelPosts() {
    const container = document.getElementById('chatMessages');
    const snap = await db.collection('chats').doc(currentChatId).collection('posts').orderBy('timestamp', 'asc').get();
    container.innerHTML = '';
    for (const doc of snap.docs) {
        await renderPost(doc.id, doc.data());
    }
    container.scrollTop = container.scrollHeight;
    
    // Real-time listener
    db.collection('chats').doc(currentChatId).collection('posts').orderBy('timestamp', 'asc').onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
            if (change.type === 'added') {
                renderPost(change.doc.id, change.doc.data());
                container.scrollTop = container.scrollHeight;
            }
        });
    });
}

// Load Messages for DM/Group
async function loadMessages() {
    const container = document.getElementById('chatMessages');
    if (!currentChatId) return;
    
    container.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
    const snap = await db.collection('chats').doc(currentChatId).collection('messages').orderBy('timestamp', 'asc').limit(200).get();
    container.innerHTML = '';
    
    let lastDate = null;
    for (const doc of snap.docs) {
        const msg = doc.data();
        const d = msg.timestamp?.toDate?.() || new Date();
        const dateKey = new Date(d.getFullYear(), d.getMonth(), d.getDate()).toString();
        if (lastDate !== dateKey) {
            const divider = document.createElement('div');
            divider.className = 'msg-date-divider';
            divider.innerHTML = `<span>${dateDivider(d)}</span>`;
            container.appendChild(divider);
            lastDate = dateKey;
        }
        renderMessage(doc.id, msg, container);
    }
    container.scrollTop = container.scrollHeight;
    
    db.collection('chats').doc(currentChatId).collection('messages').orderBy('timestamp', 'asc').onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
            if (change.type === 'added') {
                renderMessage(change.doc.id, change.doc.data(), container);
                container.scrollTop = container.scrollHeight;
            }
            if (change.type === 'modified') {
                updateMessageReactions(change.doc.id, change.doc.data().reactions);
            }
        });
    });
}

function dateDivider(d) {
    const now = new Date();
    const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = (today - date) / 86400000;
    if (diff === 0) return 'Сегодня';
    if (diff === 1) return 'Вчера';
    return d.toLocaleDateString('ru', { day: 'numeric', month: 'long' });
}

function renderMessage(id, msg, container) {
    const isOut = msg.senderId === currentUser.uid;
    const d = msg.timestamp?.toDate?.() || new Date();
    
    const div = document.createElement('div');
    div.className = `msg ${isOut ? 'msg-out' : 'msg-in'}`;
    div.setAttribute('data-msg-id', id);
    
    let html = '';
    if (msg.replyTo) {
        html += `<div style="font-size:12px;opacity:0.7;margin-bottom:4px;">↩️ Ответ: ${esc(msg.replyTo.text?.substring(0, 50))}</div>`;
    }
    html += esc(msg.text || '');
    
    if (msg.reactions && Object.keys(msg.reactions).length > 0) {
        html += '<div class="msg-reactions">';
        const groups = {};
        Object.entries(msg.reactions).forEach(([uid, emoji]) => {
            if (!groups[emoji]) groups[emoji] = [];
            groups[emoji].push(uid);
        });
        Object.entries(groups).forEach(([emoji, users]) => {
            html += `<span class="reaction-badge" data-msg-id="${id}" data-emoji="${emoji}">${emoji} ${users.length}</span>`;
        });
        html += '</div>';
    }
    
    html += `<div class="msg-time">${timeFormat(d)}${isOut ? ' ✓✓' : ''}</div>`;
    div.innerHTML = html;
    
    div.querySelectorAll('.reaction-badge').forEach(badge => {
        badge.addEventListener('click', (e) => {
            e.stopPropagation();
            const msgId = badge.dataset.msgId;
            const emoji = badge.dataset.emoji;
            toggleReaction(msgId, emoji);
        });
    });
    
    div.addEventListener('click', (e) => {
        if (e.target.closest('.reaction-badge')) return;
        selectedMsgId = id;
        selectedMsgData = msg;
        const menu = document.getElementById('msgContextMenu');
        menu.style.display = 'block';
        menu.style.left = '50%';
        menu.style.top = '50%';
        setTimeout(() => {
            document.addEventListener('click', function closeMenu() {
                menu.style.display = 'none';
                document.removeEventListener('click', closeMenu);
            }, { once: true });
        }, 10);
    });
    
    container.appendChild(div);
}

function updateMessageReactions(id, reactions) {
    const el = document.querySelector(`[data-msg-id="${id}"]`);
    if (!el) return;
    let rc = el.querySelector('.msg-reactions');
    if (!reactions || Object.keys(reactions).length === 0) {
        if (rc) rc.remove();
        return;
    }
    if (!rc) {
        rc = document.createElement('div');
        rc.className = 'msg-reactions';
        const timeEl = el.querySelector('.msg-time');
        if (timeEl) el.insertBefore(rc, timeEl);
        else el.appendChild(rc);
    }
    const groups = {};
    Object.entries(reactions).forEach(([uid, emoji]) => {
        if (!groups[emoji]) groups[emoji] = [];
        groups[emoji].push(uid);
    });
    rc.innerHTML = '';
    Object.entries(groups).forEach(([emoji, users]) => {
        rc.innerHTML += `<span class="reaction-badge" data-msg-id="${id}" data-emoji="${emoji}">${emoji} ${users.length}</span>`;
    });
    rc.querySelectorAll('.reaction-badge').forEach(b => {
        b.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleReaction(b.dataset.msgId, b.dataset.emoji);
        });
    });
}

async function toggleReaction(msgId, emoji) {
    if (!currentChatId) return;
    const ref = db.collection('chats').doc(currentChatId).collection('messages').doc(msgId);
    const doc = await ref.get();
    const reactions = doc.data()?.reactions || {};
    if (reactions[currentUser.uid] === emoji) {
        delete reactions[currentUser.uid];
    } else {
        reactions[currentUser.uid] = emoji;
    }
    await ref.update({ reactions });
}

async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !currentChatId) return;
    
    input.value = '';
    const msgData = { text, senderId: currentUser.uid, timestamp: new Date() };
    if (replyingTo) {
        msgData.replyTo = replyingTo;
        replyingTo = null;
    }
    
    if (currentChatIsChannel) {
        // Channel post
        await db.collection('chats').doc(currentChatId).collection('posts').add(msgData);
        await db.collection('chats').doc(currentChatId).update({ lastMessage: text, lastMessageTime: new Date() });
    } else {
        await db.collection('chats').doc(currentChatId).collection('messages').add(msgData);
        await db.collection('chats').doc(currentChatId).update({ lastMessage: text, lastMessageTime: new Date() });
    }
    toast('Отправлено');
}

async function createChannel() {
    const name = document.getElementById('channelNameInput').value.trim();
    const description = document.getElementById('channelDescInput').value.trim();
    const commentsEnabled = document.getElementById('channelCommentsToggle').value === 'true';
    if (!name) { toast('Введите название'); return; }
    const data = {
        isChannel: true, name, description, subscribers: [currentUser.uid], ownerId: currentUser.uid,
        lastMessage: '', lastMessageTime: new Date(), commentsEnabled, isGroup: false, isSaved: false
    };
    if (channelAvatarBase64) data.avatarBase64 = channelAvatarBase64;
    await db.collection('chats').add(data);
    toast('Канал создан');
    closeChannelModal();
    loadChats();
}

// Channel Settings
function openChatSettings() {
    if (currentChatIsChannel) openChannelSettings();
}
async function openChannelSettings() {
    const doc = await db.collection('chats').doc(currentChatId).get();
    const data = doc.data();
    const content = document.getElementById('channelSettingsContent');
    content.innerHTML = `
        <div style="text-align:center">
            <div class="avatar-preview" style="margin:0 auto 16px;" onclick="document.getElementById('channelAvatarInput').click()">${data.avatarBase64 ? `<img src="${data.avatarBase64}">` : '📢'}</div>
            <div class="input-row"><label>Название</label><input type="text" id="editChannelName" value="${esc(data.name)}"></div>
            <div class="input-row"><label>Описание</label><textarea id="editChannelDesc" rows="3">${esc(data.description || '')}</textarea></div>
            <div class="input-row"><label>Комментарии</label><select id="editCommentsEnabled"><option value="true" ${data.commentsEnabled !== false ? 'selected' : ''}>Включены</option><option value="false" ${data.commentsEnabled === false ? 'selected' : ''}>Отключены</option></select></div>
            <button class="btn btn-primary" onclick="saveChannelSettings()">Сохранить</button>
            <button class="btn btn-danger" onclick="unsubscribeChannel()">Отписаться</button>
            <button class="btn btn-secondary" onclick="closeChannelSettings()">Закрыть</button>
        </div>
    `;
    document.getElementById('channelSettingsModal').classList.add('show');
}
async function saveChannelSettings() {
    const newName = document.getElementById('editChannelName').value.trim();
    const newDesc = document.getElementById('editChannelDesc').value.trim();
    const comments = document.getElementById('editCommentsEnabled').value === 'true';
    await db.collection('chats').doc(currentChatId).update({ name: newName, description: newDesc, commentsEnabled: comments });
    toast('Настройки сохранены');
    if (currentChatId) document.getElementById('chatName').innerText = newName;
    closeChannelSettings();
}
async function unsubscribeChannel() {
    if (confirm('Отписаться от канала?')) {
        await db.collection('chats').doc(currentChatId).update({ subscribers: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
        toast('Вы отписались');
        closeChannelSettings();
        closeChat();
        loadChats();
    }
}
function closeChannelSettings() {
    document.getElementById('channelSettingsModal').classList.remove('show');
}

// User Profile View
async function viewUserProfile(userId) {
    const user = await getUserInfo(userId);
    const content = document.getElementById('userProfileContent');
    content.innerHTML = `
        <div class="profile-avatar" style="margin:0 auto 16px;">${user.avatarBase64 ? `<img src="${user.avatarBase64}">` : (user.displayName?.[0] || 'U')}</div>
        <div style="font-size:20px;font-weight:600;">${esc(user.displayName)}</div>
        <div style="color:var(--text-secondary);margin:4px 0;">@${esc(user.username)}</div>
        <div style="margin:12px 0;">${esc(user.bio || 'Нет описания')}</div>
        <button class="btn btn-primary" onclick="startChatFromProfile('${userId}')">Написать</button>
        <button class="btn btn-secondary" onclick="closeUserProfile()">Закрыть</button>
    `;
    document.getElementById('userProfileModal').classList.add('show');
}
function closeUserProfile() {
    document.getElementById('userProfileModal').classList.remove('show');
}
async function startChatFromProfile(userId) {
    closeUserProfile();
    await openDirectChat(userId);
}

// Profile Page
async function renderProfile() {
    const container = document.getElementById('profileContent');
    const avHTML = userData.avatarBase64 ? `<img src="${userData.avatarBase64}">` : (userData.displayName?.[0] || 'U');
    container.innerHTML = `
        <div class="profile-header">
            <div class="profile-avatar" onclick="document.getElementById('avatarInput').click()">${avHTML}</div>
            <div style="font-size:24px;font-weight:600;">${esc(userData.displayName)}</div>
            <div style="color:var(--text-secondary);">@${esc(userData.username)}</div>
            <div style="margin-top:8px;">${esc(userData.bio || 'Нет описания')}</div>
            <button class="btn btn-secondary" style="margin-top:16px;" onclick="openSavedChat()"><i class="fas fa-bookmark"></i> Избранное</button>
            <button class="btn btn-danger" style="margin-top:8px;" onclick="logout()">Выйти</button>
        </div>
    `;
}

// Avatar Crop
document.getElementById('avatarInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        document.getElementById('cropImageTarget').src = ev.target.result;
        document.getElementById('cropModal').classList.add('show');
        setTimeout(() => {
            if (cropper) cropper.destroy();
            cropper = new Cropper(document.getElementById('cropImageTarget'), { aspectRatio: 1, viewMode: 1, autoCropArea: 1 });
        }, 200);
    };
    reader.readAsDataURL(file);
    e.target.value = '';
});
document.getElementById('groupAvatarInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        groupAvatarBase64 = ev.target.result;
        document.getElementById('groupAvatarPreview').innerHTML = `<img src="${groupAvatarBase64}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        toast('Фото группы выбрано');
    };
    reader.readAsDataURL(file);
    e.target.value = '';
});
document.getElementById('channelAvatarInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        channelAvatarBase64 = ev.target.result;
        document.getElementById('channelAvatarPreview').innerHTML = `<img src="${channelAvatarBase64}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        toast('Фото канала выбрано');
    };
    reader.readAsDataURL(file);
    e.target.value = '';
});
function closeCrop() {
    document.getElementById('cropModal').classList.remove('show');
    if (cropper) { cropper.destroy(); cropper = null; }
}
async function saveCrop() {
    if (!cropper) return;
    const canvas = cropper.getCroppedCanvas({ width: 300, height: 300 });
    const base64 = canvas.toDataURL('image/jpeg', 0.85);
    await db.collection('users').doc(currentUser.uid).update({ avatarBase64: base64 });
    userData.avatarBase64 = base64;
    usersCache = {};
    closeCrop();
    renderProfile();
    loadChats();
    toast('Аватар обновлён');
}

function logout() {
    if (confirm('Выйти?')) auth.signOut().then(() => location.href = 'index.html');
}

document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
</script>
</body>
</html>
