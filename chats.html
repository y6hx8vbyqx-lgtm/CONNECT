<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contegg · Чаты и Профиль</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Cropper.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    
    <style>
        /* ===== RESET & VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #252525;
            --bg-tertiary: #2f2f2f;
            --bg-input: #252525;
            --bg-hover: #333333;
            --text-primary: #eaeaea;
            --text-secondary: #b0b0b0;
            --text-muted: #808080;
            --text-hint: #5a5a5a;
            --accent-color: #3a6ea5;
            --accent-hover: #4a7eb5;
            --border-light: rgba(255, 255, 255, 0.05);
            --border-medium: rgba(255, 255, 255, 0.1);
            --online-color: #4caf50;
            --danger-color: #cf6679;
            --pinned-color: #d4a017;
            --nav-bg: rgba(37, 37, 37, 0.95);
            --input-bg: rgba(37, 37, 37, 0.9);
            --card-bg: rgba(37, 37, 37, 0.95);
            --header-height: 56px;
            --bottom-nav-height: 60px;
            --radius-bubble: 18px;
            --radius-card: 20px;
            --radius-input: 20px;
            --radius-avatar: 50%;
            --transition-default: all 0.2s ease;
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            line-height: 1.25;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
        }

        /* ===== ВЕРХНЯЯ НАВИГАЦИЯ ===== */
        .nav-bar {
            height: var(--header-height);
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .nav-left h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .nav-right span {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition-default);
        }
        .icon-btn:hover { background: var(--bg-hover); }
        .icon-btn:active { transform: scale(0.92); }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .main-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            position: relative;
            scrollbar-width: none;
        }
        .main-content::-webkit-scrollbar { display: none; }

        /* Вкладки */
        .tab-content {
            display: none;
            min-height: 100%;
            width: 100%;
        }

        .tab-content.active {
            display: block;
        }

        /* ===== СТИЛИ ДЛЯ ЧАТОВ ===== */
        .chats-container {
            padding: 8px 12px;
            min-height: 100%;
            background: var(--bg-primary);
            padding-bottom: 20px;
        }
        .chats-list { display: flex; flex-direction: column; gap: 4px; }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: var(--radius-bubble);
            background: var(--bg-secondary);
            cursor: pointer;
            transition: var(--transition-default);
            border: 1px solid transparent;
            min-height: 82px;
            position: relative;
        }
        .chat-item:hover { background: var(--bg-hover); border-color: var(--border-medium); }
        .chat-item.unread { background: rgba(58, 110, 165, 0.15); }
        .chat-item.unread::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
        }
        .chat-item.pinned { background: var(--bg-tertiary); border-left: 4px solid var(--pinned-color); }
        .chat-avatar {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-avatar);
            background: linear-gradient(135deg, #3a6ea5, #6b4e71);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 24px;
            color: white;
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .online-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background: var(--online-color);
            border-radius: 50%;
            border: 2px solid var(--bg-secondary);
            display: none;
        }
        .chat-info { flex: 1; min-width: 0; }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
            gap: 8px;
        }
        .chat-user {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .verified-badge { color: var(--accent-color); font-size: 14px; margin-left: 4px; }
        .chat-time { font-size: 13px; color: var(--text-muted); flex-shrink: 0; white-space: nowrap; }
        .chat-preview {
            font-size: 15px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
            max-width: 220px;
        }

        .search-container {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .search-box { position: relative; }
        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            z-index: 1;
        }
        .search-box input {
            width: 100%;
            height: 44px;
            padding: 0 45px;
            background: var(--input-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-input);
            font-size: 16px;
            color: var(--text-primary);
            transition: var(--transition-default);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: var(--bg-tertiary);
        }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-results {
            margin-top: 8px;
            background: var(--card-bg);
            border-radius: var(--radius-card);
            overflow: hidden;
            animation: fadeSlide 0.2s ease;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-light);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: var(--shadow-card);
            position: absolute;
            left: 16px;
            right: 16px;
            z-index: 10;
        }
        .search-result-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            cursor: pointer;
            transition: var(--transition-default);
            border-bottom: 1px solid var(--border-light);
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover { background: var(--bg-hover); }
        .result-avatar {
            width: 46px;
            height: 46px;
            border-radius: var(--radius-avatar);
            background: linear-gradient(135deg, #3a6ea5, #6b4e71);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: white;
            background-size: cover;
            background-position: center;
        }
        .result-info { flex: 1; }
        .result-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .result-username { font-size: 13px; color: var(--text-muted); }

        /* ===== СТИЛИ ДЛЯ ПРОФИЛЯ ===== */
        .profile-container {
            min-height: 100%;
            background: var(--bg-primary);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
        }

        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .profile-avatar-wrapper {
            position: relative;
            margin-bottom: 16px;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3a6ea5, #6b4e71);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 44px;
            color: white;
            box-shadow: var(--shadow-card);
            border: 2px solid var(--border-medium);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .avatar-upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-color);
            border: 2px solid var(--bg-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition-default);
        }
        .avatar-upload-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.1);
        }

        .profile-name {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profile-name span {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .edit-btn {
            background: transparent;
            border: none;
            color: var(--accent-color);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: var(--transition-default);
        }
        .edit-btn:hover { background: var(--bg-hover); }

        .profile-username {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .profile-email {
            font-size: 15px;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-light);
            margin-top: 8px;
        }

        .profile-section {
            background: var(--bg-secondary);
            border-radius: var(--radius-card);
            padding: 18px 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border-light);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-field {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .profile-field:last-child { border-bottom: none; }

        .field-label {
            color: var(--text-secondary);
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .field-label i {
            width: 22px;
            color: var(--accent-color);
            font-size: 16px;
        }

        .field-value {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 15px;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .field-value.editable {
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 16px;
            background: var(--bg-tertiary);
            transition: var(--transition-default);
        }
        .field-value.editable:hover {
            background: var(--bg-hover);
        }

        /* ===== НИЖНЯЯ НАВИГАЦИЯ ===== */
        .bottom-nav {
            height: var(--bottom-nav-height);
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 12px;
            flex-shrink: 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 12px;
            transition: var(--transition-default);
            cursor: pointer;
            padding: 8px 0;
            flex: 1;
            border-radius: 12px;
        }
        .nav-item i { font-size: 22px; }
        .nav-item.active { color: var(--accent-color); }
        .nav-item:hover { background: var(--bg-hover); }

        /* ===== ОВЕРЛЕЙ ЧАТА ===== */
        .chat-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chat-overlay.show { 
            opacity: 1; 
            pointer-events: auto; 
        }
        
        .chat-container { 
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-primary);
        }
        
        .chat-header {
            height: var(--header-height);
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition-default);
        }
        .back-btn:hover { background: var(--bg-hover); }
        
        .chat-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
        }
        
        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-avatar);
            background: linear-gradient(135deg, #3a6ea5, #6b4e71);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
            color: white;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .chat-header-text { 
            display: flex; 
            flex-direction: column; 
            min-width: 0;
            flex: 1;
        }
        
        .chat-header-username {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-header-status { 
            font-size: 13px; 
            color: var(--text-muted); 
        }
        
        .chat-close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition-default);
        }
        .chat-close-btn:hover { background: var(--bg-hover); }

        /* Сообщения - занимают всё свободное место */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            background: var(--bg-primary);
        }
        .chat-messages::-webkit-scrollbar { display: none; }
        
        .message {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: var(--radius-bubble);
            line-height: 1.4;
            word-break: break-word;
            position: relative;
            animation: fadeSlide 0.2s ease;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        .message-outgoing {
            align-self: flex-end;
            background: var(--accent-color);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message-incoming {
            align-self: flex-start;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-bottom-left-radius: 4px;
        }
        .message + .message-outgoing { margin-top: 2px; }
        .message + .message-incoming { margin-top: 2px; }
        .message:not(:last-child).message-outgoing { border-bottom-right-radius: var(--radius-bubble); }
        .message:not(:last-child).message-incoming { border-bottom-left-radius: var(--radius-bubble); }
        .message-reply {
            background: rgba(255, 255, 255, 0.1);
            border-left: 3px solid var(--accent-color);
            border-radius: 8px;
            padding: 6px 10px;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .message-reply-sender { font-weight: 600; color: var(--accent-color); font-size: 12px; margin-bottom: 2px; }
        .message-reply-text { color: rgba(255, 255, 255, 0.6); font-size: 13px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .message-text { font-size: 16px; line-height: 1.4; }
        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }
        .message-status { font-size: 10px; }
        .message-reactions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .reaction {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2px 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: var(--transition-default);
            border: 1px solid var(--border-light);
        }
        .reaction:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.05); }
        .reaction.liked { background: rgba(207, 102, 121, 0.2); color: #cf6679; }
        .reaction-count { font-size: 12px; font-weight: 500; }
        .message-date-divider {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            padding: 16px 0 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .message-date-divider::before,
        .message-date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }
        .message-date-divider span {
            background: var(--bg-secondary);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            color: var(--text-muted);
            border: 1px solid var(--border-light);
        }

        /* Поле ввода - всегда внизу */
        .chat-input-area {
            background: var(--nav-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--border-light);
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .reply-container { width: 100%; }
        .reply-preview {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent-color);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 8px;
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .reply-sender { font-weight: 600; color: var(--accent-color); font-size: 13px; }

<script>
// ===== FIREBASE CONFIG =====
const firebaseConfig = {
    apiKey: "AIzaSyBKTPyHKC_Mp1ZO6NDiCaJVz3w1u_PWfUo",
    authDomain: "contegg-b3b4b.firebaseapp.com",
    projectId: "contegg-b3b4b",
    storageBucket: "contegg-b3b4b.firebasestorage.app",
    messagingSenderId: "678323780149",
    appId: "1:678323780149:web:9717ac593a21d97a19cf7c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// ===== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ =====
let currentUser = null;
let userData = null;
let blockedUsers = [];
let adminUsers = [];
let currentChatUserId = null;
let currentChatUsername = null;
let currentChatId = null;
let chatMessagesListener = null;
let usersCache = new Map();
let pinnedChats = [];
let replyingToMessage = null;
let selectedMessageForReaction = null;
let currentActiveTab = 'chats';

// Переменные для обрезки аватарки
let cropper = null;

// ===== DOM ЭЛЕМЕНТЫ =====
const mainTitle = document.getElementById('mainTitle');
const headerUsernameSpan = document.getElementById('headerUsername');
const tabChats = document.getElementById('tabChats');
const tabProfile = document.getElementById('tabProfile');
const navChats = document.getElementById('navChats');
const navProfile = document.getElementById('navProfile');
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const chatsList = document.getElementById('chatsList');
const profileContainer = document.getElementById('profileContainer');
const mainContent = document.getElementById('mainContent');
const chatOverlay = document.getElementById('chatOverlay');
const chatMessages = document.getElementById('chatMessages');
const chatUserAvatar = document.getElementById('chatUserAvatar');
const chatUserName = document.getElementById('chatUserName');
const chatUserStatus = document.getElementById('chatUserStatus');
const chatInput = document.getElementById('chatInput');
const chatSendBtn = document.getElementById('chatSendBtn');
const replyContainer = document.getElementById('replyContainer');
const replySender = document.getElementById('replySender');
const replyText = document.getElementById('replyText');
const notification = document.getElementById('notification');
const messageContextMenu = document.getElementById('messageContextMenu');
const reactionsPanel = document.getElementById('reactionsPanel');
const userProfileOverlay = document.getElementById('userProfileOverlay');
const userProfileCard = document.getElementById('userProfileCard');
const avatarUploadInput = document.getElementById('avatarUploadInput');
const cropModal = document.getElementById('cropModal');
const cropImage = document.getElementById('cropImage');

// ===== АВТОРИЗАЦИЯ =====
auth.onAuthStateChanged(async (user) => {
    if (!user) {
        location.href = 'index.html';
        return;
    }
    currentUser = user;
    
    await loadUserData();
    await loadAdminUsers();
    
    headerUsernameSpan.textContent = userData?.username || 'user';
    
    await loadChatsList();
    await renderProfile();
    
    checkForAutoOpenChat();
});

// ===== ЗАГРУЗКА ДАННЫХ ПОЛЬЗОВАТЕЛЯ =====
async function loadUserData() {
    try {
        const snap = await db.collection("users").doc(currentUser.uid).get();
        if (!snap.exists) {
            userData = {
                username: "user" + currentUser.uid.slice(-6),
                displayName: "Пользователь",
                bio: "Расскажите о себе...",
                email: currentUser.email || "email@example.com",
                isAdmin: false,
                blockedUsers: [],
                pinnedChats: [],
                avatarBase64: null
            };
            await db.collection("users").doc(currentUser.uid).set(userData);
        } else {
            userData = snap.data();
            if (!userData.displayName) userData.displayName = "Пользователь";
            if (!userData.bio) userData.bio = "Расскажите о себе...";
            if (!userData.email) userData.email = currentUser.email || "email@example.com";
            if (!userData.avatarBase64) userData.avatarBase64 = null;
            blockedUsers = userData.blockedUsers || [];
            pinnedChats = userData.pinnedChats || [];
        }
    } catch (error) {
        console.error("Ошибка загрузки данных:", error);
        showNotification("Ошибка загрузки данных");
    }
}

// ===== ЗАГРУЗКА АДМИНОВ =====
async function loadAdminUsers() {
    try {
        const adminSnap = await db.collection("users").where("isAdmin", "==", true).get();
        adminUsers = [];
        adminSnap.forEach(doc => adminUsers.push(doc.id));
    } catch (error) {
        console.error("Ошибка загрузки админов:", error);
    }
}

// ===== ПОЛУЧЕНИЕ ИНФОРМАЦИИ О ПОЛЬЗОВАТЕЛЕ =====
async function getUserInfo(userId) {
    if (usersCache.has(userId)) return usersCache.get(userId);
    try {
        const userDoc = await db.collection("users").doc(userId).get();
        let userInfo = {
            username: "user" + userId.slice(-6),
            displayName: "Пользователь",
            bio: "",
            email: "",
            isAdmin: false,
            avatarBase64: null
        };
        if (userDoc.exists) {
            const data = userDoc.data();
            userInfo = {
                username: data.username || userInfo.username,
                displayName: data.displayName || userInfo.displayName,
                bio: data.bio || "",
                email: data.email || "",
                isAdmin: data.isAdmin || false,
                avatarBase64: data.avatarBase64 || null
            };
        }
        usersCache.set(userId, userInfo);
        return userInfo;
    } catch (error) {
        console.error("Ошибка получения информации о пользователе:", error);
        return { username: "user" + userId.slice(-6), displayName: "Пользователь", bio: "", email: "", isAdmin: false, avatarBase64: null };
    }
}

// ===== ЗАГРУЗКА СПИСКА ЧАТОВ =====
async function loadChatsList() {
    try {
        const chatsSnap = await db.collection('chats').get();
        if (chatsSnap.empty) {
            chatsList.innerHTML = `<div class="no-chats"><div class="no-chats-card"><div class="no-chats-icon">💬</div><div class="no-chats-title">Нет сообщений</div><div class="no-chats-description">Начните общение с другими пользователями</div></div></div>`;
            return;
        }
        
        const userChats = [];
        for (const doc of chatsSnap.docs) {
            const chat = doc.data();
            const chatId = doc.id;
            if (chat.participants && chat.participants.includes(currentUser.uid)) {
                const otherUserId = chat.participants.find(id => id !== currentUser.uid);
                if (!otherUserId) continue;
                if (blockedUsers.includes(otherUserId)) continue;
                
                const otherUserInfo = await getUserInfo(otherUserId);
                const isPinned = pinnedChats.includes(chatId);
                const isUnread = chat.unreadFor && chat.unreadFor.includes(currentUser.uid);
                
                userChats.push({
                    id: chatId, ...chat,
                    otherUserId: otherUserId,
                    otherUserInfo: otherUserInfo,
                    isPinned: isPinned,
                    isUnread: isUnread
                });
            }
        }
        
        if (userChats.length === 0) {
            chatsList.innerHTML = `<div class="no-chats"><div class="no-chats-card"><div class="no-chats-icon">💬</div><div class="no-chats-title">Нет активных чатов</div><div class="no-chats-description">Начните общение с другими пользователями</div></div></div>`;
            return;
        }
        
        const pinnedChatsArray = userChats.filter(chat => chat.isPinned);
        const regularChatsArray = userChats.filter(chat => !chat.isPinned);
        const sortByTime = (a, b) => {
            const timeA = a.lastMessageTime?.toDate ? a.lastMessageTime.toDate() : new Date(0);
            const timeB = b.lastMessageTime?.toDate ? b.lastMessageTime.toDate() : new Date(0);
            return timeB - timeA;
        };
        pinnedChatsArray.sort(sortByTime);
        regularChatsArray.sort(sortByTime);
        const sortedChats = [...pinnedChatsArray, ...regularChatsArray];
        
        let chatsHTML = '';
        for (const chat of sortedChats) {
            const otherUser = chat.otherUserInfo;
            if (!otherUser) continue;
            
            const lastMessageTime = chat.lastMessageTime?.toDate ? chat.lastMessageTime.toDate() : new Date();
            const timeAgo = formatTimeAgo(lastMessageTime);
            let preview = chat.lastMessage || 'Нет сообщений';
            if (preview.length > 60) preview = preview.substring(0, 57) + '...';
            const senderPrefix = chat.lastSender === currentUser.uid ? 'Вы: ' : '';
            
            const avatarStyle = otherUser.avatarBase64 
                ? `style="background-image: url('${otherUser.avatarBase64}');"` 
                : '';
            
            chatsHTML += `
                <div class="chat-item fade ${chat.isUnread ? 'unread' : ''} ${chat.isPinned ? 'pinned' : ''}" 
                     onclick="openChat('${chat.otherUserId}', '${otherUser.username}', '${chat.id}')">
                    <div class="chat-avatar" ${avatarStyle}>
                        ${otherUser.avatarBase64 ? '' : (otherUser.displayName?.[0]?.toUpperCase() || otherUser.username?.[0]?.toUpperCase() || 'U')}
                    </div>
                    <div class="chat-info">
                        <div class="chat-header">
                            <span class="chat-user">
                                ${escapeHtml(otherUser.displayName || otherUser.username)}
                                ${adminUsers.includes(chat.otherUserId) ? '<span class="verified-badge">✓</span>' : ''}
                            </span>
                            <span class="chat-time">${timeAgo}</span>
                        </div>
                        <div class="chat-preview">${senderPrefix}${escapeHtml(preview)}</div>
                    </div>
                </div>`;
        }
        chatsList.innerHTML = chatsHTML;
    } catch (error) {
        console.error('Ошибка загрузки чатов:', error);
        chatsList.innerHTML = `<div class="no-chats"><div class="no-chats-card"><div class="no-chats-icon">⚠️</div><div class="no-chats-title">Ошибка загрузки</div><div class="no-chats-description">${error.message}</div></div></div>`;
    }
}

function triggerAvatarUpload() {
    avatarUploadInput.click();
}

avatarUploadInput.addEventListener('change', handleAvatarSelect);

function handleAvatarSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (e) => {
        cropImage.src = e.target.result;
        cropModal.classList.add('show');
        setTimeout(() => {
            if (cropper) cropper.destroy();
            cropper = new Cropper(cropImage, {
                aspectRatio: 1,
                viewMode: 1,
                dragMode: 'move',
                autoCropArea: 1,
                cropBoxMovable: true,
                cropBoxResizable: true,
                background: false,
                modal: true,
                guides: true,
                center: true,
                highlight: false,
                toggleDragModeOnDblclick: false,
            });
        }, 100);
    };
    reader.readAsDataURL(file);
    avatarUploadInput.value = '';
}

function closeCropModal() {
    cropModal.classList.remove('show');
    if (cropper) {
        cropper.destroy();
        cropper = null;
    }
}

function saveCroppedAvatar() {
    if (!cropper) return;
    
    const canvas = cropper.getCroppedCanvas({
        width: 300,
        height: 300,
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high',
    });
    
    canvas.toBlob(async (blob) => {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const base64Data = e.target.result;
            
            try {
                await db.collection("users").doc(currentUser.uid).update({
                    avatarBase64: base64Data
                });
                
                userData.avatarBase64 = base64Data;
                usersCache.delete(currentUser.uid);
                
                renderProfile();
                loadChatsList();
                
                showNotification('Аватар успешно обновлен');
            } catch (error) {
                console.error('Ошибка сохранения аватара:', error);
                showNotification('Ошибка при сохранении аватара');
            }
            
            closeCropModal();
        };
        reader.readAsDataURL(blob);
    }, 'image/jpeg', 0.9);
}

// ===== ФУНКЦИИ ЧАТОВ =====
function formatTimeAgo(date) {
    if (!date) return "только что";
    const now = new Date();
    const diff = now - date;
    const seconds = Math.floor(diff / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    if (days > 7) return date.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
    else if (days > 0) return `${days}д`;
    else if (hours > 0) return `${hours}ч`;
    else if (minutes > 0) return `${minutes}м`;
    else return "только что";
}

function formatMessageTime(date) {
    if (!date) return "";
    return date.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}

// Функция открытия чата
async function openChat(userId, username, chatId = null) {
    currentChatUserId = userId;
    currentChatUsername = username;
    
    if (!chatId) {
        const chatsSnap = await db.collection('chats').get();
        for (const doc of chatsSnap.docs) {
            const chat = doc.data();
            if (chat.participants && chat.participants.includes(currentUser.uid) && chat.participants.includes(userId)) {
                chatId = doc.id;
                break;
            }
        }
    }
    currentChatId = chatId;
    
    const userInfo = await getUserInfo(userId);
    
    chatUserAvatar.removeAttribute('style');
    chatUserAvatar.className = 'chat-header-avatar';
    chatUserAvatar.textContent = '';
    
    if (userInfo.avatarBase64) {
        chatUserAvatar.style.backgroundImage = `url('${userInfo.avatarBase64}')`;
        chatUserAvatar.style.backgroundSize = 'cover';
        chatUserAvatar.style.backgroundPosition = 'center';
        chatUserAvatar.style.backgroundRepeat = 'no-repeat';
        chatUserAvatar.textContent = '';
    } else {
        const firstLetter = (userInfo.displayName || username || 'U')[0].toUpperCase();
        chatUserAvatar.textContent = firstLetter;
        chatUserAvatar.style.background = 'linear-gradient(135deg, #3a6ea5, #6b4e71)';
    }
    
    chatUserName.textContent = '@' + username;
    chatUserStatus.textContent = 'онлайн';
    
    const isBlocked = blockedUsers.includes(userId);
    updateInputState(isBlocked);
    
    chatOverlay.classList.add('show');
    await loadChatMessages();
    setTimeout(() => chatInput.focus(), 100);
    if (currentChatId) await markChatAsRead(currentChatId);
}

function closeChat() {
    chatOverlay.classList.remove('show');
    if (chatMessagesListener) {
        chatMessagesListener();
        chatMessagesListener = null;
    }
    currentChatUserId = null;
    currentChatUsername = null;
    currentChatId = null;
}

async function markChatAsRead(chatId) {
    try {
        const chatRef = db.collection('chats').doc(chatId);
        const chatDoc = await chatRef.get();
        if (chatDoc.exists) {
            const chatData = chatDoc.data();
            if (chatData.unreadFor && chatData.unreadFor.includes(currentUser.uid)) {
                const updatedUnreadFor = chatData.unreadFor.filter(id => id !== currentUser.uid);
                await chatRef.update({ unreadFor: updatedUnreadFor });
            }
        }
    } catch (error) {
        console.error("Ошибка при отметке чата как прочитанного:", error);
    }
}

function updateInputState(isBlocked) {
    if (isBlocked) {
        chatInput.disabled = true;
        chatSendBtn.disabled = true;
        chatInput.placeholder = 'Пользователь заблокирован';
    } else {
        chatInput.disabled = false;
        chatSendBtn.disabled = false;
        chatInput.placeholder = 'Сообщение';
    }
}

// Функция загрузки сообщений
async function loadChatMessages() {
    chatMessages.innerHTML = '<div class="loader"><div class="loader-spinner"></div><div>Загрузка сообщений...</div></div>';
    if (!currentChatId) {
        chatMessages.innerHTML = `<div class="no-messages"><div class="no-messages-card"><div class="no-messages-icon">💬</div><div class="no-messages-text">Начните общение с @${currentChatUsername}!</div></div></div>`;
        return;
    }
    try {
        const messagesSnap = await db.collection('chats').doc(currentChatId).collection('messages').orderBy('timestamp', 'asc').limit(100).get();
        if (messagesSnap.empty) {
            chatMessages.innerHTML = `<div class="no-messages"><div class="no-messages-card"><div class="no-messages-icon">💬</div><div class="no-messages-text">Нет сообщений. Начните общение!</div></div></div>`;
            return;
        }
        chatMessages.innerHTML = '';
        let lastDate = null;
        messagesSnap.forEach(doc => {
            const msg = doc.data();
            const msgDate = msg.timestamp?.toDate ? msg.timestamp.toDate() : new Date();
            const currentDate = new Date(msgDate.getFullYear(), msgDate.getMonth(), msgDate.getDate());
            if (!lastDate || currentDate.getTime() !== lastDate.getTime()) {
                const dateDivider = document.createElement('div');
                dateDivider.className = 'message-date-divider';
                dateDivider.innerHTML = `<span>${formatDateDivider(msgDate)}</span>`;
                chatMessages.appendChild(dateDivider);
                lastDate = currentDate;
            }
            addMessageToUI({ id: doc.id, ...msg });
        });
        
        setTimeout(() => {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 100);
        
        setupChatMessagesListener();
    } catch (error) {
        console.error('Ошибка загрузки сообщений:', error);
        chatMessages.innerHTML = `<div class="no-messages"><div class="no-messages-card"><div class="no-messages-icon">⚠️</div><div class="no-messages-text">Ошибка загрузки сообщений</div></div></div>`;
    }
}

function formatDateDivider(date) {
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    if (date.toDateString() === today.toDateString()) return 'Сегодня';
    else if (date.toDateString() === yesterday.toDateString()) return 'Вчера';
    else return date.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
}

function addMessageToUI(msg) {
    const isOutgoing = msg.senderId === currentUser.uid;
    const msgDate = msg.timestamp?.toDate ? msg.timestamp.toDate() : new Date();
    const messageTime = formatMessageTime(msgDate);
    
    const messageDiv = document.createElement('div');
    messageDiv.className = `message fade ${isOutgoing ? 'message-outgoing' : 'message-incoming'}`;
    messageDiv.setAttribute('data-message-id', msg.id);
    messageDiv.setAttribute('data-sender-id', msg.senderId);
    
    setupMessageClickHandler(messageDiv, msg);
    
    const readStatus = msg.read === true ? '✓✓' : '✓';
    
    let replyHTML = '';
    if (msg.replyTo) {
        const replySender = msg.replyTo.senderId === currentUser.uid ? 'Вы' : currentChatUsername;
        const replyText = msg.replyTo.text || '';
        const shortText = replyText.length > 50 ? replyText.substring(0, 47) + '...' : replyText;
        replyHTML = `<div class="message-reply"><div class="message-reply-sender">${replySender}</div><div class="message-reply-text">${escapeHtml(shortText)}</div></div>`;
    }
    
    let reactionsHTML = '';
    if (msg.reactions && Object.keys(msg.reactions).length > 0) {
        const reactionGroups = {};
        Object.entries(msg.reactions).forEach(([userId, emoji]) => {
            if (!reactionGroups[emoji]) reactionGroups[emoji] = [];
            reactionGroups[emoji].push(userId);
        });
        reactionsHTML = '<div class="message-reactions">';
        Object.entries(reactionGroups).forEach(([emoji, users]) => {
            const isLikedByMe = users.includes(currentUser.uid);
            reactionsHTML += `<div class="reaction ${isLikedByMe ? 'liked' : ''}" onclick="event.stopPropagation(); addReactionToMessage('${msg.id}', '${emoji}')"><span>${emoji}</span><span class="reaction-count">${users.length}</span></div>`;
        });
        reactionsHTML += '</div>';
    }
    
    messageDiv.innerHTML = `${replyHTML}<div class="message-text">${escapeHtml(msg.text || '')}</div>${reactionsHTML}<div class="message-time">${messageTime}${isOutgoing ? `<span class="message-status">${readStatus}</span>` : ''}</div>`;
    chatMessages.appendChild(messageDiv);
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function setupMessageClickHandler(messageDiv, msg) {
    if ('ontouchstart' in window) {
        let longPressTimer;
        let isLongPress = false;
        messageDiv.addEventListener('touchstart', (e) => {
            isLongPress = false;
            longPressTimer = setTimeout(() => {
                isLongPress = true;
                showMessageContextMenu(e, msg.id, msg);
            }, 500);
        });
        messageDiv.addEventListener('touchend', (e) => {
            clearTimeout(longPressTimer);
            if (!isLongPress) showReactionsPanel(e, msg.id, msg);
        });
        messageDiv.addEventListener('touchmove', () => clearTimeout(longPressTimer));
    } else {
        messageDiv.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            showMessageContextMenu(e, msg.id, msg);
        });
        messageDiv.addEventListener('click', (e) => {
            if (e.button === 0) showReactionsPanel(e, msg.id, msg);
        });
    }
}

function setupChatMessagesListener() {
    if (chatMessagesListener || !currentChatId) return;
    chatMessagesListener = db.collection('chats').doc(currentChatId).collection('messages').orderBy('timestamp', 'desc').limit(1).onSnapshot((snapshot) => {
        snapshot.docChanges().forEach((change) => {
            if (change.type === 'added') {
                const msg = change.doc.data();
                const existingMessage = document.querySelector(`[data-message-id="${change.doc.id}"]`);
                if (!existingMessage) {
                    addMessageToUI({ id: change.doc.id, ...msg });
                    setTimeout(() => chatMessages.scrollTop = chatMessages.scrollHeight, 100);
                }
            } else if (change.type === 'modified') {
                const msg = change.doc.data();
                const existingMessage = document.querySelector(`[data-message-id="${change.doc.id}"]`);
                if (existingMessage && msg.reactions) updateMessageReactions(change.doc.id, msg.reactions);
            }
        });
    });
}

async function sendMessage() {
    if (!currentChatUserId) return;
    const text = chatInput.value.trim();
    if (!text) {
        showNotification('Введите сообщение');
        return;
    }
    if (blockedUsers.includes(currentChatUserId)) {
        showNotification('Нельзя отправить сообщение заблокированному пользователю');
        return;
    }
    chatSendBtn.disabled = true;
    
    const messageData = { 
        text: text, 
        senderId: currentUser.uid, 
        timestamp: new Date(), 
        read: false 
    };
    
    if (replyingToMessage) {
        messageData.replyTo = {
            messageId: replyingToMessage.id,
            senderId: replyingToMessage.senderId,
            text: replyingToMessage.text
        };
    }
    
    try {
        let chatId = currentChatId;
        if (!chatId) {
            const newChatRef = await db.collection('chats').add({
                participants: [currentUser.uid, currentChatUserId],
                lastMessage: text,
                lastSender: currentUser.uid,
                lastMessageTime: new Date(),
                createdAt: new Date(),
                updatedAt: new Date(),
                unreadFor: [currentChatUserId]
            });
            chatId = newChatRef.id;
            currentChatId = chatId;
        } else {
            await db.collection('chats').doc(chatId).update({
                lastMessage: text,
                lastSender: currentUser.uid,
                lastMessageTime: new Date(),
                updatedAt: new Date(),
                unreadFor: firebase.firestore.FieldValue.arrayUnion(currentChatUserId)
            });
        }
        await db.collection('chats').doc(chatId).collection('messages').add(messageData);
        chatInput.value = '';
        chatInput.style.height = 'auto';
        cancelReply();
        loadChatsList();
    } catch (error) {
        console.error('Ошибка отправки сообщения:', error);
        showNotification('Ошибка отправки: ' + error.message);
    } finally {
        chatSendBtn.disabled = false;
    }
}

function showReactionsPanel(event, messageId, messageData) {
    let x, y;
    if (event.type.includes('touch')) {
        const touch = event.touches[0] || event.changedTouches[0];
        x = touch.clientX;
        y = touch.clientY;
    } else {
        x = event.clientX;
        y = event.clientY;
    }
    selectedMessageForReaction = { id: messageId, ...messageData };
    reactionsPanel.style.left = Math.min(x - 100, window.innerWidth - 220) + 'px';
    reactionsPanel.style.top = Math.min(y - 60, window.innerHeight - 80) + 'px';
    reactionsPanel.classList.add('show');
    setTimeout(() => {
        const closePanel = (e) => {
            if (!reactionsPanel.contains(e.target)) {
                reactionsPanel.classList.remove('show');
                document.removeEventListener('click', closePanel);
                document.removeEventListener('touchstart', closePanel);
            }
        };
        document.addEventListener('click', closePanel);
        document.addEventListener('touchstart', closePanel);
    }, 10);
}

async function addReaction(emoji) {
    if (!selectedMessageForReaction || !currentChatId) return;
    try {
        const messageRef = db.collection('chats').doc(currentChatId).collection('messages').doc(selectedMessageForReaction.id);
        const messageDoc = await messageRef.get();
        const currentReactions = messageDoc.data()?.reactions || {};
        const userReaction = currentReactions[currentUser.uid];
        if (userReaction === emoji) {
            delete currentReactions[currentUser.uid];
            showNotification("Реакция убрана");
        } else {
            currentReactions[currentUser.uid] = emoji;
            showNotification(`+${emoji}`);
        }
        await messageRef.update({ reactions: currentReactions });
        updateMessageReactions(selectedMessageForReaction.id, currentReactions);
        reactionsPanel.classList.remove('show');
    } catch (error) {
        console.error("Ошибка при добавлении реакции:", error);
        showNotification("Ошибка: " + error.message);
    }
}

async function addReactionToMessage(messageId, emoji) {
    if (!currentChatId) return;
    try {
        const messageRef = db.collection('chats').doc(currentChatId).collection('messages').doc(messageId);
        const messageDoc = await messageRef.get();
        const currentReactions = messageDoc.data()?.reactions || {};
        const userReaction = currentReactions[currentUser.uid];
        if (userReaction === emoji) {
            delete currentReactions[currentUser.uid];
            showNotification("Реакция убрана");
        } else {
            currentReactions[currentUser.uid] = emoji;
            showNotification(`+${emoji}`);
        }
        await messageRef.update({ reactions: currentReactions });
        updateMessageReactions(messageId, currentReactions);
    } catch (error) {
        console.error("Ошибка при добавлении реакции:", error);
        showNotification("Ошибка: " + error.message);
    }
}

function updateMessageReactions(messageId, reactions) {
    const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
    if (!messageElement) return;
    let reactionsContainer = messageElement.querySelector('.message-reactions');
    if (!reactionsContainer) {
        reactionsContainer = document.createElement('div');
        reactionsContainer.className = 'message-reactions';
        const timeElement = messageElement.querySelector('.message-time');
        if (timeElement) messageElement.insertBefore(reactionsContainer, timeElement);
        else messageElement.appendChild(reactionsContainer);
    }
    reactionsContainer.innerHTML = '';
    if (Object.keys(reactions).length === 0) {
        reactionsContainer.remove();
        return;
    }
    const reactionGroups = {};
    Object.entries(reactions).forEach(([userId, emoji]) => {
        if (!reactionGroups[emoji]) reactionGroups[emoji] = [];
        reactionGroups[emoji].push(userId);
    });
    Object.entries(reactionGroups).forEach(([emoji, users]) => {
        const isLikedByMe = users.includes(currentUser.uid);
        const reactionElement = document.createElement('div');
        reactionElement.className = `reaction ${isLikedByMe ? 'liked' : ''}`;
        reactionElement.onclick = (e) => {
            e.stopPropagation();
            addReactionToMessage(messageId, emoji);
        };
        reactionElement.innerHTML = `<span>${emoji}</span><span class="reaction-count">${users.length}</span>`;
        reactionsContainer.appendChild(reactionElement);
    });
}

function replyToMessage(messageId, messageData) {
    const senderInfo = messageData.senderId === currentUser.uid ? { username: 'Вы' } : { username: currentChatUsername };
    replyingToMessage = { id: messageId, text: messageData.text, senderId: messageData.senderId, senderName: senderInfo.username };
    replyContainer.style.display = 'block';
    replySender.textContent = senderInfo.username;
    const shortText = messageData.text.length > 50 ? messageData.text.substring(0, 47) + '...' : messageData.text;
    replyText.textContent = shortText;
    chatInput.focus();
}

function cancelReply() {
    replyingToMessage = null;
    replyContainer.style.display = 'none';
}

function showMessageContextMenu(event, messageId, messageData) {
    event.preventDefault();
    event.stopPropagation();
    let x, y;
    if (event.type.includes('touch')) {
        const touch = event.touches[0] || event.changedTouches[0];
        x = touch.clientX;
        y = touch.clientY;
    } else {
        x = event.clientX;
        y = event.clientY;
    }
    messageContextMenu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
    messageContextMenu.style.top = Math.min(y, window.innerHeight - 150) + 'px';
    messageContextMenu.style.display = 'block';
    window.currentContextMessageId = messageId;
    window.currentContextMessageData = messageData;
    setTimeout(() => {
        const closeMenu = (e) => {
            if (!messageContextMenu.contains(e.target)) {
                messageContextMenu.style.display = 'none';
                document.removeEventListener('click', closeMenu);
                document.removeEventListener('touchstart', closeMenu);
            }
        };
        document.addEventListener('click', closeMenu);
        document.addEventListener('touchstart', closeMenu);
    }, 10);
}

document.getElementById('contextReplyBtn').addEventListener('click', () => {
    messageContextMenu.style.display = 'none';
    if (window.currentContextMessageId && window.currentContextMessageData) {
        replyToMessage(window.currentContextMessageId, window.currentContextMessageData);
    }
});

document.getElementById('contextReactionBtn').addEventListener('click', () => {
    messageContextMenu.style.display = 'none';
    if (window.currentContextMessageId && window.currentContextMessageData) {
        addReactionToMessage(window.currentContextMessageId, '❤️');
    }
});

document.getElementById('contextDeleteMessageBtn').addEventListener('click', () => {
    messageContextMenu.style.display = 'none';
    if (window.currentContextMessageId) {
        if (confirm("Удалить сообщение?")) deleteMessage(window.currentContextMessageId);
    }
});

async function deleteMessage(messageId) {
    try {
        if (!currentChatId) return;
        await db.collection('chats').doc(currentChatId).collection('messages').doc(messageId).delete();
        const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
        if (messageElement) messageElement.remove();
        showNotification("Сообщение удалено");
    } catch (error) {
        console.error("Ошибка при удалении сообщения:", error);
        showNotification("Ошибка удаления сообщения: " + error.message);
    }
}

// ===== ПОИСК ПОЛЬЗОВАТЕЛЕЙ =====
let searchTimeout;
searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    const query = e.target.value.trim();
    if (query.length < 2) {
        searchResults.style.display = 'none';
        return;
    }
    searchTimeout = setTimeout(() => searchUsers(query), 500);
});

async function searchUsers(query) {
    try {
        const usersRef = db.collection('users');
        const snapshot = await usersRef.where('username', '>=', query).where('username', '<=', query + '\uf8ff').limit(10).get();
        if (snapshot.empty) {
            searchResults.innerHTML = '<div class="search-result-item" style="justify-content: center;">Ничего не найдено</div>';
            searchResults.style.display = 'block';
            return;
        }
        let html = '';
        snapshot.forEach(doc => {
            const user = doc.data();
            if (user.uid === currentUser.uid) return;
            const avatarStyle = user.avatarBase64 
                ? `style="background-image: url('${user.avatarBase64}');"` 
                : '';
            html += `<div class="search-result-item" data-user-id="${user.uid}"><div class="result-avatar" ${avatarStyle}>${user.avatarBase64 ? '' : (user.displayName || user.username || 'U')[0].toUpperCase()}</div><div class="result-info"><div class="result-name">${escapeHtml(user.displayName || user.username || 'Пользователь')}</div><div class="result-username">@${escapeHtml(user.username || 'user')}</div></div></div>`;
        });
        if (!html) html = '<div class="search-result-item" style="justify-content: center;">Только вы</div>';
        searchResults.innerHTML = html;
        searchResults.style.display = 'block';
        document.querySelectorAll('.search-result-item').forEach(item => {
            item.addEventListener('click', () => {
                const userId = item.dataset.userId;
                if (userId) {
                    createOrOpenChat(userId);
                    searchResults.style.display = 'none';
                    searchInput.value = '';
                }
            });
        });
    } catch (error) {
        console.error('Search error:', error);
        searchResults.style.display = 'none';
    }
}

async function createOrOpenChat(otherUserId) {
    try {
        const userInfo = await getUserInfo(otherUserId);
        const chatsSnap = await db.collection('chats').get();
        let existingChatId = null;
        for (const doc of chatsSnap.docs) {
            const chat = doc.data();
            if (chat.participants && chat.participants.includes(currentUser.uid) && chat.participants.includes(otherUserId)) {
                existingChatId = doc.id;
                break;
            }
        }
        if (existingChatId) {
            openChat(otherUserId, userInfo.username, existingChatId);
            return;
        }
        const newChatRef = await db.collection('chats').add({
            participants: [currentUser.uid, otherUserId],
            lastMessage: '',
            lastSender: currentUser.uid,
            lastMessageTime: new Date(),
            createdAt: new Date(),
            updatedAt: new Date(),
            unreadFor: [otherUserId]
        });
        openChat(otherUserId, userInfo.username, newChatRef.id);
    } catch (error) {
        console.error('Error creating chat:', error);
        showNotification('Ошибка при создании чата');
    }
}

// ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
function showMenuModal() {
    showNotification('Дополнительные функции будут позже');
}

function checkForAutoOpenChat() {
    const openChatData = sessionStorage.getItem('openChatWith');
    if (openChatData) {
        try {
            const data = JSON.parse(openChatData);
            const { userId, username } = data;
            sessionStorage.removeItem('openChatWith');
            if (userId && username) setTimeout(() => openChat(userId, username), 500);
        } catch (error) {
            console.error("Ошибка при обработке данных для открытия чата:", error);
        }
    }
}

function showNotification(message, duration = 3000) {
    notification.textContent = message;
    notification.classList.add('show');
    if (duration > 0) setTimeout(() => notification.classList.remove('show'), duration);
}

function logout() {
    if (confirm("Выйти из аккаунта?")) {
        auth.signOut().then(() => {
            location.href = "index.html";
        });
    }
}
