<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Contegg · Чаты</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --bg-input: #1f1f1f;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #707070;
            --accent-color: #2b7ef5;
            --accent-hover: #4090f7;
            --border-color: #2a2a2a;
            --error-color: #ff4d4d;
            --success-color: #4caf50;
            --online-color: #4caf50;
            --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            --safe-area-top: env(safe-area-inset-top, 47px);
            --safe-area-bottom: env(safe-area-inset-bottom, 34px);
            --header-height: 60px;
            --bottom-nav-height: 83px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        /* Динамический остров */
        .dynamic-island {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 34px;
            border-radius: 20px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            z-index: 1000;
            color: #fff;
        }

        /* Навбар */
        .navbar {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 430px;
            background: var(--bg-secondary);
            border-radius: 18px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
            border: 1px solid var(--border-color);
        }

        .logo {
            font-weight: 700;
            font-size: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .nav-btns {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: #1c1c1e;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #2c2c2e;
        }

        .chats-btn {
            background: #2b7ef5;
            color: #fff;
            border: none;
        }

        /* Контейнер */
        .container {
            max-width: 480px;
            margin: auto;
            padding: 140px 14px 100px;
            height: 100vh;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        /* Поиск */
        .search-container {
            margin-bottom: 16px;
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            z-index: 1;
        }

        .search-box input {
            width: 100%;
            height: 46px;
            padding: 0 45px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 23px;
            font-size: 16px;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: #2a2a2a;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        /* Результаты поиска */
        .search-results {
            margin-top: 8px;
            background: var(--bg-tertiary);
            border-radius: 16px;
            overflow: hidden;
            animation: fadeIn 0.2s ease;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .search-result-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid var(--border-color);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:active {
            background: var(--bg-secondary);
        }

        .result-avatar {
            width: 46px;
            height: 46px;
            border-radius: 23px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: white;
        }

        .result-info {
            flex: 1;
        }

        .result-name {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .result-username {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Список чатов */
        .chats-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-item {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .chat-item:hover {
            background: var(--bg-tertiary);
            transform: translateY(-2px);
        }

        .chat-item:active {
            transform: scale(0.98);
        }

        .chat-item.unread {
            background: rgba(90, 200, 250, 0.1);
            border-left: 4px solid #5ac8fa;
        }

        .chat-item.unread::after {
            content: '';
            position: absolute;
            top: 18px;
            right: 18px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #5ac8fa;
        }

        .chat-item.pinned {
            background: rgba(255, 214, 10, 0.1);
            border-left: 4px solid #ffd60a;
        }

        .chat-avatar {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            color: white;
            flex-shrink: 0;
            position: relative;
        }

        .online-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background: var(--online-color);
            border-radius: 50%;
            border: 3px solid var(--bg-secondary);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
            padding-right: 80px;
        }

        .chat-user {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .verified-badge {
            color: #5ac8fa;
            font-size: 14px;
        }

        .chat-preview {
            color: var(--text-secondary);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .chat-actions {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .chat-item:hover .chat-actions {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .chat-actions {
                opacity: 1;
            }
        }

        .action-btn {
            background: rgba(28,28,30,0.8);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            transform: scale(1.1);
        }

        .action-btn.pin-btn:hover {
            color: #ffd60a;
            background: rgba(255,214,10,0.1);
        }

        .action-btn.delete-btn:hover {
            color: var(--danger);
            background: rgba(255,69,58,0.1);
        }

        /* Нет чатов */
        .no-chats {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .no-chats-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .no-chats-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .no-chats-description {
            font-size: 14px;
            line-height: 1.4;
        }

        /* Оверлей чата */
        .chat-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .chat-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .chat-header {
            background: var(--bg-secondary);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            min-height: 72px;
            flex-shrink: 0;
            z-index: 10;
        }

        .chat-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .chat-header-avatar {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: white;
        }

        .chat-header-username {
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }

        .chat-header-username:hover {
            opacity: 0.8;
        }

        .chat-header-time {
            font-size: 12px;
            margin-top: 2px;
            color: var(--text-muted);
        }

        .chat-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-close-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .back-btn {
            display: none;
        }

        @media (max-width: 768px) {
            .back-btn {
                display: block;
                background: none;
                border: none;
                color: var(--text-muted);
                font-size: 20px;
                cursor: pointer;
                padding: 8px;
                margin-right: 8px;
            }
        }

        /* Сообщения */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
            animation: fade 0.3s ease;
            cursor: pointer;
            font-size: 15px;
        }

        .message:hover {
            background: rgba(255,255,255,0.03);
        }

        .message-outgoing {
            align-self: flex-end;
            background: #2b7ef5;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-incoming {
            align-self: flex-start;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .message-reply {
            background: rgba(90,200,250,0.1);
            border-left: 3px solid #5ac8fa;
            border-radius: 8px;
            padding: 6px 10px;
            margin-bottom: 6px;
            font-size: 13px;
            line-height: 1.3;
            max-width: 100%;
            overflow: hidden;
        }

        .message-reply-sender {
            font-weight: 600;
            color: #5ac8fa;
            font-size: 11px;
            margin-bottom: 2px;
        }

        .message-reply-text {
            color: var(--text-secondary);
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .message-text {
            font-size: 15px;
            line-height: 1.4;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }

        .message-status {
            font-size: 10px;
        }

        .message-reactions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .reaction {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 2px 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reaction:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.1);
        }

        .reaction.liked {
            background: rgba(255,55,95,0.2);
            color: #ff375f;
        }

        .reaction-count {
            font-size: 11px;
        }

        .message-date-divider {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            padding: 16px 0 8px;
            position: relative;
            margin: 4px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .message-date-divider::before,
        .message-date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .message-date-divider span {
            background: var(--bg-secondary);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        /* Область ввода */
        .chat-input-area {
            background: var(--bg-secondary);
            padding: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            flex-shrink: 0;
            z-index: 10;
        }

        .reply-container {
            width: 100%;
        }

        .reply-preview {
            background: var(--bg-tertiary);
            border-left: 4px solid #5ac8fa;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 8px;
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .reply-preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .reply-sender {
            font-size: 12px;
            color: #5ac8fa;
            font-weight: 600;
        }

        .reply-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            width: 20px;
            height: 20px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reply-close-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .reply-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.3;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .reply-icon {
            color: #5ac8fa;
            font-size: 14px;
            flex-shrink: 0;
        }

        .chat-input-wrapper {
            width: 100%;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .menu-btn {
            background: #1c1c1e;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .menu-btn:hover {
            background: #2c2c2e;
        }

        .chat-input {
            flex: 1;
            background: #1c1c1e;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 10px 14px;
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            min-height: 40px;
            max-height: 100px;
            line-height: 1.4;
            -webkit-appearance: none;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .chat-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-send-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .chat-send-btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .chat-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Нет сообщений */
        .no-messages {
            text-align: center;
            color: var(--text-muted);
            padding: 60px 20px;
            font-size: 14px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
        }

        /* Загрузчик */
        .loader {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
        }

        .loader-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid var(--border-color);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Контекстное меню для сообщений */
        .message-context-menu {
            position: fixed;
            background: var(--bg-tertiary);
            border-radius: 14px;
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            z-index: 10000;
            min-width: 180px;
            animation: fadeIn 0.1s ease;
        }

        .message-context-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
        }

        .message-context-item:hover {
            background: var(--bg-secondary);
        }

        .message-context-item i {
            width: 22px;
            font-size: 16px;
            color: #5ac8fa;
        }

        .message-context-item.danger {
            color: var(--danger);
        }

        .message-context-item.danger i {
            color: var(--danger);
        }

        /* Панель реакций */
        .reactions-panel {
            position: fixed;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 10px;
            display: flex;
            gap: 8px;
            z-index: 10000;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.2s;
            pointer-events: none;
        }

        .reactions-panel.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .reaction-emoji {
            font-size: 26px;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 6px;
            border-radius: 16px;
        }

        .reaction-emoji:hover {
            transform: scale(1.2);
            background: rgba(255,255,255,0.1);
        }

        .reaction-emoji.heart:hover {
            color: #ff375f;
        }

        /* Уведомления */
        .notification {
            position: fixed;
            top: 120px;

<script>
// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyBKTPyHKC_Mp1ZO6NDiCaJVz3w1u_PWfUo",
    authDomain: "contegg-b3b4b.firebaseapp.com",
    projectId: "contegg-b3b4b",
    storageBucket: "contegg-b3b4b.firebasestorage.app",
    messagingSenderId: "678323780149",
    appId: "1:678323780149:web:9717ac593a21d97a19cf7c"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// Enable offline persistence
db.enablePersistence({ synchronizeTabs: true })
    .catch(err => console.log('Persistence error:', err));

// Глобальные переменные
let currentUser = null;
let userData = null;
let blockedUsers = [];
let adminUsers = [];
let currentChatUserId = null;
let currentChatUsername = null;
let currentChatId = null;
let chatMessagesListener = null;
let usersCache = new Map();
let pinnedChats = [];
let replyingToMessage = null;
let selectedMessageForReaction = null;

// DOM элементы
const timeElement = document.getElementById('time');
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const chatsList = document.getElementById('chatsList');
const chatOverlay = document.getElementById('chatOverlay');
const chatMessages = document.getElementById('chatMessages');
const chatUserAvatar = document.getElementById('chatUserAvatar');
const chatUserName = document.getElementById('chatUserName');
const chatUserStatus = document.getElementById('chatUserStatus');
const chatInput = document.getElementById('chatInput');
const chatSendBtn = document.getElementById('chatSendBtn');
const replyContainer = document.getElementById('replyContainer');
const replySender = document.getElementById('replySender');
const replyText = document.getElementById('replyText');
const notification = document.getElementById('notification');
const messageContextMenu = document.getElementById('messageContextMenu');
const reactionsPanel = document.getElementById('reactionsPanel');

// Обновление времени
setInterval(() => {
    if (timeElement) {
        timeElement.textContent = new Date().toLocaleTimeString('ru-RU', {
            hour: '2-digit',
            minute: '2-digit'
        });
    }
}, 1000);

// Проверка авторизации
auth.onAuthStateChanged(async (user) => {
    if (!user) {
        location.href = 'index.html';
        return;
    }
    
    currentUser = user;
    
    await loadUserData();
    await loadAdminUsers();
    await loadChatsList();
    
    // Авто-открытие чата если есть в sessionStorage
    checkForAutoOpenChat();
});

// Загрузка данных пользователя
async function loadUserData() {
    try {
        const snap = await db.collection("users").doc(currentUser.uid).get();
        if (!snap.exists) {
            userData = {
                username: "user" + currentUser.uid.slice(-6),
                isAdmin: false,
                blockedUsers: [],
                pinnedChats: []
            };
            await db.collection("users").doc(currentUser.uid).set(userData);
        } else {
            userData = snap.data();
            blockedUsers = userData.blockedUsers || [];
            pinnedChats = userData.pinnedChats || [];
        }
        
        if (userData.isAdmin === true) {
            document.getElementById("adminBtn").style.display = "block";
        }
    } catch (error) {
        console.error("Ошибка загрузки данных:", error);
        showNotification("Ошибка загрузки данных");
    }
}

// Загрузка списка администраторов
async function loadAdminUsers() {
    try {
        const adminSnap = await db.collection("users")
            .where("isAdmin", "==", true)
            .get();
        
        adminUsers = [];
        adminSnap.forEach(doc => {
            adminUsers.push(doc.id);
        });
    } catch (error) {
        console.error("Ошибка загрузки админов:", error);
    }
}

// Получение информации о пользователе
async function getUserInfo(userId) {
    if (usersCache.has(userId)) {
        return usersCache.get(userId);
    }
    
    try {
        const userDoc = await db.collection("users").doc(userId).get();
        let userInfo = {
            username: "user" + userId.slice(-6),
            isAdmin: false
        };
        
        if (userDoc.exists) {
            const data = userDoc.data();
            userInfo = {
                username: data.username || userInfo.username,
                isAdmin: data.isAdmin || false
            };
        }
        
        usersCache.set(userId, userInfo);
        return userInfo;
    } catch (error) {
        console.error("Ошибка получения информации о пользователе:", error);
        return {
            username: "user" + userId.slice(-6),
            isAdmin: false
        };
    }
}

// Загрузка списка чатов
async function loadChatsList() {
    try {
        const chatsSnap = await db.collection('chats').get();
        
        if (chatsSnap.empty) {
            chatsList.innerHTML = `
                <div class="no-chats">
                    <div class="no-chats-icon">💬</div>
                    <div class="no-chats-title">Нет сообщений</div>
                    <div class="no-chats-description">
                        Начните общение с другими пользователями!
                    </div>
                </div>`;
            return;
        }
        
        const userChats = [];
        
        for (const doc of chatsSnap.docs) {
            const chat = doc.data();
            const chatId = doc.id;
            
            if (chat.participants && chat.participants.includes(currentUser.uid)) {
                const otherUserId = chat.participants.find(id => id !== currentUser.uid);
                
                if (!otherUserId) continue;
                
                if (blockedUsers.includes(otherUserId)) continue;
                
                const otherUserInfo = await getUserInfo(otherUserId);
                
                const isPinned = pinnedChats.includes(chatId);
                const isUnread = chat.unreadFor && chat.unreadFor.includes(currentUser.uid);
                
                userChats.push({
                    id: chatId,
                    ...chat,
                    otherUserId: otherUserId,
                    otherUserInfo: otherUserInfo,
                    isPinned: isPinned,
                    isUnread: isUnread
                });
            }
        }
        
        if (userChats.length === 0) {
            chatsList.innerHTML = `
                <div class="no-chats">
                    <div class="no-chats-icon">💬</div>
                    <div class="no-chats-title">Нет активных чатов</div>
                    <div class="no-chats-description">
                        Начните общение с другими пользователями
                    </div>
                </div>`;
            return;
        }
        
        // Сортировка: сначала закрепленные, потом по времени
        const pinnedChatsArray = userChats.filter(chat => chat.isPinned);
        const regularChatsArray = userChats.filter(chat => !chat.isPinned);
        
        const sortByTime = (a, b) => {
            const timeA = a.lastMessageTime?.toDate ? a.lastMessageTime.toDate() : new Date(0);
            const timeB = b.lastMessageTime?.toDate ? b.lastMessageTime.toDate() : new Date(0);
            return timeB - timeA;
        };
        
        pinnedChatsArray.sort(sortByTime);
        regularChatsArray.sort(sortByTime);
        
        const sortedChats = [...pinnedChatsArray, ...regularChatsArray];
        
        let chatsHTML = '';
        
        for (const chat of sortedChats) {
            const otherUser = chat.otherUserInfo;
            if (!otherUser) continue;
            
            const lastMessageTime = chat.lastMessageTime?.toDate ? chat.lastMessageTime.toDate() : new Date();
            const timeAgo = formatTimeAgo(lastMessageTime);
            
            let preview = chat.lastMessage || 'Нет сообщений';
            if (preview.length > 50) {
                preview = preview.substring(0, 47) + '...';
            }
            
            const senderPrefix = chat.lastSender === currentUser.uid ? 'Вы: ' : '';
            
            chatsHTML += `
                <div class="chat-item fade ${chat.isUnread ? 'unread' : ''} ${chat.isPinned ? 'pinned' : ''}" 
                     onclick="openChat('${chat.otherUserId}', '${otherUser.username}', '${chat.id}')"
                     data-chat-id="${chat.id}">
                    <div class="chat-avatar">
                        ${otherUser.username?.[0]?.toUpperCase() || 'U'}
                    </div>
                    <div class="chat-info">
                        <div class="chat-user">
                            @${otherUser.username}
                            ${adminUsers.includes(chat.otherUserId) ? '<span class="verified-badge" title="Администратор">✓</span>' : ''}
                            ${chat.isPinned ? '<span style="color:#ffd60a;margin-left:4px;">📌</span>' : ''}
                        </div>
                        <div class="chat-preview">${senderPrefix}${preview}</div>
                        <div class="chat-time">${timeAgo}</div>
                    </div>
                    <div class="chat-actions">
                        <button class="action-btn pin-btn" onclick="event.stopPropagation(); togglePinChat('${chat.id}')" title="${chat.isPinned ? 'Открепить чат' : 'Закрепить чат'}">
                            📌
                        </button>
                        <button class="action-btn delete-btn" onclick="event.stopPropagation(); showDeleteConfirm('${chat.id}', '${otherUser.username}')" title="Удалить чат">
                            🗑️
                        </button>
                    </div>
                </div>
            `;
        }
        
        chatsList.innerHTML = chatsHTML;
        
    } catch (error) {
        console.error('Ошибка загрузки чатов:', error);
        chatsList.innerHTML = `
            <div class="no-chats" style="color:var(--danger)">
                Ошибка загрузки чатов: ${error.message}
            </div>`;
    }
}

// Форматирование времени
function formatTimeAgo(date) {
    if (!date) return "только что";
    
    const now = new Date();
    const diff = now - date;
    const seconds = Math.floor(diff / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    
    if (days > 7) {
        return date.toLocaleDateString("ru-RU", {
            day: "2-digit",
            month: "2-digit"
        });
    } else if (days > 0) {
        return `${days} д назад`;
    } else if (hours > 0) {
        return `${hours} ч назад`;
    } else if (minutes > 0) {
        return `${minutes} мин назад`;
    } else {
        return "только что";
    }
}

function formatMessageTime(date) {
    if (!date) return "";
    return date.toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
    });
}

function formatDateDivider(date) {
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    
    if (date.toDateString() === today.toDateString()) {
        return 'Сегодня';
    } else if (date.toDateString() === yesterday.toDateString()) {
        return 'Вчера';
    } else {
        return date.toLocaleDateString("ru-RU", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });
    }
}

// Закрепление чата
async function togglePinChat(chatId) {
    try {
        const isCurrentlyPinned = pinnedChats.includes(chatId);
        
        if (isCurrentlyPinned) {
            pinnedChats = pinnedChats.filter(id => id !== chatId);
            await db.collection("users").doc(currentUser.uid).update({
                pinnedChats: pinnedChats
            });
            showNotification("Чат откреплен");
        } else {
            if (pinnedChats.length >= 5) {
                showNotification("Можно закрепить не более 5 чатов");
                return;
            }
            pinnedChats.push(chatId);
            await db.collection("users").doc(currentUser.uid).update({
                pinnedChats: pinnedChats
            });
            showNotification("Чат закреплен");
        }
        
        loadChatsList();
        
    } catch (error) {
        console.error("Ошибка при закреплении чата:", error);
        showNotification("Ошибка: " + error.message);
    }
}

// Подтверждение удаления чата
function showDeleteConfirm(chatId, username) {
    if (confirm(`Вы уверены, что хотите удалить чат с @${username}? Все сообщения будут удалены.`)) {
        deleteChat(chatId);
    }
}

// Удаление чата
async function deleteChat(chatId) {
    try {
        const messagesSnap = await db.collection('chats').doc(chatId)
            .collection('messages').get();
        
        const batch = db.batch();
        messagesSnap.docs.forEach(doc => {
            batch.delete(doc.ref);
        });
        
        batch.delete(db.collection('chats').doc(chatId));
        
        await batch.commit();
        
        pinnedChats = pinnedChats.filter(id => id !== chatId);
        await db.collection("users").doc(currentUser.uid).update({
            pinnedChats: pinnedChats
        });
        
        showNotification("Чат удален");
        
        if (currentChatId === chatId) {
            closeChat();
        }
        
        loadChatsList();
        
    } catch (error) {
        console.error("Ошибка при удалении чата:", error);
        showNotification("Ошибка удаления: " + error.message);
    }
}

// Открытие чата
async function openChat(userId, username, chatId = null) {
    currentChatUserId = userId;
    currentChatUsername = username;
    
    if (!chatId) {
        const chatsSnap = await db.collection('chats').get();
        
        for (const doc of chatsSnap.docs) {
            const chat = doc.data();
            if (chat.participants && 
                chat.participants.includes(currentUser.uid) && 
                chat.participants.includes(userId)) {
                chatId = doc.id;
                break;
            }
        }
    }
    
    currentChatId = chatId;
    
    chatUserAvatar.textContent = username?.[0]?.toUpperCase() || 'U';
    chatUserName.textContent = '@' + username;
    chatUserStatus.textContent = 'онлайн';
    
    const isBlocked = blockedUsers.includes(userId);
    updateInputState(isBlocked);
    
    chatOverlay.classList.add('show');
    
    await loadChatMessages();
    
    setTimeout(() => {
        chatInput.focus();
    }, 100);
    
    if (currentChatId) {
        await markChatAsRead(currentChatId);
    }
}

// Закрытие чата
function closeChat() {
    chatOverlay.classList.remove('show');
    
    if (chatMessagesListener) {
        chatMessagesListener();
        chatMessagesListener = null;
    }
    
    currentChatUserId = null;
    currentChatUsername = null;
    currentChatId = null;
    
    loadChatsList();
}

// Отметка чата как прочитанного
async function markChatAsRead(chatId) {
    try {
        const chatRef = db.collection('chats').doc(chatId);
        const chatDoc = await chatRef.get();
        
        if (chatDoc.exists) {
            const chatData = chatDoc.data();
            if (chatData.unreadFor && chatData.unreadFor.includes(currentUser.uid)) {
                const updatedUnreadFor = chatData.unreadFor.filter(id => id !== currentUser.uid);
                await chatRef.update({
                    unreadFor: updatedUnreadFor
                });
            }
        }
    } catch (error) {
        console.error("Ошибка при отметке чата как прочитанного:", error);
    }
}

// Обновление состояния поля ввода
function updateInputState(isBlocked) {
    if (isBlocked) {
        chatInput.disabled = true;
        chatSendBtn.disabled = true;
        chatInput.placeholder = 'Пользователь заблокирован';
    } else {
        chatInput.disabled = false;
        chatSendBtn.disabled = false;
        chatInput.placeholder = 'Напишите сообщение...';
    }
}

// Открытие профиля из чата
function openProfileFromChat() {
    if (!currentChatUserId) return;
    showNotification('Профиль будет доступен позже');
}

// Загрузка сообщений чата
async function loadChatMessages() {
    chatMessages.innerHTML = '<div class="loader"><div class="loader-spinner"></div><div>Загрузка сообщений...</div></div>';
    
    if (!currentChatId) {
        chatMessages.innerHTML = `
            <div class="no-messages">
                Начните общение с @${currentChatUsername}!
            </div>`;
        return;
    }
    
    try {
        const messagesSnap = await db.collection('chats').doc(currentChatId)
            .collection('messages')
            .orderBy('timestamp', 'asc')
            .limit(100)
            .get();
        
        if (messagesSnap.empty) {
            chatMessages.innerHTML = `
                <div class="no-messages">
                    Нет сообщений. Начните общение!
                </div>`;
            return;
        }
        
        chatMessages.innerHTML = '';
        
        let lastDate = null;
        
        messagesSnap.forEach(doc => {
            const msg = doc.data();
            const msgDate = msg.timestamp?.toDate ? msg.timestamp.toDate() : new Date();
            const currentDate = new Date(msgDate.getFullYear(), msgDate.getMonth(), msgDate.getDate());
            
            if (!lastDate || currentDate.getTime() !== lastDate.getTime()) {
                const dateDivider = document.createElement('div');
                dateDivider.className = 'message-date-divider';
                dateDivider.innerHTML = `<span>${formatDateDivider(msgDate)}</span>`;
                chatMessages.appendChild(dateDivider);
                lastDate = currentDate;
            }
            
            addMessageToUI({ id: doc.id, ...msg });
        });
        
        setTimeout(() => {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 100);
        
        setupChatMessagesListener();
        
    } catch (error) {
        console.error('Ошибка загрузки сообщений:', error);
        chatMessages.innerHTML = `
            <div class="no-messages" style="color:var(--danger)">
                Ошибка загрузки сообщений
            </div>`;
    }
}

// Добавление сообщения в UI
function addMessageToUI(msg) {
    const isOutgoing = msg.senderId === currentUser.uid;
    const msgDate = msg.timestamp?.toDate ? msg.timestamp.toDate() : new Date();
    const messageTime = formatMessageTime(msgDate);
    
    const messageDiv = document.createElement('div');
    messageDiv.className = `message fade ${isOutgoing ? 'message-outgoing' : 'message-incoming'}`;
    messageDiv.setAttribute('data-message-id', msg.id);
    messageDiv.setAttribute('data-sender-id', msg.senderId);
    
    setupMessageClickHandler(messageDiv, msg);
    
    const readStatus = msg.read === true ? '✓✓' : '✓';
    
    let contentHTML = '';
    
    let replyHTML = '';
    if (msg.replyTo) {
        const replySender = msg.replyTo.senderId === currentUser.uid ? 'Вы' : currentChatUsername;
        const replyText = msg.replyTo.text || '';
        const shortText = replyText.length > 50 ? replyText.substring(0, 47) + '...' : replyText;
        
        replyHTML = `
            <div class="message-reply">
                <div class="message-reply-sender">${replySender}</div>
                <div class="message-reply-text">${escapeHtml(shortText)}</div>
            </div>
        `;
    }
    
    let reactionsHTML = '';
    if (msg.reactions && Object.keys(msg.reactions).length > 0) {
        const reactionGroups = {};
        Object.entries(msg.reactions).forEach(([userId, emoji]) => {
            if (!reactionGroups[emoji]) {
                reactionGroups[emoji] = [];
            }
            reactionGroups[emoji].push(userId);
        });
        
        reactionsHTML = '<div class="message-reactions">';
        Object.entries(reactionGroups).forEach(([emoji, users]) => {
            const isLikedByMe = users.includes(currentUser.uid);
            reactionsHTML += `
                <div class="reaction ${isLikedByMe ? 'liked' : ''}" onclick="event.stopPropagation(); addReactionToMessage('${msg.id}', '${emoji}')">
                    <span>${emoji}</span>
                    <span class="reaction-count">${users.length}</span>
                </div>
            `;
        });
        reactionsHTML += '</div>';
    }
    
    contentHTML = `
        ${replyHTML}
        <div class="message-text">${escapeHtml(msg.text || '')}</div>
        ${reactionsHTML}
    `;
    
    messageDiv.innerHTML = `
        ${contentHTML}
        <div class="message-time">
            ${messageTime}
            ${isOutgoing ? `<span class="message-status">${readStatus}</span>` : ''}
        </div>
    `;
    
    chatMessages.appendChild(messageDiv);
}

// Экранирование HTML
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Настройка обработчиков для сообщений
function setupMessageClickHandler(messageDiv, msg) {
    if ('ontouchstart' in window) {
        let longPressTimer;
        let isLongPress = false;
        
        messageDiv.addEventListener('touchstart', (e) => {
            isLongPress = false;
            longPressTimer = setTimeout(() => {
                isLongPress = true;
                showMessageContextMenu(e, msg.id, msg);
            }, 500);
        });
        
        messageDiv.addEventListener('touchend', (e) => {
            clearTimeout(longPressTimer);
            if (!isLongPress) {
                showReactionsPanel(e, msg.id, msg);
            }
        });
        
        messageDiv.addEventListener('touchmove', () => {
            clearTimeout(longPressTimer);
        });
    } else {
        messageDiv.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            showMessageContextMenu(e, msg.id, msg);
        });
        
        messageDiv.addEventListener('click', (e) => {
            if (e.button === 0) {
                showReactionsPanel(e, msg.id, msg);
            }
        });
    }
}

// Слушатель новых сообщений
function setupChatMessagesListener() {
    if (chatMessagesListener || !currentChatId) return;
    
    chatMessagesListener = db.collection('chats').doc(currentChatId)
        .collection('messages')
        .orderBy('timestamp', 'desc')
        .limit(1)
        .onSnapshot((snapshot) => {
            snapshot.docChanges().forEach((change) => {
                if (change.type === 'added') {
                    const msg = change.doc.data();
                    const existingMessage = document.querySelector(`[data-message-id="${change.doc.id}"]`);
                    
                    if (!existingMessage) {
                        addMessageToUI({ id: change.doc.id, ...msg });
                        
                        setTimeout(() => {
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        }, 100);
                    }
                } else if (change.type === 'modified') {
                    const msg = change.doc.data();
                    const existingMessage = document.querySelector(`[data-message-id="${change.doc.id}"]`);
                    if (existingMessage && msg.reactions) {
                        updateMessageReactions(change.doc.id, msg.reactions);
                    }
                }
            });
        });
}

// Отправка сообщения
async function sendMessage() {
    if (!currentChatUserId) return;
    
    const text = chatInput.value.trim();
    
    if (!text) {
        showNotification('Введите сообщение!');
        return;
    }
    
    if (blockedUsers.includes(currentChatUserId)) {
        showNotification('Нельзя отправить сообщение заблокированному пользователю');
        return;
    }
    
    chatSendBtn.disabled = true;
    
    const messageData = {
        text: text,
        senderId: currentUser.uid,
        timestamp: new Date(),
        read: false
    };
    
    if (replyingToMessage) {
        messageData.replyTo = {
            messageId: replyingToMessage.id,
            senderId: replyingToMessage.senderId,
            text: replyingToMessage.text
        };
    }
    
    try {
        let chatId = currentChatId;
        
        if (!chatId) {
            const newChatRef = await db.collection('chats').add({
                participants: [currentUser.uid, currentChatUserId],
                lastMessage: text,
                lastSender: currentUser.uid,
                lastMessageTime: new Date(),
                createdAt: new Date(),
                updatedAt: new Date(),
                unreadFor: [currentChatUserId]
            });
            
            chatId = newChatRef.id;
            currentChatId = chatId;
        } else {
            await db.collection('chats').doc(chatId).update({
                lastMessage: text,
                lastSender: currentUser.uid,
                lastMessageTime: new Date(),
                updatedAt: new Date(),
                unreadFor: firebase.firestore.FieldValue.arrayUnion(currentChatUserId)
            });
        }
        
        await db.collection('chats').doc(chatId)
            .collection('messages')
            .add(messageData);
        
        chatInput.value = '';
        chatInput.style.height = 'auto';
        cancelReply();
        
        loadChatsList();
        
    } catch (error) {
        console.error('Ошибка отправки сообщения:', error);
        showNotification('Ошибка отправки: ' + error.message);
    } finally {
        chatSendBtn.disabled = false;
    }
}

// Показать панель реакций
function showReactionsPanel(event, messageId, messageData) {
    let x, y;
    if (event.type.includes('touch')) {
        const touch = event.touches[0] || event.changedTouches[0];
        x = touch.clientX;
        y = touch.clientY;
    } else {
        x = event.clientX;
        y = event.clientY;
    }
    
    selectedMessageForReaction = { id: messageId, ...messageData };
    
    reactionsPanel.style.left = Math.min(x - 100, window.innerWidth - 220) + 'px';
    reactionsPanel.style.top = Math.min(y - 60, window.innerHeight - 80) + 'px';
    reactionsPanel.classList.add('show');
    
    setTimeout(() => {
        const closePanel = (e) => {
            if (!reactionsPanel.contains(e.target)) {
                reactionsPanel.classList.remove('show');
                document.removeEventListener('click', closePanel);
                document.removeEventListener('touchstart', closePanel);
            }
        };
        document.addEventListener('click', closePanel);
        document.addEventListener('touchstart', closePanel);
    }, 10);
}

// Добавить реакцию
async function addReaction(emoji) {
    if (!selectedMessageForReaction || !currentChatId) return;
    
    try {
        const messageRef = db.collection('chats').doc(currentChatId)
            .collection('messages')
            .doc(selectedMessageForReaction.id);
        
        const messageDoc = await messageRef.get();
        const currentReactions = messageDoc.data()?.reactions || {};
        
        const userReaction = currentReactions[currentUser.uid];
        
        if (userReaction === emoji) {
            delete currentReactions[currentUser.uid];
            showNotification("Реакция убрана");
        } else {
            currentReactions[currentUser.uid] = emoji;
            showNotification(`${emoji} Добавлено`);
        }
        
        await messageRef.update({
            reactions: currentReactions
        });
        
        updateMessageReactions(selectedMessageForReaction.id, currentReactions);
        
        reactionsPanel.classList.remove('show');
        
    } catch (error) {
        console.error("Ошибка при добавлении реакции:", error);
        showNotification("Ошибка: " + error.message);
    }
}

// Добавить реакцию к сообщению по ID
async function addReactionToMessage(messageId, emoji) {
    if (!currentChatId) return;
    
    try {
        const messageRef = db.collection('chats').doc(currentChatId)
            .collection('messages')
            .doc(messageId);
        
        const messageDoc = await messageRef.get();
        const currentReactions = messageDoc.data()?.reactions || {};
        
        const userReaction = currentReactions[currentUser.uid];
        
        if (userReaction === emoji) {
            delete currentReactions[currentUser.uid];
            showNotification("Реакция убрана");
        } else {
            currentReactions[currentUser.uid] = emoji;
            showNotification(`${emoji} Добавлено`);
        }
        
        await messageRef.update({
            reactions: currentReactions
        });
        
        updateMessageReactions(messageId, currentReactions);
        
    } catch (error) {
        console.error("Ошибка при добавлении реакции:", error);
        showNotification("Ошибка: " + error.message);
    }
}

// Обновить отображение реакций
function updateMessageReactions(messageId, reactions) {
    const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
    if (!messageElement) return;
    
    let reactionsContainer = messageElement.querySelector('.message-reactions');
    
    if (!reactionsContainer) {
        reactionsContainer = document.createElement('div');
        reactionsContainer.className = 'message-reactions';
        
        const timeElement = messageElement.querySelector('.message-time');
        if (timeElement) {
            messageElement.insertBefore(reactionsContainer, timeElement);
        } else {
            messageElement.appendChild(reactionsContainer);
        }
    }
    
    reactionsContainer.innerHTML = '';
    
    if (Object.keys(reactions).length === 0) {
        reactionsContainer.remove();
        return;
    }
    
    const reactionGroups = {};
    Object.entries(reactions).forEach(([userId, emoji]) => {
        if (!reactionGroups[emoji]) {
            reactionGroups[emoji] = [];
        }
        reactionGroups[emoji].push(userId);
    });
    
    Object.entries(reactionGroups).forEach(([emoji, users]) => {
        const isLikedByMe = users.includes(currentUser.uid);
        
        const reactionElement = document.createElement('div');
        reactionElement.className = `reaction ${isLikedByMe ? 'liked' : ''}`;
        reactionElement.onclick = (e) => {
            e.stopPropagation();
            addReactionToMessage(messageId, emoji);
        };
        
        reactionElement.innerHTML = `
            <span>${emoji}</span>
            <span class="reaction-count">${users.length}</span>
        `;
        
        reactionsContainer.appendChild(reactionElement);
    });
}

// Ответить на сообщение
function replyToMessage(messageId, messageData) {
    const senderInfo = messageData.senderId === currentUser.uid ? 
        { username: 'Вы' } : 
        { username: currentChatUsername };
    
    replyingToMessage = {
        id: messageId,
        text: messageData.text,
        senderId: messageData.senderId,
        senderName: senderInfo.username
    };
    
    replyContainer.style.display = 'block';
    replySender.textContent = senderInfo.username;
    
    const shortText = messageData.text.length > 50 ? 
        messageData.text.substring(0, 47) + '...' : 
        messageData.text;
    replyText.textContent = shortText;
    
    chatInput.focus();
}

// Отменить ответ
function cancelReply() {
    replyingToMessage = null;
    replyContainer.style.display = 'none';
}

// Показать контекстное меню сообщения
function showMessageContextMenu(event, messageId, messageData) {
    event.preventDefault();
    event.stopPropagation();
    
    let x, y;
    if (event.type.includes('touch')) {
        const touch = event.touches[0] || event.changedTouches[0];
        x = touch.clientX;
        y = touch.clientY;
    } else {
        x = event.clientX;
        y = event.clientY;
    }
    
    messageContextMenu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
    messageContextMenu.style.top = Math.min(y, window.innerHeight - 150) + 'px';
    messageContextMenu.style.display = 'block';
    
    window.currentContextMessageId = messageId;
    window.currentContextMessageData = messageData;
    
    setTimeout(() => {
        const closeMenu = (e) => {
            if (!messageContextMenu.contains(e.target)) {
                messageContextMenu.style.display = 'none';
                document.removeEventListener('click', closeMenu);
                document.removeEventListener('touchstart', closeMenu);
            }
        };
        document.addEventListener('click', closeMenu);
        document.addEventListener('touchstart', closeMenu);
    }, 10);
}

// Обработчики контекстного меню
document.getElementById('contextReplyBtn').addEventListener('click', () => {
    messageContextMenu.style.display = 'none';
    if (window.currentContextMessageId && window.currentContextMessageData) {
        replyToMessage(window.currentContextMessageId, window.currentContextMessageData);
    }
});

document.getElementById('contextReactionBtn').addEventListener('click', () => {
    messageContextMenu.style.display = 'none';
    if (window.currentContextMessageId && window.currentContextMessageData) {
        addReactionToMessage(window.currentContextMessageId, '❤️');
    }
});

document.getElementById('contextDeleteMessageBtn').addEventListener('click', () => {
    messageContextMenu.style.display = 'none';
    if (window.currentContextMessageId) {
        if (confirm("Вы уверены, что хотите удалить это сообщение?")) {
            deleteMessage(window.currentContextMessageId);
        }
    }
});

// Удалить сообщение
async function deleteMessage(messageId) {
    try {
        if (!currentChatId) return;
        
        await db.collection('chats').doc(currentChatId)
            .collection('messages')
            .doc(messageId)
            .delete();
        
        const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
        if (messageElement) {
            messageElement.remove();
        }
        
        showNotification("Сообщение удалено");
        
    } catch (error) {
        console.error("Ошибка при удалении сообщения:", error);
        showNotification("Ошибка удаления сообщения: " + error.message);
    }
}

// Поиск пользователей
let searchTimeout;
searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    const query = e.target.value.trim();
    
    if (query.length < 2) {
        searchResults.style.display = 'none';
        return;
    }
    
    searchTimeout = setTimeout(() => {
        searchUsers(query);
    }, 500);
});

async function searchUsers(query) {
    try {
        const usersRef = db.collection('users');
        const snapshot = await usersRef
            .where('username', '>=', query)
            .where('username', '<=', query + '\uf8ff')
            .limit(10)
            .get();
        
        if (snapshot.empty) {
            searchResults.innerHTML = '<div class="search-result-item" style="justify-content: center;">Ничего не найдено</div>';
            searchResults.style.display = 'block';
            return;
        }
        
        let html = '';
        snapshot.forEach(doc => {
            const user = doc.data();
            if (user.uid === currentUser.uid) return;
            
            html += `
                <div class="search-result-item" data-user-id="${user.uid}">
                    <div class="result-avatar">${(user.username || 'U')[0].toUpperCase()}</div>
                    <div class="result-info">
                        <div class="result-name">${escapeHtml(user.username || 'Пользователь')}</div>
                        <div class="result-username">@${escapeHtml(user.username || 'user')}</div>
                    </div>
                </div>
            `;
        });
        
        if (!html) {
            html = '<div class="search-result-item" style="justify-content: center;">Только вы</div>';
        }
        
        searchResults.innerHTML = html;
        searchResults.style.display = 'block';
        
        document.querySelectorAll('.search-result-item').forEach(item => {
            item.addEventListener('click', () => {
                const userId = item.dataset.userId;
                if (userId) {
                    createOrOpenChat(userId);
                    searchResults.style.display = 'none';
                    searchInput.value = '';
                }
            });
        });
        
    } catch (error) {
        console.error('Search error:', error);
        searchResults.style.display = 'none';
    }
}

// Создать или открыть чат с пользователем
async function createOrOpenChat(otherUserId) {
    try {
        const userInfo = await getUserInfo(otherUserId);
        
        const chatsSnap = await db.collection('chats').get();
        
        let existingChatId = null;
        
        for (const doc of chatsSnap.docs) {
            const chat = doc.data();
            if (chat.participants && 
                chat.participants.includes(currentUser.uid) && 
                chat.participants.includes(otherUserId)) {
                existingChatId = doc.id;
                break;
            }
        }
        
        if (existingChatId) {
            openChat(otherUserId, userInfo.username, existingChatId);
            return;
        }
        
        const newChatRef = await db.collection('chats').add({
            participants: [currentUser.uid, otherUserId],
            lastMessage: '',
            lastSender: currentUser.uid,
            lastMessageTime: new Date(),
            createdAt: new Date(),
            updatedAt: new Date(),
            unreadFor: [otherUserId]
        });
        
        openChat(otherUserId, userInfo.username, newChatRef.id);
        
    } catch (error) {
        console.error('Error creating chat:', error);
        showNotification('Ошибка при создании чата');
    }
}

// Показать меню (заглушка)
function showMenuModal() {
    if (!currentChatUserId) {
        showNotification('Сначала откройте чат');
        return;
    }
    showNotification('Дополнительные функции будут позже');
}

// Проверка на автоматическое открытие чата
function checkForAutoOpenChat() {
    const openChatData = sessionStorage.getItem('openChatWith');
    
    if (openChatData) {
        try {
            const data = JSON.parse(openChatData);
            const { userId, username } = data;
            
            sessionStorage.removeItem('openChatWith');
            
            if (userId && username) {
                setTimeout(() => {
                    openChat(userId, username);
                }, 500);
            }
        } catch (error) {
            console.error("Ошибка при обработке данных для открытия чата:", error);
        }
    }
}

// Показать уведомление
function showNotification(message, duration = 3000) {
    notification.textContent = message;
    notification.classList.add('show');
    
    if (duration > 0) {
        setTimeout(() => {
            notification.classList.remove('show');
        }, duration);
    }
}

    if (confirm("Выйти из аккаунта?")) {
        auth.signOut().then(() => {
            location.href = "index.html";
        });
    }
}
