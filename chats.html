<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Contegg · Чаты</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* iPhone 16 Pro Max размеры */
        :root {
            --bg-color: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --bg-input: #1f1f1f;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #707070;
            --accent-color: #2b7ef5;
            --accent-hover: #4090f7;
            --border-color: #2a2a2a;
            --error-color: #ff4d4d;
            --success-color: #4caf50;
            --online-color: #4caf50;
            
            /* iPhone 16 Pro Max safe areas */
            --safe-area-top: env(safe-area-inset-top, 47px); /* Динамический остров */
            --safe-area-bottom: env(safe-area-inset-bottom, 34px);
            --header-height: 60px;
            --bottom-nav-height: 83px; /* С учетом home indicator */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        /* App Container */
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            padding-top: var(--safe-area-top);
            padding-bottom: var(--safe-area-bottom);
        }

        /* Header */
        .header {
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .header-left h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #b0b0b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }

        .header-right span {
            color: var(--text-secondary);
            font-size: 17px;
            font-weight: 500;
        }

        /* Search Bar */
        .search-container {
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            z-index: 1;
        }

        .search-box input {
            width: 100%;
            height: 46px;
            padding: 0 45px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 23px;
            font-size: 16px;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: #2a2a2a;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        /* Chats List */
        .chats-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            background: var(--bg-color);
            -webkit-overflow-scrolling: touch;
            padding: 8px 12px;
        }

        .chats-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-radius: 16px;
            background: var(--bg-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            border: 1px solid transparent;
            width: 100%;
            min-height: 80px;
        }

        .chat-item:active {
            background: var(--bg-tertiary);
            transform: scale(0.98);
        }

        .chat-item.pinned {
            border-left: 4px solid var(--accent-color);
            background: var(--bg-tertiary);
        }

        .chat-avatar {
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--accent-color), #1a5ec9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 600;
            color: white;
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .online-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 16px;
            height: 16px;
            background: var(--online-color);
            border-radius: 50%;
            border: 3px solid var(--bg-secondary);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .chat-name {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .chat-time {
            font-size: 13px;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-left: 8px;
        }

        .chat-last-message {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .chat-last-message span {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .unread-badge {
            background: var(--accent-color);
            color: white;
            font-size: 12px;
            font-weight: 600;
            min-width: 22px;
            height: 22px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            flex-shrink: 0;
        }

        /* Bottom Navigation */
        .bottom-nav {
            height: var(--bottom-nav-height);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
            padding-bottom: max(0px, env(safe-area-inset-bottom, 10px));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 8px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item i {
            font-size: 24px;
        }

        .nav-item span {
            font-size: 12px;
            font-weight: 500;
        }

        /* Context Menu */
        .context-menu {
            position: fixed;
            background: var(--bg-tertiary);
            border-radius: 14px;
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            z-index: 1000;
            min-width: 200px;
            animation: fadeIn 0.1s ease;
        }

        .context-menu-item {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
        }

        .context-menu-item:active {
            background: var(--bg-secondary);
        }

        .context-menu-item i {
            width: 22px;
            font-size: 18px;
            color: var(--accent-color);
        }

        .context-menu-item.danger {
            color: var(--error-color);
        }

        .context-menu-item.danger i {
            color: var(--error-color);
        }

        /* Search Results */
        .search-results {
            margin-top: 8px;
            background: var(--bg-tertiary);
            border-radius: 16px;
            overflow: hidden;
            animation: fadeIn 0.2s ease;
            max-height: 300px;
            overflow-y: auto;
        }

        .search-result-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid var(--border-color);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:active {
            background: var(--bg-secondary);
        }

        .result-avatar {
            width: 46px;
            height: 46px;
            border-radius: 23px;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: white;
        }

        .result-info {
            flex: 1;
        }

        .result-name {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .result-username {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* No Chats */
        .no-chats {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .no-chats i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .no-chats p {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .no-chats .sub {
            font-size: 14px;
            opacity: 0.7;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        @keyframes slideOut {
            from { transform: translateX(0); }
            to { transform: translateX(100%); }
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* Pull to refresh */
        .refresh-indicator {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .fa-spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1>Contegg</h1>
            </div>
            <div class="header-right">
                <span>Чаты</span>
            </div>
        </header>

        <!-- Search -->
        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Поиск по нику..." autocomplete="off">
            </div>
            <div id="searchResults" class="search-results hidden"></div>
        </div>

        <!-- Chats List -->
        <div class="chats-container" id="chatsContainer">
            <div class="chats-list" id="chatsList"></div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-tab="chats">
                <i class="fas fa-comment"></i>
                <span>Чаты</span>
            </div>
            <div class="nav-item" data-tab="settings">
                <i class="fas fa-cog"></i>
                <span>Настройки</span>
            </div>
            <div class="nav-item" data-tab="profile">
                <i class="fas fa-user"></i>
                <span>Профиль</span>
            </div>
        </nav>

        <!-- Context Menu -->
        <div id="contextMenu" class="context-menu hidden">
            <div class="context-menu-item" id="pinChat">
                <i class="fas fa-thumbtack"></i>
                <span>Закрепить</span>
            </div>
            <div class="context-menu-item danger" id="deleteChat">
                <i class="fas fa-trash"></i>
                <span>Удалить чат</span>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBKTPyHKC_Mp1ZO6NDiCaJVz3w1u_PWfUo",
            authDomain: "contegg-b3b4b.firebaseapp.com",
            projectId: "contegg-b3b4b",
            storageBucket: "contegg-b3b4b.firebasestorage.app",
            messagingSenderId: "678323780149",
            appId: "1:678323780149:web:9717ac593a21d97a19cf7c"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Enable offline persistence
        db.enablePersistence({
            synchronizeTabs: true
        }).catch((err) => {
            if (err.code === 'failed-precondition') {
                console.log('Persistence failed');
            } else if (err.code === 'unimplemented') {
                console.log('Persistence not available');
            }
        });

        // State
        let currentUser = null;
        let currentUserId = null;
        let pinnedChats = new Set();
        let selectedChatId = null;
        let usersCache = new Map();
        let unsubscribeChats = null;
        let isTransitioning = false;

        // DOM Elements
        const chatsList = document.getElementById('chatsList');
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const contextMenu = document.getElementById('contextMenu');
        const pinChatBtn = document.getElementById('pinChat');
        const deleteChatBtn = document.getElementById('deleteChat');
        const navItems = document.querySelectorAll('.nav-item');

        // Check auth
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            
            currentUser = user;
            currentUserId = user.uid;
            
            // Save user
            await saveUserToFirestore(user);
            
            // Load pinned chats
            loadPinnedChats();
            
            // Load chats
            setupChatsListener();
        });

        // Save user to Firestore
        async function saveUserToFirestore(user) {
            try {
                const username = user.displayName || user.email.split('@')[0];
                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    username: username,
                    displayName: username,
                    online: true,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                    avatar: username[0].toUpperCase()
                }, { merge: true });
            } catch (error) {
                console.error('Error saving user:', error);
            }
        }

        // Load pinned chats
        function loadPinnedChats() {
            try {
                const saved = localStorage.getItem(`pinned_${currentUserId}`);
                if (saved) {
                    pinnedChats = new Set(JSON.parse(saved));
                }
            } catch (e) {
                console.log('Error loading pinned:', e);
            }
        }

        // Save pinned chats
        function savePinnedChats() {
            try {
                localStorage.setItem(`pinned_${currentUserId}`, JSON.stringify([...pinnedChats]));
            } catch (e) {
                console.log('Error saving pinned:', e);
            }
        }

        // Setup chats listener
        function setupChatsListener() {
            if (unsubscribeChats) {
                unsubscribeChats();
            }

            unsubscribeChats = db.collection('chats')
                .where('participants', 'array-contains', currentUserId)
                .orderBy('lastMessageTime', 'desc')
                .onSnapshot(async (snapshot) => {
                    const chats = [];
                    
                    // Collect participant IDs
                    const participantIds = new Set();
                    snapshot.forEach(doc => {
                        const chat = { id: doc.id, ...doc.data() };
                        chats.push(chat);
                        chat.participants.forEach(id => participantIds.add(id));
                    });
                    
                    // Load users data
                    await loadUsersData([...participantIds]);
                    
                    displayChats(chats);
                }, (error) => {
                    console.error('Chats listener error:', error);
                });
        }

        // Load users data
        async function loadUsersData(userIds) {
            const uncached = userIds.filter(id => !usersCache.has(id) && id !== currentUserId);
            
            if (uncached.length === 0) return;
            
            try {
                const chunks = [];
                for (let i = 0; i < uncached.length; i += 10) {
                    chunks.push(uncached.slice(i, i + 10));
                }
                
                for (const chunk of chunks) {
                    const users = await db.collection('users')
                        .where('uid', 'in', chunk)
                        .get();
                    
                    users.forEach(doc => {
                        usersCache.set(doc.id, doc.data());
                    });
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        // Display chats
        function displayChats(chats) {
            if (!chatsList) return;

            if (chats.length === 0) {
                chatsList.innerHTML = `
                    <div class="no-chats">
                        <i class="fas fa-comments"></i>
                        <p>У вас пока нет чатов</p>
                        <p class="sub">Найдите пользователя через поиск</p>
                    </div>
                `;
                return;
            }

            // Sort chats
            const sortedChats = [...chats].sort((a, b) => {
                const aPinned = pinnedChats.has(a.id);
                const bPinned = pinnedChats.has(b.id);
                
                if (aPinned && !bPinned) return -1;
                if (!aPinned && bPinned) return 1;
                
                const aTime = a.lastMessageTime?.toDate?.() || new Date(0);
                const bTime = b.lastMessageTime?.toDate?.() || new Date(0);
                return bTime - aTime;
            });

            let html = '';
            
            for (const chat of sortedChats) {
                const otherParticipantId = chat.participants.find(p => p !== currentUserId);
                const otherUser = usersCache.get(otherParticipantId) || {};
                const chatName = otherUser.displayName || otherUser.username || 'Пользователь';
                const lastMessage = chat.lastMessage || 'Нет сообщений';
                const time = chat.lastMessageTime?.toDate?.() || new Date();
                const timeString = formatTime(time);
                const isPinned = pinnedChats.has(chat.id);
                const avatar = chatName[0]?.toUpperCase() || '?';
                const isOnline = otherUser.online || false;
                
                html += `
                    <div class="chat-item ${isPinned ? 'pinned' : ''}" 
                         data-chat-id="${chat.id}" 
                         data-user-id="${otherParticipantId || ''}"
                         data-username="${chatName}">
                        <div class="chat-avatar">
                            ${avatar}
                            ${isOnline ? '<span class="online-indicator"></span>' : ''}
                        </div>
                        <div class="chat-info">
                            <div class="chat-header">
                                <span class="chat-name">${escapeHtml(chatName)}</span>
                                <span class="chat-time">${timeString}</span>
                            </div>
                            <div class="chat-last-message">
                                <span>${escapeHtml(lastMessage)}</span>
                                ${chat.unreadCount ? `<span class="unread-badge">${chat.unreadCount}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }
            
            chatsList.innerHTML = html;
            
            // Add event listeners
            addChatListeners();
        }

        // Add chat listeners
        function addChatListeners() {
            document.querySelectorAll('.chat-item').forEach(item => {
                // Click to open chat
                item.addEventListener('click', (e) => {
                    if (isTransitioning) return;
                    
                    const chatId = item.dataset.chatId;
                    const userId = item.dataset.userId;
                    const username = item.dataset.username;
                    
                    if (chatId && userId) {
                        openChat(chatId, userId, username);
                    }
                });
                
                // Context menu
                item.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const chatId = item.dataset.chatId;
                    if (chatId) {
                        showContextMenu(e, chatId);
                    }
                });
                
                // Mobile long press
                let pressTimer;
                let longPressTriggered = false;
                
                item.addEventListener('touchstart', (e) => {
                    longPressTriggered = false;
                    pressTimer = setTimeout(() => {
                        longPressTriggered = true;
                        const chatId = item.dataset.chatId;
                        const touch = e.touches[0];
                        if (chatId && touch) {
                            showContextMenu({
                                clientX: touch.clientX,
                                clientY: touch.clientY
                            }, chatId);
                        }
                    }, 500);
                });
                
                item.addEventListener('touchend', (e) => {
                    clearTimeout(pressTimer);
                    if (longPressTriggered) {
                        e.preventDefault();
                    }
                });
                
                item.addEventListener('touchmove', () => {
                    clearTimeout(pressTimer);
                });
            });
        }

        // Format time
        function formatTime(date) {
            try {
                const now = new Date();
                const diff = now - date;
                
                if (diff < 60000) return 'сейчас';
                if (diff < 3600000) return `${Math.floor(diff / 60000)} мин`;
                if (diff < 86400000) {
                    return date.toLocaleTimeString('ru-RU', { 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });
                }
                if (diff < 604800000) {
                    const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
                    return days[date.getDay()];
                }
                return date.toLocaleDateString('ru-RU', { 
                    day: 'numeric', 
                    month: 'short' 
                });
            } catch (e) {
                return '';
            }
        }

        // Show context menu
        function showContextMenu(event, chatId) {
            if (!chatId) return;
            
            selectedChatId = chatId;
            const isPinned = pinnedChats.has(chatId);
            
            pinChatBtn.innerHTML = `
                <i class="fas fa-thumbtack"></i>
                <span>${isPinned ? 'Открепить' : 'Закрепить'}</span>
            `;
            
            // Position menu
            let x = event.clientX;
            let y = event.clientY;
            
            // Keep menu in view
            const menuWidth = 200;
            const menuHeight = 100;
            
            if (x + menuWidth > window.innerWidth) {
                x = window.innerWidth - menuWidth - 10;
            }
            
            if (y + menuHeight > window.innerHeight) {
                y = window.innerHeight - menuHeight - 10;
            }
            
            contextMenu.style.left = `${x}px`;
            contextMenu.style.top = `${y}px`;
            contextMenu.classList.remove('hidden');
            
            // Hide on click outside
            const hideMenu = (e) => {
                if (!contextMenu.contains(e.target)) {
                    contextMenu.classList.add('hidden');
                    document.removeEventListener('click', hideMenu);
                }
            };
            
            setTimeout(() => {
                document.addEventListener('click', hideMenu);
            }, 100);
        }

        // Pin/Unpin chat
        pinChatBtn.addEventListener('click', () => {
            if (!selectedChatId) return;
            
            if (pinnedChats.has(selectedChatId)) {
                pinnedChats.delete(selectedChatId);
            } else {
                if (pinnedChats.size >= 5) {
                    alert('Можно закрепить не более 5 чатов');
                    return;
                }
                pinnedChats.add(selectedChatId);
            }
            
            savePinnedChats();
            contextMenu.classList.add('hidden');
            setupChatsListener(); // Refresh
        });

        // Delete chat
        deleteChatBtn.addEventListener('click', async () => {
            if (!selectedChatId || !currentUserId) return;
            
            if (!confirm('Удалить чат для всех? Это действие нельзя отменить.')) {
                contextMenu.classList.add('hidden');
                return;
            }
            
            try {
                // Delete messages
                const messages = await db.collection('messages')
                    .where('chatId', '==', selectedChatId)
                    .get();
                
                const batch = db.batch();
                messages.forEach(doc => {
                    batch.delete(doc.ref);
                });
                
                batch.delete(db.collection('chats').doc(selectedChatId));
                
                await batch.commit();
                
                // Remove from pinned
                if (pinnedChats.has(selectedChatId)) {
                    pinnedChats.delete(selectedChatId);
                    savePinnedChats();
                }
                
                contextMenu.classList.add('hidden');
                
            } catch (error) {
                console.error('Error deleting chat:', error);
                alert('Ошибка при удалении чата');
            }
        });

        // Search users
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            if (query.length < 2) {
                searchResults.classList.add('hidden');
                return;
            }
            
            searchTimeout = setTimeout(() => {
                performSearch(query);
            }, 500);
        });

        async function performSearch(query) {
            try {
                const snapshot = await db.collection('users')
                    .where('username', '>=', query)
                    .where('username', '<=', query + '\uf8ff')
                    .limit(10)
                    .get();
                
                if (snapshot.empty) {
                    searchResults.innerHTML = '<div class="search-result-item" style="justify-content: center;">Ничего не найдено</div>';
                    searchResults.classList.remove('hidden');
                    return;
                }
                
                let html = '';
                let hasResults = false;
                
                snapshot.forEach(doc => {
                    const user = doc.data();
                    if (user.uid === currentUserId) return;
                    
                    hasResults = true;
                    html += `
                        <div class="search-result-item" data-user-id="${user.uid}">
                            <div class="result-avatar">${(user.username || 'U')[0].toUpperCase()}</div>
                            <div class="result-info">
                                <div class="result-name">${escapeHtml(user.username || 'Пользователь')}</div>
                                <div class="result-username">@${escapeHtml(user.username || 'user')}</div>
                            </div>
                        </div>
                    `;
                });
                
                if (!hasResults) {
                    html = '<div class="search-result-item" style="justify-content: center;">Ничего не найдено</div>';
                }
                
                searchResults.innerHTML = html;
                searchResults.classList.remove('hidden');
                
                // Add click listeners
                document.querySelectorAll('.search-result-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const userId = item.dataset.userId;
                        if (userId) {
                            createOrOpenChat(userId);
                            searchResults.classList.add('hidden');
                            searchInput.value = '';
                        }
                    });
                });
                
            } catch (error) {
                console.error('Search error:', error);
                searchResults.classList.add('hidden');
            }
        }

        // Create or open chat
        async function createOrOpenChat(otherUserId) {
            if (!otherUserId || isTransitioning) return;
            
            try {
                // Check existing chat
                const chatsSnapshot = await db.collection('chats')
                    .where('participants', 'array-contains', currentUserId)
                    .get();
                
                let existingChatId = null;
                
                chatsSnapshot.forEach(doc => {
                    const chat = doc.data();
                    if (chat.participants.includes(otherUserId) && chat.participants.length === 2) {
                        existingChatId = doc.id;
                    }
                });
                
                if (existingChatId) {
                    openChat(existingChatId, otherUserId);
                    return;
                }
                
                // Create new chat
                const newChat = {
                    participants: [currentUserId, otherUserId],
                    type: 'private',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastMessage: 'Чат создан',
                    lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                    createdBy: currentUserId
                };
                
                const chatRef = await db.collection('chats').add(newChat);
                
                // Send welcome message
                await db.collection('messages').add({
                    chatId: chatRef.id,
                    senderId: currentUserId,
                    senderName: currentUser.displayName || 'Пользователь',
                    text: 'Чат создан',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    readBy: [currentUserId]
                });
                
                openChat(chatRef.id, otherUserId);
                
            } catch (error) {
                console.error('Error creating chat:', error);
                alert('Ошибка при создании чата');
            }
        }

        // Open chat with animation
        function openChat(chatId, otherUserId, username) {
            if (isTransitioning) return;
            
            isTransitioning = true;
            
            // Save data
            sessionStorage.setItem('currentChatId', chatId);
            sessionStorage.setItem('otherUserId', otherUserId);
            if (username) {
                sessionStorage.setItem('otherUsername', username);
            }
            
            // Animate out
            document.body.style.transition = 'transform 0.2s ease';
            document.body.style.transform = 'translateX(100%)';
            
            setTimeout(() => {
                window.location.href = 'chat.html';
            }, 180);
        }

        // Navigation
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                if (isTransitioning) return;
                
                navItems.forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
                
                const tab = item.dataset.tab;
                switch(tab) {
                    case 'chats':
                        break;
                    case 'settings':
                    case 'profile':
                        alert('Раздел в разработке');
                        break;
                }
            });
        });

        // Escape HTML
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Prevent zoom
        document.addEventListener('touchstart', (e) => {
            if (e.target.nodeName === 'INPUT') {
                e.target.style.fontSize = '16px';
            }
        }, { passive: true });

        // Update online status
        function setOnlineStatus(online) {
            if (currentUserId) {
                db.collection('users').doc(currentUserId).update({
                    online: online,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(() => {});
            }
        }

        window.addEventListener('beforeunload', () => {
            setOnlineStatus(false);
        });

        window.addEventListener('load', () => {
            setOnlineStatus(true);
        });

        // Cleanup
        window.addEventListener('unload', () => {
            if (unsubscribeChats) {
                unsubscribeChats();
            }
        });
    </script>
</body>
</html>
