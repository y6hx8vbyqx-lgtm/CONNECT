<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Contegg · Чаты</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== VARIABLES ===== */
        :root {
            /* Telegram Dark Theme Colors - без чистого чёрного */
            --bg-primary: #0a0a0a;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --bg-input: #1c1c1e;
            
            /* Основные цвета */
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.4);
            --text-hint: rgba(255, 255, 255, 0.3);
            
            /* Акцент */
            --accent-color: #2b7ef5;
            --accent-hover: #4090f7;
            
            /* Границы */
            --border-light: rgba(255, 255, 255, 0.06);
            --border-medium: rgba(255, 255, 255, 0.1);
            
            /* Статусы */
            --online-color: #4caf50;
            --danger-color: #ff453a;
            --pinned-color: #ffd60a;
            
            /* Фоны с полупрозрачностью */
            --nav-bg: rgba(28, 28, 30, 0.85);
            --input-bg: rgba(44, 44, 46, 0.9);
            --card-bg: rgba(28, 28, 30, 0.95);
            
            /* Размеры */
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --header-height: 56px;
            --input-height: 60px;
            --bottom-nav-height: 70px;
            
            /* Скругления */
            --radius-bubble: 18px;
            --radius-card: 20px;
            --radius-input: 20px;
            --radius-avatar: 50%;
            
            /* Анимации */
            --transition-default: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Тени */
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.4);
            --shadow-bubble: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* ===== GLOBAL STYLES ===== */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            line-height: 1.25;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== SAFE AREAS ===== */
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-area-top);
            padding-bottom: var(--safe-area-bottom);
            background: var(--bg-primary);
        }

        /* ===== НАВИГАЦИЯ (как в Telegram) ===== */
        .nav-bar {
            height: var(--header-height);
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            position: relative;
            z-index: 10;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-left h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-right span {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* ===== КНОПКИ ===== */
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition-default);
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        /* ===== ПОИСК (как в Telegram) ===== */
        .search-container {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-bottom: 0.5px solid var(--border-light);
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            z-index: 1;
        }

        .search-box input {
            width: 100%;
            height: 44px;
            padding: 0 45px;
            background: var(--input-bg);
            border: 0.5px solid var(--border-light);
            border-radius: var(--radius-input);
            font-size: 16px;
            color: var(--text-primary);
            transition: var(--transition-default);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(44, 44, 46, 0.95);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ===== РЕЗУЛЬТАТЫ ПОИСКА ===== */
        .search-results {
            margin-top: 8px;
            background: var(--card-bg);
            border-radius: var(--radius-card);
            overflow: hidden;
            animation: fadeSlide 0.2s ease;
            max-height: 300px;
            overflow-y: auto;
            border: 0.5px solid var(--border-light);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: var(--shadow-card);
        }

        .search-result-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            cursor: pointer;
            transition: var(--transition-default);
            border-bottom: 0.5px solid var(--border-light);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:active {
            background: var(--bg-tertiary);
        }

        .result-avatar {
            width: 46px;
            height: 46px;
            border-radius: var(--radius-avatar);
            background: linear-gradient(135deg, #2b7ef5, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: white;
        }

        .result-info {
            flex: 1;
        }

        .result-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .result-username {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ===== СПИСОК ЧАТОВ ===== */
        .chats-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            background: var(--bg-primary);
            -webkit-overflow-scrolling: touch;
            padding: 8px 12px;
            scrollbar-width: none;
        }

        .chats-container::-webkit-scrollbar {
            display: none;
        }

        .chats-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Элемент чата */
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-bubble);
            background: var(--bg-secondary);
            cursor: pointer;
            transition: var(--transition-default);
            position: relative;
            border: 0.5px solid transparent;
        }

        .chat-item:hover {
            background: var(--bg-tertiary);
        }

        .chat-item:active {
            transform: scale(0.98);
        }

        .chat-item.unread {
            background: rgba(43, 126, 245, 0.1);
        }

        .chat-item.unread::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-color);
        }

        .chat-item.pinned {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--pinned-color);
        }

        .chat-avatar {
            width: 54px;
            height: 54px;
            border-radius: var(--radius-avatar);
            background: linear-gradient(135deg, #2b7ef5, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 22px;
            color: white;
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .online-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background: var(--online-color);
            border-radius: 50%;
            border: 2px solid var(--bg-secondary);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-user {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .verified-badge {
            color: var(--accent-color);
            font-size: 14px;
            margin-left: 4px;
        }

        .chat-time {
            font-size: 13px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .chat-preview {
            font-size: 14px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .chat-actions {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .chat-item:hover .chat-actions {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .chat-actions {
                opacity: 1;
            }
        }

        .action-btn {
            background: rgba(28,28,30,0.9);
            border: 0.5px solid var(--border-light);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition-default);
            backdrop-filter: blur(10px);
        }

        .action-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            transform: scale(1.1);
        }

        .action-btn.pin-btn:hover {
            color: var(--pinned-color);
        }

        .action-btn.delete-btn:hover {
            color: var(--danger-color);
        }

        /* ===== ПУСТОЕ СОСТОЯНИЕ ===== */
        .no-chats {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 20px;
        }

        .no-chats-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: var(--radius-card);
            padding: 24px;
            max-width: 300px;
            text-align: center;
            border: 0.5px solid var(--border-light);
            box-shadow: var(--shadow-card);
        }

        .no-chats-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        .no-chats-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .no-chats-description {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* ===== ОВЕРЛЕЙ ЧАТА ===== */
        .chat-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            padding-top: var(--safe-area-top);
            padding-bottom: var(--safe-area-bottom);
        }

        .chat-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* ===== ШАПКА ЧАТА ===== */
        .chat-header {
            height: var(--header-height);
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--border-light);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            flex-shrink: 0;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition-default);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .chat-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-avatar);
            background: linear-gradient(135deg, #2b7ef5, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
            color: white;
        }

        .chat-header-text {
            display: flex;
            flex-direction: column;
        }

        .chat-header-username {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
        }

        .chat-header-status {
            font-size: 13px;
            color: var(--text-muted);
        }

        .chat-close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition-default);
        }

        .chat-close-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* ===== СООБЩЕНИЯ ===== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .chat-messages::-webkit-scrollbar {
            display: none;
        }

        .message {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: var(--radius-bubble);
            line-height: 1.35;
            word-break: break-word;
            position: relative;
            animation: fadeSlide 0.2s ease;
            cursor: pointer;
            font-size: 16px;
            box-shadow: var(--shadow-bubble);
        }

        .message-outgoing {
            align-self: flex-end;
            background: var(--accent-color);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-incoming {
            align-self: flex-start;
            background: var(--bg-tertiary);
            border: 0.5px solid var(--border-light);
            border-bottom-left-radius: 4px;
        }

        /* Группировка сообщений */
        .message + .message-outgoing {
            margin-top: 2px;
        }

        .message + .message-incoming {
            margin-top: 2px;
        }

        .message:not(:last-child).message-outgoing {
            border-bottom-right-radius: var(--radius-bubble);
        }

        .message:not(:last-child).message-incoming {
            border-bottom-left-radius: var(--radius-bubble);
        }

        /* Ответы */
        .message-reply {
            background: rgba(255, 255, 255, 0.1);
            border-left: 3px solid var(--accent-color);
            border-radius: 8px;
            padding: 6px 10px;
            margin-bottom: 6px;
            font-size: 14px;
            line-height: 1.3;
        }

        .message-reply-sender {
            font-weight: 600;
            color: var(--accent-color);
            font-size: 12px;
            margin-bottom: 2px;
        }

        .message-reply-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .message-text {
            font-size: 16px;
            line-height: 1.35;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }

        .message-status {
            font-size: 10px;
        }

        /* Реакции */
        .message-reactions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .reaction {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2px 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: var(--transition-default);
            border: 0.5px solid var(--border-light);
        }

        .reaction:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .reaction.liked {
            background: rgba(255, 55, 95, 0.2);
            color: #ff375f;
        }

        .reaction-count {
            font-size: 12px;
            font-weight: 500;
        }

        /* Разделители дат */
        .message-date-divider {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            padding: 16px 0 8px;
            position: relative;
            margin: 4px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .message-date-divider::before,
        .message-date-divider::after {
            content: '';
            flex: 1;
            height: 0.5px;
            background: var(--border-light);
        }

        .message-date-divider span {
            background: var(--bg-secondary);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            color: var(--text-muted);
            border: 0.5px solid var(--border-light);
        }

        /* ===== ОБЛАСТЬ ВВОДА ===== */
        .chat-input-area {
            background: var(--nav-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 0.5px solid var(--border-light);
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .reply-container {
            width: 100%;
        }

        .reply-preview {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent-color);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 8px;
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .reply-sender {
            font-weight: 600;
            color: var(--accent-color);
            font-size: 13px;
        }

        .reply-text {
            color: var(--text-muted);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reply-close-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition-default);
        }

        .reply-close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--input-bg);
            border: 0.5px solid var(--border-light);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: var(--transition-default);
            backdrop-filter: blur(10px);
        }

        .menu-btn:hover {
            background: var(--bg-tertiary);
        }

        .chat-input {
            flex: 1;
            background: var(--input-bg);
            border: 0.5px solid var(--border-light);
            border-radius: var(--radius-input);
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            resize: none;
            min-height: 40px;
            max-height: 100px;
            line-height: 1.35;
            transition: var(--transition-default);
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(44, 44, 46, 0.95);
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .chat-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-send-btn {

            height: 40px;

            justify-content: center;

        .chat-send-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .chat-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== ПУСТОЕ СОСТОЯНИЕ ЧАТА ===== */
        .no-messages {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            display: flex;
            justify-content: center;

        /* ===== ЗАГРУЗЧИК ===== */
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;

        .loader-spinner {
            width: 36px;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== КОНТЕКСТНОЕ МЕНЮ ===== */
        .message-context-menu {
            position: fixed;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 14px;
            padding: 6px;
            box-shadow: var(--shadow-card);
            border: 0.5px solid var(--border-light);
            z-index: 10000;
            min-width: 180px;
            animation: fadeScale 0.15s ease;
        }

        .message-context-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition-default);
            font-size: 15px;
        }

        .message-context-item:hover {
            background: var(--bg-tertiary);

        .message-context-item i {
            width: 20px;
            font-size: 16px;
            color: var(--accent-color);
        }

        .message-context-item.danger {
            color: var(--danger-color);
        }

        .message-context-item.danger i {
            color: var(--danger-color);
        }

        /* ===== ПАНЕЛЬ РЕАКЦИЙ ===== */
        .reactions-panel {
            position: fixed;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 0.5px solid var(--border-light);
            border-radius: 30px;
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            z-index: 10000;
            box-shadow: var(--shadow-card);
            opacity: 0;
            transform: translateY(10px) scale(0.95);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .reactions-panel.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .reaction-emoji {
            font-size: 26px;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 6px;
            border-radius: 50%;
        }

        .reaction-emoji:hover {
            transform: scale(1.2);
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== УВЕДОМЛЕНИЯ ===== */
        .notification {
            position: fixed;
            top: calc(var(--safe-area-top) + 70px);
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 500;
            z-index: 10001;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            font-size: 14px;
            border: 0.5px solid var(--border-light);
            box-shadow: var(--shadow-card);
        }

        .notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== АНИМАЦИИ ===== */
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .fade {
            animation: fadeSlide 0.2s ease;
        }

        /* ===== HIDDEN ===== */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<script>
// ===== FIREBASE CONFIG =====
const firebaseConfig = {
    apiKey: "AIzaSyBKTPyHKC_Mp1ZO6NDiCaJVz3w1u_PWfUo",
    authDomain: "contegg-b3b4b.firebaseapp.com",
    projectId: "contegg-b3b4b",
    storageBucket: "contegg-b3b4b.firebasestorage.app",
    messagingSenderId: "678323780149",
    appId: "1:678323780149:web:9717ac593a21d97a19cf7c"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// Enable offline persistence
db.enablePersistence({ synchronizeTabs: true })
    .catch(err => console.log('Persistence error:', err));

// ===== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ =====
let currentUser = null;
let userData = null;
let blockedUsers = [];
let adminUsers = [];
let currentChatUserId = null;
let currentChatUsername = null;
let currentChatId = null;
let chatMessagesListener = null;
let usersCache = new Map();
let pinnedChats = [];
let replyingToMessage = null;
let selectedMessageForReaction = null;

// ===== DOM ЭЛЕМЕНТЫ =====
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const chatsList = document.getElementById('chatsList');
const chatOverlay = document.getElementById('chatOverlay');
const chatMessages = document.getElementById('chatMessages');
const chatUserAvatar = document.getElementById('chatUserAvatar');
const chatUserName = document.getElementById('chatUserName');
const chatUserStatus = document.getElementById('chatUserStatus');
const chatInput = document.getElementById('chatInput');
const chatSendBtn = document.getElementById('chatSendBtn');
const replyContainer = document.getElementById('replyContainer');
const replySender = document.getElementById('replySender');
const replyText = document.getElementById('replyText');
const notification = document.getElementById('notification');
const messageContextMenu = document.getElementById('messageContextMenu');
const reactionsPanel = document.getElementById('reactionsPanel');

// ===== ПРОВЕРКА АВТОРИЗАЦИИ =====
auth.onAuthStateChanged(async (user) => {
    if (!user) {
        location.href = 'index.html';
        return;
    }
    
    currentUser = user;
    
    await loadUserData();
    await loadAdminUsers();
    await loadChatsList();
    
    // Авто-открытие чата если есть
    checkForAutoOpenChat();
});

// ===== ЗАГРУЗКА ДАННЫХ ПОЛЬЗОВАТЕЛЯ =====
async function loadUserData() {
    try {
        const snap = await db.collection("users").doc(currentUser.uid).get();
        if (!snap.exists) {
            userData = {
                username: "user" + currentUser.uid.slice(-6),
                isAdmin: false,
                blockedUsers: [],
                pinnedChats: []
            };
            await db.collection("users").doc(currentUser.uid).set(userData);
        } else {
            userData = snap.data();
            blockedUsers = userData.blockedUsers || [];
            pinnedChats = userData.pinnedChats || [];
        }
    } catch (error) {
        console.error("Ошибка загрузки данных:", error);
        showNotification("Ошибка загрузки данных");
    }
}

// ===== ЗАГРУЗКА АДМИНОВ =====
async function loadAdminUsers() {
    try {
        const adminSnap = await db.collection("users")
            .where("isAdmin", "==", true)
            .get();
        
        adminUsers = [];
        adminSnap.forEach(doc => {
            adminUsers.push(doc.id);
        });
    } catch (error) {
        console.error("Ошибка загрузки админов:", error);
    }
}

// ===== ПОЛУЧЕНИЕ ИНФОРМАЦИИ О ПОЛЬЗОВАТЕЛЕ =====
async function getUserInfo(userId) {
    if (usersCache.has(userId)) {
        return usersCache.get(userId);
    }
    
    try {
        const userDoc = await db.collection("users").doc(userId).get();
        let userInfo = {
            username: "user" + userId.slice(-6),
            isAdmin: false
        };
        
        if (userDoc.exists) {
            const data = userDoc.data();
            userInfo = {
                username: data.username || userInfo.username,
                isAdmin: data.isAdmin || false
            };
        }
        
        usersCache.set(userId, userInfo);
        return userInfo;
    } catch (error) {
        console.error("Ошибка получения информации о пользователе:", error);
        return {
            username: "user" + userId.slice(-6),
            isAdmin: false
        };
    }
}

// ===== ЗАГРУЗКА СПИСКА ЧАТОВ =====
async function loadChatsList() {
    try {
        const chatsSnap = await db.collection('chats').get();
        
        if (chatsSnap.empty) {
            chatsList.innerHTML = `
                <div class="no-chats">
                    <div class="no-chats-card">
                        <div class="no-chats-icon">💬</div>
                        <div class="no-chats-title">Нет сообщений</div>
                        <div class="no-chats-description">
                            Начните общение с другими пользователями
                        </div>
                    </div>
                </div>`;
            return;
        }
        
        const userChats = [];
        
        for (const doc of chatsSnap.docs) {
            const chat = doc.data();
            const chatId = doc.id;
            
            if (chat.participants && chat.participants.includes(currentUser.uid)) {
                const otherUserId = chat.participants.find(id => id !== currentUser.uid);
                
                if (!otherUserId) continue;
                
                if (blockedUsers.includes(otherUserId)) continue;
                
                const otherUserInfo = await getUserInfo(otherUserId);
                
                const isPinned = pinnedChats.includes(chatId);
                const isUnread = chat.unreadFor && chat.unreadFor.includes(currentUser.uid);
                
                userChats.push({
                    id: chatId,
                    ...chat,
                    otherUserId: otherUserId,
                    otherUserInfo: otherUserInfo,
                    isPinned: isPinned,
                    isUnread: isUnread
                });
            }
        }
        
        if (userChats.length === 0) {
            chatsList.innerHTML = `
                <div class="no-chats">
                    <div class="no-chats-card">
                        <div class="no-chats-icon">💬</div>
                        <div class="no-chats-title">Нет активных чатов</div>
                        <div class="no-chats-description">
                            Начните общение с другими пользователями
                        </div>
                    </div>
                </div>`;
            return;
        }
        
        // Сортировка: сначала закрепленные, потом по времени
        const pinnedChatsArray = userChats.filter(chat => chat.isPinned);
        const regularChatsArray = userChats.filter(chat => !chat.isPinned);
        
        const sortByTime = (a, b) => {
            const timeA = a.lastMessageTime?.toDate ? a.lastMessageTime.toDate() : new Date(0);
            const timeB = b.lastMessageTime?.toDate ? b.lastMessageTime.toDate() : new Date(0);
            return timeB - timeA;
        };
        
        pinnedChatsArray.sort(sortByTime);
        regularChatsArray.sort(sortByTime);
        
        const sortedChats = [...pinnedChatsArray, ...regularChatsArray];
        
        let chatsHTML = '';
        
        for (const chat of sortedChats) {
            const otherUser = chat.otherUserInfo;
            if (!otherUser) continue;
            
            const lastMessageTime = chat.lastMessageTime?.toDate ? chat.lastMessageTime.toDate() : new Date();
            const timeAgo = formatTimeAgo(lastMessageTime);
            
            let preview = chat.lastMessage || 'Нет сообщений';
            if (preview.length > 50) {
                preview = preview.substring(0, 47) + '...';
            }
            
            const senderPrefix = chat.lastSender === currentUser.uid ? 'Вы: ' : '';
            
            chatsHTML += `
                <div class="chat-item fade ${chat.isUnread ? 'unread' : ''} ${chat.isPinned ? 'pinned' : ''}" 
                     onclick="openChat('${chat.otherUserId}', '${otherUser.username}', '${chat.id}')"
                     data-chat-id="${chat.id}">
                    <div class="chat-avatar">
                        ${otherUser.username?.[0]?.toUpperCase() || 'U'}
                        ${false ? '<span class="online-indicator"></span>' : ''}
                    </div>
                    <div class="chat-info">
                        <div class="chat-header">
                            <span class="chat-user">
                                @${otherUser.username}
                                ${adminUsers.includes(chat.otherUserId) ? '<span class="verified-badge">✓</span>' : ''}
                            </span>
                            <span class="chat-time">${timeAgo}</span>
                        </div>
                        <div class="chat-preview">${senderPrefix}${escapeHtml(preview)}</div>
                    </div>
                    <div class="chat-actions">
                        <button class="action-btn pin-btn" onclick="event.stopPropagation(); togglePinChat('${chat.id}')" title="${chat.isPinned ? 'Открепить' : 'Закрепить'}">
                            📌
                        </button>
                        <button class="action-btn delete-btn" onclick="event.stopPropagation(); showDeleteConfirm('${chat.id}', '${otherUser.username}')" title="Удалить">
                            🗑️
                        </button>
                    </div>
                </div>
            `;
        }
        
        chatsList.innerHTML = chatsHTML;
        
    } catch (error) {
        console.error('Ошибка загрузки чатов:', error);
        chatsList.innerHTML = `
            <div class="no-chats">
                <div class="no-chats-card">
                    <div class="no-chats-icon">⚠️</div>
                    <div class="no-chats-title">Ошибка загрузки</div>
                    <div class="no-chats-description">
                        ${error.message}
                    </div>
                </div>
            </div>`;
    }
}

// ===== ФОРМАТИРОВАНИЕ ВРЕМЕНИ =====
function formatTimeAgo(date) {
    if (!date) return "только что";
    
    const now = new Date();
    const diff = now - date;
    const seconds = Math.floor(diff / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    
    if (days > 7) {
        return date.toLocaleDateString("ru-RU", {
            day: "2-digit",
            month: "2-digit"
        });
    } else if (days > 0) {
        return `${days}д`;
    } else if (hours > 0) {
        return `${hours}ч`;
    } else if (minutes > 0) {
        return `${minutes}м`;
    } else {
        return "только что";
    }
}

function formatMessageTime(date) {
    if (!date) return "";
    return date.toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
    });
}

function formatDateDivider(date) {
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    
    if (date.toDateString() === today.toDateString()) {
        return 'Сегодня';
    } else if (date.toDateString() === yesterday.toDateString()) {
        return 'Вчера';
    } else {
        return date.toLocaleDateString("ru-RU", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });
    }
}

// ===== ЗАКРЕПЛЕНИЕ ЧАТА =====
async function togglePinChat(chatId) {
    try {
        const isCurrentlyPinned = pinnedChats.includes(chatId);
        
        if (isCurrentlyPinned) {
            pinnedChats = pinnedChats.filter(id => id !== chatId);
            await db.collection("users").doc(currentUser.uid).update({
                pinnedChats: pinnedChats
            });
            showNotification("Чат откреплен");
        } else {
            if (pinnedChats.length >= 5) {
                showNotification("Можно закрепить не более 5 чатов");
                return;
            }
            pinnedChats.push(chatId);
            await db.collection("users").doc(currentUser.uid).update({
                pinnedChats: pinnedChats
            });
            showNotification("Чат закреплен");
        }
        
        loadChatsList();
        
    } catch (error) {
        console.error("Ошибка при закреплении чата:", error);
        showNotification("Ошибка: " + error.message);
    }
}

// ===== ПОДТВЕРЖДЕНИЕ УДАЛЕНИЯ =====
function showDeleteConfirm(chatId, username) {
    if (confirm(`Удалить чат с @${username}? Все сообщения будут удалены.`)) {
        deleteChat(chatId);
    }
}

// ===== УДАЛЕНИЕ ЧАТА =====
async function deleteChat(chatId) {
    try {
        const messagesSnap = await db.collection('chats').doc(chatId)
            .collection('messages').get();
        
        const batch = db.batch();
        messagesSnap.docs.forEach(doc => {
            batch.delete(doc.ref);
        });
        
        batch.delete(db.collection('chats').doc(chatId));
        
        await batch.commit();
        
        pinnedChats = pinnedChats.filter(id => id !== chatId);
        await db.collection("users").doc(currentUser.uid).update({
            pinnedChats: pinnedChats
        });
        
        showNotification("Чат удален");
        
        if (currentChatId === chatId) {
            closeChat();
        }
        
        loadChatsList();
        
    } catch (error) {
        console.error("Ошибка при удалении чата:", error);
        showNotification("Ошибка удаления: " + error.message);
    }
}

// ===== ОТКРЫТИЕ ЧАТА =====
async function openChat(userId, username, chatId = null) {
    currentChatUserId = userId;
    currentChatUsername = username;
    
    if (!chatId) {
        const chatsSnap = await db.collection('chats').get();
        
        for (const doc of chatsSnap.docs) {
            const chat = doc.data();
            if (chat.participants && 
                chat.participants.includes(currentUser.uid) && 
                chat.participants.includes(userId)) {
                chatId = doc.id;
                break;
            }
        }
    }
    
    currentChatId = chatId;
    
    chatUserAvatar.textContent = username?.[0]?.toUpperCase() || 'U';
    chatUserName.textContent = '@' + username;
    chatUserStatus.textContent = 'онлайн';
    
    const isBlocked = blockedUsers.includes(userId);
    updateInputState(isBlocked);
    
    chatOverlay.classList.add('show');
    
    await loadChatMessages();
    
    setTimeout(() => {
        chatInput.focus();
    }, 100);
    
    if (currentChatId) {
        await markChatAsRead(currentChatId);
    }
}

// ===== ЗАКРЫТИЕ ЧАТА =====
function closeChat() {
    chatOverlay.classList.remove('show');
    
    if (chatMessagesListener) {
        chatMessagesListener();
        chatMessagesListener = null;
    }
    
    currentChatUserId = null;
    currentChatUsername = null;
    currentChatId = null;
    
    loadChatsList();
}

// ===== ОТМЕТКА ПРОЧИТАННЫМ =====
async function markChatAsRead(chatId) {
    try {
        const chatRef = db.collection('chats').doc(chatId);
        const chatDoc = await chatRef.get();
        
        if (chatDoc.exists) {
            const chatData = chatDoc.data();
            if (chatData.unreadFor && chatData.unreadFor.includes(currentUser.uid)) {
                const updatedUnreadFor = chatData.unreadFor.filter(id => id !== currentUser.uid);
                await chatRef.update({
                    unreadFor: updatedUnreadFor
                });
            }
        }
    } catch (error) {
        console.error("Ошибка при отметке чата как прочитанного:", error);
    }
}

// ===== ОБНОВЛЕНИЕ СОСТОЯНИЯ ВВОДА =====
function updateInputState(isBlocked) {
    if (isBlocked) {
        chatInput.disabled = true;
        chatSendBtn.disabled = true;
        chatInput.placeholder = 'Пользователь заблокирован';
    } else {
        chatInput.disabled = false;
        chatSendBtn.disabled = false;
        chatInput.placeholder = 'Сообщение';
    }
}

// ===== ОТКРЫТИЕ ПРОФИЛЯ =====
function openProfileFromChat() {

    showNotification('Профиль будет доступен позже');
}

// ===== ЗАГРУЗКА СООБЩЕНИЙ =====
async function loadChatMessages() {
    chatMessages.innerHTML = '<div class="loader"><div class="loader-spinner"></div><div>Загрузка...</div></div>';
    
    if (!currentChatId) {
        chatMessages.innerHTML = `
            <div class="no-messages">
                <div class="no-messages-card">
                    <div class="no-messages-icon">💬</div>
                    <div class="no-messages-text">
                        Начните общение с @${currentChatUsername}!
                    </div>
                </div>
            </div>`;
        return;
    }
    
    try {
        const messagesSnap = await db.collection('chats').doc(currentChatId)
            .collection('messages')
            .orderBy('timestamp', 'asc')
            .limit(100)
            .get();
        
        if (messagesSnap.empty) {
            chatMessages.innerHTML = `
                <div class="no-messages">
                    <div class="no-messages-card">
                        <div class="no-messages-icon">💬</div>
                        <div class="no-messages-text">
                            Нет сообщений. Начните общение!
                        </div>
                    </div>
                </div>`;
            return;
        }
        
        chatMessages.innerHTML = '';
        
        let lastDate = null;
        
        messagesSnap.forEach(doc => {
            const msg = doc.data();
            const msgDate = msg.timestamp?.toDate ? msg.timestamp.toDate() : new Date();
            const currentDate = new Date(msgDate.getFullYear(), msgDate.getMonth(), msgDate.getDate());
            
            if (!lastDate || currentDate.getTime() !== lastDate.getTime()) {
                const dateDivider = document.createElement('div');
                dateDivider.className = 'message-date-divider';
                dateDivider.innerHTML = `<span>${formatDateDivider(msgDate)}</span>`;
                chatMessages.appendChild(dateDivider);
                lastDate = currentDate;
            }
            
            addMessageToUI({ id: doc.id, ...msg });
        });
        
        setTimeout(() => {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 100);
        
        setupChatMessagesListener();
        
    } catch (error) {
        console.error('Ошибка загрузки сообщений:', error);
        chatMessages.innerHTML = `
            <div class="no-messages">
                <div class="no-messages-card">
                    <div class="no-messages-icon">⚠️</div>
                    <div class="no-messages-text">
                        Ошибка загрузки сообщений
                    </div>
                </div>
            </div>`;
    }
}

// ===== ДОБАВЛЕНИЕ СООБЩЕНИЯ В UI =====
function addMessageToUI(msg) {
    const isOutgoing = msg.senderId === currentUser.uid;
    const msgDate = msg.timestamp?.toDate ? msg.timestamp.toDate() : new Date();
    const messageTime = formatMessageTime(msgDate);
    
    const messageDiv = document.createElement('div');
    messageDiv.className = `message fade ${isOutgoing ? 'message-outgoing' : 'message-incoming'}`;
    messageDiv.setAttribute('data-message-id', msg.id);
    messageDiv.setAttribute('data-sender-id', msg.senderId);
    
    setupMessageClickHandler(messageDiv, msg);
    
    const readStatus = msg.read === true ? '✓✓' : '✓';
    
    let replyHTML = '';
    if (msg.replyTo) {
        const replySender = msg.replyTo.senderId === currentUser.uid ? 'Вы' : currentChatUsername;
        const replyText = msg.replyTo.text || '';
        const shortText = replyText.length > 50 ? replyText.substring(0, 47) + '...' : replyText;
        
        replyHTML = `
            <div class="message-reply">
                <div class="message-reply-sender">${replySender}</div>
                <div class="message-reply-text">${escapeHtml(shortText)}</div>
            </div>
        `;
    }
    
    let reactionsHTML = '';
    if (msg.reactions && Object.keys(msg.reactions).length > 0) {
        const reactionGroups = {};
        Object.entries(msg.reactions).forEach(([userId, emoji]) => {
            if (!reactionGroups[emoji]) {
                reactionGroups[emoji] = [];
            }
            reactionGroups[emoji].push(userId);
        });
        
        reactionsHTML = '<div class="message-reactions">';
        Object.entries(reactionGroups).forEach(([emoji, users]) => {
            const isLikedByMe = users.includes(currentUser.uid);
            reactionsHTML += `
                <div class="reaction ${isLikedByMe ? 'liked' : ''}" onclick="event.stopPropagation(); addReactionToMessage('${msg.id}', '${emoji}')">
                    <span>${emoji}</span>
                    <span class="reaction-count">${users.length}</span>
                </div>
            `;
        });
        reactionsHTML += '</div>';
    }
    
    messageDiv.innerHTML = `
        ${replyHTML}
        <div class="message-text">${escapeHtml(msg.text || '')}</div>
        ${reactionsHTML}
        <div class="message-time">
            ${messageTime}
            ${isOutgoing ? `<span class="message-status">${readStatus}</span>` : ''}
        </div>
    `;
    
    chatMessages.appendChild(messageDiv);
}

// ===== ЭКРАНИРОВАНИЕ HTML =====
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ===== НАСТРОЙКА ОБРАБОТЧИКОВ СООБЩЕНИЙ =====
function setupMessageClickHandler(messageDiv, msg) {
    if ('ontouchstart' in window) {
        let longPressTimer;
        let isLongPress = false;
        
        messageDiv.addEventListener('touchstart', (e) => {
            isLongPress = false;
            longPressTimer = setTimeout(() => {
                isLongPress = true;
                showMessageContextMenu(e, msg.id, msg);
            }, 500);
        });
        
        messageDiv.addEventListener('touchend', (e) => {
            clearTimeout(longPressTimer);
            if (!isLongPress) {
                showReactionsPanel(e, msg.id, msg);
            }
        });
        
        messageDiv.addEventListener('touchmove', () => {
            clearTimeout(longPressTimer);
        });
    } else {
        messageDiv.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            showMessageContextMenu(e, msg.id, msg);
        });
        
        messageDiv.addEventListener('click', (e) => {
            if (e.button === 0) {
                showReactionsPanel(e, msg.id, msg);
            }
        });
    }
}

// ===== СЛУШАТЕЛЬ НОВЫХ СООБЩЕНИЙ =====
function setupChatMessagesListener() {
    if (chatMessagesListener || !currentChatId) return;
    
    chatMessagesListener = db.collection('chats').doc(currentChatId)
        .collection('messages')
        .orderBy('timestamp', 'desc')
        .limit(1)
        .onSnapshot((snapshot) => {
            snapshot.docChanges().forEach((change) => {
                if (change.type === 'added') {
                    const msg = change.doc.data();
                    const existingMessage = document.querySelector(`[data-message-id="${change.doc.id}"]`);
                    
                    if (!existingMessage) {
                        addMessageToUI({ id: change.doc.id, ...msg });
                        
                        setTimeout(() => {
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        }, 100);
                    }
                } else if (change.type === 'modified') {
                    const msg = change.doc.data();
                    const existingMessage = document.querySelector(`[data-message-id="${change.doc.id}"]`);
                    if (existingMessage && msg.reactions) {
                        updateMessageReactions(change.doc.id, msg.reactions);
                    }
                }
            });
        });
}

// ===== ОТПРАВКА СООБЩЕНИЯ =====
async function sendMessage() {
    if (!currentChatUserId) return;
    
    const text = chatInput.value.trim();
    
    if (!text) {
        showNotification('Введите сообщение');
        return;
    }
    
    if (blockedUsers.includes(currentChatUserId)) {
        showNotification('Нельзя отправить сообщение заблокированному пользователю');
        return;
    }
    
    chatSendBtn.disabled = true;
    
    const messageData = {
        text: text,
        senderId: currentUser.uid,
        timestamp: new Date(),
        read: false
    };
    
    if (replyingToMessage) {
        messageData.replyTo = {
            messageId: replyingToMessage.id,
            senderId: replyingToMessage.senderId,
            text: replyingToMessage.text
        };
    }
    
    try {
        let chatId = currentChatId;
        
        if (!chatId) {
            const newChatRef = await db.collection('chats').add({
                participants: [currentUser.uid, currentChatUserId],
                lastMessage: text,
                lastSender: currentUser.uid,
                lastMessageTime: new Date(),
                createdAt: new Date(),
                updatedAt: new Date(),
                unreadFor: [currentChatUserId]
            });
            
            chatId = newChatRef.id;
            currentChatId = chatId;
        } else {
            await db.collection('chats').doc(chatId).update({
                lastMessage: text,
                lastSender: currentUser.uid,
                lastMessageTime: new Date(),
                updatedAt: new Date(),
                unreadFor: firebase.firestore.FieldValue.arrayUnion(currentChatUserId)
            });
        }
        
        await db.collection('chats').doc(chatId)
            .collection('messages')
            .add(messageData);
        
        chatInput.value = '';
        chatInput.style.height = 'auto';
        cancelReply();
        
        loadChatsList();
        
    } catch (error) {
        console.error('Ошибка отправки сообщения:', error);
        showNotification('Ошибка отправки: ' + error.message);
    } finally {
        chatSendBtn.disabled = false;
    }
}

// ===== ПОКАЗ ПАНЕЛИ РЕАКЦИЙ =====
function showReactionsPanel(event, messageId, messageData) {
    let x, y;
    if (event.type.includes('touch')) {
        const touch = event.touches[0] || event.changedTouches[0];
        x = touch.clientX;
        y = touch.clientY;
    } else {
        x = event.clientX;
        y = event.clientY;
    }
    
    selectedMessageForReaction = { id: messageId, ...messageData };
    
    reactionsPanel.style.left = Math.min(x - 100, window.innerWidth - 220) + 'px';
    reactionsPanel.style.top = Math.min(y - 60, window.innerHeight - 80) + 'px';
    reactionsPanel.classList.add('show');
    
    setTimeout(() => {
        const closePanel = (e) => {
            if (!reactionsPanel.contains(e.target)) {
                reactionsPanel.classList.remove('show');
                document.removeEventListener('click', closePanel);
                document.removeEventListener('touchstart', closePanel);
            }
        };
        document.addEventListener('click', closePanel);
        document.addEventListener('touchstart', closePanel);
    }, 10);
}

// ===== ДОБАВЛЕНИЕ РЕАКЦИИ =====
async function addReaction(emoji) {
    if (!selectedMessageForReaction || !currentChatId) return;
    
    try {
        const messageRef = db.collection('chats').doc(currentChatId)
            .collection('messages')
            .doc(selectedMessageForReaction.id);
        
        const messageDoc = await messageRef.get();
        const currentReactions = messageDoc.data()?.reactions || {};
        
        const userReaction = currentReactions[currentUser.uid];
        
        if (userReaction === emoji) {
            delete currentReactions[currentUser.uid];
            showNotification("Реакция убрана");
        } else {
            currentReactions[currentUser.uid] = emoji;
            showNotification(`+${emoji}`);
        }
        
        await messageRef.update({
            reactions: currentReactions
        });
        
        updateMessageReactions(selectedMessageForReaction.id, currentReactions);
        
        reactionsPanel.classList.remove('show');
        
    } catch (error) {
        console.error("Ошибка при добавлении реакции:", error);
        showNotification("Ошибка: " + error.message);
    }
}

// ===== ДОБАВЛЕНИЕ РЕАКЦИИ ПО ID =====
async function addReactionToMessage(messageId, emoji) {
    if (!currentChatId) return;
    
    try {
        const messageRef = db.collection('chats').doc(currentChatId)
            .collection('messages')
            .doc(messageId);
        
        const messageDoc = await messageRef.get();
        const currentReactions = messageDoc.data()?.reactions || {};
        
        const userReaction = currentReactions[currentUser.uid];
        
        if (userReaction === emoji) {
            delete currentReactions[currentUser.uid];
            showNotification("Реакция убрана");
        } else {
            currentReactions[currentUser.uid] = emoji;
            showNotification(`+${emoji}`);
        }
        
        await messageRef.update({
            reactions: currentReactions
        });
        
        updateMessageReactions(messageId, currentReactions);
        
    } catch (error) {
        console.error("Ошибка при добавлении реакции:", error);
        showNotification("Ошибка: " + error.message);
    }
}

// ===== ОБНОВЛЕНИЕ ОТОБРАЖЕНИЯ РЕАКЦИЙ =====
function updateMessageReactions(messageId, reactions) {
    const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
    if (!messageElement) return;
    
    let reactionsContainer = messageElement.querySelector('.message-reactions');
    
    if (!reactionsContainer) {
        reactionsContainer = document.createElement('div');
        reactionsContainer.className = 'message-reactions';
        
        const timeElement = messageElement.querySelector('.message-time');
        if (timeElement) {
            messageElement.insertBefore(reactionsContainer, timeElement);
        } else {
            messageElement.appendChild(reactionsContainer);
        }
    }
    
    reactionsContainer.innerHTML = '';
    
    if (Object.keys(reactions).length === 0) {
        reactionsContainer.remove();
        return;
    }
    
    const reactionGroups = {};
    Object.entries(reactions).forEach(([userId, emoji]) => {
        if (!reactionGroups[emoji]) {
            reactionGroups[emoji] = [];
        }
        reactionGroups[emoji].push(userId);
    });
    
    Object.entries(reactionGroups).forEach(([emoji, users]) => {
        const isLikedByMe = users.includes(currentUser.uid);
        
        const reactionElement = document.createElement('div');
        reactionElement.className = `reaction ${isLikedByMe ? 'liked' : ''}`;
        reactionElement.onclick = (e) => {
            e.stopPropagation();
            addReactionToMessage(messageId, emoji);
        };
        
        reactionElement.innerHTML = `
            <span>${emoji}</span>
            <span class="reaction-count">${users.length}</span>
        `;
        
        reactionsContainer.appendChild(reactionElement);
    });
}

// ===== ОТВЕТ НА СООБЩЕНИЕ =====

// ===== ПОИСК ПОЛЬЗОВАТЕЛЕЙ =====
let searchTimeout;
searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    const query = e.target.value.trim();
    
    if (query.length < 2) {
        searchResults.style.display = 'none';
        return;
    }
    
    searchTimeout = setTimeout(() => {
        searchUsers(query);
    }, 500);
});

async function searchUsers(query) {
    try {
        const usersRef = db.collection('users');
        const snapshot = await usersRef
            .where('username', '>=', query)
            .where('username', '<=', query + '\uf8ff')
            .limit(10)
            .get();
        
        if (snapshot.empty) {
            searchResults.innerHTML = '<div class="search-result-item" style="justify-content: center;">Ничего не найдено</div>';
            searchResults.style.display = 'block';
            return;
        }
        
        let html = '';
        snapshot.forEach(doc => {
            const user = doc.data();
            if (user.uid === currentUser.uid) return;
            
            html += `
                <div class="search-result-item" data-user-id="${user.uid}">
                    <div class="result-avatar">${(user.username || 'U')[0].toUpperCase()}</div>
                    <div class="result-info">
                        <div class="result-name">${escapeHtml(user.username || 'Пользователь')}</div>
                        <div class="result-username">@${escapeHtml(user.username || 'user')}</div>
                    </div>
                </div>
            `;
        });
        
        if (!html) {
            html = '<div class="search-result-item" style="justify-content: center;">Только вы</div>';
        }
        
        searchResults.innerHTML = html;
        searchResults.style.display = 'block';
        
        document.querySelectorAll('.search-result-item').forEach(item => {
            item.addEventListener('click', () => {
                const userId = item.dataset.userId;
                if (userId) {
                    createOrOpenChat(userId);
                    searchResults.style.display = 'none';
                    searchInput.value = '';
                }
            });
        });
        
    } catch (error) {
        console.error('Search error:', error);
        searchResults.style.display = 'none';
    }
}

// ===== СОЗДАТЬ ИЛИ ОТКРЫТЬ ЧАТ =====
async function createOrOpenChat(otherUserId) {
    try {
        const userInfo = await getUserInfo(otherUserId);
        
        const chatsSnap = await db.collection('chats').get();
        
        let existingChatId = null;
        
        for (const doc of chatsSnap.docs) {
            const chat = doc.data();
            if (chat.participants && 
                chat.participants.includes(currentUser.uid) && 
                chat.participants.includes(otherUserId)) {
                existingChatId = doc.id;
                break;
            }
        }
        
        if (existingChatId) {
            openChat(otherUserId, userInfo.username, existingChatId);
            return;
        }
        
        const newChatRef = await db.collection('chats').add({
            participants: [currentUser.uid, otherUserId],
            lastMessage: '',
            lastSender: currentUser.uid,
            lastMessageTime: new Date(),
            createdAt: new Date(),
            updatedAt: new Date(),
            unreadFor: [otherUserId]
        });
        
        openChat(otherUserId, userInfo.username, newChatRef.id);
        
    } catch (error) {
        console.error('Error creating chat:', error);
        showNotification('Ошибка при создании чата');
    }
}

// ===== ПРОВЕРКА АВТО-ОТКРЫТИЯ ЧАТА =====
function checkForAutoOpenChat() {
    const openChatData = sessionStorage.getItem('openChatWith');
    
    if (openChatData) {
        try {
            const data = JSON.parse(openChatData);
            const { userId, username } = data;
            
            sessionStorage.removeItem('openChatWith');
            
            if (userId && username) {
                setTimeout(() => {
                    openChat(userId, username);
                }, 500);
            }
        } catch (error) {
            console.error("Ошибка при обработке данных для открытия чата:", error);
        }
    }
}

// ===== ПОКАЗ УВЕДОМЛЕНИЯ =====
function showNotification(message, duration = 3000) {
    notification.textContent = message;
    notification.classList.add('show');
    
    if (duration > 0) {
        setTimeout(() => {
            notification.classList.remove('show');
        }, duration);
    }
}

// ===== ВЫХОД =====
function logout() {
    if (confirm("Выйти из аккаунта?")) {
        auth.signOut().then(() => {
            location.href = "index.html";
        });
    }
}

// ===== АВТО-ИЗМЕНЕНИЕ ВЫСОТЫ TEXTAREA =====
chatInput?.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
});

// ===== ОТПРАВКА ПО ENTER =====
chatInput?.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

// ===== ПРЕДОТВРАЩЕНИЕ ЗУМА =====
document.addEventListener('touchstart', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        e.target.style.fontSize = '16px';
    }
}, { passive: true });

</script>
