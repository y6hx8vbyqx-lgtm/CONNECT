<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Management</title>
    <style>
        /* Basic Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background-color: #f8f9fa;
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
        }
        .folder-tabs {
            display: flex;
            overflow-x: auto;
            border-bottom: 1px solid #dee2e6;
        }
        .folder-tab {
            padding: 10px 20px;
            border-right: 1px solid #dee2e6;
            cursor: pointer;
        }
        .folder-tab:last-child {
            border-right: none;
        }
        .search-container {
            display: none;
            padding: 10px;
        }
        .search-input {
            width: 100%;
            padding: 10px;
        }
        .folder-actions {
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Chat Management</h1>
    </div>
    <div class="folder-actions">
        <button id="add-folder">Add Folder</button>
    </div>
    <div class="folder-tabs"></div>
    <div class="search-container">
        <input type="text" class="search-input" placeholder="Search..." />
    </div>

    <script>
        const folderTabs = document.querySelector('.folder-tabs');
        const searchContainer = document.querySelector('.search-container');
        const searchInput = document.querySelector('.search-input');
        let folders = JSON.parse(localStorage.getItem('folders')) || [];

        function renderFolders() {
            folderTabs.innerHTML = '';
            folders.forEach(folder => {
                const folderTab = document.createElement('div');
                folderTab.className = 'folder-tab';
                folderTab.innerText = folder;
                folderTab.onclick = () => openFolder(folder);
                folderTabs.appendChild(folderTab);
            });
        }

        function openFolder(folder) {
            console.log('Opening folder:', folder);
            // Add logic to display chats in the selected folder
        }

        document.getElementById('add-folder').onclick = () => {
            const folderName = prompt('Enter folder name:');
            if (folderName && folders.length < 10) {
                folders.push(folderName);
                localStorage.setItem('folders', JSON.stringify(folders));
                renderFolders();
            } else {
                alert('Cannot add more than 10 folders or invalid name.');
            }
        };

        searchInput.addEventListener('focus', () => {
            searchContainer.style.display = 'block';
        });

        searchInput.addEventListener('blur', () => {
            searchContainer.style.display = 'none';
        });

        document.addEventListener('scroll', (event) => {
            if (window.scrollY > 50) {
                searchContainer.style.display = 'block';
            } else {
                searchContainer.style.display = 'none';
            }
        });

        renderFolders();
    </script>
</body>
</html>
